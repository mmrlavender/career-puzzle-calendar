→C→D→E。D 是整道题的关键：任何工作都有「只做一部分」的形态，弄清你要的那部分是否存在，比判断「喜不喜欢这个职业」更准确。E 是最终的落点：多数工作是「喜欢三成、忍受七成」。","hint_raw":"① 先拆成具体动作。② 有一格是「只做那一部分」。③ 见答案，注意 E 为什么是「三成」。","record":"那件事里让我时间过得快的动作，是哪一个。","migrate":"","out_char":"","hints":["先拆成具体动作","有一格是「只做那一部分」","见答案，注意 E 为什么是「三成」"],"code":"索"},{"date":"2027-08-04","month":8,"day":4,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天拆了动作，今天看「我时间过得快的时候」。","question":"中心格写「我忘记看时间的一次」。八格填：那天在做什么、和谁、在哪、做了多久、中间被打断过吗、做完什么感觉、有人说过我做得好吗、还有哪次也是这样。","answer":"无标准答案。判定要点：把第 1 格与第 8 格对照，出现两次以上的活动就是你的兴趣线索。第 6 格「做完什么感觉」若填的是「累但舒服」，那比「轻松」更有价值——前者说明有投入。","hint_raw":"① 要两次以上才算线索。② 「累但舒服」是好信号。③ 见答案，找出重复出现的那一类活动。","record":"我忘记看时间的那些时刻，共同点是什么。","migrate":"","out_char":"","hints":["要两次以上才算线索","「累但舒服」是好信号","见答案，找出重复出现的那一类活动"],"code":"索"},{"date":"2027-08-05","month":8,"day":5,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了共同点，今天破三句「我适合」。","question":"请破译下面三句话，并指出哪一句最可能是真的判断：\n  A「我性格内向，适合做不用跟人打交道的工作。」\n  B「我做表格时能连续坐三小时不烦，做介绍人的活十分钟就累。」\n  C「我朋友说我适合当老师，因为我脾气好。」","answer":"最可能是真判断的是 B——它基于自己的实际时长与感受对比，是可复现的证据。A 把性格直接等同于岗位类型（几乎没有「不跟人打交道」的工作）；C 是别人的印象，而「脾气好」在真实课堂里并不等于能管住课堂。","hint_raw":"① 有一句话对比了两种活的时间感受。② 别人的印象不等于适配。③ 见答案，用自己的「时长感受」做一次判断。","record":"我做哪件事能连续坐三小时不烦。","migrate":"","out_char":"","hints":["有一句话对比了两种活的时间感受","别人的印象不等于适配","见答案，用自己的「时长感受」做一次判断"],"code":"索"},{"date":"2027-08-06","month":8,"day":6,"weekday":"五","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天找到了证据，今天走一条「深入了解一个职业」的路。","question":"四个岔口，每岔只有一条能真的了解：岔口一 看介绍文章／找一个在职的人聊；岔口二 问他这份工作怎么样／问他上周做了什么；岔口三 只听好的／也问最难的部分；岔口四 聊完就结束／写下来并对照自己。","answer":"参考路径：找一个在职的人聊→问他上周做了什么→也问最难的部分→写下来并对照自己。第二格是核心：问「怎么样」得到的是评价，问「上周做了什么」得到的是事实。第三格决定你听到的是宣传还是真相。","hint_raw":"① 问事实不问评价。② 「最难的部分」最有信息量。③ 见答案，找一个在职的人，问那三个问题。","record":"我问到的「上周做了什么」，具体有哪些事。","migrate":"","out_char":"","hints":["问事实不问评价","「最难的部分」最有信息量","见答案，找一个在职的人，问那三个问题"],"code":"索"},{"date":"2027-08-07","month":8,"day":7,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天拿到了事实，今天看两份「职业介绍」。","question":"同一个人对同一个岗位的两段描述，找三处不同，并指出哪一段能让人做决定：\n  A「这个岗位很有前景，需要热爱孩子、有耐心、愿意学习，发展空间大。」\n  B「早上七点半到岗，一天带 25 个孩子，两个老师；主要工作是看护、组织活动、处理冲突、写观察记录；八小时里有五小时是站着；月薪 4000 起。」","answer":"三处不同：① A 全是形容词与评价，B 全是事实与数字；② A 没有时间与人数，B 有到岗时间、人数、比例；③ A 无法判断自己能不能做，B 可以逐条对照。能让人做决定的是 B。","hint_raw":"① 有一份里有「七点半」「25 个」「4000」。② 形容词无法用来做决定。③ 见答案，用 B 的四类信息去描述你关心的岗位。","record":"我能用四个数字描述我想做的岗位吗。","migrate":"","out_char":"","hints":["有一份里有「七点半」「25 个」「4000」","形容词无法用来做决定","见答案，用 B 的四类信息去描述你关心的岗位"],"code":"索"},{"date":"2027-08-08","month":8,"day":8,"weekday":"日","level":"L4","type":"生活趣味","tag":"七夕节｜L4 生活趣味","review":false,"carry":"","question":"牛郎织女每年见一次，可有人说他们从不走同一条路——为什么？","answer":"因为是**一座桥，两个方向**：他往上走，她往下走。（也接受任何比这更妙的答案，今天的题没有标准答案。）","hint_raw":"","record":"今天有没有和谁说过一句真心话。","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-09","month":8,"day":9,"weekday":"一","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天休息，今天填「怎么把一件事问到底」。","question":"横填四格，每格两字：① 追问「___」（哪一次／为什么／好不好） ② 要求举___（例子／理由／态度） ③ 问清「然后___」（呢／做／办） ④ 记下一个___（细节／结论／评价）。","answer":"参考：哪一次／例子／呢／细节。第 1 格「哪一次」是所有追问里最有效的开场：把概括变成事件。第 3 格「然后呢」能把事情推到结果，避免停在过程描述。","hint_raw":"① 用「哪一次」替代「为什么」。② 「然后呢」能问出结果。③ 见答案，用这两句去问一个人。","record":"我用「哪一次」问出了什么细节。","migrate":"","out_char":"","hints":["用「哪一次」替代「为什么」","「然后呢」能问出结果","见答案，用这两句去问一个人"],"code":"索"},{"date":"2027-08-10","month":8,"day":10,"weekday":"二","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天学了追问细节，今天看两种「被拒绝」。","question":"同一个人被拒两次，两段反应找三处不同，并指出哪一次更有用：\n  A「她说我不合适。算了，可能我真的不行，这个方向不适合我。」\n  B「她说我不合适。我问了具体是哪方面，她说需要能独立带 30 人以上；我确实没带过，下次先带 15 人的试试。」","answer":"三处不同：① A 把拒绝当成对自己的判决，B 把它当成条件不满足；② A 没有获得信息，B 拿到了具体门槛（30 人）；③ A 停止，B 有下一步（先带 15 人）。更有用的是 B——拒绝几乎总是「条件不匹配」，很少是「你不行」。","hint_raw":"① 有一句里出现了数字。② 拒绝通常有具体原因，只是没被问。③ 见答案，下次被拒，先问一句「具体是哪方面」。","record":"我被拒过的那次，具体原因是什么。","migrate":"","out_char":"","hints":["有一句里出现了数字","拒绝通常有具体原因，只是没被问","见答案，下次被拒，先问一句「具体是哪方面」"],"code":"索"},{"date":"2027-08-11","month":8,"day":11,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天学了问原因，今天看「我怕的事」。","question":"中心格写「我不敢做的一件事」。八格填：怕什么、最坏会怎样、最坏的概率有多大、真发生了谁能帮我、我有没有做过类似的事、这件事值不值得试、试的成本是什么、如果一年后还不敢，会怎样。","answer":"无标准答案。这道题的方法在「代价核算」：把「怕」拆成最坏结果＋概率＋成本，多数恐惧在这一步会缩小。第 8 格是时间视角，它常让人做出行动决定。","hint_raw":"① 第 2 格要写得具体。② 第 7 格是试的成本，往往比想象的低。③ 见答案，如果成本低于一顿饭钱，就去做。","record":"我怕的那件事，试的成本具体是多少。","migrate":"","out_char":"","hints":["第 2 格要写得具体","第 7 格是试的成本，往往比想象的低","见答案，如果成本低于一顿饭钱，就去做"],"code":"索"},{"date":"2027-08-12","month":8,"day":12,"weekday":"四","level":"L2","type":"一问","tag":"国际青年日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：青年就业政策里，「见习」和「实习」有什么不一样。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-13","month":8,"day":13,"weekday":"五","level":"L4","type":"生活趣味","tag":"国际左撇子日｜L4 生活趣味","review":false,"carry":"","question":"小周是左撇子。早上他右手拿着杯子、左手拿着钥匙，门把手在门的左侧。他要开门，先放下哪只手里的东西？","answer":"**放杯子**。门把手在左侧，左手要腾出来；右手拿杯子不影响。","hint_raw":"","record":"有没有一件「大多数人都这样，而我不」的事。","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-14","month":8,"day":14,"weekday":"六","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天看了「不一样」，今天破三句「我不合群」。","question":"请破译下面三句话，并指出哪一句其实是优势：\n  A「宿舍里他们聊的我都插不上话。」\n  B「我不太爱参加聚会，一个人待着更舒服。」\n  C「我做事喜欢一个人从头做到尾，不太会分工。」","answer":"其实是优势的是 B——「一个人待着更舒服」是一种稳定的偏好，多数需要深度专注的工作（写作、设计、编程、研究、手工）都要求这个能力。A 是话题差异（可解决，找共同话题或换圈子）；C 是真短板（分工是职场基本能力，需要练）。","hint_raw":"① 有一句是偏好，不是缺陷。② 有一句是技能缺失。③ 见答案，分清「偏好」和「短板」。","record":"我身上被说成「缺点」的，有几条其实是偏好。","migrate":"","out_char":"","hints":["有一句是偏好，不是缺陷","有一句是技能缺失","见答案，分清「偏好」和「短板」"],"code":"索"},{"date":"2027-08-15","month":8,"day":15,"weekday":"日","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天分清了偏好不好，今天看「我一个人的时候做什么」。","question":"中心格写「没人管我时」。八格填：最常打开的应用、最常看的内容类型、最常反复做的小动作、最久没碰的东西、最近主动搜过的一个问题、一个人在时会做的正经事、一个人在时会做的浪费时间的事、这两类各占多少。","answer":"无标准答案。核心看第 5 格与第 8 格：第 5 格「主动搜过的问题」往往就是你的真实兴趣（不受课程安排影响）；第 8 格的比例，是自我管理的基线数据，不是道德判断。","hint_raw":"① ay":23,"weekday":"一","level":"L1","type":"密文破译","tag":"处暑｜密文破译","review":false,"carry":"昨天改了复习法，今天破三句「我基础差」。","question":"请破译下面三句话，并指出哪一句是在描述事实：\n  A「我基础太差了，肯定考不上。」\n  B「我上次模考 62 分，主要丢在教育学那部分。」\n  C「别人都比我强。」","answer":"描述事实的是 B——有分数、有失分位置，是可以处理的。A 是结论（且是提前放弃），C 是无法核实的比较。把 A 改写成 B 的格式：「我 X 分，主要丢在 Y」，问题就变成了任务。","hint_raw":"① 有一句话里有分数和位置。② 「都比我强」无法核实。③ 见答案，把你的成绩写成「分数＋失分位置」。","record":"我的分数主要丢在哪一部分。","migrate":"","out_char":"","hints":["有一句话里有分数和位置","「都比我强」无法核实","见答案，把你的成绩写成「分数＋失分位置」"],"code":"索"},{"date":"2027-08-24","month":8,"day":24,"weekday":"二","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天定位了失分，今天走「最后四个月怎么用」的路。","question":"离考试还有四个月，四个岔口：岔口一 全面复习／先攻失分最大的两块；岔口二 每天学新内容／每天一半新一半回看；岔口三 只看书／每周做一次限时模拟；岔口四 一个人闷头学／找一个能互相提问的人。","answer":"参考路径：先攻失分最大的两块→每天一半新一半回看→每周做一次限时模拟→找一个能互相提问的人。第三格是分数的直接来源：限时模拟训练的是「在时间压力下取分」的能力，与「会不会」是两件事。","hint_raw":"① 先攻失分最大的。② 限时模拟不可省。③ 见答案，注意第四格为什么是「互相提问」。","record":"我上一次限时模拟是什么时候，多少分。","migrate":"","out_char":"","hints":["先攻失分最大的","限时模拟不可省","见答案，注意第四格为什么是「互相提问」"],"code":"索"},{"date":"2027-08-25","month":8,"day":25,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天排了复习，今天连「四种题型配什么解法」。","question":"左边四种题型，右边四种应对策略，请连线：① 选择题 ② 简答题 ③ 案例分析 ④ 面试问答 —— A 先给框架再填内容 B 先圈关键词再排除 C 先判断考点再分点 D 先想「对方在考什么」再答。","answer":"参考 ①—B、②—C、③—A、④—D。②—C 强调「先判断考点」：简答题的分数来自踩点，写得多不如踩得准。③—A 的框架指「是什么—为什么—怎么办」，先搭骨架再填。","hint_raw":"① 案例题先搭框架。② 简答靠踩点给分。③ 见答案，用自己的考试题型对照一遍。","record":"我最容易丢分的是哪一种题型。","migrate":"","out_char":"","hints":["案例题先搭框架","简答靠踩点给分","见答案，用自己的考试题型对照一遍"],"code":"索"},{"date":"2027-08-26","month":8,"day":26,"weekday":"四","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天分清了题型，今天填「答题四步」。","question":"横填四格，每格两字：① 先看___（题眼／字数／分值） ② 再列___（要点／例子／开头） ③ 写的时候留___（空行／空白／时间） ④ 最后___（检查／补充／交卷）。","answer":"参考：题眼／要点／空行／检查。第 3 格「留空行」是阅卷友好的做法，方便补充，也让要点更清楚。第 4 格检查的重点是两个：有没有漏题、有没有写错答题位置。","hint_raw":"① 先找题眼。② 留空行方便补。③ 见答案，下次答题按这四步走。","record":"我上次考试漏题了吗。","migrate":"","out_char":"","hints":["先找题眼","留空行方便补","见答案，下次答题按这四步走" function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
</body>
</html>
