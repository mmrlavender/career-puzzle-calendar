些行业目前缺人吗，缺口在什么岗位。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"一"},{"date":"2027-12-11","month":12,"day":11,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天问了行业缺口，今天看「我的底线」。","question":"中心格写「我能接受的」。八格填：最低起薪、最长通勤、能接受的加班频率、愿不愿意离开福州、愿不愿意去县城或乡镇、能不能接受没有编制、能不能接受先做非本专业的事、最不能放弃的一样东西。","answer":"无标准答案。第 4、5 格是这一年最现实的一问：多数人的选择范围由这两格决定，越早想清楚越省事。第 8 格「最不能放弃的一样」是你的底线，它不一定合理，但必须被自己知道。","hint_raw":"① 第 4、5 格决定选择范围。② 底线要写真实的。③ 见答案，把你最不能放弃的那样写出来。","record":"我最不能放弃的一样东西，是什么。","migrate":"","out_char":"","hints":["第 4、5 格决定选择范围","底线要写真实的","见答案，把你最不能放弃的那样写出来"],"code":"一"},{"date":"2027-12-12","month":12,"day":12,"weekday":"日","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天找到了底线，今天填「怎么把底线用在选择上」。","question":"横填四格，每格两字：① 先列___（硬条件／优点／愿望） ② 划掉不能___（接受的／改变的／比较的） ③ 剩下的___（排序／再想／都投） ④ 只留前___（两个／五个／一个）。","answer":"参考：硬条件／接受的／排序／两个。第 1 格「硬条件」指那些不满足就不能去的项（地点、学历、编制、薪资下限）。第 4 格「只留两个」是为了让行动聚焦——同时认真对待五家，等于没有认真对待任何一家。","hint_raw":"① 先列不能改的条件。② 最后只留两个。③ 见答案，把你的两个写下来。","record":"我筛完之后，剩下的两个是什么。","migrate":"","out_char":"","hints":["先列不能改的条件","最后只留两个","见答案，把你的两个写下来"],"code":"一"},{"date":"2027-12-13","month":12,"day":13,"weekday":"一","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天筛出两个，今天在「我选了但我后悔」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可以提前避免的：\n  「签了之后我才发现要天天加班，周末也常被叫。当初问的时候他们只说『偶尔忙』，我就没多问。现在想换，又怕简历不好看。」","answer":"三个词：天天加班、没多问、怕简历不好看。可以提前避免的是「没多问」——「偶尔忙」这类说法必须追问频率与具体时间（一个月几次、周末几次、有没有补休）。这类信息不问，对方不会主动说。","hint_raw":"① 有一句话是没追问。② 「偶尔忙」要问成数字。③ 见答案，写下你下次要追问的三个问题。","record":"我下次签约前，必问的三个问题是什么。","migrate":"","out_char":"","hints":["有一句话是没追问","「偶尔忙」要问成数字","见答案，写下你下次要追问的三个问题"],"code":"一"},{"date":"2027-12-14","month":12,"day":14,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天备了追问，今天连「四种含糊说法配什么追问」。","question":"左边四种常见说法，右边四种最有效的追问，请连线：① 「工资 4000 起」 ② 「表现好会有提升」 ③ 「我们这边比较忙」 ④ 「先做一段时间看看」 —— A 起薪的构成是什么，转正后是多少 B 提升的标准是什么，多久评一次 C 一个月大概几次加班，有没有补休 D 「一段时间」是多久，看什么标准。","answer":"参考 ①—A、②—B、③—C、④—D。四条的共同点是：把形容词换成数字或标准。追问时语气要平（「我想了解清楚，方便安排」），不是在质疑。","hint_raw":"① 把「起」问成构成。② 把「好」问成标准。③ 见答案，把这四句背下来。","record":"这四句里，我最可能遇到的是哪一句。","migrate":"","out_char":"","hints":["把「起」问成构成","把「好」问成标准","见答案，把这四句背下来"],"code":"一"},{"date":"2027-12-15","month":12,"day":15,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天背了追问，今天填「第一次领工资要核对的四件事」。","question":"横填四格，每格两字：① 看工资___（条／卡／额） ② 看社保有没___（有缴／有扣／有单） ③ 看加班有没___（算钱／补休／记录） ④ 看合同与___（实际／口头／承诺）是否一致。","answer":"参考：条／有缴／算钱／实际。第 2 格最重要：社保是否缴纳、按什么基数缴纳，直接影响你未来的权益，且必须在头几个月就确认。第 4 格是核对合同与实际是否一致——不一致的地方要立刻提出。","hint_raw":"① 社保要确认有没有缴。② 合同与实际要一致。③ 见答案，第一次领工资时按这四格核对。","record":"我知道我的社保按什么基数缴吗。","migrate":"","out_char":"","hints":["社保要确认有没有缴","合同与实际要一致","见答案，第一次领工资时按这四格核对"],"code":"一"},{"date":"2027-12-16","month":12,"day":16,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了核对，今天在「我不想过这种日子」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可操作的：\n  「上了几个月班，我发现自己每天都在等下班。我不想过这种日子，但又不知道自己想干什么，只能先忍着。」","answer":"三个词：等下班、不想过这种日子、不知道想干什么。可操作的是「等下班」——它是具体的信号，可以追下去：是一天里哪一段时间最难熬？哪一件事让你忘记看表？把这两个答案找出来，比空想「想干什么」有效得多。","hint_raw":"① 有一句话是具体的现象。② 从「哪一段时间最难熬」查起。③ 见答案，记一周的「难熬时刻」。","record":"我这一周最难熬的时刻，出现在做什么的时候。","migrate":"","out_char":"","hints":["有一句话是具体的现象","从「哪一段时间最难熬」查起","见答案，记一周的「难熬时刻」"],"code":"一"},{"date":"2027-12-17","month":12,"day":17,"weekday":"五","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天开始记难熬时刻，今天破三句「我应该」。","question":"请破译下面三句话，并指出哪一句是别人放在你身上的：\n  A「我应该去考编，稳定。」\n  B「我做这件事的时候不觉得累，做完还想再做一次。」\n  C「我应该早点定下来，别折腾了。」","answer":"别人放在你身上的是 A——「应该」这个词通常来自外部标准（家里、同学、舆论）。B 是你自己的数据（不累、想再做），也是唯一可以直接用来判断方向的依据。C 同样是外部压力，只是被内化成了「别折腾」。","hint_raw":"① 「应该」常来自别人的标准。② 不累且想再做，是可靠信号。③ 见答案，把你所有的「应该」列出来，标出来源。","record":"我说的「应该」里，有几个是我自己的。","migrate":"","out_char":"","hints":["「应该」常来自别人的标准","不累且想再做，是可靠信号","见答案，把你所有的「应该」列出来，标出来源"],"code":"一"},{"date":"2027-12-18","month":12,"day":18,"weekday":"六","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天分清了「应该」的来源，今天连「四种说法配一句自问」。","question":"左边四种常听到的建议，右边四句该问自己的话，请连线：① 「先稳定下来再说」 ② 「年轻人要多闯」 ③ 「你这个专业不好找工作」 ④ 「跟着心走」 —— A 我闯的成本是多少，我能承担吗 B 稳定的代价是什么，我愿意付吗 C 我这个专业，本地最近在招几个 D 我心里想的那件事，做过一次吗。","answer":"参考 ①—B、②—A、③—C、④—D。这四句自问的作用，是把建议转成可核算的成本与可验证的事实。特别是 ③—C：专业好不好找工作，是一个可以被数据回答的问题，不需要接受任何一个结论。","hint_raw":"① 每条建议都对应一个成本或事实。② 「跟着心走」要做过才知道。③ 见答案，把最常听到的那条建议自问一遍。","record":"我最常听到的那条建议，自问的答案是什么。","migrate":"","out_char":"","hints":["每条建议都对应一个成本或事实","「跟着心走」要做过才知道","见答案，把最常听到的那条建议自问一遍"],"code":"一"},{"date":"2027-12-19","month":12,"day":19,"weekday":"日","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天自问了建议，今天看两种「年终盘点」。","question":"同一个人做的两份年终盘点，找三处不同，并指出哪一份能让明年更清楚：\n  A「今年最大的收获是成长了，也更了解自己了。明年要更努力，多尝试，不给自己设限。」\n  B「今年做成 4 件事：考证、实习 6 周、带 3 次活动、投 8 家过 1 家。没做到 2 件：没减肥、没读完书单。明年先只做 3 件：考编上岸、带满 10 次活动、把体重降 5 公斤。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 只有方向，B 有成与未成的清单；② A 无法检查，B 每件都可数；③ A 的明年是态度，B 的明年是三件可数的事。让明年更清楚的是 B——承认没做到的，也是盘点的一部分。","hint_raw":"① 有一份列出「没做到」。② 明年的目标要可数。③ 见答案，写你的「做成」与「没做到」两张清单。","record":"我今年没做到的两件事，是什么。","migrate":"","out_char":"","hints":["有一份列出「没做到」","明年的目标要可数","见答案，写你的「做成」与「没做到」两张清单"],"code":"一"},{"date":"2027-12-20","month":12,"day":20,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天做了两张清单，今天走「明年只做三件」的路。","question":"定明年的三件事，四个岔口：岔口一 三件都是想要的／两件想要＋一件必须做的；岔口二 三件都很难／一件难＋两件能做到的；岔口三 只写结果／写结果＋每周动作；岔口四 放在心里／写下来贴在看得见的地方。","answer":"参考路径：两件想要＋一件必须做的→一件难＋两件能做到的→写结果＋每周动作→写下来贴在看得见的地方。第二格是可持续的关键：三件都是难事，会在二月全部崩掉；一件难事加两件能做到的，才能保住节奏。","hint_raw":"① 留一件必须做的。② 只放一件难事。③ 见答案，给你的三件各写一个每周动作。","record":"我明年三件里，那件「必须做的」是什么。","migrate":"","out_char":"","hints":["留一件必须做的","只放一件难事","见答案，给你的三件各写一个每周动作"],"code":"一"},{"date":"2027-12-21","month":12,"day":21,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天定了三件，今天在「我做不到」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个最该被改掉：\n  「我每年都定目标，每年都做不到。我这个人就是没有毅力，坚持不下来，还是不要定了，定了只会更失望。」","answer":"三个词：每年都做不到、没有毅力、不要定了。最该改掉的是「没有毅力」——把它当成性格解释，就再也没有改进空间。真实原因通常是目标太大、没有每周动作、没有反馈。改法：三件减到一件，加上每周一个具体动作与一次自查。","hint_raw":"① 性格解释会关掉改进空间。② 目标太大是常见原因。③ 见答案，把目标缩到一件。","record":"我去年定的目标，是不是太大了。","migrate":"","out_char":"","hints":["性格解释会关掉改进空间","目标太大是常见原因","见答案，把目标缩到一件"],"code":"一"},{"date":"2027-12-22","month":12,"day":22,"weekday":"三","level":"L1","type":"配对连线","tag":"冬至｜配对连线","review":false,"carry":"昨天缩了目标，今天连「四种情绪配一句应对」。","question":"左边四种年末常见的心情，右边四句最有用的话，请连线：① 觉得这一年浪费了 ② 怕明年还是一样 ③ 羡慕别人已经定了 ④ 什么都提不起劲 —— A 先做一件五分钟能做完的事 B 把这一年按月写一遍再判断 C 只改一个小动作，不要改全部 D 每个人的时间表不一样，我只看自己的。","answer":"参考 ①—B、②—C、③—D、④—A。①—B 是全册反复用的方法：判断「浪费」之前，先按月写一遍事实。「什么都提不起劲」时不要靠想，靠一个五分钟的动作启动。","hint_raw":"① 先按月写一遍再判断。② 改一个小动作就好。③ 见答案，对照你今天的心情。","record":"我今天的年末心情，是哪一种。","migrate":"","out_char":"","hints":["先按月写一遍再判断","改一个小动作就好","见答案，对照你今天的心情"],"code":"一"},{"date":"2027-12-23","month":12,"day":23,"weekday":"四","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天处理了心情，今天填「给自己的四句话」。","question":"横填四格，每格两字：① 我做成了___（什么／一件／不少） ② 我学会了___（什么／一点／很多） ③ 我还要___（练什么／努力／加油） ④ 我允许自己___（慢一点／休息／失败）。","answer":"参考：什么／什么／练什么／慢一点。第 1、2 格必须写具体的事，不能写「成长」；第 4 格是这一页最需要的一句——允许自己慢一点，是把「落后」的焦虑关掉的前提，也是能长期走下去的条件。","hint_raw":"① 前两格写具体。② 第 4 格是给自己的许可。③ 见答案，把这四句读一遍。","record":"我最需要允许自己的那一件事，是什么。","migrate":"","out_char":"","hints":["前两格写具体","第 4 格是给自己的许可","见答案，把这四句读一遍"],"code":"一"},{"date":"2027-12-24","month":12,"day":24,"weekday":"五","level":"L4","type":"生活趣味","tag":"平安夜｜L4 生活趣味","review":false,"carry":"","question":"铃铛都该会响，可有一种铃，你怎么摇都没声音。是什么铃？","answer":"**哑铃**。","hint_raw":"","record":"今天想对谁说一句什么。","migrate":"","out_char":"","hints":[],"code":"一"},{"date":"2027-12-25","month":12,"day":25,"weekday":"六","level":"L4","type":"生活趣味","tag":"圣诞节｜L4 生活趣味","review":false,"carry":"","question":"圣诞老人靠烟囱进屋，可你们的教室没有烟囱。礼物怎么进来？","answer":"开放题，只有一个要求——**答案是「有人替你做了一件事」**。（提前藏好的、托人带进来的、写好了没署名的。）","hint_raw":"","record":"有没有一份礼物，我到现在还记得。","migrate":"","out_char":"","hints":[],"code":"一"},{"date":"2027-12-26","month":12,"day":26,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"两天趣味之后回来收尾。今天走「这一年最值得留下的是什么」的路。","question":"四个岔口：岔口一 留下成绩／留下方法；岔口二 记住做得好的／也记住那次失败的判断；岔口三 只自己知道／讲给一个人听；岔口四 明年重新开始／明年接着走。","answer":"参考路径：留下方法→也记住那次失败的判断→讲给一个人听→明年接着走。第一格是这一整册的落点：成绩只对这一年有效，方法会跟你走很多年。第四格「接着走」比「重新开始」更省力——今年做的每件事，明年都能接上。","hint_raw":"① 方法比成绩留得久。② 讲给一个人听才算留下。③ 见答案，写下你今年留下的三个方法。","record":"我今年留下的三个方法，是什么。","migrate":"","out_char":"","hints":["方法比成绩留得久","讲给一个人听才算留下","见答案，写下你今年留下的三个方法"],"code":"一"},{"date":"2027-12-27","month":12,"day":27,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天留下了方法，今天破三句「我和去年不一样了」。","question":"请破译下面三句话，并指出哪一句能证明真的变了：\n  A「我感觉自己成熟了。」\n  B「以前我一被批评就生气，现在会先问『具体哪里』，上个月那次我改了两遍。」\n  C「同学说我跟以前不太一样。」","answer":"能证明真变了的是 B——它有一个可复现的行为变化、一次真实的应用、一个结果。A 是感觉，C 是别人的印象（可能只是你话少了）。变化要能被验证，必须落到「以前的反应」与「现在的反应」的对比上。","hint_raw":"① 有一句话有前后对比与结果。② 感觉不能证明变化。③ 见答案，用同样的格式写你自己的一个变化。","record":"我哪一次反应，和一年前不一样了。","migrate":"","out_char":"","hints":["有一句话有前后对比与结果","感觉不能证明变化","见答案，用同样的格式写你自己的一个变化"],"code":"一"},{"date":"2027-12-28","month":12,"day":28,"weekday":"二","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天写了变化，今天排一次「跨年这天怎么过」。","question":"12 月 31 日，五个动作请排序：A 花二十分钟重读这一年的每日记录 B 写完 12/31 的年度复盘页 C 写下明年三件事与每周动作 D 给这一年帮过你的三个人各发一句话 E 早点睡。","answer":"参考 A→B→C→D→E。D 放在倒数第二：跨年这天发一句具体的话（「您上次说的 X 我用了，有用」），比群发祝福有效得多，也常常成为明年关系的起点。E 排在最后但同样重要——新年的第一天状态，会影响整年的节奏。","hint_raw":"① 先重读记录再写复盘。② 给三个人各发一句话。③ 见答案，写下那三个人的名字。","record":"这一年帮过我的三个人，分别是谁。","migrate":"","out_char":"","hints":["先重读记录再写复盘","给三个人各发一句话","见答案，写下那三个人的名字"],"code":"一"},{"date":"2027-12-29","month":12,"day":29,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天排了跨年，今天连「这一年的四层」。","question":"左边这一年的四层结构，右边四句对应的话，请连线：① L1 通用谜题 ② L2 职业追问 ③ L3 二十四专业日 ④ L4 生活趣味 —— A 让我知道这个职业真实的一天是什么样 B 让我每周动一次脑子 C 让我知道还有别的活法 D 让我知道日子可以过得有意思。","answer":"参考 ①—B、②—A、③—C、④—D。这一题是全年结构的自我复述，四层各自的职能：L1 是习惯，L2 是职业认知，L3 是视野，L4 是不让日历变成任务。","hint_raw":"① 每周动一次脑子的是哪一层。② 二十四专业日带来的是视野。③ 见答案，写下你最喜欢的一层和为什么。","record":"四层里我最喜欢哪一层，为什么。","migrate":"","out_char":"","hints":["每周动一次脑子的是哪一层","二十四专业日带来的是视野","见答案，写下你最喜欢的一层和为什么"],"code":"一"},{"date":"2027-12-30","month":12,"day":30,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天回顾了结构，今天在「这本日历有什么用」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是这本日历真正想做的事：\n  「一年下来，这些谜题没有告诉我该做什么工作。但我现在会先查再判断，遇到不懂的知道找谁问，做一件事之前会想清楚要交给谁。」","answer":"三个词：没有告诉我该做什么、先查再判断、知道找谁问。这本日历真正做的事是后两个——它不替你选路，它让你具备自己判断的能力。「先查再判断」「知道找谁问」「想清楚交给谁」，是三样可以带走的东西。","hint_raw":"① 它不负责替你选路。② 带走的是三样方法。③ 见答案，写下你带走的三样。","record":"我带走的三样，具体是什么。","migrate":"","out_char":"","hints":["它不负责替你选路","带走的是三样方法","见答案，写下你带走的三样"],"code":"一"},{"date":"2027-12-31","month":12,"day":31,"weekday":"五","level":"REVIEW","type":"年度复盘","tag":"年度复盘（出字：步）","review":true,"carry":"","question":"- 今日非 L1，年度总复盘（约 40 分钟），分五步。\n- 第一步｜通读：翻 1 月 1 日到 12 月 30 日的每一页，只看你写的「探索记录」，不做评价。\n- 第二步｜四季对账：把 3/31「己」、6/30「值」、9/30「界」三页的结论并排看，回答一句：这一年我认清了什么。\n- 第三步｜出字串联：Q1「看、见、自、己」，Q2「澄、清、价、值」，Q3「探、索、世、界」，Q4「走、出、一」，最后一天的字是——\n  **答案：步**。全年密码句：「看见自己，澄清价值，探索世界，走出一步。」\n- 第四步｜写三行：用「以前我___／现在我___／明年我___」写三行，每行不超过十五字。\n- 第五步｜收好：把这一本放进能再找到的地方。一年后再看，比现在更有用。","answer":"","hint_raw":"","record":"这一年我走出的那一步，具体是什么。\n\n---\n\n## 附一：Q4 验收自检","migrate":"","out_char":"","hints":[],"code":"步"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
