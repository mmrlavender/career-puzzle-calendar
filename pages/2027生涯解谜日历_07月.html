、很想认识但还没搭话的一个人。","answer":"无标准答案。核心看第 6 格与第 8 格：第 6 格决定你的信息来源，第 8 格是唯一可以本周执行的一格。人际结构的价值不在数量，在「不同类型的人各有一个」。","hint_raw":"① 第 6 格是职业信息的来源。② 第 8 格写一个真实的名字。③ 见答案，本周试着跟第 8 格搭一句话。","record":"我想认识的那个人，第一句话可以说什么。","migrate":"","out_char":"","hints":["第 6 格是职业信息的来源","第 8 格写一个真实的名字","见答案，本周试着跟第 8 格搭一句话"],"code":"探"},{"date":"2027-07-12","month":7,"day":12,"weekday":"一","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天想好了第一句话，今天填「怎么搭话」。","question":"横填四格，每格两字：① 找一个___（由头／机会／时间）开口 ② 先说自己的___（情况／想法／要求） ③ 问一个___（具体的／开放的／私人的）问题 ④ 结束留一句___（下次／谢谢／再见）。","answer":"参考：由头／情况／具体的／下次。第 2 格反常规：先说自己（我在准备什么、我遇到什么），对方才知道怎么接话。第 3 格问具体的（「您当时怎么找到第一份工作的」），比「您有什么建议」更容易得到真话。","hint_raw":"① 先说自己，再问别人。② 问题越具体越好答。③ 见答案，注意第 4 格为什么留「下次」。","record":"我要问的那个具体问题，是什么。","migrate":"","out_char":"","hints":["先说自己，再问别人","问题越具体越好答","见答案，注意第 4 格为什么留「下次」"],"code":"探"},{"date":"2027-07-13","month":7,"day":13,"weekday":"二","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"搭话的方法有了，今天破三句「我不想麻烦别人」。","question":"请破译下面三句话，并指出哪一句最可能错过机会：\n  A「他那么忙，我不好意思问。」\n  B「等问题攒多了一起问，比较省他时间。」\n  C「我先自己查，查不到再问。」","answer":"最可能错过机会的是 A——「他忙」是猜测，不是事实，而且多数人并不介意被问一个具体问题。B 的问题是攒着问会让问题失真（当时的情境记不清了）；C 是正确顺序，但要给自己一个期限（比如查二十分钟）。","hint_raw":"① 有一句话里有一个未经核实的判断。② 攒着问会让问题过期。③ 见答案，给「自己查」加一个时间上限。","record":"我因为「不好意思」错过的一次机会是什么。","migrate":"","out_char":"","hints":["有一句话里有一个未经核实的判断","攒着问会让问题过期","见答案，给「自己查」加一个时间上限"],"code":"探"},{"date":"2027-07-14","month":7,"day":14,"weekday":"三","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天拆了「不好意思」，今天在一段兼职里找词。","question":"下面这段话藏着三个词，找出来，并指出哪个是最有价值的收获：\n  「暑假在一家店做了一个月：每天十小时，站着，很累，工资不高。但我学会了怎么跟难缠的客人说话，也知道自己绝对不想做这种班。」","answer":"三个词：十小时、学会了怎么说话、绝对不想做。最有价值的收获是「绝对不想做」——它是一条明确的排除线，比模糊的「还行」有用得多。第二有价值的是「怎么跟难缠的人说话」，那是可迁移的能力。","hint_raw":"① 有一句话是一条边界。② 「不想做」也是收获。③ 见答案，把这段兼职写成两句：学会了什么、排除了什么。","record":"我这段经历，排除掉了什么。","migrate":"","out_char":"","hints":["有一句话是一条边界","「不想做」也是收获","见答案，把这段兼职写成两句：学会了什么、排除了什么"],"code":"探"},{"date":"2027-07-15","month":7,"day":15,"weekday":"四","level":"L3","type":"专业日","tag":"世界青年技能日｜L3 专业日：首饰设计与工艺","review":false,"carry":"7 月开始「探索」。今天探一件很具体的事：**材质的天性，决定工艺的上限**。","question":"五种材质与五种工艺，每种材质只对应一种最契合的工艺。请连线，并标出**哪一组如果硬做会开裂或崩坏**，说明原因。\n\n  - 材质：① 银　② 珐琅（釉料）　③ 树脂　④ 木　⑤ 钛\n  - 工艺：A 錾刻（敲打出纹样）　B 烧蓝（高温烧结釉色）　C 浇注（灌入模具成型）　D 榫接（不用胶的咬合）　E 阳极氧化（电解生成色层）","answer":"①—A（银的延展性好，最适合錾刻）；②—B（烧蓝是珐琅的核心工艺）；③—C（树脂靠模具浇注成型）；④—D（木材靠榫接，胶是退路）；⑤—E（钛靠阳极氧化显色，不靠涂层）。\n  - **硬做会崩坏的是「珐琅＋金属大面积镶配」这一组**：釉料与金属的**热膨胀率不同**，烧成冷却时收缩不一致，边缘会崩瓷、开裂。这不是手艺问题，是物理限制——所以珐琅件要么做小面积、要么选膨胀率匹配的底胎、要么做成不与金属硬咬合的独立片。\n  - 同类风险：把厚的树脂直接浇在薄金属片上（收缩应力）、把木件强行榫接到金属槽里（木材随湿度涨缩）。","hint_raw":"① 先问每种材质「怕什么」　② 有一组失败的根源不在手，在热胀冷缩　③ 见答案，再想：为什么工匠要先选料再选工艺","record":"我做事时，有没有硬要材料/工具/人去做它做不了的事","migrate":"给你专业的三种「材料」（可以是人、数据、设备、场地），各写一条「它的天性不允许你做什么」。","out_char":"","college":"艺术教育学院","profession":"首饰设计与工艺","hints":["先问每种材质「怕什么」","有一组失败的根源不在手，在热胀冷缩","见答案，再想：为什么工匠要先选料再选工艺"],"code":"探"},{"date":"2027-07-16","month":7,"day":16,"weekday":"五","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"专业日之后，今天看「我手上的技能」。","question":"中心格写「我会做的事」。八格填：别人花钱请我做过的、别人免费找我做的、我做得比同学快的、我做过三次以上的、我正在学的、我不敢给人看的、我最想练好的、做这件事需要多久能交付。","answer":"无标准答案。核心看第 1 格与第 6 格：第 1 格是市场验证过的（哪怕只收过二十块），第 6 格是「不敢给人看」——把它练到能给人看，就是下一步。","hint_raw":"① 第 1 格哪怕是二十块也算。② 第 6 格是成长点。③ 见答案，选第 6 格里的一件，定一个能交付的日期。","record":"我不敢给人看的那件东西，什么时候能做完。","migrate":"","out_char":"","hints":["第 1 格哪怕是二十块也算","第 6 格是成长点","见答案，选第 6 格里的一件，定一个能交付的日期"],"code":"探"},{"date":"2027-07-17","month":7,"day":17,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天找到了成长点，今天看两种「练」。","question":"两个人在暑假练同一项技能，两段记录找三处不同，并指出哪一个人开学后会明显不同：\n  A「我每天练一会儿，看视频学，练了一个月，感觉懂了很多，但没做出完整的东西。」\n  B「我这个月做了三个完整的小东西，每个都发给了两个人看，第三次被说『可以用了』。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 练的是片段，B 做的是完整品；② A 的反馈来自自己（感觉懂），B 的反馈来自他人；③ A 没有验收标准，B 有「可以用了」。更明显不同的是 B——「完整地做完三遍」是技能成型的标志。","hint_raw":"① 有一句话里有「完整的小东西」。② 「感觉懂」不是反馈。③ 见答案，把练习改成做完整的三个。","record":"我练的那件事，什么时候能做出第一个完整的。","migrate":"","out_char":"","hints":["有一句话里有「完整的小东西」","「感觉懂」不是反馈","见答案，把练习改成做完整的三个"],"code":"探"},{"date":"2027-07-18","month":7,"day":18,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天定了做完整的，今天走这条「一个月做出一个东西」的路。","question":"四个岔口，每岔只有一条能在这个暑假真的做出东西：岔口一 想做大的／做小的；岔口二 等学会了再做／边做边查；岔口三 做给自己／做给一个具体的人；岔口四 做完了放着／发出去。","answer":"参考路径：做小的→边做边查→做给一个具体的人→发出去。第三格是加速器：为一个人做（送给室友、帮亲戚、给社团用），需求具体，不用纠结风格。第四格是唯一让作品变成经历的动作。","hint_raw":"① 有一格是「为谁做」。② 不要等学会。③ 见答案，写下你要为谁做、做成什么样、什么时候发出去。","record":"我要为谁做那个东西。","migrate":"","out_char":"","hints":["有一格是「为谁做」","不要等学会","见答案，写下你要为谁做、做成什么样、什么时候发出去"],"code":"探"},{"date":"2027-07-19","month":7,"day":19,"weekday":"一","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天定了为谁做，今天连「四种反馈配怎么用」。","question":"左边四种反馈，右边四种用法，请连线：① 「挺好的」 ② 「看不懂」 ③ 「太花哨」 ④ 「少了一点什么」 —— A 减，不要加 B 追问具体哪里看不懂 C 换一个人再问 D 自己补，但先问是哪方面。","answer":"参考 ①—C、②—B、③—A、④—D。①—C 是现实：模糊的表扬不含信息，换一个会挑问题的人问。「太花哨」的正确反应是减，加东西会让问题更严重——多数新手的作品问题在信息少、装饰多，或者反过来，得先分辨。","hint_raw":"① 「看不懂」是最好处理的。② 「太花哨」要减不要加。③ 见答案，把收到的反馈对号入座。","record":"我收到过最有用的一句批评，是哪一类。","migrate":"","out_char":"","hints":["「看不懂」是最好处理的","「太花哨」要减不要加","见答案，把收到的反馈对号入座"],"code":"探"},{"date":"2027-07-20","month":7,"day":20,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了用反馈，今天在一段「我发不出去」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪个是真正的原因：\n  「我做完了，但一直没发出去。觉得还不够好，再改改。改了两周，越改越不想发，现在看到它就想删掉。」","answer":"三个词：还不够好、再改改、想删掉。真正的原因是「没有交付标准」——「够不够好」由自己随时改动的感觉判断，永远达不到。解法：先定一个可验证的标准（发给三个人、有一个说能用、下周三之前），达到就发。","hint_raw":"① 问题不在作品，在标准。② 「越改越不想发」是常见现象。③ 见答案，给你的东西定一个交付日期。","record":"我拖着没发的那件东西，交付日期定在哪天。","migrate":"","out_char":"","hints":["问题不在作品，在标准","「越改越不想发」是常见现象","见答案，给你的东西定一个交付日期"],"code":"探"},{"date":"2027-07-21","month":7,"day":21,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天定了交付，今天看两种「暑假结束」。","question":"同一个人暑假前后的两段话，找三处不同，并指出哪一处变化最值钱：\n  A（前）「我不太会做东西，也没什么特长，先看看别人怎么做。」\n  B（后）「我做了一个能用的东西，知道下一步该练什么，也知道自己不擅长哪一块。」","answer":"三处不同：① 前是「不会」，后是「做了一个能用的」；② 前没有方向，后有下一步；③ 前只有自我评价，后有边界（不擅长哪一块）。最值钱的变化是「知道下一步该练什么」——它把努力从随机变成有方向。","hint_raw":"① 注意「能用的」三个字。② 有方向比有能力更早出现。③ 见答案，写一句你的「下一步该练什么」。","record":"我的下一步该练什么，一句话说得清吗。","migrate":"","out_char":"","hints":["注意「能用的」三个字","有方向比有能力更早出现","见答案，写一句你的「下一步该练什么」"],"code":"探"},{"date":"2027-07-22","month":7,"day":22,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天写了下一步，今天破三句「别人都说」。","question":"请破译下面三句话，并指出哪一句背后有真实依据：\n  A「我表姐说这个行业已经饱和了。」\n  B「我在招聘网站上看到这个岗位最近三个月在本地有十七个在招。」\n  C「网上都在说这个专业没前途。」","answer":"有真实依据的是 B——它有范围（本地）、时间（最近三个月）、数量（十七个）。A 是一个人听来的判断，C 是「都在说」的模糊共识。判断行业冷热，看的是「本地、近期、在招数量」这三个限定。","hint_raw":"① 有一句话有三个限定词。② 「都在说」通常没有来源。③ 见答案，自己动手查一次本地在招数量。","record":"我关心那个岗位，本地最近在招几个。","migrate":"","out_char":"","hints":["有一句话有三个限定词","「都在说」通常没有来源","见答案，自己动手查一次本地在招数量"],"code":"探"},{"date":"2027-07-23","month":7,"day":23,"weekday":"五","level":"L1","type":"九宫格","tag":"大暑｜九宫格","review":false,"carry":"昨天学会了查，今天看「我查过的东西」。","question":"中心格写「我想了解的岗位」。八格填：做什么、一天对谁说话、几点上下班、要不要加班、起薪大概多少、三年后能到什么位置、需要什么证、本地有几家在招。","answer":"无标准答案。判定要点：八格里最容易空的是第 6 格（三年后）和第 8 格（本地在招数）——这两格恰恰决定这条路可不可走。空着的格子就是下一次要查的东西。","hint_raw":"① 空着的格子比填满的重要。② 第 8 格用招聘网站查。③ 见答案，本周把空的两格补上。","record":"我这一格最空的是哪一个，怎么补。","migrate":"","out_char":"","hints":["空着的格子比填满的重要","第 8 格用招聘网站查","见答案，本周把空的两格补上"],"code":"探"},{"date":"2027-07-24","month":7,"day":24,"weekday":"六","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天找到了空格，今天排一次「怎么查」。","question":"你要查清一个岗位的真实情况，五个动作请排序：A 招聘网站看本地在招数量和薪资区间 B 找岗位描述里的高频要求，抄下来 C 找一个在职的人问「最难的是哪部分」 D 对照自己现在缺哪一条 E 定一个六个月能补上的动作。","answer":"参考 A→B→C→D→E。B 的关键是「高频」——十份岗位描述里出现八次的要求，就是硬门槛；C 问「最难的部分」而不是「怎么样」，才能拿到真话；E 必须是一条能在六个月做完的，不要写「提升能力」。","hint_raw":"① 抄要求，看出现次数。② 问「最难的」比问「怎么样」有效。③ 见答案，注意 E 只能写一条。","record":"那个岗位出现最多的三条要求，我现在满足几条。","migrate":"","out_char":"","hints":["抄要求，看出现次数","问「最难的」比问「怎么样」有效","见答案，注意 E 只能写一条"],"code":"探"},{"date":"2027-07-25","month":7,"day":25,"weekday":"日","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天抄了要求，今天填「怎么补一条」。","question":"横填四格，每格两字：① 选最___（缺的／难的／简单的）一条 ② 找一份___（标准／教程／例子）对照 ③ 每周投___（时间／简历／消息）进去 ④ 三个月后看___（结果／心情／别人）。","answer":"参考：缺的／标准／时间／结果。第 1 格选「最缺的」，因为短板决定你能不能过门槛，长板只决定你多亮。第 2 格「标准」指对方要什么水平（能独立做、有作品、有证），没有标准就不知道练到哪算够。","hint_raw":"① 补短板优先。② 先找到「够」的标准。③ 见答案，写下你补的那条和验收标准。","record":"我要补的这一条，怎么算补齐了。","migrate":"","out_char":"","hints":["补短板优先","先找到「够」的标准","见答案，写下你补的那条和验收标准"],"code":"探"},{"date":"2027-07-26","month":7,"day":26,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天定了标准，今天破三句「我时间不够」。","question":"请破译下面三句话，并指出哪一句是真的时间问题：\n  A「我这学期太忙了，没时间做这些。」\n  B「我每天有两小时不知道去哪了，但确实没做成事。」\n  C「我这学期只做三件事，其余都推了，还是没时间。」","answer":"真正的时间问题只有 C 可能成立（已做减法仍不够，说明总量确实不足，需要换方案而不是加努力）。A 通常是优先级问题，B 是注意分散问题（时间在，但被切碎了）。判断方法：先记三天时间账，再判断是「没有时间」还是「没有整块」。","hint_raw":"① 先做减法，再谈时间不够。② 被切碎的时间等于没有。③ 见答案，记三天时间账再下结论。","record":"我这三天的时间，碎在哪里。","migrate":"","out_char":"","hints":["先做减法，再谈时间不够","被切碎的时间等于没有","见答案，记三天时间账再下结论"],"code":"探"},{"date":"2027-07-27","month":7,"day":27,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天记了时间账，今天连「四种时间配什么任务」。","question":"左边四种时间段，右边四种最适合放进去的事，请连线：① 二十分钟碎片 ② 一小时整块 ③ 睡前半小时 ④ 走路/坐车 —— A 背记类（单词、口诀） B 想事情、做计划 C 做需要连续动手的事 D 看、听、收集。","answer":"参考 ①—D、②—C、③—B、④—A。③—B 的依据：睡前容易反刍，正好用来想事情和排第二天，但要设一个截止（想十分钟就睡）。④—A 利用的是不需要眼睛的时间。","hint_raw":"① 走路时最适合背东西。② 需要连续动手的事只能放整块。③ 见答案，把自己的任务对号入座。","record":"我的一小时整块，通常用在了什么事上。","migrate":"","out_char":"","hints":["走路时最适合背东西","需要连续动手的事只能放整块","见答案，把自己的任务对号入座"],"code":"探"},{"date":"2027-07-28","month":7,"day":28,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天排了时间，今天看两种「暑假记录」。","question":"两个人在暑假各写了一段时间记录，找三处不同，并指出哪一份三个月后还有用：\n  A「7 月 12 日，今天很热，心情一般，看了会儿书，晚上和朋友聊天，感觉还行。」\n  B「7 月 12 日：帮表姐看店 4 小时，遇到一个退货的客人，我先听他说完再处理，他没发火。原来先听完是有用的。」","answer":"三处不同：① A 记的是状态，B 记的是事件；② A 没有可复用的结论，B 有一句「先听完是有用的」；③ A 无法在简历或面试里使用，B 可以直接变成一段经历讲述。三个月后还有用的是 B。","hint_raw":"① 有一份里有一句「原来……是有用的」。② 记录的价值在可复用。③ 见答案，今天的记录试着加一句「原来……」。","record":"我今天有一句「原来……是有用的」吗，是什么。","migrate":"","out_char":"","hints":["有一份里有一句「原来……是有用的」","记录的价值在可复用","见答案，今天的记录试着加一句「原来……」"],"code":"探"},{"date":"2027-07-29","month":7,"day":29,"weekday":"四","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天学了记结论，今天排一次「把经历讲成一段话」。","question":"面试时被问「讲一件你做过的事」，五个部分请排序：A 结果（做成了什么） B 背景（当时是什么情况） C 我做了什么（两三个动作） D 我学到/会了什么 E 一句话说清这件事是什么。","answer":"参考 E→B→C→A→D。E 最前：先说一句总括（我在暑假给一家店做了两个月的事，学会了处理客人投诉），听的人才知道后面在讲什么。A 在 D 之前：先给结果，再给收获，否则收获听起来像自我表扬。","hint_raw":"① 先说一句总括。② 结果是收获的前提。③ 见答案，用这个结构写你自己的一件事。","record":"我要讲的那件事，一句话总括是什么。","migrate":"","out_char":"","hints":["先说一句总括","结果是收获的前提","见答案，用这个结构写你自己的一件事"],"code":"探"},{"date":"2027-07-30","month":7,"day":30,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天有了结构，今天填「一句话总括」四个要素。","question":"横填四格，每格两字：① 时间___（暑假／最近／以前） ② 我做___（了什么／过什么／想什么） ③ 对象是___（谁／大家／别人） ④ 结果是___（什么／还行／不错）。","answer":"参考：暑假／做了什么／谁／什么。四格对应的就是「时间＋动作＋对象＋结果」，比「我很有责任心」这类描述有效得多。第 3 格「对象是谁」最常被漏掉，而它恰恰说明你的经验在什么场景下有效。","hint_raw":"① 第 4 格必须是具体结果。② 第 3 格别写「大家」。③ 见答案，把你的经历填成一句。","record":"我的一句话总括，说给谁听过。","migrate":"","out_char":"","hints":["第 4 格必须是具体结果","第 3 格别写「大家」","见答案，把你的经历填成一句"],"code":"探"},{"date":"2027-07-31","month":7,"day":31,"weekday":"六","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"七月最后一天，在一段「我没做出什么」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断是错的：\n  「七月过去了，我没做出什么大事。只是每天做了点小事：陪亲戚家孩子玩了几天，学会了剪一段视频，看了两本书，帮人改了一份材料。这些好像都不算数。」","answer":"三个词：没做出什么大事、每天做了点小事、不算数。判断错误的是「不算数」——四件小事里有三件是可迁移的（带孩子、剪视频、改材料），只有「看两本书」需要再过一道才能用。真正的问题不是事太小，是没有把它们写成「做过什么」。","hint_raw":"① 有一句话是全面否定。② 小事可以变成经历，前提是写下来。③ 见答案，把四件小事各写成一句「时间＋动作＋对象＋结果」。","record":"七月我做过的四件小事，各写成一句给我看。\n\n---\n\n## 八月｜追问与深入（月字：索）\n\n八月 31 天：L1 27 道；L3 一天（8/1 婴幼儿托育服务与管理）；L2 一问一天（8/12）；L4 两天（8/8 七夕、8/13 国际左撇子日）。","migrate":"","out_char":"","hints":["有一句话是全面否定","小事可以变成经历，前提是写下来","见答案，把四件小事各写成一句「时间＋动作＋对象＋结果」"],"code":"探"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
