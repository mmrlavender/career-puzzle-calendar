:"世界动物日｜密文破译","review":false,"carry":"昨天留住了假期，今天破三句「我怕竞争」。","question":"请破译下面三句话，并指出哪一句是真实的市场信息：\n  A「现在找工作的人太多了，我肯定竞争不过。」\n  B「这个岗位今年本地招 12 个人，报名的大概三四百个，去年录取的人里有三个是我们学校的。」\n  C「我们学校的人都没什么优势。」","answer":"真实市场信息是 B——有招录人数、报录比、本校先例，这些都能用来判断「我该准备到什么程度」。A 是感受，C 是无法核实的概括，且与 B 的事实直接矛盾。","hint_raw":"① 有一句话里有「12」和「四百」。② 本校先例是最有用的参考。③ 见答案，去查你要考的岗位去年的录取名单。","record":"我想去的那个岗位，本地招几个，去年有几个我们学校的人。","migrate":"","out_char":"","hints":["有一句话里有「12」和「四百」","本校先例是最有用的参考","见答案，去查你要考的岗位去年的录取名单"],"code":"走"},{"date":"2027-10-05","month":10,"day":5,"weekday":"二","level":"L1","type":"隐藏词","tag":"世界教师日｜隐藏词","review":false,"carry":"昨天查了报录比，今天在一段「我要不要考」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个最该被替换掉：\n  「我周围的人都考教师，我妈也说教师稳定，我也就跟着准备了。其实我没想过自己是不是喜欢，反正先考上再说。」","answer":"三个词：都考、稳定、先考上再说。最该被替换的是「先考上再说」——它不是计划，是推迟决定。可替换的写法：「我准备考，同时这个学期去幼儿园做二十小时志愿者，用实际经历验证我能不能待下去。」","hint_raw":"① 有一个说法是把决定往后推。② 「稳定」是别人的判断。③ 见答案，给你的「先考上再说」加一个验证动作。","record":"我要用什么方式验证「我能不能待下去」。","migrate":"","out_char":"","hints":["有一个说法是把决定往后推","「稳定」是别人的判断","见答案，给你的「先考上再说」加一个验证动作"],"code":"走"},{"date":"2027-10-06","month":10,"day":6,"weekday":"三","level":"L1","type":"九宫格","tag":"国庆假期｜九宫格","review":false,"carry":"昨天加了验证动作，今天看「我为什么选这条路」。","question":"中心格写「我现在走的路」。八格填：谁影响最大、什么时候第一次想到、最吸引我的一点、最让我犹豫的一点、如果失败了会怎样、另一条路是什么、两条路的门槛差多少、五年后我在哪。","answer":"无标准答案。核心在第 4 格与第 6 格：第 4 格「最犹豫的一点」通常就是这条路真正的风险所在，值得单独验证一次；第 6 格「另一条路」若答不出来，说明你的选择还没有比较过，只是默认。","hint_raw":"① 犹豫的那一点要验证。② 一定要想出一条别的路。③ 见答案，把第 4 格变成一次可执行的检验。","record":"我最犹豫的那一点，能用什么方式验证。","migrate":"","out_char":"","hints":["犹豫的那一点要验证","一定要想出一条别的路","见答案，把第 4 格变成一次可执行的检验"],"code":"走"},{"date":"2027-10-07","month":10,"day":7,"weekday":"四","level":"L1","type":"迷宫","tag":"国庆假期｜迷宫","review":false,"carry":"昨天找到了验证点，今天走「怎么验证一个选择」的路。","question":"你要验证「我适不适合这条路」，四个岔口：岔口一 问别人／自己去做一次；岔口二 做一次就判断／做三次再判断；岔口三 只看顺利的部分／专挑最难的那部分试；岔口四 试完就放下／写一句「我能不能接受」。","answer":"参考路径：自己去做一次→做三次再判断→专挑最难的那部分试→写一句「我能不能接受」。第三格是整册的方法：判断适不适合，看的不是最好的一面，是你能不能忍受最差的那一面。","hint_raw":"① 自己去做，别只问人。② 专挑最难的部分试。③ 见答案，写下这条路最难的那一部分是什么。","record":"这条路最难的那一部分，我能接受吗。","migrate":"","out_char":"","hints":["自己去做，别只问人","专挑最难的部分试","见答案，写下这条路最难的那一部分是什么"],"code":"走"},{"date":"2027-10-08","month":10,"day":8,"weekday":"五","level":"L3","type":"专业日","tag":"重阳节｜L3 专业日：智慧健康养老服务与管理","review":false,"carry":"前一天 L1 记的是「家里谁在惦记我」，今天把这份惦记变成一次有方法的探访。","question":"一次居家探访有 6 个动作，请排序并说明理由：A 提前电话预约　B 了解老人病史与用药禁忌　C 进门先自我介绍并说明来意　D 先听老人说，再提问　E 观察居家风险点（地面、扶手、照明、用药摆放）　F 当天记录并反馈给家属或机构。请指出：如果只能保留 5 个动作，最不能删的是哪一个。","answer":"正确顺序 **B→A→C→D→E→F**（先掌握信息再预约，进门先建立信任，先听后问，全程观察，离场前记录）。最不能删的是 **E**：只陪聊不观察，等于这次探访没有发生。常见错误是把 E 放到最后「顺便看一眼」，此时已经错过老人起身、走动时最容易暴露的风险。","hint_raw":"①有一个动作必须在打电话之前做　②「听」在「问」之前　③见答案，并想清楚为什么观察不能放到最后","record":"我去看望一个人时，通常只做了哪几个动作","migrate":"非本专业学生把这 6 个动作套用到自己专业的一次「上门式服务」（家访、维修、调研），找出本单位最容易被跳过的那一步。","out_char":"","college":"人文科学学院","profession":"智慧健康养老服务与管理","hints":["有一个动作必须在打电话之前做","「听」在「问」之前","见答案，并想清楚为什么观察不能放到最后"],"code":"走"},{"date":"2027-10-09","month":10,"day":9,"weekday":"六","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"专业日之后回到自己，今天填「秋招四件事」。","question":"横填四格，每格两字：① 简历先写___（数字／形容词／爱好） ② 投递要有___（针对性／数量／运气） ③ 面试前查___（岗位要求／公司评价／工资） ④ 每次面试后___（记问题／等结果／问别人）。","answer":"参考：数字／针对性／岗位要求／记问题。第 2 格是投递效率的核心：一份简历投三十家，不如三十次修改投十家。第 4 格「记问题」是本册最实用的习惯：被问住的题，下一家一定会再问。","hint_raw":"① 简历里要能看见数字。② 每次面试后记下被问住的题。③ 见答案，把你的简历改出三个数字。","record":"我上一次被问住的问题是什么，现在会答了吗。","migrate":"","out_char":"","hints":["简历里要能看见数字","每次面试后记下被问住的题","见答案，把你的简历改出三个数字"],"code":"走"},{"date":"2027-10-10","month":10,"day":10,"weekday":"日","level":"L2","type":"一问","tag":"世界精神卫生日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：心理援助热线这类岗位，一天要接多少个电话、需要什么训练。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"走"},{"date":"2027-10-11","month":10,"day":11,"weekday":"一","level":"L1","type":"配对连线","tag":"国际女童日｜配对连线","review":false,"carry":"昨天看了情绪，今天连「四种压力配什么应对」。","question":"左边四种压力情形，右边四种最有效的应对，请连线：① 事情太多做不完 ② 一直担心做不好 ③ 被否定了很难受 ④ 什么都没劲 —— A 先做最小的那一件，动起来 B 全部列出来，只留三件 C 把担心写成「最坏会怎样」 D 分开看：事没做好，不等于人不行。","answer":"参考 ①—B、②—C、③—D、④—A。④—A 反直觉但有效：没劲的时候不要靠想，要靠一个五分钟的动作启动。③—D 是长期健康的关键：把「事」和「人」分开评价。","hint_raw":"① 太多时先做减法。② 担心要写成具体的。③ 见答案，对号入座你现在是哪一种。","record":"我现在是哪一种压力，用了哪种应对。","migrate":"","out_char":"","hints":["太多时先做减法","担心要写成具体的","见答案，对号入座你现在是哪一种"],"code":"走"},{"date":"2027-10-12","month":10,"day":12,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天分清了压力类型，今天在一段「我不行」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可以立刻改变的：\n  「我投了二十份简历，一个回复都没有。肯定是我太差了，学校也不好，别人有关系的早就定了。我再投也没用。」","answer":"三个词：太差了、学校不好、再投也没用。可以立刻改变的是「再投也没用」——它是个判断，不是事实。二十份无回复，通常是简历与岗位不匹配或格式问题，可以逐项检查：岗位要求是否对上、有没有具体成果、投递时间是否太晚。","hint_raw":"① 有一个词是放弃的念头。② 无回复多半是匹配问题，不是能力问题。③ 见答案，把你的简历对照一份岗位要求逐条打勾。","record":"我的简历对着岗位要求，能打几个勾。","migrate":"","out_char":"","hints":["有一个词是放弃的念头","无回复多半是匹配问题，不是能力问题","见答案，把你的简历对照一份岗位要求逐条打勾"],"code":"走"},{"date":"2027-10-13","month":10,"day":13,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天检查了简历，今天看「我的简历」。","question":"中心格写「我的一页简历」。八格填：一句自我定位、三件有数字的事、一项能展示的技能、一段与岗位相关的经历、一个证书、一个作品链接、一句别人对我的评价、还缺的那一项。","answer":"无标准答案。要点在第 1 格与第 8 格：第 1 格「一句自我定位」决定 HR 三秒内怎么归类你；第 8 格「还缺的那一项」是未来两个月唯一要补的东西。第 3 格与第 6 格在教师、设计、媒体类岗位里权重最高。","hint_raw":"① 先写好那一句定位。② 缺的那一项只写一个。③ 见答案，把第 8 格写成一个带日期的动作。","record":"我的那一句自我定位，具体是什么。","migrate":"","out_char":"","hints":["先写好那一句定位","缺的那一项只写一个","见答案，把第 8 格写成一个带日期的动作"],"code":"走"},{"date":"2027-10-14","month":10,"day":14,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天打磨了定位，今天看两份简历开头。","question":"同一个人的两种简历开头，找三处不同，并指出哪一份更可能通过初筛：\n  A「本人热爱教育事业，性格开朗，善于沟通，有较强的责任心和团队精神，希望在贵单位得到锻炼。」\n  B「学前教育专业，2027 届。在幼儿园实习 6 周，独立带过 8 个孩子的一日流程；做过 12 期班级公众号，最高阅读 900。」","answer":"三处不同：① A 是形容词堆叠，B 是事实与数字；② A 没有专业与届别，B 第一句就交代（HR 靠这个分堆）；③ A 看不出能做什么，B 能直接对应岗位需求。更可能通过初筛的是 B。","hint_raw":"① 第一句要交代专业与届别。② 数字比形容词有用。③ 见答案，把你的开头改成 B 的结构。","record":"我简历的第一句，交代清楚了吗。","migrate":"","out_char":"","hints":["第一句要交代专业与届别","数字比形容词有用","见答案，把你的开头改成 B 的结构"],"code":"走"},{"date":"2027-10-15","month":10,"day":15,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天改了简历，今天排一次「接到面试通知到进门前」。","question":"收到面试通知后，五个动作请排序：A 查清岗位职责与单位情况 B 准备三个能讲的具体故事 C 准备两个要问对方的问题 D 想好一段一分钟自我介绍 E 提前一天确认地点与所需材料。","answer":"参考 A→B→D→E→C。B 是面试的主体：多数问题都能用「讲一件事」回答，准备三个故事就够覆盖（一次合作、一次解决问题、一次被批评）。C 放在最后但不可省——「你有什么问题吗」是面试里唯一你能主导的环节。","hint_raw":"① 三个故事比背答案有效。② 一定要准备两个问题。③ 见答案，写出你要问的那两个问题。","record":"我要问对方的两个问题，是什么。","migrate":"","out_char":"","hints":["三个故事比背答案有效","一定要准备两个问题","见答案，写出你要问的那两个问题"],"code":"走"},{"date":"2027-10-16","month":10,"day":16,"weekday":"六","level":"L2","type":"完整题","tag":"L2 完整题（见 v7 L2-4）","review":false,"carry":"10 月你在学「走出一步」。今天走出最小的一步：**把一顿饭，变成一次学习**。","question":"中心格是「这一餐」。周围八格填食育点，请按「一顿饭从开始到结束」的先后顺序把八格排好，并回答：**哪一格最容易被跳过**？\n\n  八格备选：① 说一说今天吃到几种味道　② 饭菜是怎么来的（一粒米的旅程）　③ 吃多少盛多少，自己决定　④ 先尝一口再说喜不喜欢　⑤ 一起收拾餐具、擦桌子　⑥ 剩下的饭菜去哪儿了　⑦ 念一念今天的菜名　⑧ 这一餐是谁做的（厨师、农民、值日生）","answer":"合理顺序 **⑦ → ② → ⑧ → ③ → ④ → ① → ⑤ → ⑥**（认识名字 → 知道来处 → 看见劳动者 → 自主定量 → 先尝后评 → 表达感受 → 参与收拾 → 追问去向）。\n  - 这条线有内在逻辑：**先建立关系（名字、来处、人），再进入行为（定量、品尝），最后收束到责任（收拾、去向）**。\n  - **最容易被跳过的是 ⑥「剩下的饭菜去哪儿了」**：因为它发生在餐后、发生在看不见的地方（后厨、垃圾桶、泔水桶），而且「脏」。但恰恰是这一格承担了食育的核心——**浪费只有被看见，才会被减少**。跳过它，前面七格都会退化成「吃饭时的规矩」。\n  - 次容易被跳过的是 ①：一句「今天这菜有点酸，我喜欢」，比十遍「不要挑食」有用。","hint_raw":"① 先想「一顿饭从哪里开始」（不是从坐下开始）　② 有一格发生在吃完以后，而且看不见　③ 见答案，再想：为什么看不见的环节最需要被设计","record":"我上一次浪费的东西，最后去了哪里","migrate":"把你专业里一件「完成了就没人再看」的收尾环节（作业批改后的反馈、活动后的复盘、维修后的回访）找出来，给它设计一个被看见的方式。\n\n---\n\n## 二、L4 生活趣味谜题（8 天）\n\n**L4 的定位（锁死）**：只负责两件事——**让人今天还想翻一页**、**让人笑一下**。严禁在这里做职业探索、严禁追问「这对你的生涯有什么启发」。L4 不计入八题型轮换约束，也不进密码表之外的专业线。\n\n体例极简：题目 → 答案 → 一句话余味。家庭类节点另加一行「家里谁在惦记你」。","out_char":"","position":"幼儿园营养员／食育教师","hints":["先想「一顿饭从哪里开始」（不是从坐下开始）","有一格发生在吃完以后，而且看不见","见答案，再想：为什么看不见的环节最需要被设计"],"code":"走"},{"date":"2027-10-17","month":10,"day":17,"weekday":"日","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天完成了 L2 题，今天在「面试完感觉不好」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断下得太早：\n  「面试的时候我卡了两次，说话也不利索，肯定没戏了。我可能就不适合这种要面试的单位，还是去考编吧。」\n  A/B 请找出三个词并判断。","answer":"三个词：卡了两次、没戏了、不适合。下得太早的是「没戏了」——卡壳是面试的常态，录取与否取决于整体印象与岗位匹配，与一次紧张没有线性关系。更早能下结论的，是等结果出来之后，把被问住的题补上。","hint_raw":"① 卡壳不等于失败。② 结论要等结果。③ 见答案，先把被问住的题补上。","record":"我卡住的那两个问题，答案该怎么说。","migrate":"","out_char":"","hints":["卡壳不等于失败","结论要等结果","见答案，先把被问住的题补上"],"code":"走"},{"date":"2027-10-18","month":10,"day":18,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天没急着下结论，今天看两种「被录用的反馈」。","question":"两个人都被实习单位评价了，两段反馈找三处不同，并指出哪一段让人知道自己下一步该改什么：\n  A「这个同学态度好，肯学，有潜力，希望继续努力。」\n  B「这个同学和孩子相处自然，家长沟通还需要练；记录写得细，但速度慢，一天只能写两份。」","answer":"三处不同：① A 只有评价，B 指出具体能力项；② A 没有对照标准，B 有量（一天两份）；③ A 无法改动，B 直接指出两个可改的点（家长沟通、速度）。能指导下一步的是 B。","hint_raw":"① 有一份里有「还需要练」和「一天两份」。② 好的反馈一定带可改的点。③ 见答案，去向你的实习老师要一份 B 式的反馈。","record":"我的实习反馈，具体指出了哪一项要改。","migrate":"","out_char":"","hints":["有一份里有「还需要练」和「一天两份」","好的反馈一定带可改的点","见答案，去向你的实习老师要一份 B 式的反馈"],"code":"走"},{"date":"2027-10-19","month":10,"day":19,"weekday":"二","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天要到了具体反馈，今天走「补短板」的路。","question":"你知道自己缺的是「家长沟通」，四个岔口：岔口一 看文章学／当场跟三次真实沟通；岔口二 一次说很多／先学会说三句固定的话；岔口三 只和被表扬过的家长聊／主动找最难沟通的那位；岔口四 练完不记录／每次记一句有效的话。","answer":"参考路径：当场跟三次真实沟通→先学会说三句固定的话→主动找最难沟通的那位→每次记一句有效的话。第二格对新手最有效：沟通初期不需要灵活，需要三句能用的句子（问好、说事实、给建议），熟练后再变化。","hint_raw":"① 跟真实沟通，别只看文章。② 先备三句固定的话。③ 见答案，把这三句话写下来。","record":"我要背的那三句话，分别是什么。","migrate":"","out_char":"","hints":["跟真实沟通，别只看文章","先备三句固定的话","见答案，把这三句话写下来"],"code":"走"},{"date":"2027-10-20","month":10,"day":20,"weekday":"三","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天备了三句话，今天排一次「和家长说一件不好的事」。","question":"孩子今天在园里被抓伤了，你要告诉家长，五个部分请排序：A 先说事实，不评价 B 说园里已经做了什么处理 C 说接下来会怎么防止再发生 D 听家长说完，不打断 E 约定明天再反馈一次。","answer":"参考 A→B→D→C→E。D 的位置是关键：家长的情绪需要先被接收，讲完处理措施再听，会显得在辩解。E 是让家长安心的最后一步——一次反馈不够，要给一个下一次。","hint_raw":"① 先说事实。② 听完再说下一步。③ 见答案，注意 E 为什么是「反馈」而不是「道歉」。","record":"我遇到这种事，第一句话会说什么。","migrate":"","out_char":"","hints":["先说事实","听完再说下一步","见答案，注意 E 为什么是「反馈」而不是「道歉」"],"code":"走"},{"date":"2027-10-21","month":10,"day":21,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天练了沟通，今天看两种「出错之后」。","question":"同一个实习生两次失误的两段反应，找三处不同，并指出哪一种会被留下：\n  A「今天填错了表格，我把错的划掉重填，没跟老师说，怕被批评。」\n  B「今天填错了表格，我发现后立刻告诉老师，重新填了一份，并做了一个勾选清单贴在桌上。」","answer":"三处不同：① A 隐瞒，B 上报；② A 只修正结果，B 修正了流程（清单）；③ A 的错可能下次再犯，B 把错变成了制度。会被留下的是 B——职场对新手最大的容忍是「不会」，最小的容忍是「不说」。","hint_raw":"① 有一种做法把错变成了制度。② 隐瞒的代价远大于错误。③ 见答案，给你的错做一个清单。","record":"我犯过的一个错，能做成什么清单。","migrate":"","out_char":"","hints":["有一种做法把错变成了制度","隐瞒的代价远大于错误","见答案，给你的错做一个清单"],"code":"走"},{"date":"2027-10-22","month":10,"day":22,"weekday":"五","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天把错变成了清单，今天连「四种沟通对象配什么方式」。","question":"左边四种对象，右边四种最合适的沟通方式，请连线：① 直属带你的老师 ② 单位负责人 ③ 同批实习生 ④ 家长 —— A 说事实＋说处理＋说下一步 B 先说结论，再说细节 C 直接问，不用铺垫 D 多听少说，学经验。","answer":"参考 ①—C、②—B、③—D、④—A。①—C：带你的老师时间最紧，直接问最省事。②—B：负责人关心结论与风险，细节留给他问。","hint_raw":"① 对负责人先说结论。② 对同批的人多听。③ 见答案，把你要说的那句话按对象改一遍。","record":"我上一次沟通，用的是哪一个对象的方式。","migrate":"","out_char":"","hints":["对负责人先说结论","对同批的人多听","见答案，把你要说的那句话按对象改一遍"],"code":"走"},{"date":"2027-10-23","month":10,"day":23,"weekday":"六","level":"L1","type":"排序题","tag":"霜降｜排序题","review":false,"carry":"昨天分了对象，今天排一次「实习最后两周」。","question":"实习还剩两周，五个动作请排序：A 把手上的事收尾，列清交接 B 主动要一份书面评价 C 问老师「我还有哪一项需要练」 D 把这段经历写成三行带数字的简历条目 E 加联系方式，保持一年一次的联系。","answer":"参考 A→C→B→D→E。C 在 B 之前：先问要改什么，再要评价，评价会写得更具体。D 必须在记忆还新的时候做，隔一个月细节就没了。","hint_raw":"① 先问要改什么，再要评价。② 经历要趁记得写下来。③ 见答案，注意 E 的「一年一次」。","record":"我实习的三行简历条目，写出来是什么。","migrate":"","out_char":"","hints":["先问要改什么，再要评价","经历要趁记得写下来","见答案，注意 E 的「一年一次」"],"code":"走"},{"date":"2027-10-24","month":10,"day":24,"weekday":"日","level":"L2","type":"一问","tag":"联合国日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：国际组织或涉外岗位，需要什么语言与经历条件。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"走"},{"date":"2027-10-25","month":10,"day":25,"weekday":"一","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天问了涉外条件，今天连「四种能力配一句证据」。","question":"左边四种能力，右边四句能证明它的话，请连线：① 会带活动 ② 会写东西 ③ 会和家长沟通 ④ 会处理突发 —— A「那次下雨，我在十分钟内把三十人换到了室内，没人受伤。」 B「我独立设计并带过三次 20 人以上的活动。」 C「我写过 12 篇推文，最高阅读 900。」 D「我处理过 6 次家长的投诉，最后都接受了方案。」","answer":"参考 ①—B、②—C、③—D、④—A。四句的共同结构是「次数＋规模＋结果」，这是面试里最有效的一句话形式。④—A 的「十分钟内」是这类句子里最有说服力的细节。","hint_raw":"① 每句都要有次数。② 突发类要写清时间和后果。③ 见答案，用这个结构写你自己的四句。","record":"我的四句证据，能写出几句。","migrate":"","out_char":"","hints":["每句都要有次数","突发类要写清时间和后果","见答案，用这个结构写你自己的四句"],"code":"走"},{"date":"2027-10-26","month":10,"day":26,"weekday":"二","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天写了证据，今天破三句「我没什么可写的」。","question":"请破译下面三句话，并指出哪一句其实是可用的素材：\n  A「我没当过学生干部，也没什么奖。」\n  B「我在奶茶店做过两个月，会记单、会处理退单，忙的时候一个人顶两个岗。」\n  C「我什么都很普通。」","answer":"可用素材是 B——它有三项具体能力（记单准确、处理退单、抗压顶岗），可以对应「细致」「沟通」「抗压」三类岗位要求。A、C 用的是「干部」「奖」这一套单一标准，把大量真实经历排除在外了。","hint_raw":"① 兼职里也有可用的能力。② 「干部/奖」不是唯一标准。③ 见答案，把你的一份兼职拆成三项能力。","record":"我的兼职里，能被说成能力的有哪三项。","migrate":"","out_char":"","hints":["兼职里也有可用的能力","「干部/奖」不是唯一标准","见答案，把你的一份兼职拆成三项能力"],"code":"走"},{"date":"2027-10-27","month":10,"day":27,"weekday":"三","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天拆出了能力，今天走「把经历变成岗位语言」的路。","question":"你要把「看店两个月」写成简历条目，四个岔口：岔口一 写「做过营业员」／写做了什么动作；岔口二 写「认真负责」／写带数字的结果；岔口三 一份写所有岗位／按岗位改关键词；岔口四 写完不改／请一个在职的人看一遍。","answer":"参考路径：写做了什么动作→写带数字的结果→按岗位改关键词→请一个在职的人看一遍。第三格决定能不能过机筛：招聘系统按关键词匹配，同一段经历要按岗位换说法（教育类强调「带」「沟通」，运营类强调「内容」「数据」）。","hint_raw":"① 写动作，不写岗位名。② 关键词要跟着岗位变。③ 见答案，把你的一段经历写成两个版本。","record":"我那段经历的两种写法，差别在哪。","migrate":"","out_char":"","hints":["写动作，不写岗位名","关键词要跟着岗位变","见答案，把你的一段经历写成两个版本"],"code":"走"},{"date":"2027-10-28","month":10,"day":28,"weekday":"四","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天写了两个版本，今天看「我要投的十家」。","question":"中心格写「我要投的单位」。八格填：最想去的两家、最可能录的两家、保底的两家、它们的共同要求、我缺的那一条、投递截止时间、谁可以帮我内推或介绍、我已经投了几家。","answer":"无标准答案。要点在第 5 格与第 7 格：第 5 格「共同要求」说明你补一项就能通吃；第 7 格是最被忽略的资源——很多岗位在公开投递之前，已经通过介绍进了人。","hint_raw":"① 找共同要求，补一项通吃。② 想一想谁能介绍。③ 见答案，本周把「已投几家」变成两位数。","record":"我最想去的两家，缺的那一条一样吗。","migrate":"","out_char":"","hints":["找共同要求，补一项通吃","想一想谁能介绍","见答案，本周把「已投几家」变成两位数"],"code":"走"},{"date":"2027-10-29","month":10,"day":29,"weekday":"五","level":"L3","type":"专业日","tag":"世界编码日｜L3 专业日：嵌入式技术应用","review":false,"carry":"昨天你在观察别人，今天你在写规则：**把自己的流程写成别人能照做的「如果……就……」**。","question":"把幼儿园一日流程写成八行伪代码，每行一个空格，填**环节名**。\n\n  ```\n  如果 8:00 且家长送到，就【 ① 】\n  如果孩子进班，就【 ② 】\n  如果时间到 9:00，就【 ③ 】\n  如果 ③ 结束，就【 ④ 】\n  如果天气允许且到 10:00，就【 ⑤ 】\n  如果到 11:30，就【 ⑥ 】\n  如果到 12:30，就【 ⑦ 】\n  如果到 16:30，就【 ⑧ 】\n  ```\n\n  备选：入园交接／晨检／区域活动／集体教学／户外活动／午餐／午睡／离园交接","answer":"① 入园交接 ② 晨检 ③ 区域活动 ④ 集体教学 ⑤ 户外活动 ⑥ 午餐 ⑦ 午睡 ⑧ 离园交接。\n  - 判别依据：①② 是**进门顺序**，交接在前、晨检在后（先接人才查身体）；③④⑤ 里**上午有两个「活动」，一室内一室外**，室内在前（注意力最好的时段做需要专注的事），室外在后（户外安排在午餐前，让体温与食欲上来）；\n  - 若把 **⑤ 户外活动与 ④ 集体教学写反**，孩子会在最需要专注的时段晒太阳、在最热最饿的时段站队；若把 **⑥ 午餐与 ⑦ 午睡写反**，整个下午都乱。\n  - 专业要点：**伪代码的价值不在写得像程序，而在把「隐含前提」写成条件**——「天气允许」就是那个必须显式写出的前提，写不出它的人，会在下雨天让整班孩子在走廊里排队。","hint_raw":"①先想「门一开，第一件事是什么」　②上午有两个活动，一个在室内一个在室外，谁在前　③见答案，特别留意「天气允许」这个条件为什么必须写","record":"我的日常流程里，有哪一步是「靠大家默认」才没出错的","migrate":"把你这周最固定的一天写成八行「如果……就……」，圈出其中靠默认维持、一旦有人不知道就会出错的那一行。","out_char":"","college":"信息科学学院","profession":"嵌入式技术应用","hints":["先想「门一开，第一件事是什么」","上午有两个活动，一个在室内一个在室外，谁在前","见答案，特别留意「天气允许」这个条件为什么必须写"],"code":"走"},{"date":"2027-10-30","month":10,"day":30,"weekday":"六","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"专业日之后，十月最后一次破译，主题是「我急」。","question":"请破译下面三句话，并指出哪一句最需要警惕：\n  A「同学都已经定了，我还没有，我天天睡不着。」\n  B「我先找一份能做的，边做边看，明年再考。」\n  C「我随便签一家算了，先有个着落。」","answer":"最需要警惕的是 C——它为了消除焦虑而放弃选择权，后续违约成本高（违约金、档案、时间）。B 是理性的过渡方案（有收入、保留再选的空间）。A 是正常的焦虑，需要处理，但不该驱动决定。","hint_raw":"① 有一句话是为了不焦虑而做的决定。② 先做着再选，是可行策略。③ 见答案，把「随便签」改成「先做一年」。","record":"我有没有为了安心而做的决定。","migrate":"","out_char":"","hints":["有一句话是为了不焦虑而做的决定","先做着再选，是可行策略","见答案，把「随便签」改成「先做一年」"],"code":"走"},{"date":"2027-10-31","month":10,"day":31,"weekday":"日","level":"L4","type":"生活趣味","tag":"万圣夜｜L4 生活趣味","review":false,"carry":"","question":"有一种东西，你给出去越多，自己剩下的越多。是什么？","answer":"**知识**（还有：笑话、勇气、谢谢）。","hint_raw":"","record":"十月我说过的一句真话是什么。\n\n---\n\n## 十一月｜走出去、说出来（月字：出）\n\n十一月 30 天：L1 26 道；L3 两天（11/8 数字媒体技术、11/20 早期教育）；L2 一问两天（11/6、11/17）。无 L4。","migrate":"","out_char":"","hints":[],"code":"走"},{"date":"2027-11-01","month":11,"day":1,"weekday":"一","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"十一月主题「出」——把自己做出来的东西拿出来。今天填「怎么介绍自己」的四格。","question":"横填四格，每格两字：① 我是___（谁／什么专业／哪里人） ② 我做过___（什么／什么事／很多） ③ 我擅长___（什么／一点／还行） ④ 我想做___（什么／一份工作／改变）。","answer":"参考：什么专业／什么／什么／什么。四格合起来是「身份＋经历＋能力＋意图」，一分钟自我介绍的骨架。第 4 格最常被漏掉，而面试官最关心「你想做什么」——它决定你会不会待下去。","hint_raw":"① 第 4 格不能省。② 每格都要具体。③ 见答案，把四格连起来说一遍，掐表看几秒。","record":"我的一分钟介绍，说完用了多少秒。","migrate":"","out_char":"","hints":["第 4 格不能省","每格都要具体","见答案，把四格连起来说一遍，掐表看几秒"],"code":"出"},{"date":"2027-11-02","month":11,"day":2,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天练了介绍，今天连「四种提问配什么回答思路」。","question":"左边四个常见面试问题，右边四种回答思路，请连线：① 你的缺点是什么 ② 为什么选我们单位 ③ 你有什么想问的 ④ 你怎么看待加班 —— A 说一个真实的、能改的，并说在怎么改 B 说一件具体的事，连到单位的特点 C 问工作内容与成长路径 D 说清自己的边界与能接受的程度。","answer":"参考 ①—A、②—B、③—C、④—D。①—A 的要诀是「真实且能改」，说「我太追求完美」会被识破。④—D 不要一味说「能接受」——说清边界反而显得成熟，但边界要给得合理。","hint_raw":"① 缺点要真实且能改。② 问工作内容，不问工资。③ 见答案，把你的缺点那一题写出来。","record":"我的缺点怎么答，理由说得清吗。","migrate":"","out_char":"","hints":["缺点要真实且能改","问工作内容，不问工资","见答案，把你的缺点那一题写出来"],"code":"出"},{"date":"2027-11-03","month":11,"day":3,"weekday":"三","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天备了问答，今天排一次「一次完整的面试准备」。","question":"面试前，五个动作请排序：A 读三遍岗位职责，划出关键词 B 针对关键词各准备一个例子 C 查单位近一年的公开动态 D 准备一段三十秒的自我介绍 E 想好第一句话与结束语。","answer":"参考 A→B→C→D→E。A 在最先：所有准备都应从岗位要求出发，不从自己的经历出发。C 的价值常被低估：提到单位最近的公开动态，是显示「你真的想来」的最短方式。","hint_raw":"① 一切从岗位要求出发。② 查单位最近在做什么。③ 见答案，注意 E 为什么排最后（它最容易准备）。","record":"那个单位最近做的一件公开的事，是什么。","migrate":"","out_char":"","hints":["一切从岗位要求出发","查单位最近在做什么","见答案，注意 E 为什么排最后（它最容易准备）"],"code":"出"},{"date":"2027-11-04","month":11,"day":4,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天查了单位，今天看两种「谈条件」。","question":"两个实习生在转正谈条件，两段对话找三处不同，并指出哪一次更可能拿到想要的结果：\n  A「我想转正，工资能高一点吗？我家里条件一般。」\n  B「这两个月我独立带过 3 次活动，接手了公众号。如果转正，我希望主要负责活动这块；工资我了解到同类岗位是 X 到 Y，我希望在这个区间。」","answer":"三处不同：① A 用困难当理由，B 用贡献当理由；② A 没有具体数字，B 有区间；③ A 只提要求，B 提了「我想负责什么」（让对方有安排空间）。更可能成功的是 B——谈条件的基础是「我带来了什么」，不是「我需要什么」。","hint_raw":"① 用贡献当理由。② 数字要有来源。③ 见答案，把你的贡献写成三条。","record":"我能说出的「我带来了什么」，有几条。","migrate":"","out_char":"","hints":["用贡献当理由","数字要有来源","见答案，把你的贡献写成三条"],"code":"出"},{"date":"2027-11-05","month":11,"day":5,"weekday":"五","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天谈了条件，今天在「我不敢开口」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个代价最大：\n  「实习单位让我做的事越来越多，很多不是我的活。我不敢说，怕影响评价，就一直做。现在累得什么都不想干，自己的作业也拖了。」","answer":"三个词：越来越多、不敢说、一直做。代价最大的是「一直做」——它把「多做事」变成了「没有边界」，最后的代价是本职做不好、情绪耗尽。可行动的一句话：「这几件我可以做，但手上的 X 会延后，您看先做哪个？」","hint_raw":"① 有一句是把边界交出去。② 把选择权交回给对方。③ 见答案，把这句应对的话写下来。","record":"我要说的那句「请排序」的话，怎么说。","migrate":"","out_char":"","hints":["有一句是把边界交出去","把选择权交回给对方","见答案，把这句应对的话写下来"],"code":"出"},{"date":"2027-11-06","month":11,"day":6,"weekday":"六","level":"L2","type":"一问","tag":"反对校园暴力和欺凌国际日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：学校里负责学生工作的岗位，主要处理哪些事。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"出"},{"date":"2027-11-07","month":11,"day":7,"weekday":"日","level":"L1","type":"迷宫","tag":"立冬｜迷宫","review":false,"carry":"昨天想了「会不会站出来」，今天走「第一次公开表达」的路。","question":"你要在三十人面前讲五分钟，四个岔口：岔口一 写完整逐字稿／只写要点和开头；岔口二 背下来／看着要点说；岔口三 追求讲得全／只讲清三件事；岔口四 讲完就下台／留一分钟提问。","answer":"参考路径：只写要点和开头→看着要点说→只讲清三件事→留一分钟提问。第一格是新手最大的效率提升：逐字稿会让语气僵硬，写要点则自然。第四格能把「单向讲」变成「对话」，也是听众记住你的关键时刻。","hint_raw":"① 只写要点和开头。② 三件事就够。③ 见答案，把你要讲的三件事写出来。","record":"我要讲的三件事，是什么。","migrate":"","out_char":"","hints":["只写要点和开头","三件事就够","见答案，把你要讲的三件事写出来"],"code":"出"},{"date":"2027-11-08","month":11,"day":8,"weekday":"一","level":"L3","type":"专业日","tag":"中国记者节｜L3 专业日：数字媒体技术","review":false,"carry":"11 月谈「走出去」。今天先学会一件基本功：**观众看不懂，多半不是画面差，是「这一步怎么来的」没交代**。","question":"下面是一段 60 秒校园短视频的分镜文案，三个术语被改写成了解释句，请把它们还原成行业词，并回答：删掉哪一个，观众会觉得「跳了」？\n\n  - 镜头 1（0—3 秒）：树叶特写，风一起。\n  - 镜头 2（3—12 秒）：【甲：画面被切成一小格一小格的拍摄单位，每格标明秒数与景别】——\n  - 镜头 3（12—22 秒）：男生抬头看树（注：【乙：画面中动作开始或变化的那一帧，剪辑点常落在它上面】）\n  - 镜头 4（22—24 秒）：黑屏 0.5 秒，声音先入（注：【丙：两个镜头之间的衔接方式，常见有切、叠、划】）\n  - 镜头 5（24—60 秒）：男生走出校门，字幕「11 月，第一批实习报名开始」。","answer":"甲＝**分镜**；乙＝**关键帧**；丙＝**转场**。\n  - 删掉后观众会觉得「跳了」的是**转场（丙）**：镜头 4 那个 0.5 秒黑屏＋声音先入，正是把「看树」接到「走出校门」的桥。没有它，观众会以为自己漏看了一段——**时间与空间的转换必须有人交代，哪怕只用半秒黑场**。\n  - 分镜缺了只是拍摄乱了（观众看不见），关键帧缺了只是剪辑点不准（观众只觉得「有点别扭」）。\n  - 专业要点：**观众感知不到术语，只感知到断裂**。所有「看不懂」的问题，先回到「哪一步没有交代」。","hint_raw":"①三个词分别管「拍之前」「剪的时候」「接的时候」　②有一个词管的是「从这里到那里」　③见答案，再想：你上次看不懂一个视频，是内容难，还是中间少了一步","record":"我讲一件事时，最常省略的是哪一步","migrate":"把你这周要讲的一件事（汇报、试讲、社团招新）找出「省略掉的那一步」，补一句话交代它。","out_char":"","college":"信息科学学院","profession":"数字媒体技术","hints":["三个词分别管「拍之前」「剪的时候」「接的时候」","有一个词管的是「从这里到那里」","见答案，再想：你上次看不懂一个视频，是内容难，还是中间少了一步"],"code":"出"},{"date":"2027-11-09","month":11,"day":9,"weekday":"二","level":"L1","type":"九宫格","tag":"全国消防日｜九宫格","review":false,"carry":"专业日之后，今天看「我做过的东西」。","question":"中心格写「我做出来的东西」。八格填：一个文档、一个视频或图文、一次活动、一份表格、一个手工、一次讲解、别人用过的一个成果、我最想再做一次的那个。","answer":"无标准答案。要点在第 7 格与第 8 格：第 7 格「别人用过」是作品与练习的分界；第 8 格「最想再做一次」指向你真正的动力来源，也是下一件作品该做什么的答案。","hint_raw":"① 别人用过才算作品。② 最想再做一次的那件事很关键。③ 见答案，把第 6 格的编号换成能发出去的链接或文件。","record":"我的东西，有没有被别人真的用过一次。","migrate":"","out_char":"","hints":["别人用过才算作品","最想再做一次的那件事很关键","见答案，把第 6 格的编号换成能发出去的链接或文件"],"code":"出"},{"date":"2027-11-10","month":11,"day":10,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天盘点了作品，今天连「四种作品配什么展示方式」。","question":"左边四种作品，右边四种最合适的展示，请连线：① 一份教案或活动方案 ② 一段视频 ③ 一套设计或手工 ④ 一组数据或表格 —— A 做成三张图＋一句结论 B 拍成品＋过程三张照片 C 附一张成品图和一句「解决了什么问题」 D 剪成 60 秒，开头三秒给结果。","answer":"参考 ①—C、②—D、③—B、④—A。②—D 的关键是「开头三秒」：视频的留存取决于前三秒，作品集里的视频同样。①—C 强调「解决了什么问题」，教案的价值不在格式，在它解决了什么教学问题。","hint_raw":"① 视频前三秒最重要。② 教案要说明解决什么问题。③ 见答案，选你的一件作品，按对应方式整理一次。","record":"我的那件作品，解决了什么问题，一句话说得清吗。","migrate":"","out_char":"","hints":["视频前三秒最重要","教案要说明解决什么问题","见答案，选你的一件作品，按对应方式整理一次"],"code":"出"},{"date":"2027-11-11","month":11,"day":11,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天整理了作品，今天在「我怕被比较」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是需要处理的真问题：\n  「我不敢把作品发出去，怕别人做得比我好。看到别人的作品，我就觉得自己做的很粗糙，还不如不发。」","answer":"三个词：不敢发、别人比我好、还不如不发。真问题是「还不如 —A 是关键：怕做不好的人需要的不是鼓励，而是允许自己先做一个差版本，改起来比开始容易得多。","hint_raw":"① 不知道开始就先做五分钟。② 先做丑版本。③ 见答案，对照你今天的状态。","record":"我今天拖的那件事，属于哪一种。","migrate":"","out_char":"","hints":["不知道开始就先做五分钟","先做丑版本","见答案，对照你今天的状态"],"code":"出"},{"date":"2027-11-20","month":11,"day":20,"weekday":"六","level":"L3","type":"专业日","tag":"世界儿童日｜L3 专业日：早期教育","review":false,"carry":"昨天你在补「被省略的那一步」，今天补另一种省略：**孩子的信号被读错了，不是没发出**。","question":"三段 0—3 岁照护记录，每段里藏着一个信号词（饥饿／困倦／过度刺激），请找出来，并判断**哪一个最常被大人误读成「闹脾气」**。\n\n  - 记录一：「10:40，距上次进食 3 小时 20 分。先吃手，转头找，随后开始短促低声哭，抱起来会往怀里拱。」\n  - 记录二：「13:50，已清醒 4 小时。揉眼、打哈欠、眼神开始飘，抱着轻拍后哭声变小。」\n  - 记录三：「16:20，活动室有人来访，音乐与说话声同时变大。突然扭头、身体打挺、哭声尖而急，越抱越哭，换到安静房间 3 分钟后停止。」","answer":"记录一＝**饥饿**（吃手、转头找、拱怀是觅食反射链）；记录二＝**困倦**（揉眼、打哈欠、眼神飘，是睡眠信号）；记录三＝**过度刺激**（扭头、打挺、越哄越哭，是刺激过载）。\n  - **最常被误读成「闹脾气」的是过度刺激**：它的表现（打挺、越抱越哭、哭声尖）最像「不听话」，而大人的本能反应是**加倍安抚**——抱得更紧、说得更多、换个花样哄，恰好继续加刺激，于是越哄越哭。\n  - 正确做法是**减法**：降光、降噪、减少接触人数，把孩子带到安静角落，等神经系统自己下来。记录三最后「换到安静房间 3 分钟后停止」，就是最直接的证据：**环境一改，哭声就停，说明问题从来不在孩子身上**。","hint_raw":"①三段里有两段，孩子是在「要什么」；有一段，孩子是在「不要什么」　②有一段越哄越哭，这本身就是线索　③见答案，再想：为什么「加倍的安抚」有时反而是加压","record":"我身边有人「闹脾气」时，我第一反应是加还是减","migrate":"找出你专业里一个「需要做减法而不是加法」的场景（信息过载的用户、任务太多的组员、排得太满的课表），写出你要减掉什么。","out_char":"","college":"学前教育学院","profession":"早期教育","hints":["三段里有两段，孩子是在「要什么」；有一段，孩子是在「不要什么」","有一段越哄越哭，这本身就是线索","见答案，再想：为什么「加倍的安抚」有时反而是加压"],"code":"出"},{"date":"2027-11-21","month":11,"day":21,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"专业日之后，今天走「我的第一份工作怎么选」的路。","question":"你手上有两个 offer，四个岔口：岔口一 只看工资／先看能学到什么；岔口二 选最轻松／选能接触到核心业务的；岔口三 只看单位大小／看带你的人是谁；岔口四 定下来就结束／给自己留一句「什么情况下我会换」。","answer":"参考路径：先看能学到什么→选能接触到核心业务的→看带你的人是谁→给自己留一句「什么情况下我会换」。第三格对第一份工作最重要：第一年带你的那个人，决定你养成什么工作习惯。","hint_raw":"① 第一份工作看成长。② 带你的人最关键。③ 见答案，写下你的「什么情况下会换」。","record":"我这两个选择，各自能学到什么。","migrate":"","out_char":"","hints":["第一份工作看成长","带你的人最关键","见答案，写下你的「什么情况下会换」"],"code":"出"},{"date":"2027-11-22","month":11,"day":22,"weekday":"一","level":"L1","type":"配对连线","tag":"小雪｜配对连线","review":false,"carry":"昨天做了选择，今天连「四种单位配什么提问」。","question":"左边四种单位类型，右边四个面试时该问的问题，请连线：① 公办园或学校 ② 民办园或机构 ③ 企业 ④ 社区或社会组织 —— A 这个岗的考核指标是什么 B 编制与聘用方式、职称评定路径 C 生源结构与家长群体的特点 D 项目经费从哪里来、周期多长。","answer":"参考 ①—B、②—C、③—A、④—D。①—B 必须问：编制与聘用、职称路径决定你五年的收入曲线。④—D 决定这份工作稳不稳——靠项目经费运转的岗位，周期就是你的周期。","hint_raw":"① 公办先问编制与职称。② 社区类问经费来源。③ 见答案，把你最该问的那一个问题写下来。","record":"我去面试时，最该问的那一个问题是什么。","migrate":"","out_char":"","hints":["公办先问编制与职称","社区类问经费来源","见答案，把你最该问的那一个问题写下来"],"code":"出"},{"date":"2027-11-23","month":11,"day":23,"weekday":"二","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天要问了关键问题，今天填「听答案时听什么」。","question":"横填四格，每格两字：① 听有没有___（具体数字／好话／承诺） ② 听谁___（负责／最大／说话） ③ 听有没有说___（难处／前景／待遇） ④ 听有没有___（含糊／确定／很长）的地方。","answer":"参考：具体数字／负责／难处／含糊。第 3 格是最可靠的判断依据：愿意主动讲难处的单位，通常可信度更高；只讲前景的，需要多问几句。第 4 格「含糊」出现在哪里，那里就有问题（常出现在加班、考核、转正条件上）。","hint_raw":"① 主动讲难处是可信信号。② 含糊的地方要追问。③ 见答案，把对方含糊的那一处记下来再问。","record":"对方含糊过去的那个问题是什么。","migrate":"","out_char":"","hints":["主动讲难处是可信信号","含糊的地方要追问","见答案，把对方含糊的那一处记下来再问"],"code":"出"},{"date":"2027-11-24","month":11,"day":24,"weekday":"三","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天学了听答案，今天走「签约前要确认的事」的路。","question":"签约之前，四个岔口：岔口一 只看工资／看工资＋五险一金＋试用期；岔口二 口头承诺／写进合同；岔口三 不问违约金／问清违约与解约条件；岔口四 签完不存／自己留一份并拍照存档。","answer":"参考路径：看工资＋五险一金＋试用期→写进合同→问清违约与解约条件→自己留一份并拍照存档。第三格是很多学生的盲点：违约金、服务期、档案与户籍的处理方式，都必须在签之前问清。","hint_raw":"① 五险一金与试用期要看。② 口头承诺要落到纸上。③ 见答案，把违约金这一项问清楚。","record":"我要签的那份合同，违约金怎么写的。","migrate":"","out_char":"","hints":["五险一金与试用期要看","口头承诺要落到纸上","见答案，把违约金这一项问清楚"],"code":"出"},{"date":"2027-11-25","month":11,"day":25,"weekday":"四","level":"L1","type":"密文破译","tag":"感恩节｜密文破译","review":false,"carry":"昨天看了合同，今天破三句「谢谢」。","question":"请破译下面三句话，并指出哪一句最有可能在三年后还有用：\n  A「谢谢老师这段时间的照顾。」\n  B「谢谢老师，您上次说的『先听家长说完』我用了，那次没吵起来。我记在本子上了。」\n  C「谢谢，以后有事找我。」","answer":"三年后还有用的是 B——它说了「用了什么、结果如何」，对方因此知道自己的建议有价值，关系会继续。A 是礼貌，C 是客套且没有落点。感谢的公式是：具体的事＋我的动作＋结果。","hint_raw":"① 感谢要具体到一件事。② 说出结果最打动人。③ 见答案，写一句你真正想说的感谢。","record":"我要感谢的那个人，具体是哪一件事帮到了我。","migrate":"","out_char":"","hints":["感谢要具体到一件事","说出结果最打动人","见答案，写一句你真正想说的感谢"],"code":"出"},{"date":"2027-11-26","month":11,"day":26,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天写了感谢，今天排一次「告别」。","question":"实习或一段经历结束，五个动作请排序：A 把手上的资料整理好留给接手的人 B 当面向带你的老师说一句具体的感谢 C 和同批的人互留联系方式 D 写一段三百字的总结 E 一个月后发一条近况。","answer":"参考 A→B→D→C→E。A 在最前：留下整理好的资料，是最实在的告别。D 必须趁细节还清楚时写，它是你日后写简历与面试故事的唯一素材库。E 是长期关系的维护动作，成本极低，回报很高。","hint_raw":"① 先留资料。② 总结要趁记得写。③ 见答案，注意 E 为什么是「一个月后」。","record":"我这三百字的总结，第一句会写什么。","migrate":"","out_char":"","hints":["先留资料","总结要趁记得写","见答案，注意 E 为什么是「一个月后」"],"code":"出"},{"date":"2027-11-27","month":11,"day":27,"weekday":"六","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天写了总结，今天走「明年怎么办」的路。","question":"这一年快结束了，四条路：岔口一 继续现在这条路／换一条；岔口二 想清楚再动／先动起来再看；岔口三 只靠自己摸索／找一个走过这条路的人；岔口四 定一个大目标／定一个三个月的动作。","answer":"参考路径：先动起来再看→找一个走过这条路的人→定一个三个月的动作→再判断要不要继续这条路。第二格是这一年最省时间的做法：走过这条路的人能在十分钟里告诉你三个坑。","hint_raw":"① 先动再看。② 找一个走过的人。③ 见答案，写下那个人的名字。","record":"走过我想走那条路的人，我认识几个。","migrate":"","out_char":"","hints":["先动再看","找一个走过的人","见答案，写下那个人的名字"],"code":"出"},{"date":"2027-11-28","month":11,"day":28,"weekday":"日","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了那个人，今天破三句「明年再说」。","question":"请破译下面三句话，并指出哪一句其实已经在行动：\n  A「明年再好好规划吧，今年先这样。」\n  B「我这个月先把简历改好，下个月投五家。」\n  C「等我准备好了就开始。」","answer":"已经在行动的是 B——它有具体动作与时间。A 是把决定推给未来的自己（明年会有明年的忙）；C 的「准备好」没有定义，通常永远不会到来。","hint_raw":"① 有一个动作有月份和数量。② 「准备好」没有标准。③ 见答案，把你的「明年再说」换成本月的一件事。","record":"我这个月能做完的那一件事，是什么。","migrate":"","out_char":"","hints":["有一个动作有月份和数量","「准备好」没有标准","见答案，把你的「明年再说」换成本月的一件事"],"code":"出"},{"date":"2027-11-29","month":11,"day":29,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天定了本月的事，今天看两份「年度总结」。","question":"两个人的年度总结，找三处不同，并指出哪一份明年还能用：\n  A「这一年过得很充实，参加了很多活动，学到了很多，也成长了很多，希望明年继续努力。」\n  B「一月加入社团，负责过一次 20 人的活动；四月考了普通话二甲；七月在奶茶店做了两个月；十月开始实习，独立带过 3 次活动；十一月投了 8 家，面试 3 家，过了 1 家。」","answer":"三处不同：① A 全是程度词，B 全是时间＋事件；② A 没有量，B 每件事都有数字；③ A 无法转成简历，B 可以直接拆成三行。明年还能用的是 B——它本身就是一份素材库。","hint_raw":"① 按月份记事。② 每件事带数字。③ 见答案，把你的这一年补成 B 的样子。","record":"我这一年，能按月说出几件事。","migrate":"","out_char":"","hints":["按月份记事","每件事带数字","见答案，把你的这一年补成 B 的样子"],"code":"出"},{"date":"2027-11-30","month":11,"day":30,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"十一月最后一天，在一段「我这一年好像白过了」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断需要修正：\n  「这一年好像白过了：没拿奖学金，没当干部，也没什么比赛。看着别人的朋友圈，我越来越觉得自己浪费时间。」\n  A/B 请找出三个词并判断。","answer":"三个词：白过了、没什么、浪费时间。需要修正的是「白过了」——它用三个单一指标（奖、干部、比赛）衡量一整年，把实习、兼职、考证、人际关系全部排除在外。修正方式：用 11/29 那份按月清单重写一次这一年。","hint_raw":"① 三个指标不等于一年。② 按月重写一次。③ 见答案，写下你这一年真正做成的三件事。","record":"我这一年真正做成的三件事，是什么。\n\n---\n\n## 十二月｜合一（月字：一）\n\n十二月 31 天：L1 25 道；L3 一天（12/3 特殊教育）；L2 一问两天（12/5、12/10）；L4 两天（12/24、12/25）；12/31 年度复盘（出字：步）。","migrate":"","out_char":"","hints":["三个指标不等于一年","按月重写一次","见答案，写下你这一年真正做成的三件事"],"code":"出"},{"date":"2027-12-01","month":12,"day":1,"weekday":"三","level":"L1","type":"密文破译","tag":"世界艾滋病日｜密文破译","review":false,"carry":"十二月主题「一」——把这一年合成一个整体。今天破三句「我和别人不一样」。","question":"请破译下面三句话，并指出哪一句是事实描述而非评价：\n  A「我比别人慢，做什么都要多花时间。」\n  B「我做表格时容易漏行，所以我每次都按清单核对一遍，最近两个月没出过错。」\n  C「我脑子不太行。」","answer":"事实描述是 B——有具体问题（漏行）、有应对（清单核对）、有结果（两个月无错）。A、C 都是把自己和一个模糊的「别人」比较得出的评价。同一件事，写成 B 的形式就从缺点变成了方法。","hint_raw":"① 有一句话里有「所以我」和「没出过错」。② 把缺点写成「问题＋应对＋结果」。③ 见答案，把你的一个短处写成 B。","record":"我的一个短处，怎么写才变成方法。","migrate":"","out_char":"","hints":["有一句话里有「所以我」和「没出过错」","把缺点写成「问题＋应对＋结果」","见答案，把你的一个短处写成 B"],"code":"一"},{"date":"2027-12-02","month":12,"day":2,"weekday":"四","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天把短处变成了方法，今天走「这一年怎么收尾」的路。","question":"今年还剩一个月，四个岔口：岔口一 再开一件新的事／把手上的一件做完；岔口二 什么都想收尾／只收尾一件；岔口三 不留记录／留一份清单；岔口四 直接翻篇／写三句「明年不再做的事」。","answer":"参考路径：把手上的一件做完→只收尾一件→留一份清单→写三句「明年不再做的事」。第四格是全年最反常规也最有效的一题：做减法比定目标更能改变明年。","hint_raw":"① 收尾比开头重要。② 只收尾一件。③ 见答案，写三句「明年不再做」。","record":"我明年不再做的三件事，是什么。","migrate":"","out_char":"","hints":["收尾比开头重要","只收尾一件","见答案，写三句「明年不再做」"],"code":"一"},{"date":"2027-12-03","month":12,"day":3,"weekday":"五","level":"L3","type":"专业日","tag":"国际残疾人日｜L3 专业日：特殊教育","review":false,"carry":"12 月是最后一个月，也是「走出一步」的收尾。今天这一步最考验人：**支持是留机会，代劳是拿走机会**。","question":"中心格是「支持」。周围八格是老师在一个 6 岁孩子（动作发展较慢，正在学自己扣扣子）身边的行为，请逐个填「支」或「代」，并回答：哪一格的「代」看起来最像在帮他？\n\n  ① 站在旁边等他自己扣，扣错了也不动\n  ② 直接蹲下来替他扣好，说「来不及了」\n  ③ 提前把他外套的扣子换成大号魔术贴\n  ④ 手把手带他扣一遍，然后退开半步让他自己来\n  ⑤ 当着全班说「他扣不好，我们帮他一下」\n  ⑥ 前一天晚上提醒家长换一件宽松款外套\n  ⑦ 让他给同学演示「我是怎么扣的」\n  ⑧ 他扣好后说「你真棒」","answer":"**支 ①③④⑥⑦；代 ②⑤；⑧ 不是「代」，但也不完全算「支」——它是评价，不是支持**。\n  - 判断依据：**这个动作有没有把「做的机会」留给他**。① 等待＝留机会（哪怕慢、哪怕扣错）；③ 改环境＝把任务调到他能完成的难度（不是替他做）；④ 示范后退出＝给方法、留主体；⑥ 提前降难度＝预防失败；⑦ 让他成为示范者＝把能力变成身份。\n  - ② 是纯代劳（理由「来不及」是最常见的取代理由）；⑤ 是代劳＋贴标签，**当众宣布「他不行」，比替他扣一次伤害更大**。\n  - **看起来最像在帮他的「代」是 ⑤**：它出于善意、语气温和、还带着「我们一起帮他」的集体感，但它同时做完了两件最不该做的事——替他做了，并且把「他做不好」变成了公开事实。\n  - ⑧ 需要单独说明：表扬本身没错，但它指向的是「你这个人」，不是「你刚才那个动作」；真正的支持式反馈是「你自己把最下面那颗扣上了」。","hint_raw":"① 只看一件事：做完这个动作，他下次还有没有机会自己来　② 有一格把「他不行」说给了全班听　③ 见答案，再想：为什么「来不及了」是最容易滑向代劳的一句话","record":"我帮别人的时候，是让他更快，还是让他更强","migrate":"在你专业的一次实操里，找出一个「为了赶进度而代劳」的动作，写出一个「留机会」的替代做法。\n\n---\n\n## 附一：24 题交叉校验\n\n| 序 | 日期 | 专业 | 密码字 | 题型 | 七项齐全 | 前后 2 日题型是否相撞 |\n|---|---|---|---|---|---|---|\n| 1 | 1/14 | 人工智能技术应用 | 看 | 隐藏词 | 是 | 无相邻非 L1 节点，通过 |\n| 2 | 2/21 | 小学教育 | 见 | 密文破译 | 是 | 相邻 2/14、2/20 均为 L4，通过 |\n| 3 | 3/14 | 小学数学教育 | 自 | 填字格 | 是 | 3/8 L2 一问、3/16 排序题，通过 |\n| 4 | 3/16 | 社会工作 | 自 | 排序题 | 是 | 与 3/14 不同题型，通过 |\n| 5 | 3/19 | 现代教育技术 | 自 | 找不同 | 是 | 与 3/16 不同题型，通过 |\n| 6 | 4/15 | 艺术教育 | 澄 | 找不同 | 是 | 相邻 4/2 L2 找不同相距 13 天，通过 |\n| 7 | 4/22 | 小学科学教育 | 澄 | 配对连线 | 是 | 与 4/15、4/23 均不同，通过 |\n| 8 | 4/23 | 小学英语教育 | 澄 | 密文破译 | 是 | 与 4/22、4/27 均不同，通过 |\n| 9 | 4/27 | 艺术设计 | 澄 | 九宫格 | 是 | 与 4/23、4/29 均不同，通过 |\n| 10 | 4/29 | 舞蹈表演 | 澄 | 迷宫 | 是 | 与 4/27 不同，通过 |\n| 11 | 5/20 | 食品营养与健康 | 清 | 填字格 | 是 | 相邻 5/18 L2 为配对连线、5/25 L2 为一问，通过 |\n| 12 | 6/1 | 美术教育 | 价 | 找不同 | 是 | 与 6/11 相距 10 天，通过 |\n| 13 | 6/11 | 学前教育 | 价 | 九宫格 | 是 | 与 6/12、6/5 L2 均不同，通过 |\n| 14 | 6/12 | 工艺美术品设计 | 价 | 排序题 | 是 | 与 6/11 不同，通过 |\n| 15 | 6/21 | 音乐教育 | 价 | 密文破译 | 是 | 相邻 6/26 L2 为一问，通过 |\n| 16 | 7/15 | 首饰设计与工艺 | 探 | 配对连线 | 是 | 7 月唯一非 L1 节点，通过 |\n| 17 | 8/1 | 婴幼儿托育服务与管理 | 索 | 迷宫 | 是 | 与 8/8、8/12、8/13 均不同（L4 不计入轮换），通过 |\n| 18 ode":"一"},{"date":"2027-12-05","month":12,"day":5,"weekday":"日","level":"L2","type":"一问","tag":"国际志愿者日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：志愿服务经历在求职里到底有多重。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"一"},{"date":"2027-12-06","month":12,"day":6,"weekday":"一","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天问了志愿经历，今天排一次「把这一年整理成三行简历」。","question":"你要把 2027 年压缩成简历上的三行，五个动作请排序：A 按 11/29 的月度清单，挑出带数字的事 B 按岗位要求分成三类能力 C 每类选一件最强的 D 每件写成「动作＋数字＋结果」 E 请一个人看一遍并挑毛病。","answer":"参考 A→B→C→D→E。C 是取舍的关键：三行不是把一年全部列出，是每年份挑一件。E 不可省——自己看自己的简历永远看不出问题。","hint_raw":"① 先分类，再挑。② 每类只挑一件。③ 见答案，把三行写出来。","record":"我的三行简历，分别是什么。","migrate":"","out_char":"","hints":["先分类，再挑","每类只挑一件","见答案，把三行写出来"],"code":"一"},{"date":"2027-12-07","month":12,"day":7,"weekday":"二","level":"L1","type":"九宫格","tag":"大雪｜九宫格","review":false,"carry":"昨天写了三行，今天看「这一年我变了什么」。","question":"中心格写「2027 年的我」。八格填：年初最怕的一件事、现在对它的看法、学会的一个具体技能、改掉的一个习惯、新认识的三个重要的人、做成的一件有数字的事、还没解决的一件事、明年最想试的一件事。","answer":"无标准答案。核心在第 1 格与第 2 格的对照：把年初的怕和现在的看法放在一起，多数人会看到「怕的东西变小了」，这是这一年最真实的变化。第 7 格不必回避，未解决的事是明年的起点。","hint_raw":"① 对照年初的怕。② 未解决的事不用藏。③ 见答案，把第 8 格写成一件具体的、明年三月前能试的事。","record":"我年初最怕的那件事，现在还怕吗。","migrate":"","out_char":"","hints":["对照年初的怕","未解决的事不用藏","见答案，把第 8 格写成一件具体的、明年三月前能试的事"],"code":"一"},{"date":"2027-12-08","month":12,"day":8,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天看到了变化，今天填「怎么把变化说清楚」。","question":"横填四格，每格两字：① 以前我___（不会／不敢／不懂） ② 现在我___（会／敢／明白） ③ 中间我___（练了／试了／学了） ④ 结果___（是／在／有）。","answer":"参考：不会／会／练了／是。这四格是「成长叙述」的最小结构，也是面试里「你最大的变化是什么」的标准答法。第 3 格必须有具体动作与次数（练了十次、试了三次），否则听起来像自我表扬。","hint_raw":"① 前后对比＋中间的动作。② 第 3 格要有次数。③ 见答案，用这四格写一句你的变化。","record":"我这一年的最大变化，用这四格说得清吗。","migrate":"","out_char":"","hints":["前后对比＋中间的动作","第 3 格要有次数","见答案，用这四格写一句你的变化"],"code":"一"},{"date":"2027-12-09","month":12,"day":9,"weekday":"四","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天说清了变化，今天排一次「这一年最难的一件事怎么讲」。","question":"面试问「讲一件你遇到过最大的困难」，五个部分请排序：A 当时的处境（时间、角色、限制） B 我判断的关键点 C 我做了什么（两三个动作） D 结果（尽量有数字） E 如果重来我会怎么改。","answer":"参考 A→B→C→D→E。B 是区分好答案与普通答案的地方：多数人只讲「我做了什么」，讲清「我当时判断的关键点是什么」的人，会显得能独立处理事情。E 让答案收在反思上，不是收在成绩上。","hint_raw":"① 先交代处境与限制。② 讲你的判断。③ 见答案，把 E 想清楚。","record":"那件难事里，我判断的关键点是什么。","migrate":"","out_char":"","hints":["先交代处境与限制","讲你的判断","见答案，把 E 想清楚"],"code":"一"},{"date":"2027-12-10","month":12,"day":10,"weekday":"五","level":"L2","type":"一问","tag":"世界人权日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：托育、养老这些行业目前缺人吗，缺口在什么岗位。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"一"},{"date":"2027-12-11","month":12,"day":11,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天问了行业缺口，今天看「我的底线」。","question":"中心格写「我能接受的」。八格填：最低起薪、最长通勤、能接受的加班频率、愿不愿意离开福州、愿不愿意去县城或乡镇、能不能接受没有编制、能不能接受先做非本专业的事、最不能放弃的一样东西。","answer":"无标准答案。第 4、5 格是这一年最现实的一问：多数人的选择范围由这两格决定，越早想清楚越省事。第 8 格「最不能放弃的一样」是你的底线，它不一定合理，但必须被自己知道。","hint_raw":"① 第 4、5 格决定选择范围。② 底线要写真实的。③ 见答案，把你最不能放弃的那样写出来。","record":"我最不能放弃的一样东西，是什么。","migrate":"","out_char":"","hints":["第 4、5 格决定选择范围","底线要写真实的","见答案，把你最不能放弃的那样写出来"],"code":"一"},{"date":"2027-12-12","month":12,"day":12,"weekday":"日","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天找到了底线，今天填「怎么把底线用在选择上」。","question":"横填四格，每格两字：① 先列___（硬条件／优点／愿望） ② 划掉不能___（接受的／改变的／比较的） ③ 剩下的___（排序／再想／都投） ④ 只留前___（两个／五个／一个）。","answer":"参考：硬条件／接受的／排序／两个。第 1 格「硬条件」指那些不满足就不能去的项（地点、学历、编制、薪资下限）。第 4 格「只留两个」是为了让行动聚焦——同时认真对待五家，等于没有认真对待任何一家。","hint_raw":"① 先列不能改的条件。② 最后只留两个。③ 见答案，把你的两个写下来。","record":"我筛完之后，剩下的两个是什么。","migrate":"","out_char":"","hints":["先列不能改的条件","最后只留两个","见答案，把你的两个写下来"],"code":"一"},{"date":"2027-12-13","month":12,"day":13,"weekday":"一","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天筛出两个，今天在「我选了但我后悔」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可以提前避免的：\n  「签了之后我才发现要天天加班，周末也常被叫。当初问的时候他们只说『偶尔忙』，我就没多问。现在想换，又怕简历不好看。」","answer":"三个词：天天加班、没多问、怕简历不好看。可以提前避免的是「没多问」——「偶尔忙」这类说法必须追问频率与具体时间（一个月几次、周末几次、有没有补休）。这类信息不问，对方不会主动说。","hint_raw":"① 有一句话是没追问。② 「偶尔忙」要问成数字。③ 见答案，写下你下次要追问的三个问题。","record":"我下次签约前，必问的三个问题是什么。","migrate":"","out_char":"","hints":["有一句话是没追问","「偶尔忙」要问成数字","见答案，写下你下次要追问的三个问题"],"code":"一"},{"date":"2027-12-14","month":12,"day":14,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天备了追问，今天连「四种含糊说法配什么追问」。","question":"左边四种常见说法，右边四种最有效的追问，请连线：① 「工资 4000 起」 ② 「表现好会有提升」 ③ 「我们这边比较忙」 ④ 「先做一段时间看看」 —— A 起薪的构成是什么，转正后是多少 B 提升的标准是什么，多久评一次 C 一个月大概几次加班，有没有补休 D 「一段时间」是多久，看什么标准。","answer":"参考 ①—A、②—B、③—C、④—D。四条的共同点是：把形容词换成数字或标准。追问时语气要平（「我想了解清楚，方便安排」），不是在质疑。","hint_raw":"① 把「起」问成构成。② 把「好」问成标准。③ 见答案，把这四句背下来。","record":"这四句里，我最可能遇到的是哪一句。","migrate":"","out_char":"","hints":["把「起」问成构成","把「好」问成标准","见答案，把这四句背下来"],"code":"一"},{"date":"2027-12-15","month":12,"day":15,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天背了追问，今天填「第一次领工资要核对的四件事」。","question":"横填四格，每格两字：① 看工资___（条／卡／额） ② 看社保有没___（有缴／有扣／有单） ③ 看加班有没___（算钱／补休／记录） ④ 看合同与___（实际／口头／承诺）是否一致。","answer":"参考：条／有缴／算钱／实际。第 2 格最重要：社保是否缴纳、按什么基数缴纳，直接影响你未来的权益，且必须在头几个月就确认。第 4 格是核对合同与实际是否一致——不一致的地方要立刻提出。","hint_raw":"① 社保要确认有没有缴。② 合同与实际要一致。③ 见答案，第一次领工资时按这四格核对。","record":"我知道我的社保按什么基数缴吗。","migrate":"","out_char":"","hints":["社保要确认有没有缴","合同与实际要一致","见答案，第一次领工资时按这四格核对"],"code":"一"},{"date":"2027-12-16","month":12,"day":16,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了核对，今天在「我不想过这种日子」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可操作的：\n  「上了几个月班，我发现自己每天都在等下班。我不想过这种日子，但又不知道自己想干什么，只能先忍着。」","answer":"三个词：等下班、不想过这种日子、不知道想干什么。可操作的是「等下班」——它是具体的信号，可以追下去：是一天里哪一段时间最难熬？哪一件事让你忘记看表？把这两个答案找出来，比空想「想干什么」有效得多。","hint_raw":"① 有一句话是具体的现象。② 从「哪一段时间最难熬」查起。③ 见答案，记一周的「难熬时刻」。","record":"我这一周最难熬的时刻，出现在做什么的时候。","migrate":"","out_char":"","hints":["有一句话是具体的现象","从「哪一段时间最难熬」查起","见答案，记一周的「难熬时刻」"],"code":"一"},{"date":"2027-12-17","month":12,"day":17,"weekday":"五","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天开始记难熬时刻，今天破三句「我应该」。","question":"请破译下面三句话，并指出哪一句是别人放在你身上的：\n  A「我应该去考编，稳定。」\n  B「我做这件事的时候不觉得累，做完还想再做一次。」\n  C「我应该早点定下来，别折腾了。」","answer":"别人放在你身上的是 A——「应该」这个词通常来自外部标准（家里、同学、舆论）。B 是你自己的数据（不累、想再做），也是唯一可以直接用来判断方向的依据。C 同样是外部压力，只是被内化成了「别折腾」。","hint_raw":"① 「应该」常来自别人的标准。② 不累且想再做，是可靠信号。③ 见答案，把你所有的「应该」列出来，标出来源。","record":"我说的「应该」里，有几个是我自己的。","migrate":"","out_char":"","hints":["「应该」常来自别人的标准","不累且想再做，是可靠信号","见答案，把你所有的「应该」列出来，标出来源"],"code":"一"},{"date":"2027-12-18","month":12,"day":18,"weekday":"六","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天分清了「应该」的来源，今天连「四种说法配一句自问」。","question":"左边四种常听到的建议，右边四句该问自己的话，请连线：① 「先稳定下来再说」 ② 「年轻人要多闯」 ③ 「你这个专业不好找工作」 ④ 「跟着心走」 —— A 我闯的成本是多少，我能承担吗 B 稳定的代价是什么，我愿意付吗 C 我这个专业，本地最近在招几个 D 我心里想的那件事，做过一次吗。","answer":"参考 ①—B、②—A、③—C、④—D。这四句自问的作用，是把建议转成可核算的成本与可验证的事实。特别是 ③—C：专业好不好找工作，是一个可以被数据回答的问题，不需要接受任何一个结论。","hint_raw":"① 每条建议都对应一个成本或事实。② 「跟着心走」要做过才知道。③ 见答案，把最常听到的那条建议自问一遍。","record":"我最常听到的那条建议，自问的答案是什么。","migrate":"","out_char":"","hints":["每条建议都对应一个成本或事实","「跟着心走」要做过才知道","见答案，把最常听到的那条建议自问一遍"],"code":"一"},{"date":"2027-12-19","month":12,"day":19,"weekday":"日","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天自问了建议，今天看两种「年终盘点」。","question":"同一个人做的两份年终盘点，找三处不同，并指出哪一份能让明年更清楚：\n  A「今年最大的收获是成长了，也更了解自己了。明年要更努力，多尝试，不给自己设限。」\n  B「今年做成 4 件事：考证、实习 6 周、带 3 次活动、投 8 家过 1 家。没做到 2 件：没减肥、没读完书单。明年先只做 3 件：考编上岸、带满 10 次活动、把体重降 5 公斤。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 只有方向，B 有成与未成的清单；② A 无法检查，B 每件都可数；③ A 的明年是态度，B 的明年是三件可数的事。让明年更清楚的是 B——承认没做到的，也是盘点的一部分。","hint_raw":"① 有一份列出「没做到」。② 明年的目标要可数。③ 见答案，写你的「做成」与「没做到」两张清单。","record":"我今年没做到的两件事，是什么。","migrate":"","out_char":"","hints":["有一份列出「没做到」","明年的目标要可数","见答案，写你的「做成」与「没做到」两张清单"],"code":"一"},{"date":"2027-12-20","month":12,"day":20,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天做了两张清单，今天走「明年只做三件」的路。","question":"定明年的三件事，四个岔口：岔口一 三件都是想要的／两件想要＋一件必须做的；岔口二 三件都很难／一件难＋两件能做到的；岔口三 只写结果／写结果＋每周动作；岔口四 放在心里／写下来贴在看得见的地方。","answer":"参考路径：两件想要＋一件必须做的→一件难＋两件能做到的→写结果＋每周动作→写下来贴在看得见的地方。第二格是可持续的关键：三件都是难事，会在二月全部崩掉；一件难事加两件能做到的，才能保住节奏。","hint_raw":"① 留一件必须做的。② eekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天排了跨年，今天连「这一年的四层」。","question":"左边这一年的四层结构，右边四句对应的话，请连线：① L1 通用谜题 ② L2 职业追问 ③ L3 二十四专业日 ④ L4 生活趣味 —— A 让我知道这个职业真实的一天是什么样 B 让我每周动一次脑子 C 让我知道还有别的活法 D 让我知道日子可以过得有意思。","answer":"参考 ①—B、②—A、③—C、④—D。这一题是全年结构的自我复述，四层各自的职能：L1 是习惯，L2 是职业认知，L3 是视野，L4 是不让日历变成任务。","hint_raw":"① 每周动一次脑子的是哪一层。② 二十四专业日带来的是视野。③ 见答案，写下你最喜欢的一层和为什么。","record":"四层里我最喜欢哪一层，为什么。","migrate":"","out_char":"","hints":["每周动一次脑子的是哪一层","二十四专业日带来的是视野","见答案，写下你最喜欢的一层和为什么"],"code":"一"},{"date":"2027-12-30","month":12,"day":30,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天回顾了结构，今天在「这本日历有什么用」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是这本日历真正想做的事：\n  「一年下来，这些谜题没有告诉我该做什么工作。但我现在会先查再判断，遇到不懂的知道找谁问，做一件事之前会想清楚要交给谁。」","answer":"三个词：没有告诉我该做什么、先查再判断、知道找谁问。这本日历真正做的事是后两个——它不替你选路，它让你具备自己判断的能力。「先查再判断」「知道找谁问」「想清楚交给谁」，是三样可以带走的东西。","hint_raw":"① 它不负责替你选路。② 带走的是三样方法。③ 见答案，写下你带走的三样。","record":"我带走的三样，具体是什么。","migrate":"","out_char":"","hints":["它不负责替你选路","带走的是三样方法","见答案，写下你带走的三样"],"code":"一"},{"date":"2027-12-31","month":12,"day":31,"weekday":"五","level":"REVIEW","type":"年度复盘","tag":"年度复盘（出字：步）","review":true,"carry":"","question":"- 今日非 L1，年度总复盘（约 40 分钟），分五步。\n- 第一步｜通读：翻 1 月 1 日到 12 月 30 日的每一页，只看你写的「探索记录」，不做评价。\n- 第二步｜四季对账：把 3/31「己」、6/30「值」、9/30「界」三页的结论并排看，回答一句：这一年我认清了什么。\n- 第三步｜出字串联：Q1「看、见、自、己」，Q2「澄、清、价、值」，Q3「探、索、世、界」，Q4「走、出、一」，最后一天的字是——\n  **答案：步**。全年密码句：「看见自己，澄清价值，探索世界，走出一步。」\n- 第四步｜写三行：用「以前我___／现在我___／明年我___」写三行，每行不超过十五字。\n- 第五步｜收好：把这一本放进能再找到的地方。一年后再看，比现在更有用。","answer":"","hint_raw":"","record":"这一年我走出的那一步，具体是什么。\n\n---\n\n## 附一：Q4 验收自检","migrate":"","out_char":"","hints":[],"code":"步"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
