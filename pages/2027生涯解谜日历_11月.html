.answer{white-space:pre-wrap;font-size:14px;background:#FFF9E8;border-left:3px solid var(--gold);

.record{font-size:13.5px;color:var(--green-2);margin-top:10px;padding-left:2px}
.record:before{content:"探索记录 · ";color:var(--mute);font-size:12px}

.index-list{list-style:none;padding:0;margin:18px 0 0}

.index-list a:hover{color:var(--ochre)}
.index-list span{color:var(--mute);font-size:13px;margin-left:10px}
@media (max-width:640px){
  h1{font-size:26px} .hero-svg{display:none} .month-head .ch{font-size:26px}

@media print{
  body{background:#fff;font-size:11pt} .controls,#q,button{display:none!important}

  .card{break-inside:avoid;box-shadow:none} section.month{break-before:page}
  .cards{grid-template-columns:1fr 1fr}
  a{color:inherit;text-decoration:none}
}

被改写成了解释句，请把它们还原成行业词，并回答：删掉哪一个，观众会觉得「跳了」？\n\n  - 镜头 1（0—3 秒）：树叶特写，风一起。\n  - 镜头 2（3—12 秒）：【甲：画面被切成一小格一小格的拍摄单位，每格标明秒数与景别】——\n  - 镜头 3（12—22 秒）：男生抬头看树（注：【乙：画面中动作开始或变化的那一帧，剪辑点常落在它上面】）\n  - 镜头 4（22—24 秒）：黑屏 0.5 秒，声音先入（注：【丙：两个镜头之间的衔接方式，常见有切、叠、划】）\n  - 镜头 5（24—60 秒）：男生走出校门，字幕「11 月，第一批实习报名开始」。","answer":"甲＝**分镜**；乙＝**关键帧**；丙＝**转场**。\n  - 删掉后观众会觉得「跳了」的是**转场（丙）**：镜头 4 那个 0.5 秒黑屏＋声音先入，正是把「看树」接到「走出校门」的桥。没有它，观众会以为自己漏看了一段——**时间与空间的转换必须有人交代，哪怕只用半秒黑场**。\n  - 分镜缺了只是拍摄乱了（观众看不见），关键帧缺了只是剪辑点不准（观众只觉得「有点别扭」）。\n  - 专业要点：**观众感知不到术语，只感知到断裂**。所有「看不懂」的问题，先回到「哪一步没有交代」。","hint_raw":"①三个词分别管「拍之前」「剪的时候」「接的时候」　②有一个词管的是「从这里到那里」　③见答案，再想：你上次看不懂一个视频，是内容难，还是中间少了一步","record":"我讲一件事时，最常省略的是哪一步","migrate":"把你这周要讲的一件事（汇报、试讲、社团招新）找出「省略掉的那一步」，补一句话交代它。","out_char":"","college":"信息科学学院","profession":"数字媒体技术","hints":["三个词分别管「拍之前」「剪的时候」「接的时候」","有一个词管的是「从这里到那里」","见答案，再想：你上次看不懂一个视频，是内容难，还是中间少了一步"],"code":"出"},{"date":"2027-11-09","month":11,"day":9,"weekday":"二","level":"L1","type":"九宫格","tag":"全国消防日｜九宫格","review":false,"carry":"专业日之后，今天看「我做过的东西」。","question":"中心格写「我做出来的东西」。八格填：一个文档、一个视频或图文、一次活动、一份表格、一个手工、一次讲解、别人用过的一个成果、我最想再做一次的那个。","answer":"无标准答案。要点在第 7 格与第 8 格：第 7 格「别人用过」是作品与练习的分界；第 8 格「最想再做一次」指向你真正的动力来源，也是下一件作品该做什么的答案。","hint_raw":"① 别人用过才算作品。② 最想再做一次的那件事很关键。③ 见答案，把第 6 格的编号换成能发出去的链接或文件。","record":"我的东西，有没有被别人真的用过一次。","migrate":"","out_char":"","hints":["别人用过才算作品","最想再做一次的那件事很关键","见答案，把第 6 格的编号换成能发出去的链接或文件"],"code":"出"},{"date":"2027-11-10","month":11,"day":10,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天盘点了作品，今天连「四种作品配什么展示方式」。","question":"左边四种作品，右边四种最合适的展示，请连线：① 一份教案或活动方案 ② 一段视频 ③ 一套设计或手工 ④ 一组数据或表格 —— A 做成三张图＋一句结论 B 拍成品＋过程三张照片 C 附一张成品图和一句「解决了什么问题」 D 剪成 60 秒，开头三秒给结果。","answer":"参考 ①—C、②—D、③—B、④—A。②—D 的关键是「开头三秒」：视频的留存取决于前三秒，作品集里的视频同样。①—C 强调「解决了什么问题」，教案的价值不在格式，在它解决了什么教学问题。","hint_raw":"① 视频前三秒最重要。② 教案要说明解决什么问题。③ 见答案，选你的一件作品，按对应方式整理一次。","record":"我的那件作品，解决了什么问题，一句话说得清吗。","migrate":"","out_char":"","hints":["视频前三秒最重要","教案要说明解决什么问题","见答案，选你的一件作品，按对应方式整理一次"],"code":"出"},{"date":"2027-11-11","month":11,"day":11,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天整理了作品，今天在「我怕被比较」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是需要处理的真问题：\n  「我不敢把作品发出去，怕别人做得比我好。看到别人的作品，我就觉得自己做的很粗糙，还不如不发。」","answer":"三个词：不敢发、别人比我好、还不如不发。真问题是「还不如不发」——它把「水平不够」直接推成「不该被看见」，而作品的价值在于被使用与反馈，不在于比别人好。可行动的一步：发给三个不会嘲笑你的人，只问一句「哪里看不懂」。","hint_raw":"① 作品的价值不在排名。② 先发给安全的人。③ 见答案，把三个人写下来。","record":"我可以发给哪三个人，不会被嘲笑。","migrate":"","out_char":"","hints":["作品的价值不在排名","先发给安全的人","见答案，把三个人写下来"],"code":"出"},{"date":"2027-11-12","month":11,"day":12,"weekday":"五","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天定了三个人，今天走「把作品集做出来」的路。","question":"你要做一份三页的作品集，四个岔口：岔口一 放十件／只放三件；岔口二 每件都写完整体／每件只写做了什么＋结果；岔口三 按时间排／按能力排；岔口四 做完等机会／主动发出去。","answer":"参考路径：只放三件→每件只写做了什么＋结果→按能力排→主动发出去。第三格是要点：按能力排（我会带活动／我会写／我会拍），对方才能在一分钟内看到你能做什么；按时间排只对你自己有意义。","hint_raw":"① 三件胜十件。② 按能力排，不按时间排。③ 见答案，把你的三件排出能力标签。","record":"我三件作品对应的能力标签，分别是什么。","migrate":"","out_char":"","hints":["三件胜十件","按能力排，不按时间排","见答案，把你的三件排出能力标签"],"code":"出"},{"date":"2027-11-13","month":11,"day":13,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天排了作品集，今天看两种「自我介绍」。","question":"两个人在同一场双选会上介绍自己，两段话找三处不同，并指出哪一个人更容易被记住：\n  A「你好，我是学前的，我性格开朗，能吃苦，什么都能干。」\n  B「你好，我是学前的，在幼儿园实习过 6 周，带过 8 个孩子的一日流程。您这边主要缺哪一块？」","answer":"三处不同：① A 只说专业和性格，B 说了具体经历；② A 没有数字，B 有两个数字；③ A 说完就结束，B 用一个问题把对话继续下去。更容易被记住的是 B——最后一个问题让对方开始说话，你就从「众多应聘者」变成了「聊过的人」。","hint_raw":"① 一个数字胜过三个形容词。② 结尾用一个问题。③ 见答案，把你的自我介绍改成 B。","record":"我自我介绍的最后一句，能不能是一个问题。","migrate":"","out_char":"","hints":["一个数字胜过三个形容词","结尾用一个问题","见答案，把你的自我介绍改成 B"],"code":"出"},{"date":"2027-11-14","month":11,"day":14,"weekday":"日","level":"L1","type":"隐藏词","tag":"世界糖尿病日｜隐藏词","review":false,"carry":"昨天改了介绍，今天在「我身体扛不住」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是最需要现在就处理的：\n  「最近总是熬夜，早上起不来，白天靠咖啡。吃饭不规律，胃开始疼了。反正年轻，先扛着，等工作定了再调。」","answer":"三个词：熬夜、吃饭不规律、先扛着。最需要现在处理的是「先扛着」——身体问题不会等到「工作定了」才处理，而且它会直接影响面试状态与考试发挥。最小的动作：固定一个睡觉时间、按时吃早饭，两周就能看到差别。","hint_raw":"① 「先扛着」是最大的风险。② 从一件事开始改。③ 见答案 day":19,"weekday":"五","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天做了时间表，今天连「四种拖延配什么解法」。","question":"左边四种拖延的情形，右边四种对应的解法，请连线：① 不知道怎么开始 ② 怕做不好 ③ 事情太大 ④ 手机一直响 —— A 先做一个最丑的版本 B 把第一步缩到五分钟 C 只做半小时，定闹钟 D 把手机放到另一个房间。","answer":"参考 ①—B、②—A、③—C、④—D。②—A 是关键：怕做不好的人需要的不是鼓励，而是允许自己先做一个差版本，改起来比开始容易得多。","hint_raw":"① 不知道开始就先做五分钟。② 先做丑版本。③ 见答案，对照你今天的状态。","record":"我今天拖的那件事，属于哪一种。","migrate":"","out_char":"","hints":["不知道开始就先做五分钟","先做丑版本","见答案，对照你今天的状态"],"code":"出"},{"date":"2027-11-20","month":11,"day":20,"weekday":"六","level":"L3","type":"专业日","tag":"世界儿童日｜L3 专业日：早期教育","review":false,"carry":"昨天你在补「被省略的那一步」，今天补另一种省略：**孩子的信号被读错了，不是没发出**。","question":"三段 0—3 岁照护记录，每段里藏着一个信号词（饥饿／困倦／过度刺激），请找出来，并判断**哪一个最常被大人误读成「闹脾气」**。\n\n  - 记录一：「10:40，距上次进食 3 小时 20 分。先吃手，转头找，随后开始短促低声哭，抱起来会往怀里拱。」\n  - 记录二：「13:50，已清醒 4 小时。揉眼、打哈欠、眼神开始飘，抱着轻拍后哭声变小。」\n  - 记录三：「16:20，活动室有人来访，音乐与说话声同时变大。突然扭头、身体打挺、哭声尖而急，越抱越哭，换到安静房间 3 分钟后停止。」","answer":"记录一＝**饥饿**（吃手、转头找、拱怀是觅食反射链）；记录二＝**困倦**（揉眼、打哈欠、眼神飘，是睡眠信号）；记录三＝**过度刺激**（扭头、打挺、越哄越哭，是刺激过载）。\n  - **最常被误读成「闹脾气」的是过度刺激**：它的表现（打挺、越抱越哭、哭声尖）最像「不听话」，而大人的本能反应是**加倍安抚**——抱得更紧、说得更多、换个花样哄，恰好继续加刺激，于是越哄越哭。\n  - 正确做法是**减法**：降光、降噪、减少接触人数，把孩子带到安静角落，等神经系统自己下来。记录三最后「换到安静房间 3 分钟后停止」，就是最直接的证据：**环境一改，哭声就停，说明问题从来不在孩子身上**。","hint_raw":"①三段里有两段，孩子是在「要什么」；有一段，孩子是在「不要什么」　②有一段越哄越哭，这本身就是线索　③见答案，再想：为什么「加倍的安抚」有时反而是加压","record":"我身边有人「闹脾气」时，我第一反应是加还是减","migrate":"找出你专业里一个「需要做减法而不是加法」的场景（信息过载的用户、任务太多的组员、排得太满的课表），写出你要减掉什么。","out_char":"","college":"学前教育学院","profession":"早期教育","hints":["三段里有两段，孩子是在「要什么」；有一段，孩子是在「不要什么」","有一段越哄越哭，这本身就是线索","见答案，再想：为什么「加倍的安抚」有时反而是加压"],"code":"出"},{"date":"2027-11-21","month":11,"day":21,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"专业日之后，今天走「我的第一份工作怎么选」的路。","question":"你手上有两个 offer，四个岔口：岔口一 只看工资／先看能学到什么；岔口二 选最轻松／选能接触到核心业务的；岔口三 只看单位大小／看带你的人是谁；岔口四 定下来就结束／给自己留一句「什么情况下我会换」。","answer":"参考路径：先看能学到什么→选能接触到核心业务的→看带你的人是谁→给自己留一句「什么情况下我会换」。第三格对第一份工作最重要：第一年带你的那个人，决定你养成什么工作习惯。","hint_raw":"① 第一份工作看成长。② 带你的人最关键。③ 见答案，写下你的「什么情况下会换」。","record":"我这两个选择，各自能学到什么。","migrate":"","out_char":"","hints":["第一份工作看成长","带你的人最关键","见答案，写下你的「什么情况下会换」"],"code":"出"},{"date":"2027-11-22","month":11,"day":22,"weekday":"一","level":"L1","type":"配对连线","tag":"小雪｜配对连线","review":false,"carry":"昨天做了选择，今天连「四种单位配什么提问」。","question":"左边四种单位类型，右边四个面试时该问的问题，请连线：① 公办园或学校 ② 民办园或机构 ③ 企业 ④ 社区或社会组织 —— A 这个岗的考核指标是什么 B 编制与聘用方式、职称评定路径 C 生源结构与家长群体的特点 D 项目经费从哪里来、周期多长。","answer":"参考 ①—B、②—C、③—A、④—D。①—B 必须问：编制与聘用、职称路径决定你五年的收入曲线。④—D 决定这份工作稳不稳——靠项目经费运转的岗位，周期就是你的周期。","hint_raw":"① 公办先问编制与职称。② 社区类问经费来源。③ 见答案，把你最该问的那一个问题写下来。","record":"我去面试时，最该问的那一个问题是什么。","migrate":"","out_char":"","hints":["公办先问编制与职称","社区类问经费来源","见答案，把你最该问的那一个问题写下来"],"code":"出"},{"date":"2027-11-23","month":11,"day":23,"weekday":"二","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天要问了关键问题，今天填「听答案时听什么」。","question":"横填四格，每格两字：① 听有没有___（具体数字／好话／承诺） ② 听谁___（负责／最大／说话） ③ 听有没有说___（难处／前景／待遇） ④ 听有没有___（含糊／确定／很长）的地方。","answer":"参考：具体数字／负责／难处／含糊。第 3 格是最可靠的判断依据：愿意主动讲难处的单位，通常可信度更高；只讲前景的，需要多问几句。第 4 格「含糊」出现在哪里，那里就有问题（常出现在加班、考核、转正条件上）。","hint_raw":"① 主动讲难处是可信信号。② 含糊的地方要追问。③ 见答案，把对方含糊的那一处记下来再问。","record":"对方含糊过去的那个问题是什么。","migrate":"","out_char":"","hints":["主动讲难处是可信信号","含糊的地方要追问","见答案，把对方含糊的那一处记下来再问"],"code":"出"},{"date":"2027-11-24","month":11,"day":24,"weekday":"三","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天学了听答案，今天走「签约前要确认的事」的路。","question":"签约之前，四个岔口：岔口一 只看工资／看工资＋五险一金＋试用期；岔口二 口头承诺／写进合同；岔口三 不问违约金／问清违约与解约条件；岔口四 签完不存／自己留一份并拍照存档。","answer":"参考路径：看工资＋五险一金＋试用期→写进合同→问清违约与解约条件→自己留一份并拍照存档。第三格是很多学生的盲点：违约金、服务期、档案与户籍的处理方式，都必须在签之前问清。","hint_raw":"① 五险一金与试用期要看。② 口头承诺要落到纸上。③ 见答案，把违约金这一项问清楚。","record":"我要签的那份合同，违约金怎么写的。","migrate":"","out_char":"","hints":["五险一金与试用期要看","口头承诺要落到纸上","见答案，把违约金这一项问清楚"],"code":"出"},{"date":"2027-11-25","month":11,"day":25,"weekday":"四","level":"L1","type":"密文破译","tag":"感恩节｜密文破译","review":false,"carry":"昨天看了合同，今天破三句「谢谢」。","question":"请破译下面三句话，并指出哪一句最有可能在三年后还有用：\n  A「谢谢老师这段时间的照顾。」\n  B「谢谢老师，您上次说的『先听家长说完』我用了，那次没吵起来。我记在本子上了。」\n  C「谢谢，以后有事找我。」","answer":"三年后还有用的是 B——它说了「用了什么、结果如何」，对方因此知道自己的建议有价值，关系会继续。A 是礼貌，C 是客套且没有落点。感谢的公式是：具体的事＋我的动作＋结果。","hint_raw":"① 感谢要具体到一件事。② 说出结果最打动人。③ 见答案，写一句你真正想说的感谢。","record":"我要感谢的那个人，具体是哪一件事帮到了我。","migrate":"","out_char":"","hints":["感谢要具体到一件事","说出结果最打动人","见答案，写一句你真正想说的感谢"],"code":"出"},{"date":"2027-11-26","month":11,"day":26,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天写了感谢，今天排一次「告别」。","question":"实习或一段经历结束，五个动作请排序：A 把手上的资料整理好留给接手的人 B 当面向带你的老师说一句具体的感谢 C 和同批的人互留联系方式 D 写一段三百字的总结 E 一个月后发一条近况。","answer":"参考 A→B→D→C→E。A 在最前：留下整理好的资料，是最实在的告别。D 必须趁细节还清楚时写，它是你日后写简历与面试故事的唯一素材库。E 是长期关系的维护动作，成本极低，回报很高。","hint_raw":"① 先留资料。② 总结要趁记得写。③ 见答案，注意 E 为什么是「一个月后」。","record":"我这三百字的总结，第一句会写什么。","migrate":"","out_char":"","hints":["先留资料","总结要趁记得写","见答案，注意 E 为什么是「一个月后」"],"code":"出"},{"date":"2027-11-27","month":11,"day":27,"weekday":"六","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天写了总结，今天走「明年怎么办」的路。","question":"这一年快结束了，四条路：岔口一 继续现在这条路／换一条；岔口二 想清楚再动／先动起来再看；岔口三 只靠自己摸索／找一个走过这条路的人；岔口四 定一个大目标／定一个三个月的动作。","answer":"参考路径：先动起来再看→找一个走过这条路的人→定一个三个月的动作→再判断要不要继续这条路。第二格是这一年最省时间的做法：走过这条路的人能在十分钟里告诉你三个坑。","hint_raw":"① 先动再看。② 找一个走过的人。③ 见答案，写下那个人的名字。","record":"走过我想走那条路的人，我认识几个。","migrate":"","out_char":"","hints":["先动再看","找一个走过的人","见答案，写下那个人的名字"],"code":"出"},{"date":"2027-11-28","month":11,"day":28,"weekday":"日","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了那个人，今天破三句「明年再说」。","question":"请破译下面三句话，并指出哪一句其实已经在行动：\n  A「明年再好好规划吧，今年先这样。」\n  B「我这个月先把简历改好，下个月投五家。」\n  C「等我准备好了就开始。」","answer":"已经在行动的是 B——它有具体动作与时间。A 是把决定推给未来的自己（明年会有明年的忙）；C 的「准备好」没有定义，通常永远不会到来。","hint_raw":"① 有一个动作有月份和数量。② 「准备好」没有标准。③ 见答案，把你的「明年再说」换成本月的一件事。","record":"我这个月能做完的那一件事，是什么。","migrate":"","out_char":"","hints":["有一个动作有月份和数量","「准备好」没有标准","见答案，把你的「明年再说」换成本月的一件事"],"code":"出"},{"date":"2027-11-29","month":11,"day":29,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天定了本月的事，今天看两份「年度总结」。","question":"两个人的年度总结，找三处不同，并指出哪一份明年还能用：\n  A「这一年过得很充实，参加了很多活动，学到了很多，也成长了很多，希望明年继续努力。」\n  B「一月加入社团，负责过一次 20 人的活动；四月考了普通话二甲；七月在奶茶店做了两个月；十月开始实习，独立带过 3 次活动；十一月投了 8 家，面试 3 家，过了 1 家。」","answer":"三处不同：① A 全是程度词，B 全是时间＋事件；② A 没有量，B 每件事都有数字；③ A 无法转成简历，B 可以直接拆成三行。明年还能用的是 B——它本身就是一份素材库。","hint_raw":"① 按月份记事。② 每件事带数字。③ 见答案，把你的这一年补成 B 的样子。","record":"我这一年，能按月说出几件事。","migrate":"","out_char":"","hints":["按月份记事","每件事带数字","见答案，把你的这一年补成 B 的样子"],"code":"出"},{"date":"2027-11-30","month":11,"day":30,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"十一月最后一天，在一段「我这一年好像白过了」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断需要修正：\n  「这一年好像白过了：没拿奖学金，没当干部，也没什么比赛。看着别人的朋友圈，我越来越觉得自己浪费时间。」\n  A/B 请找出三个词并判断。","answer":"三个词：白过了、没什么、浪费时间。需要修正的是「白过了」——它用三个单一指标（奖、干部、比赛）衡量一整年，把实习、兼职、考证、人际关系全部排除在外。修正方式：用 11/29 那份按月清单重写一次这一年。","hint_raw":"① 三个指标不等于一年。② 按月重写一次。③ 见答案，写下你这一年真正做成的三件事。","record":"我这一年真正做成的三件事，是什么。\n\n---\n\n## 十二月｜合一（月字：一）\n\n十二月 31 天：L1 25 道；L3 一天（12/3 特殊教育）；L2 一问两天（12/5、12/10）；L4 两天（12/24、12/25）；12/31 年度复盘（出字：步）。","migrate":"","out_char":"","hints":["三个指标不等于一年","按月重写一次","见答案，写下你这一年真正做成的三件事"],"code":"出"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
