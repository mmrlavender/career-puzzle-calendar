iew":false,"carry":"寒假前的第一周，把「我的一天」分给几个人。","question":"左边五种时间，右边五句话，请连线：① 起床到出门 ② 上课的四十分钟 ③ 下课那十分钟 ④ 睡前半小时 ⑤ 一个人吃饭 —— A「今天最想说话的时候」 B「一天里最赶的一段」 C「一天里最容易被别人决定的一段」 D「一天里最属于自己的安静」 E「一天里状态最好的时候」。","answer":"参考连线 ①—B、②—C、③—A、④—D、⑤—E（③与④可互换，看个人）。关键不在连得对不对，在「一天里最属于自己的安静」落到哪一格。","hint_raw":"① 先答第 ⑤ 题：一个人吃饭时你在想什么。② 有两格都可能是「最属于自己的安静」。③ 多数人的 D 落在 ④，如果你落在别处，说明你的安静不在睡前。","record":"我一天里最属于自己的那段时间，够不够半小时。","migrate":"","out_char":"","hints":["先答第 ⑤ 题：一个人吃饭时你在想什么","有两格都可能是「最属于自己的安静」","多数人的 D 落在 ④，如果你落在别处，说明你的安静不在睡前"],"code":"看"},{"date":"2027-01-05","month":1,"day":5,"weekday":"二","level":"L1","type":"迷宫","tag":"小寒｜迷宫","review":false,"carry":"天冷了，先看一件最容易被忽略的事：我的身体怎么说。","question":"从「早上闹钟响」到「出门」，有四个岔口，每个岔口只有一条路通向「不迟到也不难受」：岔口一 起床还是再睡五分钟；岔口二 先喝水还是先刷手机；岔口三 先穿衣服还是先找东西；岔口四 出门前照镜子还是抓门就走。","answer":"参考路径：（起床）→（先喝水）→（先穿衣服）→（照镜子）。岔口二的「先刷手机」是最危险的一条，它偷走的不是五分钟，是判断力；岔口四的照镜子不是臭美，是检查「有没有哪里不对」。","hint_raw":"① 四个岔口里，有一个一旦走错，后面三个全部失效。② 不是「再睡五分钟」最危险，是起床之后第一件事。③ 见答案，并想清楚为什么第一件事决定后面所有事。","record":"我早上起床后的第一件事，是给身体，还是给别人。","migrate":"","out_char":"","hints":["四个岔口里，有一个一旦走错，后面三个全部失效","不是「再睡五分钟」最危险，是起床之后第一件事","见答案，并想清楚为什么第一件事决定后面所有事"],"code":"看"},{"date":"2027-01-06","month":1,"day":6,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天看早上，今天看一句「我以为我很努力」的话。","question":"下面两句话，只差几个字，意思差很远。找出三处不同，并说明哪一句是真的在做事：\n  A「我今天很忙，忙到没时间喝水。」\n  B「我今天做了三件事，做完第二件时喝了水。」","answer":"三处不同：① A 说自己忙，B 说做了什么；② A 的衡量标准是「没时间」，B 的标准是「做完了」；③ A 没有结尾，B 有节奏（做完第二件时喝水）。真正在做事的是 B——它说得出做了什么、什么时候停。","hint_raw":"① 数一数两句话里各有多少个「具体的事」。② 有一句话里没有一个动词指向前进。③ 见答案，并留意「忙」这个词其实什么都没说。","record":"我说「我很忙」的时候，通常是在掩饰哪一件事没做。","migrate":"","out_char":"","hints":["数一数两句话里各有多少个「具体的事」","有一句话里没有一个动词指向前进","见答案，并留意「忙」这个词其实什么都没说"],"code":"看"},{"date":"2027-01-07","month":1,"day":7,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天抓了「忙」，今天在一段日记里找别的词。","question":"下面这段日记里藏着三个词，找出来，并指出哪一个是最关键的：\n  「今天上午本来想复习，结果被叫去帮忙搬东西，搬完就中午了。中午吃不下，随便吃了两口。下午本来想睡，睡不着，翻了两个小时的手机。晚上突然觉得一天就这么没了，有点生气，又不知道气谁。」","answer":"三个词（参考）：本来、随便、突然。最关键的是「本来」——它出现两次，每出现一次，就说明有一件事在开始之前就被人或自己换掉了。「突然」是结果，不是原因。","hint_raw":"① 注意反复出现的那个词，重复就是线索。② 有一个词是「凑合」的意思。③ 见答案，「突然」指的是情绪，不是事情。","record":"我的「本来」这个词，一天里出现几次。","migrate":"","out_char":"","hints":["注意反复出现的那个词，重复就是线索","有一个词是「凑合」的意思","见答案，「突然」指的是情绪，不是事情"],"code":"看"},{"date":"2027-01-08","month":1,"day":8,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"话说多了会累，今天只填六个字。","question":"横填六个字，每格一个字，组成今天最该做的一件事的完整说法，提示如下：\n  ① 「今天我不想做，但」——第一个字（也/就/还）___\n  ② 「我可以只做」——第二个字（一/半/十）___ 分钟\n  ③ 「做完了就」——第三个字（停/加/换）___\n  ④ 「不用做到」——第四个字（好/完/对）___\n  ⑤ 「做不下去就」——第五个字（记/扔/忘）___下来\n  ⑥ 「明天从」——第六个字（头/此/新）___开始","answer":"参考填法：还／一／停／好／记／头。连起来是「还差一步：只做一分钟，做完就停，不用做到好，做不下去就记下来，明天从头开始」。这六格是拖延的最小解法。","hint_raw":"① 第三格和第四格必须选「停」和「好」，否则整句话会变成加压。② 第五格选「记」，因为记下来才不算白做。③ 见答案，试着今天用一次。","record":"我拖延的时候，最常卡在第几格。","migrate":"","out_char":"","hints":["第三格和第四格必须选「停」和「好」，否则整句话会变成加压","第五格选「记」，因为记下来才不算白做","见答案，试着今天用一次"],"code":"看"},{"date":"2027-01-09","month":1,"day":9,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天给了拖延一个解法，今天看它的反面：什么事我一做就停不下来。","question":"中心格写「停不下来」。八格填：上一次忘记看时间是在做什么、那时身边有人吗、做完之后身体什么感觉、有没有人夸过我这件、这件事能不能换钱、这件事我练了多久、如果没人看见我还会不会做、它和我的专业有没有一点点关系。","answer":"无标准答案。八格填完后，看两格：第 5 格（能不能换钱）与第 7 格（没人看见还做不做）。两格都「是」，是职业线索；第 7 格「是」而第 5 格「不是」，是热爱但还没找到出口。","hint_raw":"① 先填第 7 格，它最诚实。② 第 8 格允许写「没有」。③ 两格都「不是」也正常，说明这件事只是休息。","record":"我停不下来的那件事，我有没有认真对待过它一次。","migrate":"","out_char":"","hints":["先填第 7 格，它最诚实","第 8 格允许写「没有」","两格都「不是」也正常，说明这件事只是休息"],"code":"看"},{"date":"2027-01-10","month":1,"day":10,"weekday":"日","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天发现了一件停不下来的事，今天听听别人怎么说它。","question":"下面三句话说的是同一件事，但说话的人不同。请破译出：谁在说、对谁说、真正想表达什么：\n  A「你这个有什么用？」\n  B「这个你自己喜欢就好。」\n  C「要是有时间，我也想学。」","answer":"A 多在长辈或同学口中，对晚辈/同伴说，真正想表达的是「我担心这个不能当饭吃」；B 是客气话，真正想表达的是「我不懂，也不打算懂」，它听着温和，其实是退出；C 是真心话，真正想表达的是「我羡慕你敢花时间在没用的事上」。三句里唯一有支持成分的是 C。","hint_raw":"① 分清楚哪一句是在担心，哪一句是在退出。② 最温柔的那句，往往是最不参与的那句。③ 见答案，想想我听到的通常是哪一句。","record":"我把哪一句话，当成了对我的否定。","migrate":"","out_char":"","hints":["分清楚哪一句是在担心，哪一句是在退出","最温柔的那句，往往是最不参与的那句","见答案，想想我听到的通常是哪一句"],"code":"看"},{"date":"2027-01-11","month":1,"day":11,"weekday":"一","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天听见了三种反应，今天排一下「怎么回应」。","question":"当有人说「你这个有什么用」时，有五个回应，请排出你自己愿意用的顺序，并说明第一句为什么放第一：A 沉默，回去继续做 B 反问「你觉得什么有用」 C 说「现在没用，但我想试试」 D 笑一下，换话题 E 认真解释这件事的价值。","answer":"参考顺序 C→A→D→B→E。C 最稳：承认现状又不放弃立场，一句就把对话关掉一半的火气。E 最容易失控，因为它需要对方听得懂。这道题没有唯一答案，但有一个判断标准：第一句要能让对话停下来，而不是继续烧。","hint_raw":"① 先排除「最想说的」那一句，它通常不是最好的。② 有一句既承认事实又不认输。③ 见答案，注意 E 为什么排最后。","record":"我上一次被质疑时，用的是哪一句。","migrate":"","out_char":"","hints":["先排除「最想说的」那一句，它通常不是最好的","有一句既承认事实又不认输","见答案，注意 E 为什么排最后"],"code":"看"},{"date":"2027-01-12","month":1,"day":12,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"从「被质疑」回到「我信什么」，今天连五组。","question":"左边五个说法，右边五种人的处境，请连线：① 「稳定最重要」 ② 「先挣钱再说」 ③ 「趁年轻多试」 ④ 「跟对人比什么都强」 ⑤ 「我还没想好」 —— A 家里需要我尽快有收入 B 我不知道自己喜欢什么 C 我怕选错，所以先不动 D 我试过两次都失败，不想再试 E 我见过的稳定，是靠人给的。","answer":"参考 ①—E、②—A、③—D（或 B）、④—C、⑤—B。关键在 ⑤—B：说「还没想好」的人，往往缺的不是答案，是试过的次数。","hint_raw":"① 先连最确定的一组。② 有一句听起来是谦虚，其实是没有开始。③ 见答案，看 ③ 与 ⑤ 的关系：多试是「还没想好」的解药。","record":"这五句话里，哪一句现在最像我。","migrate":"","out_char":"","hints":["先连最确定的一组","有一句听起来是谦虚，其实是没有开始","见答案，看 ③ 与 ⑤ 的关系：多试是「还没想好」的解药"],"code":"看"},{"date":"2027-01-13","month":1,"day":13,"weekday":"三","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天找到了最像我的那句话，今天走一走它的出口。","question":"一句话「我还没想好」有三条出口，每条路上有两个岔口，请选出唯一能走出去的一条：出口一 等想好了再开始（岔口：等灵感／等别人告诉我）；出口二 先做一件小事再看（岔口：做最想做的／做最容易的）；出口三 问很多人（岔口：问同专业的／问已经工作三年的人）。","answer":"唯一能走出去的是出口二，岔口选「做最容易的」。理由：想不清楚时，难度会放大犹豫；先做最容易的一件，能在两周内拿到一次真实反馈，反馈比思考更能定位方向。出口一的两个岔口都是「等」，出口三问同专业的人容易得到同一套焦虑。","hint_raw":"① 三条出口里，有两条其实是一条：都在等。② 唯一能走出去的那条，不需要你先想清楚。③ 见答案，注意为什么先选「最容易的」而不是「最想做的」。","record":"我正在等的那件事，等的到底是什么。","migrate":"","out_char":"","hints":["三条出口里，有两条其实是一条：都在等","唯一能走出去的那条，不需要你先想清楚","见答案，注意为什么先选「最容易的」而不是「最想做的」"],"code":"看"},{"date":"2027-01-14","month":1,"day":14,"weekday":"四","level":"L3","type":"专业日","tag":"L3 专业日：人工智能技术应用","review":false,"carry":"1 月的主线是「看见自己」，前几天你写下的是「我最常被人问的一个问题」。今天把这个问题交给一台机器——它答得又快又像样，但它不知道自己哪一句不该说。","question":"某校园问答机器人上线前，值班老师写了三条配置规则，每条规则里藏着一个行业词，请把三个词找出来，再回答：明天就要上线，三条里哪一条最不能缺？\n\n  - 规则一：「遇到不会的问题不要编，回复『这个问题我需要确认后答复你』，并把问题转给学生会。」——藏着（　　　）\n  - 规则二：「你可以回答课程、场地、社团相关的问题。」——藏着（　　　）\n  - 规则三：「回答学生提问时，先复述他的问题，再给答案，不超过 80 字。」——藏着（　　　）","answer":"三个词依次是**兜底、边界、提示词**（规则一＝兜底，规则二＝边界，规则三＝提示词）。最不能缺的是**边界**。因为提示词决定它「答得好不好」，兜底决定它「答不出时体不体面」，而边界决定它「根本不碰哪些事」。没有兜底的机器人会露怯，没有边界的机器人会**用很确定的语气说出它不该说的话**——学生分不出哪句是错的，只看见语气很笃定。","hint_raw":"①三个词分别回答三个问题：它怎么答、它能答什么、它答不出来怎么办　②有一条规则划的不是方法，是范围　③见答案，并想清楚：为什么「答错」比「答不出」更伤人","record":"我请别人（或机器）替我做决定时，有没有提前划清过界线","migrate":"在你的专业里找一件「必须先划范围、再谈做得好不好」的事（实习中哪些事必须请示、哪些数据不能外传、哪些话不能对学生家长说），写一句你的界线。","out_char":"","college":"信息科学学院","profession":"人工智能技术应用","hints":["三个词分别回答三个问题：它怎么答、它能答什么、它答不出来怎么办","有一条规则划的不是方法，是范围","见答案，并想清楚：为什么「答错」比「答不出」更伤人"],"code":"看"},{"date":"2027-01-15","month":1,"day":15,"weekday":"五","level":"L1","type":"找不同","tag":"腊八节｜找不同","review":false,"carry":"专业日之后回到自己，今天看两碗「粥」。","question":"下面两段写同一天的文字，找三处不同，并指出哪一种写法更像「过日子」而不是「熬日子」：\n  A「今天腊八，家里煮了粥。我喝了一碗，还行。」\n  B「今天腊八，妈一早泡了八样豆子，煮了一个钟头。我喝了两碗，第二碗她给我多添了一勺糖。」","answer":"三处不同：① A 只有「粥」，B 有「八样豆子、一个钟头」——有过程；② A 说「还行」，B 说「第二碗」——有数量，数量代表真实的喜欢；③ A 没有别人，B 有「她多添了一勺糖」——有人在做。更像过日子的是 B。","hint_raw":"① 数一数两段里各出现了几个人。② 有一段的细节是「多添了一勺糖」。③ 见答案，注意「还行」这个词抹掉了什么。","record":"我上一次认真吃一顿饭，是哪天。","migrate":"","out_char":"","hints":["数一数两段里各出现了几个人","有一段的细节是「多添了一勺糖」","见答案，注意「还行」这个词抹掉了什么"],"code":"看"},{"date":"2027-01-16","month":1,"day":16,"weekday":"六","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天在一碗粥里看见了人，今天走一条「家里人问我未来」的路。","question":"过年回家，亲戚问「你以后干什么」，有四个岔口，每个岔口只有一个选择能让这顿饭吃完还不难受：岔口一 实话都说／挑一句说；岔口二 说给亲戚听／说给自己听；岔口三 解释／反问；岔口四 说完就停／说完再补三句。","answer":"参考路径：挑一句说→说给亲戚听→反问→说完就停。岔口二最关键：这顿饭是社交场合，你说的话是给饭桌的，不是给未来的；真正的打算留在自己那里。岔口四最易失控，补三句就是把话柄递出去。","hint_raw":"① 四个岔口里，只有一个决定「这句话到底说给谁听」。② 反问比解释省力，因为它把问题还回去了。③ 见答案，注意「说完就停」本身是一种能力。","record":"我在饭桌上说过多少句，其实是说给自己听的。","migrate":"","out_char":"","hints":["四个岔口里，只有一个决定「这句话到底说给谁听」","反问比解释省力，因为它把问题还回去了","见答案，注意「说完就停」本身是一种能力"],"code":"看"},{"date":"2027-01-17","month":1,"day":17,"weekday":"日","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天练了「少说」，今天填一格不一样的：我到底在意什么。","question":"横填四格，每格两字，拼出「我在意的东西」的四个方向：① 别人对我的___（评价/眼光/态度）② 我能不能把事___（做好/做完/做成）③ 我有没有被___（需要/看见/喜欢）④ 我说话有没有人___（听/信/接）。","answer":"参考填法：评价／做好／看见／听。四格分别对应「面子」「标准」「被需要」「被听见」。四格都能填，但只有一格是你真的愿意为它难受的——那一格就是你现在的核心在意。","hint_raw":"① 四格不必都填同一个词。② 有一格藏着「我怕不被需要」。③ 见答案，选一格：我为它哭过的那个。","record":"我在意的那一格，是别人的事，还是我的事。","migrate":"","out_char":"","hints":["四格不必都填同一个词","有一格藏着「我怕不被需要」","见答案，选一格：我为它哭过的那个"],"code":"看"},{"date":"2027-01-18","month":1,"day":18,"weekday":"一","level":"L1","type":"九宫格","tag":"寒假开始（校历参考）｜九宫格","review":false,"carry":"假期的第一天，先给假期一个形状。","question":"中心格写「这个寒假」。八格填：想睡到几点、想见谁、想去哪、想学一样什么、想扔掉什么、想还给谁一句话、想留给自己的一个小时在几点、假期最后一天想以什么状态结束。","answer":"无标准答案。判断标准只有一条：八格里至少有三格是「可以自己决定的」。全是「取决于别人」的假期，过完会更累。","hint_raw":"① 先填第 8 格，再倒推其它格。② 有一格是「还话」，很多人空着，其实心里有。③ 三格以上自己能决定，就算合格。","record":"这个假期，我最想留下的是哪一格。","migrate":"","out_char":"","hints":["先填第 8 格，再倒推其它格","有一格是「还话」，很多人空着，其实心里有","三格以上自己能决定，就算合格"],"code":"看"},{"date":"2027-01-19","month":1,"day":19,"weekday":"二","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"假期形状有了，今天破一句家里的「暗语」。","question":"下面三句家常话，各藏一句没说出口的意思，请破译：\n  A「你放假就好好休息，家里不用你管。」\n  B「你姐今年又没回来。」\n  C「钱够不够？不够就说。」","answer":"A 的真实意思常是「我希望你主动帮一点」；B 的真实意思是「我想她了，也想你常回来」；C 的真实意思常是「我不太敢直接问你的打算」。三句都不是命令，是绕了一圈的关心。","hint_raw":"① 三句都不难听，所以更容易听漏。② 有一句真正在问的是「你以后怎么打算」。③ 见答案，想想自己家里最常说哪一句。","record":"我听懂了哪一句的暗语，又假装没听懂哪一句。","migrate":"","out_char":"","hints":["三句都不难听，所以更容易听漏","有一句真正在问的是「你以后怎么打算」","见答案，想想自己家里最常说哪一句"],"code":"看"},{"date":"2027-01-20","month":1,"day":20,"weekday":"三","level":"L1","type":"排序题","tag":"大寒｜排序题","review":false,"carry":"听懂了家里的话，今天排一下「照顾自己」的顺序。","question":"一天里最冷的时候，五件事请排序：A 洗个热水澡 B 吃点热的 C 把明天的东西准备好 D 跟一个能说话的人聊十分钟 E 早点关灯。","answer":"参考 B→A→C→D→E。先给身体热量（B），再放松（A），再把明天的负担提前卸掉（C），再补一段人际热量（D），最后关灯（E）。D 不能省：冬天最容易被忽略的不是冷，是没人说话。","hi y":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：教育行业里，除了当老师还有哪些岗位？写出 3 个。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"看"},{"date":"2027-01-25","month":1,"day":25,"weekday":"一","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天看见了一个行业的样子，今天回到自己身上找一个词。","question":"下面这段话里藏着三个词，找出来，并指出哪一个最可能是「我真正想要的东西」：\n  「其实我不怕累，我怕白累。上次做活动连着一周，每天到十一点，但我知道第二天要干什么，所以不觉得苦。最难受的是那种坐着等通知的日子，什么都没做，还特别累。」","answer":"三个词：不怕累、白累、等通知。最关键的是「白累」——它说明这个人能承受强度，承受不了没有意义；「等通知」是白累的具体形态。这是很清晰的职业线索：要的是明确的目标和可见的进度。","hint_raw":"① 有一个词是「不」字开头的，它其实在说能承受什么。② 难受的那段日子，缺的不是休息，是方向。③ 见答案，注意「白累」这个词很少有人说出口。","record":"我最近一次「白累」，是在等什么。","migrate":"","out_char":"","hints":["有一个词是「不」字开头的，它其实在说能承受什么","难受的那段日子，缺的不是休息，是方向","见答案，注意「白累」这个词很少有人说出口"],"code":"看"},{"date":"2027-01-26","month":1,"day":26,"weekday":"二","level":"L1","type":"填字格","tag":"国际海关日｜填字格","review":false,"carry":"昨天找到了「白累」，今天给自己立一道关。","question":"横填五格，每格两字，组成「我准备从今天开始守的一条规矩」：① 每天___（定量/定时/定量）② 做完就___（走/停/记）③ 不跟别人___（比/说/换）④ 做不到就___（改小/放弃/硬撑）⑤ 一周后___（回看/重来/加量）。","answer":"参考：定时／停／比／改小／回看。这五格是一条完整的最小规则：定时开始，做完就停，不与他人比，做不到就改小而不是放弃，一周回看一次。最容易写错的是第 4 格——「硬撑」是规则死亡的第一原因。","hint_raw":"① 只有一格能让规则活过一周。② 「改小」不是降低标准，是降低门槛。③ 见答案，注意第 2 格为什么是「停」。","record":"我定过的规矩，通常死在第几格。","migrate":"","out_char":"","hints":["只有一格能让规则活过一周","「改小」不是降低标准，是降低门槛","见答案，注意第 2 格为什么是「停」"],"code":"看"},{"date":"2027-01-27","month":1,"day":27,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"规矩立好了，今天看「我一天到底有多少时间是我自己的」。","question":"中心格写「24 小时」。八格按你自己的一天填：睡觉__h、通勤/走路__h、上课__h、吃饭__h、刷手机__h、跟人聊天__h、发呆__h、剩下的__h。填完把八格加起来，与 24 对账。","answer":"无标准答案。常见对账结果是：加起来超过 24（说明有重叠，多半是边刷手机边吃饭），或剩下不到 1 小时（说明没有自己的时间）。对账的意义不是自责，是找出那半小时可以从哪里挪。","hint_raw":"① 允许重叠，重叠本身就是发现。② 「剩下」那一格如果为负，找出被谁借走了。③ 见答案，只做一件事：从「刷手机」里挪出 20 分钟。","record":"我的 24 小时里，有几小时是我自己安排的。","migrate":"","out_char":"","hints":["允许重叠，重叠本身就是发现","「剩下」那一格如果为负，找出被谁借走了","见答案，只做一件事：从「刷手机」里挪出 20 分钟"],"code":"看"},{"date":"2027-01-28","month":1,"day":28,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"时间对完账，今天破一句「我自己说过的话」。","question":"下面三句是我的原话被录下来后回放的，请破译每句背后真正在说的事：\n  A「随便，都行。」\n  B「我都可以，你们定。」\n  C「我不太会，你们先。」","answer":"A 的真实意思常是「我不想再为这件事负责」；B 常是「我怕我的选择拖累别人」；C 常是「我怕做不好被人看见」。三句都是把自己从场上撤下来的说法。它们不坏，但用多了，别人会真的不再问你。","hint_raw":"① 三句都没有说「不」，所以更难被察觉。② 有一句是在让出决定权。③ 见答案，注意最后一句「别人会真的不再问你」。","record":"这个月我说过几次「随便」。","migrate":"","out_char":"","hints":["三句都没有说「不」，所以更难被察觉","有一句是在让出决定权","见答案，注意最后一句「别人会真的不再问你」"],"code":"看"},{"date":"2027-01-29","month":1,"day":29,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天发现自己在撤场，今天排一下「怎么重新进场」。","question":"小组要定一个方案，五个动作请排序：A 先说出自己的一个偏好 B 听完所有人的 C 说出自己的理由 D 在有人反对时补充一句 E 最后表个态。","answer":"参考 B→A→C→D→E。先听后说，是为了让自己的偏好不是凭空；A 只需要一个偏好，不需要完整方案——这是最容易迈的第一步；D 的「补充一句」比「反驳」成本低；E 表态是收尾，把「都可以」换成一个明确的选择。","hint_raw":"① 有一件事必须先做，否则说的都是猜的。② 说偏好不等于说方案。③ 见答案，注意为什么表个态要放在最后。","record":"下次小组讨论，我准备先说出的那一个偏好是什么。","migrate":"","out_char":"","hints":["有一件事必须先做，否则说的都是猜的","说偏好不等于说方案","见答案，注意为什么表个态要放在最后"],"code":"看"},{"date":"2027-01-30","month":1,"day":30,"weekday":"六","level":"L1","type":"配对连线","tag":"小年｜配对连线","review":false,"carry":"小年了，把「我的在意」和「家里的期待」连一次线。","question":"左边五个我的选择，右边五种家里的反应，请按你家真实的经验连线：① 我要读这个专业 ② 我要留在福州 ③ 我不想考编 ④ 我想先工作两年 ⑤ 我想学一个和本专业无关的东西 —— A「那有什么用」 B「你自己想清楚」 C「听你的，我们不懂」 D「先考了再说」 E「别人家孩子都……」","answer":"没有标准连线，按真实情况连。连完后看两件事：一是有几组是「反对但不说死」（B、C），这种其实是支持；二是有几组是「拿别人比」（E），这一组最容易让人误以为全家都反对。","hint_raw":"① 注意区分「反对」与「不支持」，它们不一样。② 有一种反应最难识别，因为它听起来像放手。③ 见答案，把「B 你自己想清楚」标出来——它是最常被误读的支持。","record":"我家里最常出现的是哪一组反应。","migrate":"","out_char":"","hints":["注意区分「反对」与「不支持」，它们不一样","有一种反应最难识别，因为它听起来像放手","见答案，把「B 你自己想清楚」标出来——它是最常被误读的支持"],"code":"看"},{"date":"2027-01-31","month":1,"day":31,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"一月最后一天，走一遍这个月。","question":"回顾这一个月，有四个岔口，每个岔口只有一条路能让人往前走：岔口一 总结成「我这个月很废」／总结成「这个月有一件事做成了」；岔口二 记住没做到的／记住做到的；岔口三 定三个新目标／只留一个；岔口四 从明天开始／从今天剩下的时间开始。","answer":"参考路径：有一件事做成了→记住做到的→只留一个→从今天剩下的时间开始。四个岔口是同一件事的四个面：这个月的价值取决于你挑哪一面来看。第三格最关键：目标越多，越像没定。","hint_raw":"① 第一格决定后面三格。② 有一个岔口的选择会直接影响能不能坚持到二月。③ 见答案，注意「从今天剩下的时间开始」比「从明天」多一天。","record":"一月我做成的那一件事，是什么。\n\n---\n\n## 二月｜关系与支持（月字：见）\n\n本月 28 天，L1 24 道，L3 一天（2/21 小学教育），L2 一问一天（2/11），L4 两天（2/14 情人节、2/20 元宵节）。","migrate":"","out_char":"","hints":["第一格决定后面三格","有一个岔口的选择会直接影响能不能坚持到二月","见答案，注意「从今天剩下的时间开始」比「从明天」多一天"],"code":"看"},{"date":"2027-02-01","month":2,"day":1,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"二月第一天，主题换成「人」。先看两种「在一起」。","question":"下面两段写「和室友一起过周末」的话，找三处不同，并说明哪一段关系更稳：\n  A「我们俩周末一起去了商场，逛了一下午，买了不少东西，挺开心的。」\n  B「周末她拉着我去逛商场，走到一半我说走不动了，我们就坐在楼梯口坐了半小时，什么也没买。」","answer":"三处不同：① A 说的是「买了什么」，B 说的是「走不动了」；② A 里两个人是同一个节奏，B 里两个人都让步了；③ A 的结尾是「挺开心」，B 的结尾是「坐半小时」。更稳的是 B——一段关系能不能承受「我累了」，比能不能一起开心更能说明问题。","hint_raw":"① 看哪一段里出现了「不」或「停」。② 让步不是坏事，是关系有弹性。③ 见答案，注意 B 里没有人被指责。","record":"我身边有没有一个人，我说「走不动了」他不会不高兴。","migrate":"","out_char":"","hints":["看哪一段里出现了「不」或「停」","让步不是坏事，是关系有弹性","见答案，注意 B 里没有人被指责"],"code":"见"},{"date":"2027-02-02","month":2,"day":2,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天看见了一段关系里的「停」，今天在一段对话里找三个词。","question":"下面这段聊天记录里藏着三个词，找出来，并指出哪个词让对方愿意继续说：\n  「她说她最近很烦。我说：怎么了？她说算了，说了也没用。我说：那就不说事，说你现在最想干什么。她愣了一下，说想吃炸鸡。我们就去了。」","answer":"三个词：算了／不说事／愣了一下。关键是「不说事」——它把对话从「解决问题」切到「陪一会儿」，对方才松动。很多人卡在「她说算了」这一步就停住了。","hint_raw":"① 有一个词是对方的口头退让。② 转折发生在哪一句。③ 见答案，注意「愣了一下」是松动的信号。","record":"别人说「算了」的时候，我通常会怎么接。","migrate":"","out_char":"","hints":["有一个词是对方的口头退让","转折发生在哪一句","见答案，注意「愣了一下」是松动的信号"],"code":"见"},{"date":"2027-02-03","month":2,"day":3,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天学了一句「不说事」，今天把它填成四种说法。","question":"横填四格，每格三字以内，把「我在」说出来：① 我在___（听/这/呢）② 不用马上___（说/好/解决）③ 你想说的时候___（再说/我在/发我）④ 要不要我___（陪你/帮你/走一段）。","answer":"参考：听／说／再说／陪你。四格里最难说出口的是第 2 格——多数人一听到问题就急着给方案，对方就闭嘴了。第 4 格最好用：给出一个具体选项，比「有需要找我」有用十倍。","hint_raw":"① 有一格是在「收回你的急」。② 第 4 格要给具体的，不给笼统的。③ 见答案，注意「陪你」和「帮你」的区别。","record":"我说「有需要找我」的次数，比「要不要我陪你」多几次。","migrate":"","out_char":"","hints":["有一格是在「收回你的急」","第 4 格要给具体的，不给笼统的","见答案，注意「陪你」和「帮你」的区别"],"code":"见"},{"date":"2027-02-04","month":2,"day":4,"weekday":"四","level":"L1","type":"九宫格","tag":"世界抗癌日／立春｜九宫格","review":false,"carry":"立春了，今天看「谁在我身边」。","question":"中心格写「我」。周围八格按亲近程度由近到远填八个人的名字（可以含家人、同学、老师、网友），并在每个名字下写一个数字：最近一个月联系过几次。","answer":"无标准答案。填完后看两件事：一是八格里有没有超过三个是家人（说明圈子太窄）；二是联系次数有没有两极——只有 0 次和很多次（说明缺乏中间层的关系）。健康的支持网，是既有很近的人，也有几个「偶尔联系但能帮上忙」的人。","hint_raw":"① 允许写不满八格，不满本身就是信息。② 数字比名字更能说明关系。③ 见答案，看有没有一个人是「半年没联系但我知道他在」。","record":"如果我明天需要求助，第一个打给谁。","migrate":"","out_char":"","hints":["允许写不满八格，不满本身就是信息","数字比名字更能说明关系","见答案，看有没有一个人是「半年没联系但我知道他在」"],"code":"见"},{"date":"2027-02-05","month":2,"day":5,"weekday":"五","level":"L1","type":"密文破译","tag":"除夕｜密文破译","review":false,"carry":"一年最后一晚，破三句年夜饭桌上的话。","question":"请破译下面三句话真正想表达的意思，并指出哪一句最容易在年后变成压力：\n  A「明年就看你啦。」\n  B「吃菜吃菜，别说这些。」\n  C「你瘦了，是不是在学校没好好吃。」","answer":"A 的真实意思是「我们对你有期待，但说不清是什么」；B 是挡话，真实意思是「这话现在不好谈」，它多半在替谁解围；C 是关心的变形，真实意思是「我担心你过得不好」。最容易变成年后压力的是 A——它没有具体内容，所以怎么努力都不算达标。","hint_raw":"① 有一句是在替人挡话，不是冷漠。② 最容易变成压力的话，通常最像祝福。③ 见答案，想一句能接住 A 的话：「那你想让我先干成哪一件？」","record":"今年饭桌上，我最想接住的是哪一句。","migrate":"","out_char":"","hints":["有一句是在替人挡话，不是冷漠","最容易变成压力的话，通常最像祝福","见答案，想一句能接住 A 的话：「那你想让我先干成哪一件？」"],"code":"见"},{"date":"2027-02-06","month":2,"day":6,"weekday":"六","level":"L1","type":"排序题","tag":"春节｜排序题","review":false,"carry":"除夕守了岁，今天排一下「过年这几天怎么过」。","question":"春节假期五天，五件事请排序，并说出哪一件不做最可惜：A 陪家里一个老人坐半小时，不听手机 B 见一个很久没见的同学 C 睡到自然醒一次 D 一个人出去走一次 E 把一个学期的东西整理一次。","answer":"没有唯一顺序，但推荐 A→D→B→C→E。A 放第一，因为老人是最不会等的那一类；E 放最后，因为它可以拖到假期结束也不影响心情。最可惜的是 A——其它四件都能补，A 不能补。","hint_raw":"① 有一件事的时间成本最高，且无法延后。② 「整理东西」是唯一可以先不做也不亏的。③ 见答案，看 A 为什么排第一。","record":"这个春节，我打算留给谁半小时。","migrate":"","out_char":"","hints":["有一件事的时间成本最高，且无法延后","「整理东西」是唯一可以先不做也不亏的","见答案，看 A 为什么排第一"],"code":"见"},{"date":"2027-02-07","month":2,"day":7,"weekday":"日","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天决定留半小时给谁，今天连「怎么陪」。","question":"左边五种人，右边五种最合适的陪伴方式，请连线：① 八十岁的奶奶 ② 上初中的表妹 ③ 刚工作两年的表姐 ④ 帮过我很多的老师 ⑤ 很久没联系的朋友 —— A 一起做一件小事，不聊天 B 听她讲工作里的气 C 问一句「你现在最想做什么」 D 带上一个具体的谢意 E 发一句「突然想起你」。","answer":"参考 ①—A、②—C、③—B、④—D、⑤—E。①—A 的理由：老人不需要话题，需要人在；②—C 的理由：初中生最缺的是被问想法；④—D 必须是具体的（哪件事、哪句话），笼统的道谢没有重量。","hint_raw":"① 先连最容易出错的那一对（①）。② 有一种陪伴不需要说话。③ 见答案，注意「具体的谢意」为什么重要。","record":"我陪人的方式，是不是都只有一种。","migrate":"","out_char":"","hints":["先连最容易出错的那一对（①）","有一种陪伴不需要说话","见答案，注意「具体的谢意」为什么重要"],"code":"见"},{"date":"2027-02-08","month":2,"day":8,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"会陪人之后，走一条「被误解」的路。","question":"你被误会了一件事，有四个岔口，每个岔口只有一条路能真正解决：岔口一 立刻解释／等对方说完；岔口二 解释事实／先说自己的感受；岔口三 找第三个人帮你说／自己说；岔口四 说清楚就停／反复强调。","answer":"参考路径：等对方说完→先说自己的感受→自己说→说清楚就停。等对方说完是唯一能让对方听进去的前提；先说感受再讲事实，是因为人在情绪里听不进事实；找第三个人会把小事变大事；反复强调说明前面没说到位。","hint_raw":"① 有一个岔口决定对方会不会听。② 感受在前还是事实在前，结果差别很大。③ 见答案，注意「说清楚就停」为什么是终点的标志。","record":"我被误会时，第一反应通常是 A 哪一条路的开头。","migrate":"","out_char":"","hints":["有一个岔口决定对方会不会听","感受在前还是事实在前，结果差别很大","见答案，注意「说清楚就停」为什么是终点的标志"],"code":"见"},{"date":"2027-02-09","month":2,"day":9,"weekday":"二","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天走了被误解的路，今天看两句「道歉」。","question":"下面两句道歉，找三处不同，判断哪一句对方会真的消气：\n  A「对不起，我错了，你别生气了行不行。」\n  B「昨天那句话说出口我就后悔了。是我着急，不是你做错了。」","answer":"三处不同：① A 道歉的是「让你生气」这个结果，B 道歉的是自己说的那句话；② A 有一句「别生气了行不行」，是把责任推回对方；③ B 明确说「不是你做错了」，替对方卸掉了自我怀疑。真正管用的是 B。","hint_raw":"① 看哪一句在要求对方做一件事。② 好的道歉里会有一句「不是你」。③ 见答案，注意「行不行」三个字的重量。","record":"我道歉时，有没有在末尾偷偷加一句要求。","migrate":"","out_char":"","hints":["看哪一句在要求对方做一件事","好的道歉里会有一句「不是你」","见答案，注意「行不行」三个字的重量"],"code":"见"},{"date":"2027-02-10","month":2,"day":10,"weekday":"三","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了道歉，今天在一段「被夸」里找词。","question":"下面这段话里藏着三个词，找出来，并指出哪一个才是真的夸奖：\n  「老师说我这次表现不错，同学说我挺厉害的，我妈说我总算有点样子了，我自己觉得还行吧，就是运气好。」","answer":"三个词：不错／总算／运气好。真的夸奖是「总算」背后的那个变化——它说明有人一直在看着你；「不错」「挺厉害的」是社交礼貌；「运气好」是自己把功劳推掉的说法。这段里最值得留意的是：所有夸奖都被自己挡回去了。","hint_raw":"① 有一句被自己抵掉了。② 哪一个词说明「有人在长期观察你」。③ 见答案，注意最后那半句「就是运气好」。","record":"别人夸我时，我第一句话通常是什么。","migrate":"","out_char":"","hints":["有一句被自己抵掉了","哪一个词说明「有人在长期观察你」","见答案，注意最后那半句「就是运气好」"],"code":"见"},{"date":"2027-02-11","month":2,"day":11,"weekday":"四","level":"L2","type":"一问","tag":"L2 一问：妇女和女童参与科学国际日","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：有没有人说过「这个不适合女生」？你怎么回。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"见"},{"date":"2027-02-12","month":2,"day":12,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天面对了「不适合女生」这句话，今天把它填成回应。","question":"横填四格，把一句既不吵架也不认输的话补完：① 「我___（听/懂/知道）你的意思」② 「但我不___（同意/觉得/接受）这句话」③ 「我做的时候会___（注意/小心/证明）给你看」④ 「这件事我想自己___（试/选/担）」。","answer":"参考：懂／同意／证明／试。四格的结构是：先接住对方（懂），再表明立场（不同意），再给一个动作（证明），最后要回决定权（自己试）。第 4 格是这句话真正的作用——它把争论变成一次可以验证的尝试。","hint_raw":"① 第一格不能是反驳。② 有一格看起来最强硬，其实是把话接回来了。③ 见答案，注意「想自己试」比「我能做好」更有力。","record":"这句话我说得出口吗，如果说不出口，卡在哪一格。","migrate":"","out_char":"","hints":["第一格不能是反驳","有一格看起来最强硬，其实是把话接回来了","见答案，注意「想自己试」比「我能做好」更有力"],"code":"见"},{"date":"2027-02-13","month":2,"day":13,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"明天是情人节（L4），今天先做一道正经的：我看人的标准。","question":"中心格写「我愿意深交的人」。八格填八个具体特征（不许写「善良」「靠谱」这类大词），例如：说过的话会做到、生气时不翻旧账、会主动说「我错了」、借钱会还、不在背后说人。","answer":"无标准答案。八格填完后做一件事：把这八个特征对着自己看一遍，有几条我自己做得到。自己做不到的特征，往往是自己最缺、也最容易被人拿捏的地方。","hint_raw":"① 每个特征都要能举出一个具体场景。② 大词（善良、真诚）不算，因为它们没有行为。③ 见答案，数一数自己能做到几条。","record":"我要求别人的那几条，我自己做到了几条。","migrate":"","out_char":"","hints":["每个特征都要能举出一个具体场景","大词（善良、真诚）不算，因为它们没有行为","见答案，数一数自己能做到几条"],"code":"见"},{"date":"2027-02-14","month":2,"day":14,"weekday":"日","level":"L4","type":"生活趣味","tag":"L4 生活趣味：情人节","review":false,"carry":"","question":"情人节都在送花。可有一种花，谁都不敢伸手去拿——它是什么花？","answer":"**烟花**（还有「火花」）。拿在手上，就没了。","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"见"},{"date":"2027-02-15","month":2,"day":15,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"情人节过后，破一句更实在的话：什么叫「对我好」。","question":"下面三句话都是「对我好」的表达，请破译每一句背后真正给的东西：\n  A「你别去了，我替你去。」\n  B「你去吧，搞不定就喊我。」\n  C「你自己决定，我不干预。」","answer":"A 给的是「替代」，短期舒服，长期会拿走你的能力；B 给的是「后盾」，它允许你失败一次；C 给的是「信任」，但需要你承担后果。三种都能是好意，区别在于：哪一种让你变强，哪一种让你变依赖。","hint_raw":"① 有一句在帮你做事，有一句在帮你能做事。② 最需要承担的是 C。③ 见答案，想想自己更常收到哪一种，又更常给哪一种。","record":"我给别人的好，是不是也在悄悄拿走他的能力。","migrate":"","out_char":"","hints":["有一句在帮你做事，有一句在帮你能做事","最需要承担的是 C","见答案，想想自己更常收到哪一种，又更常给哪一种"],"code":"见"},{"date":"2027-02-16","month":2,"day":16,"weekday":"二","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天分清了三种好意，今天排一次「冲突之后」。","question":"和好朋友闹了别扭，五件事请排序：A 等自己气消一点 B 想清楚到底哪句话让我不舒服 C 找一个双方都不忙的时间 D 说「那天那句话我听着难受」 E 听完对方怎么说。","answer":"参考 A→B→C→D→E。A 在前，因为气头上说的话一定会跑偏；B 是这道题的关键——多数人只知道「我不舒服」，说不出「哪句话」；D 用「我听着」而不是「你说错了」，把自己放回话题里；E 必须真的听完，否则前面全白做。","hint_raw":"① 有一个动作必须自己一个人完成。② 说「哪句话」比说「你错了」有效。③ 见答案，注意 D 的句式。","record":"我上一次闹别扭，停在了哪一步。","migrate":"","out_char":"","hints":["有一个动作必须自己一个人完成","说「哪句话」比说「你错了」有效","见答案，注意 D 的句式"],"code":"见"},{"date":"2027-02-17","month":2,"day":17,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天排了冲突，今天连「谁适合说什么」。","question":"左边五个问题，右边五个最适合问的人，请连线：① 这个专业以后能干什么 ② 我适不适合当老师 ③ 福州哪家幼儿园在招人 ④ 我最近很焦虑怎么办 ⑤ 我这件作品好不好看 —— A 已经在这个岗位做了三年的人 B 专业老师 C 学校心理中心 D 同专业的学长 E 你自己。","answer":"参考 ①—B（或 D）、②—A、③—D、④—C、⑤—E。②最忌讳问老师——老师看到的你是课堂上的你，看不到你在真实场景里的耐受度；⑤只能问自己，因为作品的第一读者是你。","hint_raw":"① 有一个问题的答案只能由你自己给。② 「我适不适合」这类问题，最好问已经干过的人。③ 见答案，注意④为什么不该问朋友。","record":"我最想问的那个问题，我一直问错了人吗。","migrate":"","out_char":"","hints":["有一个问题的答案只能由你自己给","「我适不适合」这类问题，最好问已经干过的人","见答案，注意④为什么不该问朋友"],"code":"见"},{"date":"2027-02-18","month":2,"day":18,"weekday":"四","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"问对人了，今天走一条「被比较」的路。","question":"家里又提起了「别人家孩子」，有四个岔口，每岔只有一条能让你不上火也不认输：岔口一 反驳／不接；岔口二 说事实／说感受；岔口三 把话题转到对方身上／转到自己身上；岔口四 说完就走／坐下继续聊。","answer":"参考路径：不接→说感受→转到自己身上→坐下继续聊。第一个岔口是关键：一反驳就进了对方的场子；说感受（「比来比去我挺难受的」）比列举事实有效，因为对方要的不是数据；转到自己身上（「我这边在弄一件事」）能把话头收回；坐下继续聊，是给关系留台阶。","hint_raw":"① 有一个岔口一旦选错，后面全在对方的节奏里。② 事实赢不了这类对话，感受可以。③ 见答案，注意最后一个岔口为什么是「坐下」。","record":"我在被比较时，最想证明的是什么，值得吗。","migrate":"","out_char":"","hints":["有一个岔口一旦选错，后面全在对方的节奏里","事实赢不了这类对话，感受可以","见答案，注意最后一个岔口为什么是「坐下」"],"code":"见"},{"date":"2027-02-19","month":2,"day":19,"weekday":"五","level":"L1","type":"找不同","tag":"世界社会公正日｜找不同","review":false,"carry":"昨天守住了自己，今天看两种「公平」。","question":"下面两段话都在说「公平」，找三处不同，并指出哪一段是真正可执行的：\n  A「这件事对大家要一样，不能有人特殊。」\n  B「这次按同一套标准来。有两个人情况确实不同，我先跟他们说清楚哪条不变、哪条可以商量。」","answer":"三处不同：① A 只讲一样，B 讲同一套标准；② A 不承认差异，B 承认差异但要当面说；③ A 没有执行人，B 有动作（先说清楚）。可执行的是 B——它把「公平」落成了两句话：哪条不变、哪条可以商量。","hint_raw":"① 「一样」和「同一套标准」不是一回事。② 有一段里出现了「先说清楚」。③ 见答案，把 B 的两句话记下来，以后自己当负责人时用。","record":"我抱怨不公平时，有没有说过「我希望怎么改」。","migrate":"","out_char":"","hints":["「一样」和「同一套标准」不是一回事","有一段里出现了「先说清楚」","见答案，把 B 的两句话记下来，以后自己当负责人时用"],"code":"见"},{"date":"2027-02-20","month":2,"day":20,"weekday":"六","level":"L4","type":"生活趣味","tag":"L4 生活趣味：元宵节","review":false,"carry":"","question":"猜一件家家厨房都有的东西：上不怕水，下不怕火，天天在灶上，从来不喊热。","answer":"**锅**。","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"见"},{"date":"2027-02-21","month":2,"day":21,"weekday":"日","level":"L3","type":"专业日","tag":"L3 专业日：小学教育","review":false,"carry":"2 月你写下的是「我家里常说的一句话」。今天把这句话带进课堂：同一个意思，换个场合就会变成另一副面孔。","question":"下面三段话，意思完全一样——「请小朋友坐好，我们要开始上课了」。请逐段破译三件事：**谁在说、对谁说、说完孩子会去做什么**，并判断哪一段最容易被孩子「听懂但不照做」。\n\n  - A「囡仔，坐好势，欲上课矣。」（奶奶对刚放学的孙子，家中饭桌前）\n  - B「请幼儿保持正确坐姿，注意力集中于教师。」（教研材料，写给老师看）\n  - C「小眼睛——看老师；小耳朵——听我说。」（老师站在活动室中间，对全班）","answer":"A 是**方言口语，管关系**——奶奶的话先建立的是「我在乎你」，孩子听到的是亲近，动作依赖的是习惯；B 是**书面语，管规范**——它根本不是对孩子说的，是给老师看的「标准」，孩子听到只会觉得陌生；C 是**现场语，管行动**——短、成对、带动作指向，孩子听完直接就能动。最容易被「听懂但不照做」的是 **C**：孩子完全听懂，但它是口令式的，若老师说完没有停顿和眼神确认，孩子会跟着念而不跟着做。**同一种要求，用三种语言说出来，孩子的接收路径完全不同——这就是小学教师每天在做的事。**","hint_raw":"①先别看内容，看「这句话是说给谁听的」　②有一段其实不是对孩子说的　③见答案，再想：孩子说「我知道了」却不做，缺的是哪一层","record":"我对别人提要求时，用的是哪一种话；对方真的动了吗","migrate":"把你专业里的一句「标准表述」，改写成能让外行动起来的一句话（把规范译成动作）。","out_char":"","college":"人文科学学院","profession":"小学教育","hints":["先别看内容，看「这句话是说给谁听的」","有一段其实不是对孩子说的","见答案，再想：孩子说「我知道了」却不做，缺的是哪一层"],"code":"见"},{"date":"2027-02-22","month":2,"day":22,"weekday":"一","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"开学第一周，在一段「自我介绍」里找词。","question":"下面这段自我介绍里藏着三个词，找出来，并指出哪一个最容易被记住：\n  「大家好，我叫林小雨，学前教育专业，平时喜欢拍照片，也喜欢给小朋友做手工。我不太会说话，但做事还可以。这学期想多参加点活动，练练胆。」","answer":"三个词：喜欢／不太会说话／练练胆。最容易被记住的是「给小朋友做手工」这个具体的事，其次才是「练胆」这个目标。自我介绍的通病是说形容词（勤奋、认真），能被记住的永远是一个具体动作加一个具体结果。","hint_raw":"① 哪一句可以立刻被想象出画面。② 有一个词是自我贬低，它会削弱前面所有内容。③ 见答案，试着把自己的介绍改成「一个具体的事」。","record":"我自我介绍里，有没有一句能被别人记住的具体的事。","migrate":"","out_char":"","hints":["哪一句可以立刻被想象出画面","有一个词是自我贬低，它会削弱前面所有内容","见答案，试着把自己的介绍改成「一个具体的事」"],"code":"见"},{"date":"2027-02-23","month":2,"day":23,"weekday":"二","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"改好了介绍，今天填「我的三个身份」。","question":"横填三行，每行两格：第一格是身份（如学生、女儿、室友、部长、志愿者），第二格是「这个身份让我学会了什么」，各填一个动词短语（如「等」「让人说完」「按时交」「认错」）。","answer":"参考：学生—按时交；女儿—听出话外音；室友—让出半个柜子。三行没有标准答案。合格的判断是：每一行的第二格必须是一个具体动作，不能是「成长」「成熟」这类词；三行里至少有一行是你自己选的，不是别人给的。","hint_raw":"① 第二格必须是动词。② 三个身份里，哪一个是你自己选的。③ 见答案，把「自己选的那个」圈出来。","record":"我最看重的那个身份，是不是我自己选的。","migrate":"","out_char":"","hints":["第二格必须是动词","三个身份里，哪一个是你自己选的","见答案，把「自己选的那个」圈出来"],"code":"见"},{"date":"2027-02-24","month":2,"day":24,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天排了身份，今天看「我在集体里是什么位置」。","question":"中心格写「在这个班里」。八格填：谁总是第一个到、谁负责收尾、谁在群里最活跃、谁最少说话但最靠谱、谁最会安抚人、我通常做什么、我从来没做过什么、如果有一次机会我想试哪个位置。","answer":"无标准答案。关键是最后两格：多数人在班级里的位置是固定的，一旦固定，别人就不会再给你新的位置。第 7 格（从来没做过）和第 8 格（想试的）之间的差距，就是这学期可以争取的空间。","hint_raw":"① 先填第 8 格。② 第 7 格如果是「组织」，那你这学期可以试着当一次负责人。③ 见答案，注意「固定位置」这件事本身就是限制。","record":"这学期我想在班里试一次的位置，是哪一个。","migrate":"","out_char":"","hints":["先填第 8 格","第 7 格如果是「组织」，那你这学期可以试着当一次负责人","见答案，注意「固定位置」这件事本身就是限制"],"code":"见"},{"date":"2027-02-25","month":2,"day":25,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"想试一个位置，今天破一句「老师说的话」。","question":"请破译下面三句话真正的意思，并指出哪一句是在给你机会：\n  A「你这个想法不错，回头再说。」\n  B「这件事你来做，做砸了算我的。」\n  C「你怎么想的？说来听听。」","answer":"A 多是客气的结束语，真正意思是「现在不考虑」；B 是真机会——它给了你授权，同时承担了风险；C 是邀请，但只到「说」为止。判断一句是不是机会，看它有没有给你「资源或授权」，只有鼓励没有资源的，都不是。","hint_raw":"① 有一句里有承担风险的承诺。② 「回头再说」通常是不会再说了。③ 见答案，想想自己听过多少次 A 就当了真。","record":"我上一次拿到真机会，是因为我做了什么。","migrate":"","out_char":"","hints":["有一句里有承担风险的承诺","「回头再说」通常是不会再说了","见答案，想想自己听过多少次 A 就当了真"],"code":"见"},{"date":"2027-02-26","month":2,"day":26,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"认得出机会了，今天排「怎么接住一个机会」。","question":"老师让你负责一个活动，五个动作请排序：A 问清楚「做到什么算成」 B 答应下来 C 列出三件必须做对的事 D 找一个能补位的人 E 中途汇报一次进度。","answer":"参考 A→C→B→D→E。A 在答应之前：没搞清楚验收标准就答应，是新人最常见的坑；C 找出三件关键事，避免平均用力；D 提前找补位，是给自己留退路也给别人参与感；E 中途汇报，让信任可以持续积累。","hint_raw":"① 有一个动作必须在「答应」之前做。② 三个必须做对的事，不要超过三件。③ 见答案，注意 D 为什么不是「找最厉害的人」。","record":"我上次接任务，问没问「做到什么算成」。","migrate":"","out_char":"","hints":["有一个动作必须在「答应」之前做","三个必须做对的事，不要超过三件","见答案，注意 D 为什么不是「找最厉害的人」"],"code":"见"},{"date":"2027-02-27","month":2,"day":27,"weekday":"六","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"接住机会了，今天连「我遇事会找谁」。","question":"左边五种情形，右边五种最该找的人，请连线：① 想放弃的时候 ② 不知道怎么开头 ③ 做着做着发现方向错了 ④ 做完不知道好不好 ⑤ 做成了想告诉一个人 —— A 一个会泼冷水的人 B 一个会推你一把的人 C 一个做过同样事的人 D 一个只恭喜你、不加评价的人 E 一个会问「你当初想干什么」的人。","answer":"参考 ①—B、②—C、③—E、④—A、⑤—D。③—E 最关键：方向错了的时候，最需要的不是安慰也不是鼓励，是有人帮你找回当初的目的。⑤—D 的理由：做成一件事之后，最难得的是有人只是替你高兴。","hint_raw":"① 有一种人只在你想放弃时有用。② 「你当初想干什么」这句话对应哪种情形。③ 见答案，看看自己有没有这五类人。","record":"这五类人里，我缺哪一类。","migrate":"","out_char":"","hints":["有一种人只在你想放弃时有用","「你当初想干什么」这句话对应哪种情形","见答案，看看自己有没有这五类人"],"code":"见"},{"date":"2027-02-28","month":2,"day":28,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"二月最后一天，走一遍这个月的人际。","question":"回顾这个月，四个岔口，每岔只有一条能让人轻一点：岔口一 记住谁让我难受／记住谁帮过我；岔口二 想办法让对方改变／想办法让自己少受影响；岔口三 维持所有关系／维护三段关系；岔口四 等对方先开口／自己先开口一次。","answer":"参考路径：记住谁帮过我→让自己少受影响→维护三段关系→自己先开口一次。第二格是分水岭：把力气放在「改变别人」上，几乎必然失败；放在「我少受影响」上，一次就见效。","hint_raw":"① 第一格决定这个月你带着什么进三月。② 有一个岔口的对象是「自己」。③ 见答案，注意「维护三段」为什么比「维持所有」有效。","record":"这个月帮过我的那三个人，我说过谢吗。\n\n---\n\n## 三月｜节奏与自己（月字：自）\n\n本月 31 天，L1 26 道，L3 三天（3/14 小学数学教育、3/16 社会工作、3/19 现代教育技术），L2 一问一天（3/8 国际妇女节），3/31 季度复盘。","migrate":"","out_char":"","hints":["第一格决定这个月你带着什么进三月","有一个岔口的对象是「自己」","见答案，注意「维护三段」为什么比「维持所有」有效"],"code":"见"},{"date":"2027-03-01","month":3,"day":1,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"三月第一天，主题换成「我自己的速度」。先看两种「快」。","question":"下面两段写同一件事（一周做完一个作业），找三处不同，并说明哪一种快是真的快：\n  A「我三天就写完了，后面几天都在改，改到最后一晚还在改。」\n  B「我先花半天把要交的东西列清楚，然后每天做一块，最后一晚没动。」","answer":"三处不同：① A 用「写完」当终点，B 用「列清楚」当起点；② A 的时间是压缩的（三天写完，后面全在返工），B 的时间是摊开的；③ A 的最后一晚在工作，B 的最后一晚在休息。真快是 B——它的总时间更长，但返工为零。","hint_raw":"① 看哪一段里有「还在改」。② 快不等于短，等于不返工。③ 见答案，注意 B 的第一件事是「列清楚」而不是「开始写」。","record":"我上一次赶工，时间花在做上，还是花在返工上。","migrate":"","out_char":"","hints":["看哪一段里有「还在改」","快不等于短，等于不返工","见答案，注意 B 的第一件事是「列清楚」而不是「开始写」"],"code":"自"},{"date":"2027-03-02","month":3,"day":2,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天算清了返工，今天在一段自述里找三个词。","question":"下面这段话里藏着三个词，找出来，并指出哪一个在偷走时间：\n  「我每天早上都想着今天要干很多事，然后先收拾桌子、泡杯茶、看看消息，一上午就过去了。下午觉得来不及了，赶紧开始，做到一半又觉得做得不好，就重新来过。」","answer":"三个词：先收拾（准备）、来不及（焦虑）、重新来过（返工）。偷走时间的是「先收拾」——它是典型的准备型拖延：用一件看似正当的小事替换掉真正要紧的那一件。第二个耗损是「重新来过」，因为标准没在开始时定下。","hint_raw":"① 有一个动作看起来很勤快，其实是在逃。② 「来不及」出现的时候，往往是半天已经过去。③ 见答案，注意「重新来过」的原因是标准没定。","record":"我的「先收拾」是什么，通常出现在几点。","migrate":"","out_char":"","hints":["有一个动作看起来很勤快，其实是在逃","「来不及」出现的时候，往往是半天已经过去","见答案，注意「重新来过」的原因是标准没定"],"code":"自"},{"date":"2027-03-03","month":3,"day":3,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"找到了偷时间的动作，今天把它填成一条替换规则。","question":"横填五格，每格两字：① 起床后先做___（最难/最易/随便）的那一件 ② 只做___（二十/三十/十）分钟 ③ 手机放___（远/手边/口袋）④ 卡住就___（记/跳/问）⑤ 到点就___（停/续/换）。","answer":"参考：最难／二十／远／记／停。这条规则的作用不是提高效率，是打破「先收拾」的循环：一起床先碰最难的那件二十分钟，把一天的顺序反过来。第 3 格（手机放远）不是意志问题，是环境问题。","hint_raw":"① 第 1 格要和昨天找到的「先收拾」相反。② 第 5 格如果不填「停」，第 2 格就没有意义。③ 见答案，注意第 3 格为什么用环境而不是自律来解决。","record":"我能不能明天先做二十分钟最难的那件事。","migrate":"","out_char":"","hints":["第 1 格要和昨天找到的「先收拾」相反","第 5 格如果不填「停」，第 2 格就没有意义","见答案，注意第 3 格为什么用环境而不是自律来解决"],"code":"自"},{"date":"2027-03-04","month":3,"day":4,"weekday":"四","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"规则有了，今天看「我到底被什么推着走」。","question":"中心格写「我开始做一件事的原因」。八格填八个真实原因，例如：怕被说、想被夸、自己好奇、答应了别人、不想落后、觉得应该、真喜欢、无聊。","answer":"无标准答案。填完后分类：把「外部原因」（怕被说、想被夸、不想落后、答应了别人、觉得应该）和「内部原因」（好奇、真喜欢、无聊）分开数。外部原因占比超过 6 格，说明动力主要来自别人；这种动力能撑一阵，撑不过一个学期。","hint_raw":"① 先按真实情况填，不要填「应该有的原因」。② 数一数有几格跟别人有关。③ 见答案，看那一两格内部原因出现在什么事上。","record":"我最近做成的三件事，各有几格是内部原因。","migrate":"","out_char":"","hints":["先按真实情况填，不要填「应该有的原因」","数一数有几格跟别人有关","见答案，看那一两格内部原因出现在什么事上"],"code":"自"},{"date":"2027-03-05","month":3,"day":5,"weekday":"五","level":"L1","type":"密文破译","tag":"学雷锋日｜密文破译","review":false,"carry":"昨天看了动力，今天破三句「我来帮你」。","question":"请破译下面三句话真正在说的事，并指出哪一句帮得最值：\n  A「我来帮你弄吧，你别弄了。」\n  B「你先弄，我看着，卡住了我再说。」\n  C「这个我不会，但我在旁边陪你弄。」","answer":"A 是代劳，短期最快，长期让你失去能力；B 是教学式帮助，对方保留了你动手的机会，帮得最值；C 是陪伴，解决不了技术问题，但能撑住情绪。三句里，B 最难得——它需要对方忍住不接手。","hint_raw":"① 有一句里出现了「你先」。② 帮得最值的那一句，帮的人反而最省力。③ 见答案，想想自己帮人时，最常用哪一句。","record":"我帮别人时，是不是常常忍不住接手。","migrate":"","out_char":"","hints":["有一句里出现了「你先」","帮得最值的那一句，帮的人反而最省力","见答案，想想自己帮人时，最常用哪一句"],"code":"自"},{"date":"2027-03-06","month":3,"day":6,"weekday":"六","level":"L1","type":"排序题","tag":"惊蛰｜排序题","review":false,"carry":"昨天学了「忍住不接手」，今天排一次「一个乱摊子怎么收」。","question":"手上同时有四件事在响（作业、活动、家里的电话、一个想回又不敢回的消息），五个动作请排序：A 把四件事写在一张纸上 B 标出各自的死线 C 先做死线最近的一件 D 把家里那通电话打了 E 把不敢回的消息放着，定一个时间再回。","answer":"参考 A→B→D→C→E。A、B 是把「响」变成「清单」，是最先必须做的；D 提前，因为家里的电话拖一天，情绪成本翻倍；E 允许「放着」，但要定时间——不定时间的「放着」会变成一直想着。","hint_raw":"① 有两个动作必须在一分钟内完成。② 有一件事拖的时间越长，代价越大，且不是时间代价。③ 见答案，注意 E 为什么不是「马上回」。","record":"我心里那件「放着」的事，定了时间吗。","migrate":"","out_char":"","hints":["有两个动作必须在一分钟内完成","有一件事拖的时间越长，代价越大，且不是时间代价","见答案，注意 E 为什么不是「马上回」"],"code":"自"},{"date":"2027-03-07","month":3,"day":7,"weekday":"日","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"乱摊子收了，今天连「四类待办该放在哪」。","question":"左边四种事，右边四种处理方式，请连线：① 两分钟能做完的 ② 要别人配合的 ③ 一想就烦的 ④ 不知道怎么做才对的 —— A 立刻做掉 B 拆出第一步，只做第一步 C 现在就发消息约人 D 先找一个做过的人问十分钟。","answer":"参考 ①—A、②—C、③—B、④—D。③—B 是关键：烦的事不是难，是没有开头；把它拆成「第一步」后，烦的感觉会掉一半。④—D 的理由：不知道怎么做的正确反应是问，而不是硬想。","hint_raw":"① 有一类事处理方式只有「做掉」。② 最烦的那一类，需要的是「第一步」而不是「决心」。③ 见答案，注意②为什么是「现在就发消息」。","record":"我最常拖的是哪一类，用的是不是对应的方式。","migrate":"","out_char":"","hints":["有一类事处理方式只有「做掉」","最烦的那一类，需要的是「第一步」而不是「决心」","见答案，注意②为什么是「现在就发消息」"],"code":"自"},{"date":"2027-03-08","month":3,"day":8,"weekday":"一","level":"L2","type":"一问","tag":"L2 一问：国际妇女节","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：你身边职业女性身上，你最想学的一样是什么。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"自"},{"date":"2027-03-09","month":3,"day":9,"weekday":"二","level":"L1","type":"迷宫","tag":"龙抬头（二月二）｜迷宫","review":false,"carry":"昨天看了一位职业女性，今天走一条「我也想过那样的日子」的路。","question":"你羡慕一个人的状态，有四个岔口，每岔只有一条能真的靠近她：岔口一 羡慕她的结果／羡慕她的日常；岔口二 打听她怎么做到的／猜她运气好；岔口三 从她的一个习惯开始／从她的一天开始；岔口四 做到一半发现太累就停／做到一半发现太累就减量。","answer":"参考路径：羡慕她的日常→打听她怎么做到的→从她的一个习惯开始→太累就减量。第一格分水岭：羡慕结果会让人焦虑，羡慕日常会让人有动作。第三格选「一个习惯」而不是「一天」，因为一天的量学不来。","hint_raw":"① 有一个岔口问的是「她的哪一部分值得羡慕」。② 复制一整天的作息，几乎一定失败。③ 见答案，注意最后一格为什么是「减量」不是「停」。","record":"我羡慕的那个人，她的哪一个习惯我可以先学。","migrate":"","out_char":"","hints":["有一个岔口问的是「她的哪一部分值得羡慕」","复制一整天的作息，几乎一定失败","见答案，注意最后一格为什么是「减量」不是「停」"],"code":"自"},{"date":"2027-03-10","month":3,"day":10,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天学了一个习惯，今天看两种「努力」。","question":"下面两段写备考（同一个证），找三处不同，并指出哪一段更可能通过：\n  A「我每天学到十二点，笔记写了三本，题也刷了很多，但一模拟考就慌。」\n  B「我每天学两小时，只做一件事：把错题的原因写下来。模拟考前我把错题本看了一遍。」","answer":"三处不同：① A 用时长计量，B 用「一件事」计量；② A 的产出是笔记和题量，B 的产出是「错的原因」；③ A 的模拟考是检验，B 的模拟考是复习。更可能通过的是 B——它把学习变成了可以复用的东西（错题原因）。","hint_raw":"① 看哪一段里有「原因」两个字。② 笔记多不等于学会了。③ 见答案，注意 B 的两小时里没有任何「刷题」的量。","record":"我的努力，能不能被我自己说清楚做成了什么。","migrate":"","out_char":"","hints":["看哪一段里有「原因」两个字","笔记多不等于学会了","见答案，注意 B 的两小时里没有任何「刷题」的量"],"code":"自"},{"date":"2027-03-11","month":3,"day":11,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天看清了努力的形状，今天在一段「自我评价」里找词。","question":"下面这段话里藏着三个词，找出来，并指出哪一个是最需要改的：\n  「我这人就是不细心，从小到大都这样。做事容易毛躁，也不太会坚持。不过我觉得我还挺乐观的，遇到事不太会垮。」","answer":"三个词：从小到大（固化）、毛躁（性格化）、还挺乐观（资源）。最需要改的是「从小到大都这样」——它把一件可以练的事说成了天生的事，一旦这么说，就没有改的可能了。「毛躁」如果改成「我在最后检查这一步容易漏」，就变成可操作的问题。","hint_raw":"① 有一个词在时间上做了手脚。② 把性格描述改成动作描述，问题才有解。③ 见答案，试着自己那句「我就是……的人」改成一件具体的事。","record":"我给自己下过哪些「从小就这样」的结论。","migrate":"","out_char":"","hints":["有一个词在时间上做了手脚","把性格描述改成动作描述，问题才有解","见答案，试着自己那句「我就是……的人」改成一件具体的事"],"code":"自"},{"date":"2027-03-12","month":3,"day":12,"weekday":"五","level":"L1","type":"配对连线","tag":"植树节｜配对连线","review":false,"carry":"昨天松了一块「天生如此」的土，今天连「我该种什么」。","question":"左边五种能力，右边五种最省力的练法，请连线：① 说话不慌 ② 把事做完 ③ 听懂别人的意思 ④ 遇事不崩 ⑤ 和人开口求帮助 —— A 每次只做一半，做完再定下一半 B 每天对着手机录一分钟再自己听 C 先复述对方的话再回应 D 先练一件必然失败的小事 E 每周问一个人一件小事。","answer":"参考 ①—B、②—A、③—C、④—D、⑤—E。④—D 最反常识：抗挫不是靠鼓励练出来的，是靠反复经历「失败也没事」练出来的，所以要主动设计小失败。⑤—E 的理由：求帮助是频次问题，不是技巧问题。","hint_raw":"① 有一项要主动让自己失败。② 「听懂」的练法里有「复述」。③ 见答案，注意②为什么只做一半。","record":"这五项里，我最想先种哪一项。","migrate":"","out_char":"","hints":["有一项要主动让自己失败","「听懂」的练法里有「复述」","见答案，注意②为什么只做一半"],"code":"自"},{"date":"2027-03-13","month":3,"day":13,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"选好要种的一项，今天给它九格。","question":"中心格写「我要练的那一项」。八格填：我现在的水平（一句话）、比我高一点的人是怎么做的、我一周能花多少分钟、第一个可以做的小动作、谁会知道我在练、练砸了会怎样、练成了对我有什么用、一个月后我怎么知道有没有进步。","answer":"无标准答案。最容易被漏掉的是第 6 格「练砸了会怎样」和第 8 格「怎么知道有没有进步」。前者不写清楚，一失败就会停；后者不写清楚，练一个月会觉得白练。","hint_raw":"① 先填第 8 格，它是验收标准。② 第 3 格的分钟数要小到不可能失败。③ 见答案，注意第 4 格必须是「一个」小动作。","record":"我一个月后怎么判断这件事有没有成。","migrate":"","out_char":"","hints":["先填第 8 格，它是验收标准","第 3 格的分钟数要小到不可能失败","见答案，注意第 4 格必须是「一个」小动作"],"code":"自"},{"date":"2027-03-14","month":3,"day":14,"weekday":"日","level":"L3","type":"专业日","tag":"L3 专业日：小学数学教育","review":false,"carry":"前一天 L1 记录的是「我最擅长的一件小事」，今天把镜头切到课堂上：一件你以为只有一种做法的事，其实有好几条路。","question":"横格里填「12 个苹果平均分给 4 个人」的五种解法名称，纵格里填每种解法「描述的是什么关系」：\n  - 横 ① 一个一个分（等分除）② 每 4 个装一袋能装几袋（包含除）③ 每人分到总数的几分之几（分数）④ 12 是 4 的几倍（倍）⑤ 设每人 x 个列等式（方程）\n  - 纵 A 描述「总量被分成几份」　B 描述「两个量的比」　C 描述「未知量与已知量的相等关系」","answer":"横向五格依次为等分除、包含除、分数、倍、方程；纵向 A＝①②、B＝④、C＝⑤。同一个答案 3，被五种不同的数量关系说出来。孩子说「不会」，往往不是算不出 3，而是没听懂老师这次用的是哪一种关系。","hint_raw":"①先不管答案，只看「这道题在问哪一种关系」　②有三格描述的是「分几份」，两格讲的是「谁是谁的几倍」　③见答案全序","record":"我上一次「听不懂」，是听不懂内容，还是听不懂对方用的是哪套说法","migrate":"非本专业学生在自己的专业里找一个「结果一样但路径不同」的例子（同一份教案、同一段代码、同一幅画，都有不止一种做法）。","out_char":"","college":"人文科学学院","profession":"小学数学教育","hints":["先不管答案，只看「这道题在问哪一种关系」","有三格描述的是「分几份」，两格讲的是「谁是谁的几倍」","见答案全序"],"code":"自"},{"date":"2027-03-15","month":3,"day":15,"weekday":"一","level":"L1","type":"密文破译","tag":"消费者权益日｜密文破译","review":false,"carry":"专业日之后回到自己，今天破三句「我被坑过」。","question":"请破译下面三句话里真正的问题出在哪一步，并指出哪一步最该在事前做：\n  A「当时没问清楚价格，结账才发现多了两百。」\n  B「合同我签了，后来才看到有一行小字。」\n  C「他们说可以退，我去了三次都说不符合条件。」","answer":"A 的问题在「事前没确认关键数字」；B 的问题在「签字前没读完全文」；C 的问题在「没有留下书面凭证」。最该在事前做的是 A 的那一步：把关键条件问成一句可以复述的话（多少钱、包含什么、什么情况不退）。","hint_raw":"① 三件事的共同点是「信息不对称」。② 只有一件事可以做在付钱之前。③ 见答案，记住三个必问：多少钱、含什么、什么情况不退。","record":"我上一次吃哑巴亏，是缺了哪一步。","migrate":"","out_char":"","hints":["三件事的共同点是「信息不对称」","只有一件事可以做在付钱之前","见答案，记住三个必问：多少钱、含什么、什么情况不退"],"code":"自"},{"date":"2027-03-16","month":3,"day":16,"weekday":"二","level":"L3","type":"专业日","tag":"L3 专业日：社会工作","review":false,"carry":"昨天你练的是「一题多路」，今天面对的是另一种题：路只有一条，但**先后顺序错了就会出事**。","question":"一名学生在你面前说了一句「我不想活了」。桌上有六个动作，请排序，并回答：如果只能做四件事，哪两件绝不能省？\n\n  - A 说「我保证不告诉任何人，你放心说」\n  - B 保持在场、不离开，直接问「你现在有具体的想法或计划吗」\n  - C 先安慰：「别想那么多，都会过去的」\n  - D 说明保密例外：「涉及你的安全，我必须让能帮你的人知道」\n  - E 联系监护人，并按流程转介心理老师／医院\n  - F 当天记录并上报，约定下次见面时间","answer":"正确顺序 **B → D → E → F**（A、C 不在序列里，是要避开的两个动作）。理由：**评估风险必须早于劝说**——不问「有没有具体计划」，你不知道这是倾诉还是危机；B 同时解决两件事：人不能离开，风险必须直接问（直接问不会「诱发」自杀，这是最常被误解的一点）。D 必须在学生开口讲细节**之前**说清，否则就是在骗他。E、F 是动作闭环，不能不落。绝不能省的是 **B 与 E**——不评估，后面全错；不转介，你一个人扛不住也不该扛。**A 是专业错误**：承诺绝对保密，等于把学生和自己都关进一个没有出口的房间；**C 是善意但无效**：先安慰会把话堵回去。","hint_raw":"①有一件事必须在「安慰」之前做　②这里的「保密」不是绝对的，而且必须在开头就说　③见答案，想清楚 A 为什么是错的而不是「不好的」","record":"别人对我说很重的话时，我先做的是「让他好受」，还是「弄明白有多危险」","migrate":"把你专业里一次「求救信号」（学生突然沉默、系统报错、客户投诉、老人不肯吃饭）拿出来，写出你的前三个动作，并标出哪一步绝不能为了「让对方舒服」而跳过。","out_char":"","college":"人文科学学院","profession":"社会工作","hints":["有一件事必须在「安慰」之前做","这里的「保密」不是绝对的，而且必须在开头就说","见答案，想清楚 A 为什么是错的而不是「不好的」"],"code":"自"},{"date":"2027-03-17","month":3,"day":17,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"社会工作日的核心是「顺序」，今天把这个方法用到自己身上。","question":"中心格写「我这周最该先做的一件事」。八格填：这件事现在卡在哪、卡住的原因是我不会还是我不想、最快的下一步（十五分钟内能做完）、这一步需要谁、对方什么时候有空、如果今天不做会怎样、做了之后能松掉哪件别的、这件事对我下个月有什么影响。","answer":"无标准答案。判断一格：第 2 格——「不会」和「不想」的解法完全不同。「不会」要找方法，「不想」要找意义或找一个人陪着做。多数人以为是「不会」，其实是「不想」。","hint_raw":"① 先答第 2 格，它决定后面全部。② 第 3 格必须是十五分钟内能做完的。③ 见答案，注意第 7 格：一件事做了，往往会带动另一件。","record":"我卡住的那件事，是不会，还是不想。","migrate":"","out_char":"","hints":["先答第 2 格，它决定后面全部","第 3 格必须是十五分钟内能做完的","见答案，注意第 7 格：一件事做了，往往会带动另一件"],"code":"自"},{"date":"2027-03-18","month":3,"day":18,"weekday":"四","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"分清了「不会」和「不想」，今天连四种解法。","question":"左边四种情况，右边四种对应解法，请连线：① 不会，也没人教 ② 不会，但有人会 ③ 不想，但必须做 ④ 不想，也不必须做 —— A 找十分钟的问人机会 B 找一个同伴一起做 C 只做最小的一步，换来后面的自由 D 允许自己不做，把它从清单划掉。","answer":"参考 ①—A、②—A（或 B）、③—C、④—D。关键是④—D：很多「不想」的事其实不必做，只是被放在了清单上；承认它不必做，比硬撑更省力。","hint_raw":"① 有一类事最好的处理是「划掉」。② 「必须做」的那一类，靠的不是意志，是最小的一步。③ 见答案，看自己的清单里有几件属于④。","record":"我清单上那件一直没做的事，是不是可以划掉。","migrate":"","out_char":"","hints":["有一类事最好的处理是「划掉」","「必须做」的那一类，靠的不是意志，是最小的一步","见答案，看自己的清单里有几件属于④"],"code":"自"},{"date":"2027-03-19","month":3,"day":19,"weekday":"五","level":"L3","type":"专业日","tag":"L3 专业日：现代教育技术","review":false,"carry":"本周你已经看了「多条路」和「先后顺序」，今天看第三种专业能力：**判断哪些东西搬得走，哪些搬不走**。","question":"同一节「认识春天」的活动，有线下版和线上版。下面五组环节，只有 3 处是「必须重写、不能平移」的。请找出来，并说明重写方案。\n\n  | 环节 | 线下版 | 线上版 |\n  |---|---|---|\n  | 导入 | 带孩子到窗边看树 | 播放树木高清视频 |\n  | 演示 | 老师举着实物叶子绕场走一圈 | 共享屏幕展示叶子图片 |\n  | 练习 | 每人发一片叶子摸一摸、比一比 | 请学生说一说你见过的叶子 |\n  | 反馈 | 老师走到每个孩子身边看记录 | 对镜头说「我看到有小朋友画好了」 |\n  | 收束 | 排队把叶子贴到主题墙 | 把作品拍照发到班级群 |","answer":"必须重写的是**演示、练习、反馈**三处。\n  - 演示：实物绕场靠的是「叶子在不同距离、不同角度下的变化」，屏幕把它压成一张平面图——重写方案：让学生课前自己捡一片叶子放在手边，课上跟着老师的口令同步举起、翻面、对光。\n  - 练习：摸、比、闻是触觉与嗅觉通道，屏幕上根本不存在——重写方案：练习改为「手边实物操作＋向镜头展示」，把感官任务留在屏幕外完成。\n  - 反馈：线下反馈靠「老师能走到你身边」，线上老师看不见细微动作——重写方案：改为点名轮流展示＋课后一对一点评，把「即时全班反馈」降级为「定点反馈」，并明确告诉学生什么时候会轮到他。\n  - 导入与收束**可以平移**（视频替换窗边、群相册替换主题墙），只需微调：视频要有真实光线变化、群相册要设固定命名规则。","hint_raw":"①有些环节靠的是身体，不是画面　②找那个「老师必须能走到你身边」才成立的环节　③见答案，注意导入为什么反而可以搬","record":"我把一件事搬到新环境时，有哪些部分我原样搬了过去","migrate":"把你专业里的一次活动（社团课、班会、家访、维修、直播）从 A 场地搬到 B 场地，写出哪一环必须重写，为什么。","out_char":"","college":"信息科学学院","profession":"现代教育技术","hints":["有些环节靠的是身体，不是画面","找那个「老师必须能走到你身边」才成立的环节","见答案，注意导入为什么反而可以搬"],"code":"自"},{"date":"2027-03-20","month":3,"day":20,"weekday":"六","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"三次专业日看完，今天走一条「我到底要不要试」的路。","question":"有一个机会你想试但不确定，四个岔口，每岔只有一条能避免后悔：岔口一 等到有把握再报／现在就报；岔口二 报最想要的／报最有把握的；岔口三 只报一个／报两个；岔口四 失败后不复盘／失败后写三行复盘。","answer":"参考路径：现在就报→报最有把握的→报两个→失败后写三行复盘。第一格是这道题的核心：多数机会的门槛是「先在场」，把握是在场上长出来的。第三格报两个，是为了把「一次失败」稀释成「一次经验」。","hint_raw":"① 有一个岔口，选错会导致你根本没上场。② 「有把握」这个状态，很少在报名之前出现。③ 见答案，注意最后一格为什么只写三行。","record":"这学期我因为「没准备好」错过了几件事。","migrate":"","out_char":"","hints":["有一个岔口，选错会导致你根本没上场","「有把握」这个状态，很少在报名之前出现","见答案，注意最后一格为什么只写三行"],"code":"自"},{"date":"2027-03-21","month":3,"day":21,"weekday":"日","level":"L1","type":"排序题","tag":"世界森林日／世界唐氏综合征日｜排序题","review":false,"carry":"昨天决定上场，今天排一次「上场之后」。","question":"你进了复试/面试，五个动作请排序：A 查清楚对方要什么人 B 准备三个自己的具体例子 C 练一遍「为什么是我」 D 想好要问对方的一个问题 E 提前十分钟到。","answer":"参考 A→B→C→D→E。A 决定后面所有内容的方向；B 的例子必须有具体场景和结果（没有结果的例子不算）；D 的问题最能拉开差距，它说明你在挑对方，不只是在被挑；E 提前十分钟是唯一不需要能力的加分项。","hint_raw":"① 有一个动作决定你准备的内容对不对题。② 例子必须带结果。③ 见答案，注意 D 为什么排在这个位置。","record":"我上次面试/复试，准备了几个带结果的例子。","migrate":"","out_char":"","hints":["有一个动作决定你准备的内容对不对题","例子必须带结果","见答案，注意 D 为什么排在这个位置"],"code":"自"},{"date":"2027-03-22","month":3,"day":22,"weekday":"一","level":"L1","type":"隐藏词","tag":"世界水日｜隐藏词","review":false,"carry":"上场的事排完了，今天在一段「我的一天」里找词，看有没有漏水。","question":"下面这段话里藏着三个词，找出来，并指出哪一个是真正在漏的地方：\n  「今天挺满的：上午两节课，中午开会，下午做表，晚上写作业到十一点。回想一下，好像什么都没做完，但一直在忙。」","answer":"三个词：挺满、一直在忙、什么都没做完。真正在漏的是「挺满」这个错觉——它用时间长度代替了完成度。这一天里没有一段是连续超过一小时的，所以每件事都只做了开头。","hint_raw":"① 有一句话同时承认了「忙」和「没做完」，这就是线索。② 漏的不是时间，是整块的时间。③ 见答案，找出自己一天里最长的一段连续时间是多少。","record":"我一天里最长的一段不被打断的时间，是几分钟。","migrate":"","out_char":"","hints":["有一句话同时承认了「忙」和「没做完」，这就是线索","漏的不是时间，是整块的时间","见答案，找出自己一天里最长的一段连续时间是多少"],"code":"自"},{"date":"2027-03-23","month":3,"day":23,"weekday":"二","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"找到了漏点，今天填一条「堵漏」的规矩。","question":"横填五格，每格两字：① 每天留一段___（整块/零碎/固定）时间 ② 这段时间只做___（一件/两件/三件）事 ③ 门关着或___（耳机/手机/牌子）戴上 ④ 有人找就说___（等一下/不行/稍后）⑤ 结束后写___（一句/一篇/一行）。","answer":"参考：整块／一件／耳机／稍后／一句。第 4 格是难点：多数人学不会说「稍后」，于是整块时间被切碎。第 5 格只写一句，是为了知道这段整块时间到底有没有产出。","hint_raw":"① 第 2 格如果填「两件」，这段整块就白留了。② 第 4 格要给一个具体说法，不能只是「嗯」。③ 见答案，注意第 5 格为什么只要一句。","record":"我能说出「稍后」吗，还是会立刻放下手上的事。","migrate":"","out_char":"","hints":["第 2 格如果填「两件」，这段整块就白留了","第 4 格要给一个具体说法，不能只是「嗯」","见答案，注意第 5 格为什么只要一句"],"code":"自"},{"date":"2027-03-24","month":3,"day":24,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"堵漏之后，今天看「我这学期的重心」。","question":"中心格写「这学期」。八格填：必须完成的（学业类）三件、想完成的（自己选的）两件、可以放弃的一件、别人期待我做的一件、我真正在意的一件。","answer":"无标准答案。填完后做一次减法：八格里只留三格作为这学期的重心，其余五格标为「维持即可」。多数人的问题是三格全在「必须完成」里，于是整学期没有一件是自己选的。","hint_raw":"① 先写「我真正在意的一件」，再写别的。② 八格都要留，但重心只能三个。③ 见答案，看这三个里有没有一件是你自己选的。","record":"这学期的三格里，有一件是我自己选的吗。","migrate":"","out_char":"","hints":["先写「我真正在意的一件」，再写别的","八格都要留，但重心只能三个","见答案，看这三个里有没有一件是你自己选的"],"code":"自"},{"date":"2027-03-25","month":3,"day":25,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"定了重心，今天破三句「时间不够」。","question":"请破译下面三句话真正在说的事，并指出哪一句是最好处理的：\n  A「我最近太忙了，等忙完这阵再说。」\n  B「我时间不够，是因为我什么都想做好。」\n  C「我不知道我的时间去哪了。」","answer":"A 的真实意思常是「这件事我不打算现在做」，它把一个决定拖成了无限期；B 是标准问题（标准太高导致时间膨胀），最好处理——只要降低单项标准即可；C 是记录问题，记三天时间日志就能解决。三句里 A 最难办，因为它不是时间问题。","hint_raw":"① 有一句其实是拒绝，只是没说「不」。② 有一句只要降低标准就能解决。③ 见答案，把 A 翻译成一句诚实的拒绝。","record":"我用「太忙了」推掉过哪些事。","migrate":"","out_char":"","hints":["有一句其实是拒绝，只是没说「不」","有一句只要降低标准就能解决","见答案，把 A 翻译成一句诚实的拒绝"],"code":"自"},{"date":"2027-03-26","month":3,"day":26,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天把「太忙」翻译了，今天排一次「这学期先做什么」。","question":"剩下半个学期，五件事请排序：A 把上学期欠下的一个东西补完 B 把手上一件事做到能拿出来给别人看 C 学一样新东西 D 多认识两个人 E 把身体弄好一点。","answer":"参考 B→E→A→D→C。B 排第一：拿得出手的作品是这学期唯一能带走的东西；E 提前，因为身体是所有计划的地基，一旦塌了，其余四项全部停摆；C 排最后，因为「学新东西」最容易挤掉现有的进度。","hint_raw":"① 有一件是「可以给别人看的」，它决定后面所有机会。② 身体不排第一，但必须在「学新的」之前。③ 见答案，注意 A 为什么排第三而不是第一。","record":"这学期结束时，我能拿出什么给别人看。","migrate":"","out_char":"","hints":["有一件是「可以给别人看的」，它决定后面所有机会","身体不排第一，但必须在「学新的」之前","见答案，注意 A 为什么排第三而不是第一"],"code":"自"},{"date":"2027-03-27","month":3,"day":27,"weekday":"六","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"确定了要拿出什么，今天连「给谁看」。","question":"左边五种「我能拿出的东西」，右边五种最可能用上它的人，请连线：① 一份活动方案 ② 一段课堂视频 ③ 一件手工作品 ④ 一份数据分析表 ⑤ 一篇写自己经历的短文 —— A 招人的园所/机构 B 带你做项目的老师 C 想认识的新同学 D 比赛评委 E 未来的自己。","answer":"参考 ①—B、②—A、③—D、④—B（或 A）、⑤—E。⑤—E 最容易被忽略：写给未来的自己，是唯一不需要评委的东西，也是三年后最有用的一份。","hint_raw":"① 有一种东西的读者不是别人。② 「课堂视频」最直接的用途是给对方看你的现场。③ 见答案，注意⑤为什么放在最后却最有用。","record":"我愿意写给三年后的自己的那段文字，第一句是什么。","migrate":"","out_char":"","hints":["有一种东西的读者不是别人","「课堂视频」最直接的用途是给对方看你的现场","见答案，注意⑤为什么放在最后却最有用"],"code":"自"},{"date":"2027-03-28","month":3,"day":28,"weekday":"日","level":"L1","type":"迷宫","tag":"复活节｜迷宫","review":false,"carry":"写完了给未来的话，今天走一条「重来一次」的路。","question":"你有一件事失败了，想再试一次，四个岔口，每岔只有一条能真的重来：岔口一 换个新目标／回到原目标；岔口二 从头来过／从失败的那一步开始；岔口三 一个人做／找一个人一起；岔口四 瞒着上次失败／把上次失败说出来。","answer":"参考路径：回到原目标→从失败的那一步开始→找一个人一起→把上次失败说出来。第一格是关键：换目标常常是逃避；第二格省一半力气；第四格最反直觉，但说出失败会让你从「怕被知道」里解放出来，也更容易拿到帮助。","hint_raw":"① 有一个岔口看起来是重新开始，其实是绕开。② 从哪一步开始可以省一半时间。③ 见答案，注意最后一格为什么反而更轻松。","record":"我有没有一件想重来的事，卡在哪个岔口。","migrate":"","out_char":"","hints":["有一个岔口看起来是重新开始，其实是绕开","从哪一步开始可以省一半时间","见答案，注意最后一格为什么反而更轻松"],"code":"自"},{"date":"2027-03-29","month":3,"day":29,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天想重来，今天看两种「三个月」。","question":"下面是同一学期的两份总结，找三处不同，并指出哪一份能让人接着往下走：\n  A「这学期参加了不少活动，收获很多，也认识到自己的不足，下学期要继续努力。」\n  B「这学期做成两件事：一次活动带到收尾、一门课从及格到八十分。没做成一件：没坚持跑步。跑步失败的原因是每次都定五公里，下次改成两公里。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 有评价无事实，B 有事实有数字；② A 的结论是「继续努力」，B 的结论是「改成一个更小的量」；③ A 没有失败的具体原因，B 有。能接着往下走的是 B——它把失败变成了下一次的参数。","hint_raw":"① 数一数哪一份里有具体数字。② 有一份写出了失败的原因和解法。③ 见答案，注意「下次改成两公里」这一句的价值。","record":"我这学期的总结，写得出两个具体的事吗。","migrate":"","out_char":"","hints":["数一数哪一份里有具体数字","有一份写出了失败的原因和解法","见答案，注意「下次改成两公里」这一句的价值"],"code":"自"},{"date":"2027-03-30","month":3,"day":30,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"明天复盘，今天先在一段话里找到自己的「季末状态」。","question":"下面这段话里藏着三个词，找出来，并指出哪一个最需要在下季度改掉：\n  「这三个月好像做了很多，又说不出做了什么。有时候挺有劲，有时候一整天都不想动。最怕的是别人问我最近在忙什么，因为我答不上来。」","answer":"三个词：说不出、不想动、答不上来。最需要改的是「答不上来」——它是前三者的结果，也是唯一能被训练的一环：只要每周留一句「这周做成的一件事」，三个月后就能答得上来。","hint_raw":"① 注意「答不上来」是被什么造成的。② 有一件事每周只花一分钟就能解决。③ 见答案，从今天开始写那句「这周做成的一件事」。","record":"如果现在有人问我最近在忙什么，我的答案是什么。","migrate":"","out_char":"","hints":["注意「答不上来」是被什么造成的","有一件事每周只花一分钟就能解决","见答案，从今天开始写那句「这周做成的一件事」"],"code":"自"},{"date":"2027-03-31","month":3,"day":31,"weekday":"三","level":"REVIEW","type":"季度复盘","tag":"季度复盘｜Q1 密码字：己","review":true,"carry":"Q1 最后一天。这一季的四个字是「看」「见」「自」「己」，今天出最后一个字：己。","question":"三道题，请一次做完：\n  ① 从 1 月 1 日到今天，翻回自己的记录，数出「我做成的事」有几件（不要求大，能说出具体动作就算）。\n  ② 从这三个月里挑一件事，写出它的三个参数：我花了多少时间、我当时的标准是什么、结果如何。\n  ③ 用一句话回答：如果这个季度只留一句话给下一个季度的自己，是哪一句。","answer":"无标准答案。判断标准：①至少要能数出三件（数不出，说明这一季没有留痕，从 Q2 起每天只写一句）；②三个参数必须都有具体数字或具体说法；③那句话里不能出现「努力」「加油」「变得更好」这类空词，要有一件具体的事或一个具体的量。","hint_raw":"① 第 ① 题允许把「坚持了某件事两周」算作一件。② 第 ② 题的标准那一栏最容易空，它恰恰是最该写的。③ 第 ③ 题试着自己念一遍：如果这句话对你没用，就重写。","record":"这一季的四个字连起来是「看见自己」。我现在能说出「自己」的哪一件事。","migrate":"","out_char":"己（Q1 完整密码「看见自己」，与 4 月「澄」连成第二句的开头）\n\n---\n\n## 验收自检（v8）\n\n| 检查项 | 要求 | 本册实际 | 结论 |\n|---|---|---|---|\n| Q1 天数 | 90 | 90 | 通过 |\n| L1 逐日题 | 79 | 79 | 通过 |\n| 非 L1 节点 | L3 5 + L2 3 + L4 2 = 10 | 1/14、2/21、3/14、3/16、3/19；1/24、2/11、3/8；2/14、2/20 | 通过 |\n| 季度复盘 | 1 道（3/31） | 1 道，出「己」 | 通过 |\n| 密码字 | 1 月看、2 月见、3 月自、3/31 己 | 一致 | 通过 |\n| 题型轮换 | 八种，任一日与前后两日不重复 | 已逐日校验，4 处初排冲突已改（1/16、3/12、3/17、3/21） | 通过 |\n| 单题结构 | 承接／题干／答案／三级提示／探索记录 | 79 道全部齐备 | 通过 |\n| 月度主题 | 重启与看见／关系与支持／节奏与自己 | 一致 | 通过 |\n| 不抢 L3 内容 | L1 不出现专业切口 | L1 无专业术语，L3 日期全部标注「见 v6」 | 通过 |\n\n**题型分布（79 道 L1）**\n\n| 题型 | 道数 |\n|---|---|\n| 九宫格 | 11 |\n| 配对连线 | 11 |\n| 迷宫 | 11 |\n| 密文破译 | 10 |\n| 排序题 | 10 |\n| 找不同 | 9 |\n| 隐藏词 | 9 |\n| 填字格 | 8 |\n| 合计 | 79 |\n\n**下一步**","hints":["第 ① 题允许把「坚持了某件事两周」算作一件","第 ② 题的标准那一栏最容易空，它恰恰是最该写的","第 ③ 题试着自己念一遍：如果这句话对你没用，就重写"],"code":"己"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
