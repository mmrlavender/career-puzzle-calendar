几个人、很想认识但还没搭话的一个人。","answer":"无标准答案。核心看第 6 格与第 8 格：第 6 格决定你的信息来源，第 8 格是唯一可以本周执行的一格。人际结构的价值不在数量，在「不同类型的人各有一个」。","hint_raw":"① 第 6 格是职业信息的来源。② 第 8 格写一个真实的名字。③ 见答案，本周试着跟第 8 格搭一句话。","record":"我想认识的那个人，第一句话可以说什么。","migrate":"","out_char":"","hints":["第 6 格是职业信息的来源","第 8 格写一个真实的名字","见答案，本周试着跟第 8 格搭一句话"],"code":"探"},{"date":"2027-07-12","month":7,"day":12,"weekday":"一","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天想好了第一句话，今天填「怎么搭话」。","question":"横填四格，每格两字：① 找一个___（由头／机会／时间）开口 ② 先说自己的___（情况／想法／要求） ③ 问一个___（具体的／开放的／私人的）问题 ④ 结束留一句___（下次／谢谢／再见）。","answer":"参考：由头／情况／具体的／下次。第 2 格反常规：先说自己（我在准备什么、我遇到什么），对方才知道怎么接话。第 3 格问具体的（「您当时怎么找到第一份工作的」），比「您有什么建议」更容易得到真话。","hint_raw":"① 先说自己，再问别人。② 问题越具体越好答。③ 见答案，注意第 4 格为什么留「下次」。","record":"我要问的那个具体问题，是什么。","migrate":"","out_char":"","hints":["先说自己，再问别人","问题越具体越好答","见答案，注意第 4 格为什么留「下次」"],"code":"探"},{"date":"2027-07-13","month":7,"day":13,"weekday":"二","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"搭话的方法有了，今天破三句「我不想麻烦别人」。","question":"请破译下面三句话，并指出哪一句最可能错过机会：\n  A「他那么忙，我不好意思问。」\n  B「等问题攒多了一起问，比较省他时间。」\n  C「我先自己查，查不到再问。」","answer":"最可能错过机会的是 A——「他忙」是猜测，不是事实，而且多数人并不介意被问一个具体问题。B 的问题是攒着问会让问题失真（当时的情境记不清了）；C 是正确顺序，但要给自己一个期限（比如查二十分钟）。","hint_raw":"① 有一句话里有一个未经核实的判断。② 攒着问会让问题过期。③ 见答案，给「自己查」加一个时间上限。","record":"我因为「不好意思」错过的一次机会是什么。","migrate":"","out_char":"","hints":["有一句话里有一个未经核实的判断","攒着问会让问题过期","见答案，给「自己查」加一个时间上限"],"code":"探"},{"date":"2027-07-14","month":7,"day":14,"weekday":"三","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天拆了「不好意思」，今天在一段兼职里找词。","question":"下面这段话藏着三个词，找出来，并指出哪个是最有价值的收获：\n  「暑假在一家店做了一个月：每天十小时，站着，很累，工资不高。但我学会了怎么跟难缠的客人说话，也知道自己绝对不想做这种班。」","answer":"三个词：十小时、学会了怎么说话、绝对不想做。最有价值的收获是「绝对不想做」——它是一条明确的排除线，比模糊的「还行」有用得多。第二有价值的是「怎么跟难缠的人说话」，那是可迁移的能力。","hint_raw":"① 有一句话是一条边界。② 「不想做」也是收获。③ 见答案，把这段兼职写成两句：学会了什么、排除了什么。","record":"我这段经历，排除掉了什么。","migrate":"","out_char":"","hints":["有一句话是一条边界","「不想做」也是收获","见答案，把这段兼职写成两句：学会了什么、排除了什么"],"code":"探"},{"date":"2027-07-15","month":7,"day":15,"weekday":"四","level":"L3","type":"专业日","tag":"世界青年技能日｜L3 专业日：首饰设计与工艺","review":false,"carry":"7 月开始「探索」。今天探一件很具体的事：**材质的天性，决定工艺的上限**。","question":"五种材质与五种工艺，每种材质只对应一种最契合的工艺。请连线，并标出**哪一组如果硬做会开裂或崩坏**，说明原因。\n\n  - 材质：① 银　② 珐琅（釉料）　③ 树脂　④ 木　⑤ 钛\n  - 工艺：A 錾刻（敲打出纹样）　B 烧蓝（高温烧结釉色）　C 浇注（灌入模具成型）　D 榫接（不用胶的咬合）　E 阳极氧化（电解生成色层）","answer":"①—A（银的延展性好，最适合錾刻）；②—B（烧蓝是珐琅的核心工艺）；③—C（树脂靠模具浇注成型）；④—D（木材靠榫接，胶是退路）；⑤—E（钛靠阳极氧化显色，不靠涂层）。\n  - **硬做会崩坏的是「珐琅＋金属大面积镶配」这一组**：釉料与金属的**热膨胀率不同**，烧成冷却时收缩不一致，边缘会崩瓷、开裂。这不是手艺问题，是物理限制——所以珐琅件要么做小面积、要么选膨胀率匹配的底胎、要么做成不与金属硬咬合的独立片。\n  - 同类风险：把厚的树脂直接浇在薄金属片上（收缩应力）、把木件强行榫接到金属槽里（木材随湿度涨缩）。","hint_raw":"① 先问每种材质「怕什么」　② 有一组失败的根源不在手，在热胀冷缩　③ 见答案，再想：为什么工匠要先选料再选工艺","record":"我做事时，有没有硬要材料/工具/人去做它做不了的事","migrate":"给你专业的三种「材料」（可以是人、数据、设备、场地），各写一条「它的天性不允许你做什么」。","out_char":"","college":"艺术教育学院","profession":"首饰设计与工艺","hints":["先问每种材质「怕什么」","有一组失败的根源不在手，在热胀冷缩","见答案，再想：为什么工匠要先选料再选工艺"],"code":"探"},{"date":"2027-07-16","month":7,"day":16,"weekday":"五","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"专业日之后，今天看「我手上的技能」。","question":"中心格写「我会做的事」。八格填：别人花钱请我做过的、别人免费找我做的、我做得比同学快的、我做过三次以上的、我正在学的、我不敢给人看的、我最想练好的、做这件事需要多久能交付。","answer":"无标准答案。核心看第 1 格与第 6 格：第 1 格是市场验证过的（哪怕只收过二十块），第 6 格是「不敢给人看」——把它练到能给人看，就是下一步。","hint_raw":"① 第 1 格哪怕是二十块也算。② 第 6 格是成长点。③ 见答案，选第 6 格里的一件，定一个能交付的日期。","record":"我不敢给人看的那件东西，什么时候能做完。","migrate":"","out_char":"","hints":["第 1 格哪怕是二十块也算","第 6 格是成长点","见答案，选第 6 格里的一件，定一个能交付的日期"],"code":"探"},{"date":"2027-07-17","month":7,"day":17,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天找到了成长点，今天看两种「练」。","question":"两个人在暑假练同一项技能，两段记录找三处不同，并指出哪一个人开学后会明显不同：\n  A「我每天练一会儿，看视频学，练了一个月，感觉懂了很多，但没做出完整的东西。」\n  B「我这个月做了三个完整的小东西，每个都发给了两个人看，第三次被说『可以用了』。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 练的是片段，B 做的是完整品；② A 的反馈来自自己（感觉懂），B 的反馈来自他人；③ A 没有验收标准，B 有「可以用了」。更明显不同的是 B——「完整地做完三遍」是技能成型的标志。","hint_raw":"① 有一句话里有「完整的小东西」。② 「感觉懂」不是反馈。③ 见答案，把练习改成做完整的三个。","record":"我练的那件事，什么时候能做出第一个完整的。","migrate":"","out_char":"","hints":["有一句话里有「完整的小东西」","「感觉懂」不是反馈","见答案，把练习改成做完整的三个"],"code":"探"},{"date":"2027-07-18","month":7,"day":18,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天定了做完整的，今天走这条「一个月做出一个东西」的路。","question":"四个岔口，每岔只有一条能在这个暑假真的做出东西：岔口一 想做大的／做小的；岔口二 等学会了再做／边做边查；岔口三 做给自己／做给一个具体的人；岔口四 做完了放着／发出去。","answer":"参考路径：做小的→边做边查→做给一个具体的人→发出去。第三格是加速器：为一个人做（送给室友、帮亲戚、给社团用），需求具体，不用纠结风格。第四格是唯一让作品变成经历的动作。","hint_raw":"① 有一格是「为谁做」。② 不要等学会。③ 见答案，写下你要为谁做、做成什么样、什么时候发出去。","record":"我要为谁做那个东西。","migrate":"","out_char":"","hints":["有一格是「为谁做」","不要等学会","见答案，写下你要为谁做、做成什么样、什么时候发出去"],"code":"探"},{"date":"2027-07-19","month":7,"day":19,"weekday":"一","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天定了为谁做，今天连「四种反馈配怎么用」。","question":"左边四种反馈，右边四种用法，请连线：① 「挺好的」 ② 「看不懂」 ③ 「太花哨」 ④ 「少了一点什么」 —— A 减，不要加 B 追问具体哪里看不懂 C 换一个人再问 D 自己补，但先问是哪方面。","answer":"参考 ①—C、②—B、③—A、④—D。①—C 是现实：模糊的表扬不含信息，换一个会挑问题的人问。「太花哨」的正确反应是减，加东西会让问题更严重——多数新手的作品问题在信息少、装饰多，或者反过来，得先分辨。","hint_raw":"① 「看不懂」是最好处理的。② 「太花哨」要减不要加。③ 见答案，把收到的反馈对号入座。","record":"我收到过最有用的一句批评，是哪一类。","migrate":"","out_char":"","hints":["「看不懂」是最好处理的","「太花哨」要减不要加","见答案，把收到的反馈对号入座"],"code":"探"},{"date":"2027-07-20","month":7,"day":20,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了用反馈，今天在一段「我发不出去」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪个是真正的原因：\n  「我做完了，但一直没发出去。觉得还不够好，再改改。改了两周，越改越不想发，现在看到它就想删掉。」","answer":"三个词：还不够好、再改改、想删掉。真正的原因是「没有交付标准」——「够不够好」由自己随时改动的感觉判断，永远达不到。解法：先定一个可验证的标准（发给三个人、有一个说能用、下周三之前），达到就发。","hint_raw":"① 问题不在作品，在标准。② 「越改越不想发」是常见现象。③ 见答案，给你的东西定一个交付日期。","record":"我拖着没发的那件东西，交付日期定在哪天。","migrate":"","out_char":"","hints":["问题不在作品，在标准","「越改越不想发」是常见现象","见答案，给你的东西定一个交付日期"],"code":"探"},{"date":"2027-07-21","month":7,"day":21,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天定了交付，今天看两种「暑假结束」。","question":"同一个人暑假前后的两段话，找三处不同，并指出哪一处变化最值钱：\n  A（前）「我不太会做东西，也没什么特长，先看看别人怎么做。」\n  B（后）「我做了一个能用的东西，知道下一步该练什么，也知道自己不擅长哪一块。」","answer":"三处不同：① 前是「不会」，后是「做了一个能用的」；② 前没有方向，后有下一步；③ 前只有自我评价，后有边界（不擅长哪一块）。最值钱的变化是「知道下一步该练什么」——它把努力从随机变成有方向。","hint_raw":"① 注意「能用的」三个字。② 有方向比有能力更早出现。③ 见答案，写一句你的「下一步该练什么」。","record":"我的下一步该练什么，一句话说得清吗。","migrate":"","out_char":"","hints":["注意「能用的」三个字","有方向比有能力更早出现","见答案，写一句你的「下一步该练什么」"],"code":"探"},{"date":"2027-07-22","month":7,"day":22,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天写了下一步，今天破三句「别人都说」。","question":"请破译下面三句话，并指出哪一句背后有真实依据：\n  A「我表姐说这个行业已经饱和了。」\n  B「我在招聘网站上看到这个岗位最近三个月在本地有十七个在招。」\n  C「网上都在说这个专业没前途。」","answer":"有真实依据的是 B——它有范围（本地）、时间（最近三个月）、数量（十七个）。A 是一个人听来的判断，C 是「都在说」的模糊共识。判断行业冷热，看的是「本地、近期、在招数量」这三个限定。","hint_raw":"① 有一句话有三个限定词。② 「都在说」通常没有来源。③ 见答案，自己动手查一次本地在招数量。","record":"我关心那个岗位，本地最近在招几个。","migrate":"","out_char":"","hints":["有一句话有三个限定词","「都在说」通常没有来源","见答案，自己动手查一次本地在招数量"],"code":"探"},{"date":"2027-07-23","month":7,"day":23,"weekday":"五","level":"L1","type":"九宫格","tag":"大暑｜九宫格","review":false,"carry":"昨天学会了查，今天看「我查过的东西」。","question":"中心格写「我想了解的岗位」。八格填：做什么、一天对谁说话、几点上下班、要不要加班、起薪大概多少、三年后能到什么位置、需要什么证、本地有几家在招。","answer":"无标准答案。判定要点：八格里最容易空的是第 6 格（三年后）和第 8 格（本地在招数）——这两格恰恰决定这条路可不可走。空着的格子就是下一次要查的东西。","hint_raw":"① 空着的格子比填满的重要。② 第 8 格用招聘网站查。③ 见答案，本周把空的两格补上。","record":"我这一格最空的是哪一个，怎么补。","migrate":"","out_char":"","hints":["空着的格子比填满的重要","第 8 格用招聘网站查","见答案，本周把空的两格补上"],"code":"探"},{"date":"2027-07-24","month":7,"day":24,"weekday":"六","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天找到了空格，今天排一次「怎么查」。","question":"你要查清一个岗位的真实情况，五个动作请排序：A 招聘网站看本地在招数量和薪资区间 B 找岗位描述里的高频要求，抄下来 C 找一个在职的人问「最难的是哪部分」 D 对照自己现在缺哪一条 E 定一个六个月能补上的动作。","answer":"参考 A→B→C→D→E。B 的关键是「高频」——十份岗位描述里出现八次的要求，就是硬门槛；C 问「最难的部分」而不是「怎么样」，才能拿到真话；E 必须是一条能在六个月做完的，不要写「提升能力」。","hint_raw":"① 抄要求，看出现次数。② 问「最难的」比问「怎么样」有效。③ 见答案，注意 E 只能写一条。","record":"那个岗位出现最多的三条要求，我现在满足几条。","migrate":"","out_char":"","hints":["抄要求，看出现次数","问「最难的」比问「怎么样」有效","见答案，注意 E 只能写一条"],"code":"探"},{"date":"2027-07-25","month":7,"day":25,"weekday":"日","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天抄了要求，今天填「怎么补一条」。","question":"横填四格，每格两字：① 选最___（缺的／难的／简单的）一条 ② 找一份___（标准／教程／例子）对照 ③ 每周投___（时间／简历／消息）进去 ④ 三个月后看___（结果／心情／别人）。","answer":"参考：缺的／标准／时间／结果。第 1 格选「最缺的」，因为短板决定你能不能过门槛，长板只决定你多亮。第 2 格「标准」指对方要什么水平（能独立做、有作品、有证），没有标准就不知道练到哪算够。","hint_raw":"① 补短板优先。② 先找到「够」的标准。③ 见答案，写下你补的那条和验收标准。","record":"我要补的这一条，怎么算补齐了。","migrate":"","out_char":"","hints":["补短板优先","先找到「够」的标准","见答案，写下你补的那条和验收标准"],"code":"探"},{"date":"2027-07-26","month":7,"day":26,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天定了标准，今天破三句「我时间不够」。","question":"请破译下面三句话，并指出哪一句是真的时间问题：\n  A「我这学期太忙了，没时间做这些。」\n  B「我每天有两小时不知道去哪了，但确实没做成事。」\n  C「我这学期只做三件事，其余都推了，还是没时间。」","answer":"真正的时间问题只有 C 可能成立（已做减法仍不够，说明总量确实不足，需要换方案而不是加努力）。A 通常是优先级问题，B 是注意分散问题（时间在，但被切碎了）。判断方法：先记三天时间账，再判断是「没有时间」还是「没有整块」。","hint_raw":"① 先做减法，再谈时间不够。② 被切碎的时间等于没有。③ 见答案，记三天时间账再下结论。","record":"我这三天的时间，碎在哪里。","migrate":"","out_char":"","hints":["先做减法，再谈时间不够","被切碎的时间等于没有","见答案，记三天时间账再下结论"],"code":"探"},{"date":"2027-07-27","month":7,"day":27,"weekday":"二","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天记了时间账，今天连「四种时间配什么任务」。","question":"左边四种时间段，右边四种最适合放进去的事，请连线：① 二十分钟碎片 ② 一小时整块 ③ 睡前半小时 ④ 走路/坐车 —— A 背记类（单词、口诀） B 想事情、做计划 C 做需要连续动手的事 D 看、听、收集。","answer":"参考 ①—D、②—C、③—B、④—A。③—B 的依据：睡前容易反刍，正好用来想事情和排第二天，但要设一个截止（想十分钟就睡）。④—A 利用的是不需要眼睛的时间。","hint_raw":"① 走路时最适合背东西。② 需要连续动手的事只能放整块。③ 见答案，把自己的任务对号入座。","record":"我的一小时整块，通常用在了什么事上。","migrate":"","out_char":"","hints":["走路时最适合背东西","需要连续动手的事只能放整块","见答案，把自己的任务对号入座"],"code":"探"},{"date":"2027-07-28","month":7,"day":28,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天排了时间，今天看两种「暑假记录」。","question":"两个人在暑假各写了一段时间记录，找三处不同，并指出哪一份三个月后还有用：\n  A「7 月 12 日，今天很热，心情一般，看了会儿书，晚上和朋友聊天，感觉还行。」\n  B「7 月 12 日：帮表姐看店 4 小时，遇到一个退货的客人，我先听他说完再处理，他没发火。原来先听完是有用的。」","answer":"三处不同：① A 记的是状态，B 记的是事件；② A 没有可复用的结论，B 有一句「先听完是有用的」；③ A 无法在简历或面试里使用，B 可以直接变成一段经历讲述。三个月后还有用的是 B。","hint_raw":"① 有一份里有一句「原来……是有用的」。② 记录的价值在可复用。③ 见答案，今天的记录试着加一句「原来……」。","record":"我今天有一句「原来……是有用的」吗，是什么。","migrate":"","out_char":"","hints":["有一份里有一句「原来……是有用的」","记录的价值在可复用","见答案，今天的记录试着加一句「原来……」"],"code":"探"},{"date":"2027-07-29","month":7,"day":29,"weekday":"四","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天学了记结论，今天排一次「把经历讲成一段话」。","question":"面试时被问「讲一件你做过的事」，五个部分请排序：A 结果（做成了什么） B 背景（当时是什么情况） C 我做了什么（两三个动作） D 我学到/会了什么 E 一句话说清这件事是什么。","answer":"参考 E→B→C→A→D。E 最前：先说一句总括（我在暑假给一家店做了两个月的事，学会了处理客人投诉），听的人才知道后面在讲什么。A 在 D 之前：先给结果，再给收获，否则收获听起来像自我表扬。","hint_raw":"① 先说一句总括。② 结果是收获的前提。③ 见答案，用这个结构写你自己的一件事。","record":"我要讲的那件事，一句话总括是什么。","migrate":"","out_char":"","hints":["先说一句总括","结果是收获的前提","见答案，用这个结构写你自己的一件事"],"code":"探"},{"date":"2027-07-30","month":7,"day":30,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天有了结构，今天填「一句话总括」四个要素。","question":"横填四格，每格两字：① 时间___（暑假／最近／以前） ② 我做___（了什么／过什么／想什么） ③ 对象是___（谁／大家／别人） ④ 结果是___（什么／还行／不错）。","answer":"参考：暑假／做了什么／谁／什么。四格对应的就是「时间＋动作＋对象＋结果」，比「我很有责任心」这类描述有效得多。第 3 格「对象是谁」最常被漏掉，而它恰恰说明你的经验在什么场景下有效。","hint_raw":"① 第 4 格必须是具体结果。② 第 3 格别写「大家」。③ 见答案，把你的经历填成一句。","record":"我的一句话总括，说给谁听过。","migrate":"","out_char":"","hints":["第 4 格必须是具体结果","第 3 格别写「大家」","见答案，把你的经历填成一句"],"code":"探"},{"date":"2027-07-31","month":7,"day":31,"weekday":"六","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"七月最后一天，在一段「我没做出什么」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断是错的：\n  「七月过去了，我没做出什么大事。只是每天做了点小事：陪亲戚家孩子玩了几天，学会了剪一段视频，看了两本书，帮人改了一份材料。这些好像都不算数。」","answer":"三个词：没做出什么大事、每天做了点小事、不算数。判断错误的是「不算数」——四件小事里有三件是可迁移的（带孩子、剪视频、改材料），只有「看两本书」需要再过一道才能用。真正的问题不是事太小，是没有把它们写成「做过什么」。","hint_raw":"① 有一句话是全面否定。② 小事可以变成经历，前提是写下来。③ 见答案，把四件小事各写成一句「时间＋动作＋对象＋结果」。","record":"七月我做过的四件小事，各写成一句给我看。\n\n---\n\n## 八月｜追问与深入（月字：索）\n\n八月 31 天：L1 27 道；L3 一天（8/1 婴幼儿托育服务与管理）；L2 一问一天（8/12）；L4 两天（8/8 七夕、8/13 国际左撇子日）。","migrate":"","out_char":"","hints":["有一句话是全面否定","小事可以变成经历，前提是写下来","见答案，把四件小事各写成一句「时间＋动作＋对象＋结果」"],"code":"探"},{"date":"2027-08-01","month":8,"day":1,"weekday":"日","level":"L3","type":"专业日","tag":"建军节｜L3 专业日：婴幼儿托育服务与管理","review":false,"carry":"前一天 L1 写的是「我最近一次照顾别人」，今天把这件事变成专业课：**照顾不是先动手，是先判断**。","question":"一名 8 月龄婴儿在托育园持续哭闹。从起点到「安抚成功」出口，迷宫有四个岔口，每个岔口只有一条路能通向出口：\n  - 岔口一：饥饿 / 困倦\n  - 岔口二：身体不适（发热、腹胀、衣物缠绕）/ 环境过度刺激（灯太亮、人太多）\n  - 岔口三：抱起来摇 / 先降刺激再抱\n  - 岔口四：直接喂奶 / 记录并交接班\n  请走出那条必须最先排除的分支，并指出哪一条岔口里藏着「走得越久越危险」的选项。","answer":"正确路径是 **岔口一（先分清饥饿与困倦）→ 岔口二选身体不适（必须先排）→ 岔口三选先降刺激再抱 → 出口**。\n  - 危险选项在**岔口二**：身体不适若被当成「闹觉」，会拖成发热惊厥或窒息风险（衣物缠绕、口鼻被掩）。\n  - 岔口四「直接喂奶」是常见错误——未排除不适就喂，可能加重腹胀；正确做法是记录并交接班，让下一个接手的人知道前一小时发生了什么。","hint_raw":"①哭闹第一分钟该做什么，不该做什么　②四个岔口里，只有一个是「不能再等」的　③先排除生理与安全，再谈安抚技巧","record":"我照顾别人时，是先去解决，还是先看清楚","migrate":"把「婴儿哭闹」换成本专业最常见的求助信号（学生突然沉默、用户报错、老人不愿吃饭），先排危险再谈方法。","out_char":"","college":"学前教育学院","profession":"婴幼儿托育服务与管理","hints":["哭闹第一分钟该做什么，不该做什么","四个岔口里，只有一个是「不能再等」的","先排除生理与安全，再谈安抚技巧"],"code":"索"},{"date":"2027-08-02","month":8,"day":2,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"八月主题「索」——往深里追问。今天破三句「为什么」。","question":"下面三段对话，谁问到了真问题，请指出并说明理由：\n  A「你为什么选这个专业？」「因为我喜欢小孩。」\n  B「你喜欢小孩的什么？」「……就是喜欢吧。」\n  C「你带过几个小孩，最麻烦的是哪个时刻？」「中午不肯睡那次，我试了三种方法。」","answer":"C 问到了真问题。A、B 停留在「喜欢」这一层，而喜欢是无法验证的；C 问的是具体经历与具体动作，答案里有细节、有尝试、有数量。追问的诀窍只有一个：把抽象的词换成「哪一次、几个、怎么做的」。","hint_raw":"① 真问题里有数字和具体时刻。② 「喜欢」需要被拆成场景。③ 见答案，用这个方法追问自己一次。","record":"「我喜欢」后面，我能接上哪一件具体的事。","migrate":"","out_char":"","hints":["真问题里有数字和具体时刻","「喜欢」需要被拆成场景","见答案，用这个方法追问自己一次"],"code":"索"},{"date":"2027-08-03","month":8,"day":3,"weekday":"二","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天学了追问，今天排一次「问自己」。","question":"你要弄清「我到底喜不喜欢这件事」，五个动作请排序：A 找出这件事里最具体的三个动作 B 标出哪个动作让你时间过得快 C 标出哪个动作让你拖延 D 想象只做喜欢的那部分、其余交给别人 E 判断能不能接受「喜欢三成、忍受七成」。","answer":"参考 A→B→C→D→E。D 是整道题的关键：任何工作都有「只做一部分」的形态，弄清你要的那部分是否存在，比判断「喜不喜欢这个职业」更准确。E 是最终的落点：多数工作是「喜欢三成、忍受七成」。","hint_raw":"① 先拆成具体动作。② 有一格是「只做那一部分」。③ 见答案，注意 E 为什么是「三成」。","record":"那件事里让我时间过得快的动作，是哪一个。","migrate":"","out_char":"","hints":["先拆成具体动作","有一格是「只做那一部分」","见答案，注意 E 为什么是「三成」"],"code":"索"},{"date":"2027-08-04","month":8,"day":4,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天拆了动作，今天看「我时间过得快的时候」。","question":"中心格写「我忘记看时间的一次」。八格填：那天在做什么、和谁、在哪、做了多久、中间被打断过吗、做完什么感觉、有人说过我做得好吗、还有哪次也是这样。","answer":"无标准答案。判定要点：把第 1 格与第 8 格对照，出现两次以上的活动就是你的兴趣线索。第 6 格「做完什么感觉」若填的是「累但舒服」，那比「轻松」更有价值——前者说明有投入。","hint_raw":"① 要两次以上才算线索。② 「累但舒服」是好信号。③ 见答案，找出重复出现的那一类活动。","record":"我忘记看时间的那些时刻，共同点是什么。","migrate":"","out_char":"","hints":["要两次以上才算线索","「累但舒服」是好信号","见答案，找出重复出现的那一类活动"],"code":"索"},{"date":"2027-08-05","month":8,"day":5,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了共同点，今天破三句「我适合」。","question":"请破译下面三句话，并指出哪一句最可能是真的判断：\n  A「我性格内向，适合做不用跟人打交道的工作。」\n  B「我做表格时能连续坐三小时不烦，做介绍人的活十分钟就累。」\n  C「我朋友说我适合当老师，因为我脾气好。」","answer":"最可能是真判断的是 B——它基于自己的实际时长与感受对比，是可复现的证据。A 把性格直接等同于岗位类型（几乎没有「不跟人打交道」的工作）；C 是别人的印象，而「脾气好」在真实课堂里并不等于能管住课堂。","hint_raw":"① 有一句话对比了两种活的时间感受。② 别人的印象不等于适配。③ 见答案，用自己的「时长感受」做一次判断。","record":"我做哪件事能连续坐三小时不烦。","migrate":"","out_char":"","hints":["有一句话对比了两种活的时间感受","别人的印象不等于适配","见答案，用自己的「时长感受」做一次判断"],"code":"索"},{"date":"2027-08-06","month":8,"day":6,"weekday":"五","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天找到了证据，今天走一条「深入了解一个职业」的路。","question":"四个岔口，每岔只有一条能真的了解：岔口一 看介绍文章／找一个在职的人聊；岔口二 问他这份工作怎么样／问他上周做了什么；岔口三 只听好的／也问最难的部分；岔口四 聊完就结束／写下来并对照自己。","answer":"参考路径：找一个在职的人聊→问他上周做了什么→也问最难的部分→写下来并对照自己。第二格是核心：问「怎么样」得到的是评价，问「上周做了什么」得到的是事实。第三格决定你听到的是宣传还是真相。","hint_raw":"① 问事实不问评价。② 「最难的部分」最有信息量。③ 见答案，找一个在职的人，问那三个问题。","record":"我问到的「上周做了什么」，具体有哪些事。","migrate":"","out_char":"","hints":["问事实不问评价","「最难的部分」最有信息量","见答案，找一个在职的人，问那三个问题"],"code":"索"},{"date":"2027-08-07","month":8,"day":7,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天拿到了事实，今天看两份「职业介绍」。","question":"同一个人对同一个岗位的两段描述，找三处不同，并指出哪一段能让人做决定：\n  A「这个岗位很有前景，需要热爱孩子、有耐心、愿意学习，发展空间大。」\n  B「早上七点半到岗，一天带 25 个孩子，两个老师；主要工作是看护、组织活动、处理冲突、写观察记录；八小时里有五小时是站着；月薪 4000 起。」","answer":"三处不同：① A 全是形容词与评价，B 全是事实与数字；② A 没有时间与人数，B 有到岗时间、人数、比例；③ A 无法判断自己能不能做，B 可以逐条对照。能让人做决定的是 B。","hint_raw":"① 有一份里有「七点半」「25 个」「4000」。② 形容词无法用来做决定。③ 见答案，用 B 的四类信息去描述你关心的岗位。","record":"我能用四个数字描述我想做的岗位吗。","migrate":"","out_char":"","hints":["有一份里有「七点半」「25 个」「4000」","形容词无法用来做决定","见答案，用 B 的四类信息去描述你关心的岗位"],"code":"索"},{"date":"2027-08-08","month":8,"day":8,"weekday":"日","level":"L4","type":"生活趣味","tag":"七夕节｜L4 生活趣味","review":false,"carry":"","question":"牛郎织女每年见一次，可有人说他们从不走同一条路——为什么？","answer":"因为是**一座桥，两个方向**：他往上走，她往下走。（也接受任何比这更妙的答案，今天的题没有标准答案。）","hint_raw":"","record":"今天有没有和谁说过一句真心话。","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-09","month":8,"day":9,"weekday":"一","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天休息，今天填「怎么把一件事问到底」。","question":"横填四格，每格两字：① 追问「___」（哪一次／为什么／好不好） ② 要求举___（例子／理由／态度） ③ 问清「然后___」（呢／做／办） ④ 记下一个___（细节／结论／评价）。","answer":"参考：哪一次／例子／呢／细节。第 1 格「哪一次」是所有追问里最有效的开场：把概括变成事件。第 3 格「然后呢」能把事情推到结果，避免停在过程描述。","hint_raw":"① 用「哪一次」替代「为什么」。② 「然后呢」能问出结果。③ 见答案，用这两句去问一个人。","record":"我用「哪一次」问出了什么细节。","migrate":"","out_char":"","hints":["用「哪一次」替代「为什么」","「然后呢」能问出结果","见答案，用这两句去问一个人"],"code":"索"},{"date":"2027-08-10","month":8,"day":10,"weekday":"二","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天学了追问细节，今天看两种「被拒绝」。","question":"同一个人被拒两次，两段反应找三处不同，并指出哪一次更有用：\n  A「她说我不合适。算了，可能我真的不行，这个方向不适合我。」\n  B「她说我不合适。我问了具体是哪方面，她说需要能独立带 30 人以上；我确实没带过，下次先带 15 人的试试。」","answer":"三处不同：① A 把拒绝当成对自己的判决，B 把它当成条件不满足；② A 没有获得信息，B 拿到了具体门槛（30 人）；③ A 停止，B 有下一步（先带 15 人）。更有用的是 B——拒绝几乎总是「条件不匹配」，很少是「你不行」。","hint_raw":"① 有一句里出现了数字。② 拒绝通常有具体原因，只是没被问。③ 见答案，下次被拒，先问一句「具体是哪方面」。","record":"我被拒过的那次，具体原因是什么。","migrate":"","out_char":"","hints":["有一句里出现了数字","拒绝通常有具体原因，只是没被问","见答案，下次被拒，先问一句「具体是哪方面」"],"code":"索"},{"date":"2027-08-11","month":8,"day":11,"weekday":"三","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天学了问原因，今天看「我怕的事」。","question":"中心格写「我不敢做的一件事」。八格填：怕什么、最坏会怎样、最坏的概率有多大、真发生了谁能帮我、我有没有做过类似的事、这件事值不值得试、试的成本是什么、如果一年后还不敢，会怎样。","answer":"无标准答案。这道题的方法在「代价核算」：把「怕」拆成最坏结果＋概率＋成本，多数恐惧在这一步会缩小。第 8 格是时间视角，它常让人做出行动决定。","hint_raw":"① 第 2 格要写得具体。② 第 7 格是试的成本，往往比想象的低。③ 见答案，如果成本低于一顿饭钱，就去做。","record":"我怕的那件事，试的成本具体是多少。","migrate":"","out_char":"","hints":["第 2 格要写得具体","第 7 格是试的成本，往往比想象的低","见答案，如果成本低于一顿饭钱，就去做"],"code":"索"},{"date":"2027-08-12","month":8,"day":12,"weekday":"四","level":"L2","type":"一问","tag":"国际青年日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：青年就业政策里，「见习」和「实习」有什么不一样。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-13","month":8,"day":13,"weekday":"五","level":"L4","type":"生活趣味","tag":"国际左撇子日｜L4 生活趣味","review":false,"carry":"","question":"小周是左撇子。早上他右手拿着杯子、左手拿着钥匙，门把手在门的左侧。他要开门，先放下哪只手里的东西？","answer":"**放杯子**。门把手在左侧，左手要腾出来；右手拿杯子不影响。","hint_raw":"","record":"有没有一件「大多数人都这样，而我不」的事。","migrate":"","out_char":"","hints":[],"code":"索"},{"date":"2027-08-14","month":8,"day":14,"weekday":"六","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天看了「不一样」，今天破三句「我不合群」。","question":"请破译下面三句话，并指出哪一句其实是优势：\n  A「宿舍里他们聊的我都插不上话。」\n  B「我不太爱参加聚会，一个人待着更舒服。」\n  C「我做事喜欢一个人从头做到尾，不太会分工。」","answer":"其实是优势的是 B——「一个人待着更舒服」是一种稳定的偏好，多数需要深度专注的工作（写作、设计、编程、研究、手工）都要求这个能力。A 是话题差异（可解决，找共同话题或换圈子）；C 是真短板（分工是职场基本能力，需要练）。","hint_raw":"① 有一句是偏好，不是缺陷。② 有一句是技能缺失。③ 见答案，分清「偏好」和「短板」。","record":"我身上被说成「缺点」的，有几条其实是偏好。","migrate":"","out_char":"","hints":["有一句是偏好，不是缺陷","有一句是技能缺失","见答案，分清「偏好」和「短板」"],"code":"索"},{"date":"2027-08-15","month":8,"day":15,"weekday":"日","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天分清了偏好不好，今天看「我一个人的时候做什么」。","question":"中心格写「没人管我时」。八格填：最常打开的应用、最常看的内容类型、最常反复做的小动作、最久没碰的东西、最近主动搜过的一个问题、一个人在时会做的正经事、一个人在时会做的浪费时间的事、这两类各占多少。","answer":"无标准答案。核心看第 5 格与第 8 格：第 5 格「主动搜过的问题」往往就是你的真实兴趣（不受课程安排影响）；第 8 格的比例，是自我管理的基线数据，不是道德判断。","hint_raw":"① 主动搜过的问题最真实。② 第 8 格只需要一个比例。③ 见答案，把第 5 格的问题记下来，顺着它查一次。","record":"我最近主动搜的那个问题，是什么。","migrate":"","out_char":"","hints":["主动搜过的问题最真实","第 8 格只需要一个比例","见答案，把第 5 格的问题记下来，顺着它查一次"],"code":"索"},{"date":"2027-08-16","month":8,"day":16,"weekday":"一","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天找到了真兴趣，今天排一次「顺着一个兴趣往下查」。","question":"你对一个话题有兴趣，五个动作请排序：A 先查它的基本概念和范围 B 找三个做这行的人看他们在做什么 C 试做一个最小的产出 D 判断它能不能变成一份工作 E 如果不能，就把它留作爱好，继续用别的方式养活自己。","answer":"参考 A→B→C→D→E。C 是分界线：没做过之前，兴趣只是想象。E 是本册一个重要的态度——兴趣不必都变成职业，很多兴趣变成职业后会消失。","hint_raw":"① 先做一次再判断。② 兴趣可以不变成工作。③ 见答案，注意 E 为什么是「留作爱好」。","record":"我这个兴趣，值得变成工作吗。","migrate":"","out_char":"","hints":["先做一次再判断","兴趣可以不变成工作","见答案，注意 E 为什么是「留作爱好」"],"code":"索"},{"date":"2027-08-17","month":8,"day":17,"weekday":"二","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天做了判断，今天看两种「爱好变现」。","question":"两个人都喜欢拍照，两段经历找三处不同，并指出哪一个人更可能靠它挣到钱：\n  A「我拍了很多照片，存在手机里，朋友都说好看。」\n  B「我给三个社团拍过活动，收了两次钱，每次两百。我知道一场活动要拍哪几个关键画面。」","answer":"三处不同：① A 没有交付对象，B 有（三个社团）；② A 没有定价，B 有（两百一次）；③ A 不知道「关键画面」，B 知道行业里的交付标准。更可能挣到钱的是 B——市场认的是「知道要交什么」，不是「拍得好看」。","hint_raw":"① 有一句话里有价格。② 交付标准比技术水平更早决定收入。③ 见答案，把你喜欢的事写出「交付什么」。","record":"我喜欢的那件事，交付物具体是什么。","migrate":"","out_char":"","hints":["有一句话里有价格","交付标准比技术水平更早决定收入","见答案，把你喜欢的事写出「交付什么」"],"code":"索"},{"date":"2027-08-18","month":8,"day":18,"weekday":"三","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天学了交付，今天破三句「我要不要读本科」。","question":"请破译下面三句话，并指出哪一句是真正的考虑：\n  A「大家都说要读，那我就读。」\n  B「我这个方向考编和进公办园都要本科，所以我需要读。」\n  C「我不想那么早工作，读两年也挺好。」","answer":"真正的考虑是 B——它指向具体门槛（考编、公办园的学历要求），有明确用途。A 是从众，C 是推迟决定（本身不是错，但要承认这是「缓两年」，不是「为了学历」）。","hint_raw":"① 有一句话里有具体的用人要求。② 「不想那么早工作」需要被承认。③ 见答案，去查你想去的岗位的学历门槛。","record":"我想去的那个地方，学历门槛具体写的是什么。","migrate":"","out_char":"","hints":["有一句话里有具体的用人要求","「不想那么早工作」需要被承认","见答案，去查你想去的岗位的学历门槛"],"code":"索"},{"date":"2027-08-19","month":8,"day":19,"weekday":"四","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天查了门槛，今天连「四种去向配什么准备」。","question":"左边四种毕业去向，右边四种最该提前做的事，请连线：① 考编/考公 ② 进民办园或机构 ③ 专升本 ④ 直接就业但方向未定 —— A 先做一份能展示的作品或试讲 B 提前半年开始刷题与报名节点 C 先去实习两个月，用排除法定方向 D 弄清考试科目与招生计划，早一年准备。","answer":"参考 ①—B、②—A、③—D、④—C。②—A 的要点：民办园和机构最看重「能不能马上上手」，一场试讲或一份作品比学历更有效。③—D 强调「早一年」：专升本的信息差主要在时间节点上。","hint_raw":"① 有一种准备要早一年。② 民办单位看能不能上手。③ 见答案，对照自己现在属于哪一类。","record":"我这四条路里，最可能走的是哪一条，准备做到哪一步了。","migrate":"","out_char":"","hints":["有一种准备要早一年","民办单位看能不能上手","见答案，对照自己现在属于哪一类"],"code":"索"},{"date":"2027-08-20","month":8,"day":20,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天对号入座，今天排一次「定去向」。","question":"你要在三条路里定一条主攻，五个动作请排序：A 写下三条路各自的硬门槛（学历、证、笔试） B 标出自己已经满足和缺的 C 算每条路要投入的时间 D 选一条主攻、一条备选 E 给主攻路线定三个月的第一个节点。","answer":"参考 A→B→C→D→E。B 是分流点：如果三条路的门槛差距很大，选择其实已经被现实决定了。D 的关键是「一条主攻一条备选」，两条主攻等于没有主攻。","hint_raw":"① 先看门槛，再看意愿。② 主攻只能一条。③ 见答案，注意 E 必须是一个可检查的节点。","record":"我主攻的那条路，缺的最硬的一项是什么。","migrate":"","out_char":"","hints":["先看门槛，再看意愿","主攻只能一条","见答案，注意 E 必须是一个可检查的节点"],"code":"索"},{"date":"2027-08-21","month":8,"day":21,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天定了主攻，今天看「我离门槛还差多少」。","question":"中心格写「目标岗位的门槛」。八格填：学历、专业限制、证书、笔试科目、面试形式、经验要求、年龄/身高等硬条件、我目前缺的几项。","answer":"无标准答案。要点在第 7 格：硬条件（年龄、身高、视力、户籍）是最先要查的一项，因为它不可通过努力改变，越早知道越好。第 8 格写在最后，作为结论。","hint_raw":"① 先查不可改变的条件。② 缺的项要少于三项才好推进。③ 见答案，把第 8 格写成一句行动。","record":"我缺的那几项里，哪一项最难补。","migrate":"","out_char":"","hints":["先查不可改变的条件","缺的项要少于三项才好推进","见答案，把第 8 格写成一句行动"],"code":"索"},{"date":"2027-08-22","month":8,"day":22,"weekday":"日","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天看清了缺口，今天看两种「备考」。","question":"两个人在准备同一场考试，两段记录找三处不同，并指出哪一个人更可能通过：\n  A「我每天都在看书，看了三章，感觉都懂了，但一做题就错很多。」\n  B「我先做了两套真题，看错在哪，再回去看对应的三章，第三次做真题对了七成。」","answer":"三处不同：① A 从内容出发，B 从题目出发；② A 的检验是「感觉懂了」，B 的检验是正确率；③ A 没有定位错误，B 定位到了具体章节。更可能通过的是 B——考试考的是「会不会做题」，不是「看没看完」。","hint_raw":"① 有一句话里有「七成」。② 从真题倒推章节更省时间。③ 见答案，把「先看后做」改成「先做后看」。","record":"我复习时，有没有算过正确率。","migrate":"","out_char":"","hints":["有一句话里有「七成」","从真题倒推章节更省时间","见答案，把「先看后做」改成「先做后看」"],"code":"索"},{"date":"2027-08-23","month":8,"day":23,"weekday":"一","level":"L1","type":"密文破译","tag":"处暑｜密文破译","review":false,"carry":"昨天改了复习法，今天破三句「我基础差」。","question":"请破译下面三句话，并指出哪一句是在描述事实：\n  A「我基础太差了，肯定考不上。」\n  B「我上次模考 62 分，主要丢在教育学那部分。」\n  C「别人都比我强。」","answer":"描述事实的是 B——有分数、有失分位置，是可以处理的。A 是结论（且是提前放弃），C 是无法核实的比较。把 A 改写成 B 的格式：「我 X 分，主要丢在 Y」，问题就变成了任务。","hint_raw":"① 有一句话里有分数和位置。② 「都比我强」无法核实。③ 见答案，把你的成绩写成「分数＋失分位置」。","record":"我的分数主要丢在哪一部分。","migrate":"","out_char":"","hints":["有一句话里有分数和位置","「都比我强」无法核实","见答案，把你的成绩写成「分数＋失分位置」"],"code":"索"},{"date":"2027-08-24","month":8,"day":24,"weekday":"二","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天定位了失分，今天走「最后四个月怎么用」的路。","question":"离考试还有四个月，四个岔口：岔口一 全面复习／先攻失分最大的两块；岔口二 每天学新内容／每天一半新一半回看；岔口三 只看书／每周做一次限时模拟；岔口四 一个人闷头学／找一个能互相提问的人。","answer":"参考路径：先攻失分最大的两块→每天一半新一半回看→每周做一次限时模拟→找一个能互相提问的人。第三格是分数的直接来源：限时模拟训练的是「在时间压力下取分」的能力，与「会不会」是两件事。","hint_raw":"① 先攻失分最大的。② 限时模拟不可省。③ 见答案，注意第四格为什么是「互相提问」。","record":"我上一次限时模拟是什么时候，多少分。","migrate":"","out_char":"","hints":["先攻失分最大的","限时模拟不可省","见答案，注意第四格为什么是「互相提问」"],"code":"索"},{"date":"2027-08-25","month":8,"day":25,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天排了复习，今天连「四种题型配什么解法」。","question":"左边四种题型，右边四种应对策略，请连线：① 选择题 ② 简答题 ③ 案例分析 ④ 面试问答 —— A 先给框架再填内容 B 先圈关键词再排除 C 先判断考点再分点 D 先想「对方在考什么」再答。","answer":"参考 ①—B、②—C、③—A、④—D。②—C 强调「先判断考点」：简答题的分数来自踩点，写得多不如踩得准。③—A 的框架指「是什么—为什么—怎么办」，先搭骨架再填。","hint_raw":"① 案例题先搭框架。② 简答靠踩点给分。③ 见答案，用自己的考试题型对照一遍。","record":"我最容易丢分的是哪一种题型。","migrate":"","out_char":"","hints":["案例题先搭框架","简答靠踩点给分","见答案，用自己的考试题型对照一遍"],"code":"索"},{"date":"2027-08-26","month":8,"day":26,"weekday":"四","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天分清了题型，今天填「答题四步」。","question":"横填四格，每格两字：① 先看___（题眼／字数／分值） ② 再列___（要点／例子／开头） ③ 写的时候留___（空行／空白／时间） ④ 最后___（检查／补充／交卷）。","answer":"参考：题眼／要点／空行／检查。第 3 格「留空行」是阅卷友好的做法，方便补充，也让要点更清楚。第 4 格检查的重点是两个：有没有漏题、有没有写错答题位置。","hint_raw":"① 先找题眼。② 留空行方便补。③ 见答案，下次答题按这四步走。","record":"我上次考试漏题了吗。","migrate":"","out_char":"","hints":["先找题眼","留空行方便补","见答案，下次答题按这四步走"],"code":"索"},{"date":"2027-08-27","month":8,"day":27,"weekday":"五","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天练了答题，今天看两种「模拟考之后」。","question":"两个人模考后都考砸了，两段反应找三处不同，并指出哪一个人四个月后分数会上去：\n  A「考得太差了，我可能真的不适合。先放两天，缓缓再说。」\n  B「考得差，我把错的题分成三类：没背过的、看错的、来不及的。前两类能补，第三类要练速度。」","answer":"三处不同：① A 把分数当成评价，B 把分数当成诊断；② A 没有分类，B 把错误分成三类；③ A 停下，B 有对应解法。四个月后分数会上去的是 B——错题分类是提分最快的一步，因为它把「差」变成了三个具体任务。","hint_raw":"① 有一句话里有「三类」。② 「来不及」是速度问题，不是知识问题。③ 见答案，把你的错题分一次类。","record":"我的错题里，最多的是哪一类。","migrate":"","out_char":"","hints":[" ,"question":"下面这段话藏着三个词，找出来，并指出哪一个是真的问题：\n  「这学期事情好多，上课、社团、考证、兼职，我全都要做。每天都很忙，但周末一想，好像没推进什么，下周还得重新开始。」","answer":"三个词：全都要做、没推进什么、重新开始。真问题在「全都要做」——它导致每件事都只推进一点点，而「一点点」不产生可见成果。第三个词「重新开始」是后果：没有连续投入的事，每次都要重新热身。","hint_raw":"① 有一个词是原因。② 「重新开始」消耗最大。③ 见答案，从「全都要」里划掉一件。","record":"我这学期「全都要」的清单里，能划掉哪一件。","migrate":"","out_char":"","hints":["有一个词是原因","「重新开始」消耗最大","见答案，从「全都要」里划掉一件"],"code":"世"},{"date":"2027-09-05","month":9,"day":5,"weekday":"日","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天划掉了一件，今天看两种「参与」。","question":"两个人都参加了同一个社团，一学期后两段话找三处不同，并指出哪一个人真正受益：\n  A「我每次活动都去，帮忙搬东西、拍照，认识了不少人。」\n  B「我在社团负责一个 20 人的小组，带过两次活动，出过一次事故（下雨改场地），后来我写了份流程清单给下一届。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 是参与，B 是负责；② A 没有遇到过问题，B 处理过一次意外；③ A 的成果留在记忆里，B 的成果留下来（清单传给下一届）。真正受益的是 B——「负责过一个小组」和「处理过一次意外」是面试里最有用的两段素材。","hint_raw":"① 有一句话里有「负责」。② 事故比顺利更值钱。③ 见答案，在社团里争取一次「负责」。","record":"我负责过的一件事，出过什么问题。","migrate":"","out_char":"","hints":["有一句话里有「负责」","事故比顺利更值钱","见答案，在社团里争取一次「负责」"],"code":"世"},{"date":"2027-09-06","month":9,"day":6,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天学了负责，今天走一条「第一次带人」的路。","question":"你要第一次组织一件小事（一次班会、一次小组作业、一次活动），四个岔口：岔口一 自己全做／分给三个人；岔口二 只说要求／说清要求和截止时间；岔口三 出了问题自己扛／当场说「这块我来补，你换一件事」；岔口四 做完就散／做完留一句感谢和一个记录。","answer":"参考路径：分给三个人→说清要求和截止时间→当场说「这块我来补，你换一件事」→做完留一句感谢和一个记录。第三格是关键的分寸：不追责，但立刻补位，同时换掉任务，避免同一个坑踩第二次。","hint_raw":"① 分给三个人，不是全自己干。② 截止时间必须说。③ 见答案，注意第四格记录什么（谁做了什么）。","record":"我组织的那件事，谁做了什么，我记下来了吗。","migrate":"","out_char":"","hints":["分给三个人，不是全自己干","截止时间必须说","见答案，注意第四格记录什么（谁做了什么）"],"code":"世"},{"date":"2027-09-07","month":9,"day":7,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天带了人，今天在「组里有人不做」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个处理方式最不可取：\n  「小组作业有人一直不做。我不想得罪人，就一直自己补。后来交上去，老师夸了我们组，他也很高兴。我心里很不舒服，但也没说。」","answer":"三个词：不想得罪人、一直自己补、也没说。最不可取的是「一直自己补」——它让问题被掩盖，同时把你的付出变成默认。正确做法不是撕破脸，而是提前分工写清、中途同步进度、事后如实说明各自完成部分。","hint_raw":"① 有一句话是「替别人完成」。② 不说，问题不会消失。③ 见答案，试着用「分工写清」代替「自己补」。","record":"我上次替别人补的活，占了多少。","migrate": 两个方案／对吗。第 3 格是分水岭：带着两个方案去问，对方只需要判断；空手去问，对方要替你想。前者得到的是指导，后者得到的是答案。","hint_raw":"① 先说自己怎么想的。② 带两个方案去。③ 见答案，下次问问题按这四步。","record":"我下次要问的那个问题，两个方案是什么。","migrate":"","out_char":"","hints":["先说自己怎么想的","带两个方案去","见答案，下次问问题按这四步"],"code":"世"},{"date":"2027-09-13","month":9,"day":13,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天练了问问题，今天走一条「第一次面试」的路。","question":"第一次面试，四个岔口：岔口一 把简历上的话背一遍／讲一件具体的事；岔口二 说自己什么都能干／说自己擅长什么、不擅长什么；岔口三 对方问「有什么问题吗」说没有／问一个关于工作内容的问题；岔口四 结束后等通知／当天发一句感谢并补一份材料。","answer":"参考路径：讲一件具体的事→说自己擅长什么、不擅长什么→问一个关于工作内容的问题→当天发一句感谢并补一份材料。第二格反直觉但有效：承认不擅长（并说在怎么补）会显著提高可信度。第四格的补充材料，是很多人忽略的加分项。","hint_raw":"① 讲一件具体的事。② 承认不擅长能加分。③ 见答案，注意第四格补什么材料。","record":"我面试要讲的那件具体的事，是什么。","migrate":"","out_char":"","hints":["讲一件具体的事","承认不擅长能加分","见答案，注意第四格补什么材料"],"code":"世"},{"date":"2027-09-14","month":9,"day":14,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天备了面试，今天在一段「面试失败」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个判断需要修正：\n  「面试没通过，我说话的时候手一直在抖，肯定是我太紧张了。我这样的人不适合需要面对人的岗位，还是去做安静一点的工作吧。」","answer":"三个词：手一直在抖、太紧张、不适合。需要修正的是「不适合」——把一次紧张直接推成职业排除，跨度太大。紧张是可训练的反应（模拟三次就会明显下降），而「适合安静的工作」这个结论，缺少任何一次安静工作的实际检验。","hint_raw":"① 有一句话是从一次表现推出结论。② 紧张可以练。③ 见答案，把结论改成「需要多模拟几次」。","record":"我因为一次紧张，排除了什么。","migrate":"","out_char":"","hints":["有一句话是从一次表现推出结论","紧张可以练","见答案，把结论改成「需要多模拟几次」"],"code":"世"},{"date":"2027-09-15","month":9,"day":15,"weekday":"三","level":"L1","type":"填字格","tag":"中秋节｜填字格","review":false,"carry":"昨天修正了结论，今天中秋，填「和家里人说话」。","question":"横填四格，每格两字：① 先说___（自己在做什么／大道理／别人的事） ② 说具体的___（计划／想法／困难） ③ 听到反对先___（问为什么／反驳／沉默） ④ 结束给一个___（时间点／承诺／总结）。","answer":"参考：自己在做什么／计划／问为什么／时间点。第 3 格是家庭沟通的关键：家里人反对往往出于担心，问一句「您担心的是哪方面」，多数反对会变成具体建议。第 4 格「给一个时间点」，能让担心有落点。","hint_raw":"① 先说自己在做什么。② 反对背后通常是担心。③ 见答案，今晚试着用这四格聊一次。","record":"家里最担心我的一件事是什么。","migrate":"","out_char":"","hints":["先说自己在做什么","反对背后通常是担心","见答案，今晚试着用这四格聊一次"],"code":"世"},{"date":"2027-09-16","month":9,"day":16,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天聊了家里，今天看两种「被安排」。","question":"两个人都被家里建议去考某个岗位，两段反应找三处不同，并指出哪一种更能保住关系也保住自己：\n  A「我不喜欢，但家里说了算，先考吧，考不上再说。」\n  B「我先把要求查清楚，发现自己缺一项证；我跟家里说，如果补上这项证我就认真考，补不上我走另一条路。」","answer":"三处不同：① A 是被动服从，B 是带着条件接受；② A 没有核实（不知道要什么），B 查清了门槛；③ A 把结果交给运气，B 给了自己一条退路。更能保住两边的是 B——它把「要不要听家里的」变成了「能不能达到条件」。","hint_raw":"① 有一句话里有一个条件。② 先查门槛再表态。③ 见答案，把你被建议的那条路，查一次门槛。","record":"家里建议的那条路，我达标了吗。","migrate":"","out_char":"","hints":["有一句话里有一个条件","先查门槛再表态","见答案，把你被建议的那条路，查一次门槛"],"code":"世"},{"date":"2027-09-17","month":9,"day":17,"weekday":"五","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天学了带条件答应，今天连「四种说法配什么效果」。","question":"左边四种表达，右边四种最可能的效果，请连线：① 「我不去。」 ② 「我不去，因为……」 ③ 「我不去，但我可以帮你想别的办法。」 ④ 「我再想想。」 —— A 关系保住，对方也会继续问 B 对话结束，关系可能受损 C 对方接受，且不再追问 D 拖延，压力会回来。","answer":"参考 ①—B、②—C、③—A、④—D。②—C 的依据：给出理由（尤其是可核实的理由），对方更容易接受，因为他知道不是被否定。③—A 是最高级的拒绝：拒绝这件事，但不拒绝这个人。","hint_raw":"① 给理由比不给更容易被接受。② 「再想想」会把压力留给自己。③ 见答案，注意第三句的结构（拒绝＋替代）。","record":"我最常用的是哪一句，最该练的是哪一句。","migrate":"","out_char":"","hints":["给理由比不给更容易被接受","「再想想」会把压力留给自己","见答案，注意第三句的结构（拒绝＋替代）"],"code":"世"},{"date":"2027-09-18","month":9,"day":18,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天练了拒绝，今天看「我的边界」。","question":"中心格写「我不能接受的」。八格填：被当众批评、被临时改要求、被要求加班、被借钱、被开身体玩笑、被要求替人背责任、被查手机、被叫外号。","answer":"无标准答案。要点是给每条标一个等级（能忍／要提出／必须拒绝）。真正的边界不在「不能接受什么」，而在「被越过时我说什么」。给每一条写一句应对的话，这张表才有用。","hint_raw":"① 每条标等级。② 每条配一句话。③ 见答案，选等级最高的一条，把那句话写出来。","record":"我被越过边界时，通常说什么，有没有效。","migrate":"","out_char":"","hints":["每条标等级","每条配一句话","见答案，选等级最高的一条，把那句话写出来"],"code":"世"},{"date":"2027-09-19","month":9,"day":19,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天写了应对的话，今天走一条「第一次说不」的路。","question":"有人向你提一个你不想答应的请求，四个岔口：岔口一 立刻答应／先说「我想一下」；岔口二 编一个理由／说真实的原因；岔口三 说完就走／给出一个替代；岔口四 事后反复想／记下来，下次更快。","answer":"参考路径：先说「我想一下」→说真实的原因→给出一个替代→记下来，下次更快。第一格给的是时间：拒绝最难的是当场，缓一小时，难度会降一半。第四格是熟练度问题——拒绝是一项技能，练五次就不难了。","hint_raw":"① 先争取时间。② 真实原因比编的省事。③ 见答案，注意第四格为什么是「下次更快」。","record":"我想拒绝但答应了的那件事，真实原因是什么。","migrate":"","out_char":"","hints":["先争取时间",  + 共同对象**——\"Sit with your legs crossed, hands on your knees.\"（给动作）或 \"Let's sit like a frog together.\"（给共同对象）。①之所以是邀请，是因为 \"Line up\" 本身指向一个集体动作；③之所以是协作，是因为句中出现 \"with your friend\"，把孩子放进了关系里。\n  - 判据一句话：**句子里有没有「做什么」和「和谁」**。有，孩子听到的是合作；只有「不许」，孩子听到的是命令。","hint_raw":"①有一句只说了「不许」，没说「可以做什么」　②看三句里哪一句出现了「和谁一起」　③见答案，然后把 \"Don't run.\" 改写成可执行的版本","record":"我对别人说「不行」的时候，有没有同时告诉他可以怎么做","migrate":"把你专业里最常说的一句禁令，改写成「给动作 + 给对象」的版本，写下来对比。","out_char":"","college":"外语教育学院","profession":"应用英语（幼儿双语方向）","hints":["有一句只说了「不许」，没说「可以做什么」","看三句里哪一句出现了「和谁一起」","见答案，然后把 \"Don't run.\" 改写成可执行的版本"],"code":"界"}]};
const WEEK = {一:"周一",二:"周二",三:"周三",四:"周四",五:"周五",六:"周六",日:"周日"};
const LEVEL_NAME = {L1:"L1 通用",L2:"L2 职业",L3:"L3 专业日",L4:"L4 生活",REVIEW:"季度复盘"};
const MONTH_CN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}

const days = DATA.days.slice();
const monthTheme = DATA.month_theme || {};
const byMonth = {};
days.forEach(d=>{ (byMonth[d.month]=byMonth[d.month]||[]).push(d); });

/* 统计 */
(function(){
  const c = {};
  days.forEach(d=>c[d.level]=(c[d.level]||0)+1);
  const scope = DATA.meta && DATA.meta.scope_label ? DATA.meta.scope_label : "全年";
  const items = [
    ["范围", scope],
    ["天数", days.length],
    ["L1 通用", c.L1||0],
    ["L2 职业", c.L2||0],
    ["L3 专业日", c.L3||0],
    ["L4 生活", c.L4||0],
    ["复盘日", days.filter(d=>d.review).length]
  ];
  document.getElementById("stats").innerHTML = items.map(([k,v])=>`<span class="tag">${k} <b>${v}</b></span>`).join("");
})();

/* 导航 */
(function(){
  const nav = document.getElementById("nav");
  nav.innerHTML = Object.keys(byMonth).map(m=>{
    const hasRev = byMonth[m].some(d=>d.review);
    return `<a class="${hasRev?"rev":""}" href="#m${m}">${m}月${hasRev?"·复盘":""}</a>`;
  }).join("");
})();

/* 渲染 */
function cardHTML(d){
  const lv = d.level;
  const id = "c" + d.date.replace(/-/g,"");
  const hints = (d.hints||[]).map((h,i)=>`<div class="hint" data-i="${i}">${["①","②","③"][i]||"·"} ${md(h)}</div>`).join("");
  const tipBtn = (d.hints&&d.hints.length)
    ? `<button onclick="stepHint('${id}')">提示 <span id="${id}-hi">0</span>/${d.hints.length}</button>
       <button class="ghost" onclick="allHints('${id}')">全提示</button>` : "";
  const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){

  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
</body>
</html>
