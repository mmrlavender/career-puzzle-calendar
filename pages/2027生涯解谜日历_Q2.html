const DATA = {"year":2027,"title":"2027 生涯解谜日历","subtitle":"福建幼儿师范高等专科学校 社团生涯教育","month_theme":{"1":"看","2":"见","3":"自","4":"澄","5":"清","6":"价","7":"探","8":"索","9":"世","10":"走","11":"出","12":"一"},"meta":{"scope":"Q2","scope_label":"Q2（4—7 月）"},"days":[{"date":"2027-04-01","month":4,"day":1,"weekday":"四","level":"L4","type":"生活趣味","tag":"愚人节｜L4 生活趣味","review":false,"carry":"","question":"有一种东西，你说出来它就没有了。不是秘密，也不是谎话——是什么？","answer":"**沉默**。（说出来，沉默就结束了。）","hint_raw":"","record":"今天笑过一次吗，因为什么。","migrate":"","out_char":"","hints":[],"code":"澄"},{"date":"2027-04-02","month":4,"day":2,"weekday":"五","level":"L2","type":"完整题","tag":"世界提高自闭症意识日｜L2 完整题：找不同","review":false,"carry":"3 月 31 日你把第一季度的句子连起来读过一遍。今天把目光移到另一个人身上：当一个孩子的表达方式和你不一样，你会把它读成「不听话」，还是读成「过载了」？","question":"活动室要切换环节，音响刚起，4 岁的明明突然蹲下、捂住耳朵、开始尖叫。下面是两位老师的现场处理，请找出 **3 处专业差异**，并回答：哪一段会让崩溃持续更久？\n\n  - 甲：「明明，站起来！不许叫！大家都在看你呢，再这样老师不喜欢你了。」（走过去拉他的手臂，把他拉起来）\n  - 乙：（先关掉音响，蹲到与他同高，先不说话，把他带到角落软垫旁，等他呼吸变慢）「先在这里。五分钟后，画画。」","answer":"三处差异——① **刺激量**：甲增加了三种刺激（大声、围观、身体拉扯），乙先把声音关掉、把围观撤掉、不碰他；② **语言量**：甲是长句＋否定＋情感威胁（三个信息同时进入），乙是短句＋具体下一步（一条信息）；③ **时间感**：甲要求「立刻停止」，乙给出「五分钟」这个可预期的等待。\n  让崩溃更久的是**甲**：自闭症谱系孩子的崩溃通常是**感觉过载**而不是挑衅，此时每多一种刺激（尤其是身体接触与围观），过载就再叠一层；「不许叫」也在要求他做当下做不到的事。\n  专业要点：**先降刺激，再降语言，最后才谈规则**。这三步的顺序不能调——先讲道理，孩子听觉通道已经关了，讲的全是噪音。","hint_raw":"① 数一数甲这段话里有几种「声音」同时在响　② 有一段在减少信息，有一段在增加信息　③ 见答案，再想：为什么身体接触可能是加刺激而不是安抚","record":"有人情绪崩掉时，我的第一反应是「讲道理」还是「先把环境关小声」","migrate":"把场景换成你专业里最常见的「过载」（组员被任务压住、用户在报错里慌、老人在嘈杂环境里听不清），写出你先要关掉的那一个「音响」。","out_char":"","position":"融合教育教师／行为干预师","hints":["数一数甲这段话里有几种「声音」同时在响","有一段在减少信息，有一段在增加信息","见答案，再想：为什么身体接触可能是加刺激而不是安抚"],"code":"澄"},{"date":"2027-04-03","month":4,"day":3,"weekday":"六","level":"L1","type":"排序题","tag":"清明假期｜排序题","review":false,"carry":"昨天看了「不一样的人」，今天排一次「有人来找我说心里话」。","question":"同学跟你说「这事我不知道跟谁说」，五个动作请排序：A 先问「你现在最难受的是哪一点」B 说「我听着，你慢慢说」C 问「你希望我帮你出主意，还是就听你说」D 听完复述一遍你听到的 E 如果你接不住，明确说「我陪你去找老师」。","answer":"参考 B→A→C→D→E。B 在最前，因为开口的人先需要的是「被允许说」；C 排第三是关键分水岭——先问清对方要建议还是要倾听，能避免九成的「好心办坏事」；E 不是失败，是负责：接不住还硬接，两个人都会更糟。","hint_raw":"① 有一句话只是让对方知道「你可以说」。② 有一个动作决定你后面要不要给建议。③ 见答案，注意 C 为什么排在给建议之前。","record":"上次有人来找我说心事，我是先听了，还是先给主意了。","migrate":"","out_char":"","hints":["有一句话只是让对方知道「你可以说」","有一个动作决定你后面要不要给建议","见答案，注意 C 为什么排在给建议之前"],"code":"澄"},{"date":"2027-04-04","month":4,"day":4,"weekday":"日","level":"L1","type":"填字格","tag":"清明假期｜填字格","review":false,"carry":"昨天学会了先问「要听还是要建议」，今天把「怎么回话」填成四格。","question":"横填四格，每格两字：① 对方说完，先___（重复／评价／纠正）他的关键词 ② 不确定时问___（一句／闭口／多点） ③ 不评价对错，只说___（我听到／你应该／这不对） ④ 结束时给一个___（下一步／道理／结论）。","answer":"参考：重复／一句／我听到／下一步。第 1 格是全部技巧里最有效的：把对方的关键词重复回去，对方会觉得被听见，话会自己往下走。第 4 格给「下一步」而不是「道理」——道理他早就懂。","hint_raw":"① 第 1 格不需要你说新的话。② 第 3 格只能用「我」开头。③ 见答案，注意第 4 格为什么不要讲道理。","record":"我上一次安慰人，说的是道理还是下一步。","migrate":"","out_char":"","hints":["第 1 格不需要你说新的话","第 3 格只能用「我」开头","见答案，注意第 4 格为什么不要讲道理"],"code":"澄"},{"date":"2027-04-05","month":4,"day":5,"weekday":"一","level":"L1","type":"九宫格","tag":"清明｜九宫格","review":false,"carry":"假期最后一天，主题转到「我在别人眼里是谁」。","question":"中心格写「别人找我，通常是为了什么」。八格填八个真实答案，例如：借笔记、听我吐槽、问我怎么报名、让我帮忙改东西、找我一起吃饭、问我老师的事、找我做表格、没什么人找我。","answer":"无标准答案。填完看两件事：① 八格里属于「我能做的事」有几格，属于「我在场就好」有几格——后者说明你在关系里的价值不是功能性的，这种关系更耐久；② 如果出现「没什么人找我」，不必改，把它当作一个信息：你现在的圈子还不够大，这是环境问题不是人的问题。","hint_raw":"① 按真实情况填，不要填理想状态。② 分清「被需要做事」和「被需要在场」。③ 见答案，注意最后一格出现时该怎么理解。","record":"我最希望别人因为什么来找我。","migrate":"","out_char":"","hints":["按真实情况填，不要填理想状态","分清「被需要做事」和「被需要在场」","见答案，注意最后一格出现时该怎么理解"],"code":"澄"},{"date":"2027-04-06","month":4,"day":6,"weekday":"二","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天看清了「被找的理由」，今天在一段自我介绍里找词。","question":"下面这段自我介绍藏着三个词，找出来，并指出哪一个最该删掉：\n  「大家好，我是学前教育专业的，平时喜欢听歌、看剧、拍拍照，性格比较随和，跟谁都能聊两句，没有什么特别的特长，希望以后多多关照。」","answer":"三个词：平时喜欢（泛）、比较随和（模糊）、没有特别的特长（自我否定）。最该删的是「没有特别的特长」——它在你还没被了解之前先替对方下了结论。改法：把「没有特长」换成一件具体做过的事（带过一场活动、做过一个手工、拍过一支视频）。","hint_raw":"① 有一个词是提前认输。② 「跟谁都能聊两句」其实是可以用的能力，只是说得太轻。③ 见答案，试着把「没有特长」那句换成一件具体的事。","record":"我那句「我没什么特别的」，可以换成哪件事。","migrate":"","out_char":"","hints":["有一个词是提前认输","「跟谁都能聊两句」其实是可以用的能力，只是说得太轻","见答案，试着把「没有特长」那句换成一件具体的事"],"code":"澄"},{"date":"2027-04-07","month":4,"day":7,"weekday":"三","level":"L1","type":"填字格","tag":"世界卫生日｜填字格","review":false,"carry":"昨天删了自我否定，今天填「怎么照顾自己」的四个格。","question":"横填四格，每格两字：① 睡不够时先___（补觉／硬撑／喝咖啡） ② 一天里要有一段不看___（手机／书／人） ③ 心里堵的时候先___（说出来／想清楚／忍着） ④ 撑不住的时候允许自己___（停一天／再撑撑／装作没事）。","answer":"参考：补觉／手机／说出来／停一天。第 4 格是这四格里唯一需要练习的：多数人允许自己「再撑撑」，把停一天当成失败。实际上停一天是把后面七天保住。","hint_raw":"① 第 1 格的答案是唯一真正有效的补救。② 第 4 格要填「允许」。③ 见答案，想想自己上一次主动停一天是什么时候。","record":"我这学期有没有主动停过一天。","migrate":"","out_char":"","hints":["第 1 格的答案是唯一真正有效的补救","第 4 格要填「允许」","见答案，想想自己上一次主动停一天是什么时候"],"code":"澄"},{"date":"2027-04-08","month":4,"day":8,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天学了照顾自己，今天看两种「关心」。","question":"下面是同一个人收到的两段话，找三处不同，并指出哪一段更可能真的帮到人：\n  A「别想太多，你已经很棒了，加油！」\n  B「你昨天说睡不着，是那件事一直没解决吗？要不要今晚先不弄它，明天我陪你去问老师。」","answer":"三处不同：① A 评价情绪（别想太多），B 承认事实（你昨天说睡不着）；② A 给的是态度，B 给的是具体下一步；③ A 没有记住任何细节，B 记得「昨天」「那件事」。更可能帮到人的是 B——它证明「有人在认真听」。","hint_raw":"① 哪一段里有具体的「昨天」。② 有一段的结尾是「加油」，另一段的结尾是一个人和一个动作。③ 见答案，B 的价值不在安慰，在证明被听见。","record":"我安慰人时，记得住对方上次说的细节吗。","migrate":"","out_char":"","hints":["哪一段里有具体的「昨天」","有一段的结尾是「加油」，另一段的结尾是一个人和一个动作","见答案，B 的价值不在安慰，在证明被听见"],"code":"澄"},{"date":"2027-04-09","month":4,"day":9,"weekday":"五","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天看懂了「记住细节」的力量，今天在一段抱怨里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是可以马上改的：\n  「我们组每次都是我在做，他们都在划水。我也不好意思说，说了怕关系搞僵。反正最后都是我熬夜，也没人知道我做了多少。」","answer":"三个词：每次（绝对化）、不好意思说（回避）、没人知道（无记录）。可以马上改的是「没人知道」——不需要指责别人，只需要让分工留痕：群里发一句「我这部分做完了，剩下两块谁接」。留痕不伤人，还能让贡献可见。","hint_raw":"① 有一个词让问题看起来永远无解。② 最容易改的那一个，跟「说出口」无关。③ 见答案，注意「留痕」为什么比「沟通」更容易做到。","record":"我做过但没人知道的事，有几件可以留痕。","migrate":"","out_char":"","hints":["有一个词让问题看起来永远无解","最容易改的那一个，跟「说出口」无关","见答案，注意「留痕」为什么比「沟通」更容易做到"],"code":"澄"},{"date":"2027-04-10","month":4,"day":10,"weekday":"六","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天学了留痕，今天把「分工怎么说」填成四格。","question":"横填四格，每格两字：① 开头说___（我做／我们／你们）哪一块 ② 说出___（时间／难度／心情）点 ③ 请对方___（认领／随便／看着办）一块 ④ 结束留一句___（留痕／感谢／下次）。","answer":"参考：我做／时间／认领／留痕。第 3 格的关键是「认领」而不是「分配」：让对方自己选一块，比指派更容易被接受。第 2 格给时间点（我周三前交第一部分），比说「我尽量」有效十倍。","hint_raw":"① 第 1 格用「我」开头，避免变成指责。② 第 3 格要留出让对方选的余地。③ 见答案，注意第 2 格为什么必须是时间。","record":"我下次分组，第一句话准备怎么说。","migrate":"","out_char":"","hints":["第 1 格用「我」开头，避免变成指责","第 3 格要留出让对方选的余地","见答案，注意第 2 格为什么必须是时间"],"code":"澄"},{"date":"2027-04-11","month":4,"day":11,"weekday":"日","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"分组的事说清了，今天看「我到底擅长什么」——这一格最难填。","question":"中心格写「我做事时比同龄人顺一点的地方」。八格填证据（不是形容词）：例如「做表格别人要问三次，我一次就懂」「小朋友愿意跟我说话」「我能把复杂的事讲成一句话」「手比较稳」。","answer":"无标准答案。判定标准只有一条：每格必须是一件**可以被别人看见的事**，不能是「细心」「有耐心」这类形容词。填不满八格是正常的，能填三格并且有证据，就已经比多数人清楚。","hint_raw":"① 形容词不算，写事。② 可以从「别人夸过我什么」倒推。③ 见答案，三格有证据，比八格空话有用。","record":"我的这三格证据，能不能在一个场合里用上。","migrate":"","out_char":"","hints":["形容词不算，写事","可以从「别人夸过我什么」倒推","见答案，三格有证据，比八格空话有用"],"code":"澄"},{"date":"2027-04-12","month":4,"day":12,"weekday":"一","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天找了证据，今天看两种「试试看」。","question":"下面是两个人在同一个社团一学期后的说法，找三处不同，并指出哪一种更有积累：\n  A「这学期什么都试了一下：写推文、做海报、带活动、拍照，都做过，但都不太会。」\n  B「这学期主要做海报，从套模板做到自己排，最后一次活动我排的版没被改。」","answer":"三处不同：① A 是横向平铺，B 是纵向加深；② A 的成果是「做过」，B 的成果是「没被改」；③ A 没有可展示物，B 有一份可以拿出来的东西。更有积累的是 B——「做过」不产生能力，「做到不用改」才产生能力。","hint_raw":"① 有一份说法里有「没被改」。② 广度和深度在一年内的价值不同。③ 见答案，注意 A 里其实也有价值：它帮你排除了不喜欢的方向。","record":"我这学期做的事，有哪一件是「做到不用改」的。","migrate":"","out_char":"","hints":["有一份说法里有「没被改」","广度和深度在一年内的价值不同","见答案，注意 A 里其实也有价值：它帮你排除了不喜欢的方向"],"code":"澄"},{"date":"2027-04-13","month":4,"day":13,"weekday":"二","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天决定要往深里做一件，今天填「怎么往深里做」。","question":"横填四格，每格两字：① 选___（一件／三件／都）事做深 ② 找一个___（标准／老师／同伴）判断好坏 ③ 每次只改___（一处／全部／随便） ④ 留下___（过程／结果／照片）。","answer":"参考：一件／标准／一处／过程。第 2 格是最容易被跳过的一格：没有标准，加深就变成重复。标准可以是「老师没改」「浏览量过百」「对方一次就看懂」。第 4 格留过程，因为三个月后你会忘记自己是怎么做到的。","hint_raw":"① 第 1 格必须是一个数字。② 第 2 格要能判断「好」。③ 见答案，注意第 4 格为什么留过程而不是结果。","record":"我这件要做深的事，好坏的标准是什么。","migrate":"","out_char":"","hints":["第 1 格必须是一个数字","第 2 格要能判断「好」","见答案，注意第 4 格为什么留过程而不是结果"],"code":"澄"},{"date":"2027-04-14","month":4,"day":14,"weekday":"三","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"标准有了，今天破三句「别人夸我」。","question":"请破译下面三句夸奖真实的意思，并指出哪一句最值得继续做：\n  A「你人真好。」\n  B「你刚才那句话，把我没想明白的地方说清楚了。」\n  C「你以后肯定很吃香。」","answer":"A 夸的是顺从（好人常在帮别人方便）；B 夸的是能力，且指出了具体的动作和效果；C 是祝福，不含信息，也不含评价。最值得继续做的是 B 指向的那类事——把复杂说清楚，是可被反复使用的能力。","hint_raw":"① 有一句夸奖里出现了「你刚才」和「哪句话」。② 不含信息的好话，不能用来判断自己。③ 见答案，回头想想自己被夸时，记下来的是哪一类。","record":"我记得最久的一句夸奖，具体是什么内容。","migrate":"","out_char":"","hints":["有一句夸奖里出现了「你刚才」和「哪句话」","不含信息的好话，不能用来判断自己","见答案，回头想想自己被夸时，记下来的是哪一类"],"code":"澄"},{"date":"2027-04-15","month":4,"day":15,"weekday":"四","level":"L3","type":"专业日","tag":"世界艺术日｜L3 专业日：艺术教育","review":false,"carry":"4 月的关键词是「澄清」。今天澄清一件很日常的事：**夸孩子，和看见孩子，不是同一件事**。","question":"一幅 4 岁幼儿的画《我和妈妈》：妈妈被画得比房子还高，手里拿着一朵很大的红花。下面是两位老师的评语，请找出 **3 处不同**，并回答：哪一份会让孩子下次还想画？\n\n  - 左（常规鼓励版）：「画得真好！颜色真漂亮，你真是小画家，比上次进步多了！」\n  - 右（艺术教育版）：「我看到你把妈妈画得比房子还高，手里还拿着一朵很大的红花——能告诉我她在做什么吗？」","answer":"三处不同——① **判断 vs 描述**：左边下结论（真好、真漂亮），右边描述看见的事实（比房子高、拿红花）；② **笼统 vs 具体**：左边夸的是「你这个人」，右边指的是「画里的这一处」；③ **封口 vs 开口**：左边以句号结束，右边用问句把解释权还给作者。让孩子想再画的是**右边**：左边夸得越满，孩子越会把「画画」和「被表扬」绑在一起，一旦没人夸就不画了；右边让他知道**有人真的在看他的画**，而且他还有话可说。","hint_raw":"①看两句话的落点：一句落在人身上，一句落在画上　②注意最后那个标点　③见答案，再想：被夸「你真棒」时，你知道自己哪里棒吗","record":"我被夸过很多次，哪一次真的让我想继续做下去","migrate":"把一句你常说的表扬（对同学、对弟弟妹妹、对队友）改成「描述你看见的」＋「一个问句」，写下来对比一次。","out_char":"","college":"艺术教育学院","profession":"艺术教育","hints":["看两句话的落点：一句落在人身上，一句落在画上","注意最后那个标点","见答案，再想：被夸「你真棒」时，你知道自己哪里棒吗"],"code":"澄"},{"date":"2027-04-16","month":4,"day":16,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"专业日之后回到自己，今天填「我怎么看别人的专业」。","question":"横填四格，每格两字：① 听到陌生专业，先问___（做什么／好不好／难不难） ② 判断一个专业，看它的___（日常／名字／传闻） ③ 不评价优劣，只问___（合不合／值不值／强不强） ④ 对比时先看___（自己／别人／排名）。","answer":"参考：做什么／日常／合不合／自己。第 2 格是全册的核心方法：专业之间的差别不在名称，在日常——每天几点起、对谁说话、一个人做还是一群人做、做完有没有人验收。第 3 格把「好不好」换成「合不合」，评价就变成了匹配问题。","hint_raw":"① 第 1 格问的是内容而不是评价。② 「日常」包含四件事：时间、对象、方式、验收。③ 见答案，用这四个字去问一个你不了解的专业。","record":"我用「日常四问」去问过一个别的专业的人吗。","migrate":"","out_char":"","hints":["第 1 格问的是内容而不是评价","「日常」包含四件事：时间、对象、方式、验收","见答案，用这四个字去问一个你不了解的专业"],"code":"澄"},{"date":"2027-04-17","month":4,"day":17,"weekday":"六","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"学会了问日常，今天走一条「我要不要转方向」的路。","question":"你发现自己对现在学的东西没那么有劲，四个岔口，每岔只有一条能少走弯路：岔口一 立刻换方向／先把这学期读完；岔口二 凭感觉判断／找三个人问他们的真实一天；岔口三 全面推倒／留下能带走的部分；岔口四 只跟同龄人聊／也找一个已经工作的人聊。","answer":"参考路径：先把这学期读完→找三个人问他们的真实一天→留下能带走的部分→也找一个已经工作的人聊。第二格是关键：感觉通常来自「累」，不来自「不合适」，必须用别人的真实一天来校准。第三格：换方向不等于全部作废，通用能力（写、说、组织、审美）都能带走。","hint_raw":"① 有一个岔口会让你在没有信息时做决定。② 同龄人的信息量通常小于工作三年的人。③ 见答案，注意第三格为什么不是「全面推倒」。","record":"我对现在学的东西没劲，是因为累，还是因为不合适。","migrate":"","out_char":"","hints":["有一个岔口会让你在没有信息时做决定","同龄人的信息量通常小于工作三年的人","见答案，注意第三格为什么不是「全面推倒」"],"code":"澄"},{"date":"2027-04-18","month":4,"day":18,"weekday":"日","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天校准了方向，今天看「我这一天到底怎么过的」。","question":"中心格写「我昨天的一天」。八格按时间填：几点起、上午做什么、中午和谁吃、下午做什么、最花时间的一件事、最轻松的一刻、最烦的一刻、几点睡。","answer":"无标准答案。填完后找两个数：① 一天里「自己选的事」有几格，② 一天里「和人打交道」有几格。第一个数过低会让人疲惫且说不清原因；第二个数过低说明你的信息主要来自手机。","hint_raw":"① 按真实情况填，不要按理想作息填。② 「最轻松的一刻」往往暴露你真正喜欢什么。③ 见答案，注意两个数各自的意义。","record":"我一天里最轻松的一刻，通常出现在做什么的时候。","migrate":"","out_char":"","hints":["按真实情况填，不要按理想作息填","「最轻松的一刻」往往暴露你真正喜欢什么","见答案，注意两个数各自的意义"],"code":"澄"},{"date":"2027-04-19","month":4,"day":19,"weekday":"一","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天看到了自己的一天，今天破三句「等忙完这阵」。","question":"请破译下面三句话，并指出哪一句的人最可能真的做成事：\n  A「等这学期忙完，我就开始准备考证。」\n  B「这学期忙，我每周只花两小时准备考证，进度慢但不断。」\n  C「考证的事明年再说吧，先把该做的做完。」","answer":"A 把开始时间交给一个永远不会到来的「忙完」；B 承认忙，同时给出一个不可再压缩的最小投入（每周两小时）；C 是诚实的延期。最可能做成的是 B——它不依赖状态，只依赖排期。","hint_raw":"① 有一句话里既有「忙」也有一个具体数字。② 「忙完这阵」通常不会发生。③ 见答案，把 A 改写成 B 的样子：每周几个小时。","record":"我那句「等忙完」，可以改成每周几小时。","migrate":"","out_char":"","hints":["有一句话里既有「忙」也有一个具体数字","「忙完这阵」通常不会发生","见答案，把 A 改写成 B 的样子：每周几个小时"],"code":"澄"},{"date":"2027-04-20","month":4,"day":20,"weekday":"二","level":"L1","type":"找不同","tag":"谷雨｜找不同","review":false,"carry":"谷雨，四月最后一个节气，今天看两种「播种」。","question":"同一个人前后两个学期的两段自述，找三处不同，并指出哪一段更像在积累：\n  A「上个学期我报了很多活动，生怕错过。」\n  B「这个学期我只留了两个：一个我做得下去的，一个我必须做的。剩下的都推了。」","answer":"三处不同：① A 的动作是「报」，B 的动作是「推」；② A 怕错过，B 怕分散；③ A 没有标准，B 有两条筛选标准（做得下去／必须做）。更像在积累的是 B——会拒绝的人才有余量把事做完。","hint_raw":"① 注意「推了」这两个字。② 广撒网的代价不是时间，是注意力。③ 见答案，想想自己这个学期推掉过什么。","record":"我这学期该推掉却没推的一件事是什么。","migrate":"","out_char":"","hints":["注意「推了」这两个字","广撒网的代价不是时间，是注意力","见答案，想想自己这个学期推掉过什么"],"code":"澄"},{"date":"2027-04-21","month":4,"day":21,"weekday":"三","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"学会了推掉，今天排一次「拒绝」的四个顺序。","question":"有人请你帮一个你其实做不了的忙，五个动作请排序：A 先说「我这次做不了」 B 说清楚原因（不是「我不行」，是「我这周在赶什么」） C 给一个替代方案（找谁／换个时间） D 不解释太多 E 说完就不再反复道歉。","answer":"参考 A→B→C→D→E。A 最前：拒绝要先给结论，不要先铺陈理由，否则对方会一路听下去并且继续劝；B 给的是具体原因，具体原因让人信；C 有替代方案时，拒绝就从「关门」变成「指路」；D 与 E 是收尾纪律：一个理由说一遍，道歉说一次。","hint_raw":"① 结论先于理由。② 有一个动作能把拒绝变成帮忙。③ 见答案，注意 D 为什么要求「不解释太多」。","record":"我上次拒绝人，说了几个理由。","migrate":"","out_char":"","hints":["结论先于理由","有一个动作能把拒绝变成帮忙","见答案，注意 D 为什么要求「不解释太多」"],"code":"澄"},{"date":"2027-04-22","month":4,"day":22,"weekday":"四","level":"L3","type":"专业日","tag":"世界地球日｜L3 专业日：小学科学教育","review":false,"carry":"昨天你练的是「看见细节」，今天练「问对问题」——**能被验证的问题，才叫科学问题**。","question":"五个孩子的问题，五种探究方式（每种只用一次）。请连线，并标出**哪一个问题一节课给不出答案**。\n\n  - 问题：① 树叶为什么秋天会变色　② 蚯蚓多的地方土是不是更松　③ 哪种纸最吸水　④ 校园里哪棵树最先发芽　⑤ 为什么雨后蜗牛特别多\n  - 方式：A 控制变量实验（同样面积、同时滴水、计时）　B 取样测量（取土测硬度与孔隙）　C 长期定点观察记录　D 资料查证＋实物对比　E 资料查证＋多因素观察","answer":"①—D（查叶绿素分解的资料，同时对比不同树种的真实叶片）；②—B（要「松不松」，必须有测量数据，不能凭手感）；③—A（唯一能在一节课内做完、且能重复的）；④—C（发芽是时间事件，只能等，无法加速）；⑤—E（雨后湿度、气压、蜗牛习性多因素叠加，**一节课给不出答案**，只能提出问题、留下观察任务）。**一节课给不出答案的是⑤**——而这一条恰恰是最该教的：科学教育里，「这个问题现在答不了，我们怎么设计一个能慢慢答的办法」比答案本身重要。凡是不可测量、不可重复的，都不能进实验。","hint_raw":"①先问「这个问题要多久才能有答案」　②有一个问题连「怎么测」都还没想清楚　③见答案，特别注意⑤为什么不能硬答","record":"我最近问过的一个问题，是能验证的，还是只能讨论的","migrate":"把你这学期的三个疑问分类：能一周内验证的、要长期观察的、目前无法验证的。各写一个。","out_char":"","college":"人文科学学院","profession":"小学科学教育","hints":["先问「这个问题要多久才能有答案」","有一个问题连「怎么测」都还没想清楚","见答案，特别注意⑤为什么不能硬答"],"code":"澄"},{"date":"2027-04-23","month":4,"day":23,"weekday":"五","level":"L3","type":"专业日","tag":"世界读书日／联合国英语日｜L3 专业日：小学英语教育","review":false,"carry":"昨天你在给问题分类，今天破译一件更细的东西：**同一句话，语气不同，孩子听到的内容就不同**。","question":"同一句英文 \"Sit down, please.\" 出现在三个场景。请破译每个场景里「孩子实际接收到的是什么」，并指出**哪一句最容易被孩子听成「我被批评了」**。\n\n  - A 课中过渡：老师一边走动收教具，一边轻声说，配合一个手掌向下压的手势\n  - B 个别孩子跑动时：老师突然停下、提高音量、皱眉，看着那个孩子说\n  - C 集体活动前常规提示：老师笑着，先拍手两下，再对全班说","answer":"A 孩子接收到的是「**我们该换了**」——注意力在动作上，不在自己被评价上；B 孩子接收到的是「**我做错事了**」——音量、表情、点名三者叠加，句子的字面意思被完全盖住；C 孩子接收到的是「**要开始下一件事了**」——先拍手建立了共同注意，句子变成信号的一部分。最容易被听成批评的是 **B**。对幼儿说英语，**语气和体态先于词汇被接收**：他们可能还不认识 \"sit down\"，但一定读得懂皱眉和音量。所以小学与幼儿英语教师的专业动作是「把指令放进固定的动作与语调里」，而不是「把词说得更清楚」。","hint_raw":"①注意每一句前面都有一个小动作，它才是真正的信息　②有一句同时用了音量、表情和点名　③见答案，再想：孩子听不懂词，为什么还能「听懂」你","record":"我说的话被别人听成「批评」时，问题出在词，还是出在语气","migrate":"写一句你常说的话（提醒同学交作业、催室友、跟组员分工），用三种语气说出来，标出哪一句最容易被听成指责。","out_char":"","college":"外语教育学院","profession":"小学英语教育","hints":["注意每一句前面都有一个小动作，它才是真正的信息","有一句同时用了音量、表情和点名","见答案，再想：孩子听不懂词，为什么还能「听懂」你"],"code":"澄"},{"date":"2027-04-24","month":4,"day":24,"weekday":"六","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"两个专业日看完，今天回到自己：我看得懂什么。","question":"中心格写「我最近真正读进去的东西」。八格填：是什么、什么时候读的、为什么读下去、读的时候想到谁、有没有记下来、能不能讲给别人听、讲了别人听懂了吗、下一次还想读什么。","answer":"无标准答案。核心看第 6、7 格：能讲给别人听并且别人听懂，才算真的读进去；读了但讲不出，多半只是看过。","hint_raw":"① 第 7 格是验收标准。② 「读进去」不等于「读完」。③ 见答案，如果第 6 格填不出，找一段话试着讲给一个人听。","record":"我最近一次把读到的东西讲给别人听，是什么时候。","migrate":"","out_char":"","hints":["第 7 格是验收标准","「读进去」不等于「读完」","见答案，如果第 6 格填不出，找一段话试着讲给一个人听"],"code":"澄"},{"date":"2027-04-25","month":4,"day":25,"weekday":"日","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天确认了「讲得出才算懂」，今天走一条「我怎么准备一场讲」的路。","question":"你要在三分钟里讲清楚一件事，四个岔口，每岔只有一条能让人听懂：岔口一 先讲背景／先给结论；岔口二 讲三个要点／讲六个要点；岔口三 用术语显得专业／用例子替代术语；岔口四 结尾总结／结尾给一个动作。","answer":"参考路径：先给结论→讲三个要点→用例子替代术语→结尾给一个动作。第一格是这道题的答案核心：听的人耐心只有三十秒，结论先给，人就会继续听。第三格不是降低水平，是检验你真的懂：能举出例子，说明你掌握了。","hint_raw":"① 有一个岔口决定对方要不要继续听。② 三个要点是人的短时记忆上限附近。③ 见答案，注意第四格为什么给动作而不是总结。","record":"我上一次讲事情，第一句说的是背景还是结论。","migrate":"","out_char":"","hints":["有一个岔口决定对方要不要继续听","三个要点是人的短时记忆上限附近","见答案，注意第四格为什么给动作而不是总结"],"code":"澄"},{"date":"2027-04-26","month":4,"day":26,"weekday":"一","level":"L1","type":"密文破译","tag":"世界知识产权日｜密文破译","review":false,"carry":"讲清楚了，今天破三句「这是我想的」。","question":"请破译下面三句话里，谁的成果最站得住，并说明理由：\n  A「这个点子是我最先想到的，我们都想到了，只是我先说。」\n  B「这个活动方案是我写的，群里还有我三版的过程稿。」\n  C「这是我们组一起做的，谁做得多说不清。」","answer":"最站得住的是 B——它有过程留痕（三版过程稿），能证明贡献。A 只有时间先后，无法证明；C 是「说不清」，在需要署名、评奖、写简历时最吃亏。结论：能被证明的贡献才叫成果。","hint_raw":"① 有一句话里有「过程稿」。② 想到不算，做出并留下证据才算。③ 见答案，回头看自己的文件，有没有版本。","record":"我做的东西，有没有留下能证明是我做的痕迹。","migrate":"","out_char":"","hints":["有一句话里有「过程稿」","想到不算，做出并留下证据才算","见答案，回头看自己的文件，有没有版本"],"code":"澄"},{"date":"2027-04-27","month":4,"day":27,"weekday":"二","level":"L3","type":"专业日","tag":"L3 专业日：艺术设计","review":false,"carry":"前面几天你在看别人的作品，今天轮到你排一次：**观众的眼睛，是按设计走的，不是乱看的**。","question":"为「校园开放日」做一张 A3 海报。中心格固定为「信息」。请把剩下八格填满，并在格上标出**观众第一眼看哪一格、最后一格看什么**，再用一句话说明你的判断依据。\n\n  八格备选：主标题／主视觉（照片或插画）／网格（栏宽与对齐线）／留白／字级层次（大字到小字）／色彩（主色与强调色）／落款单位／二维码（报名或地图）","answer":"九宫格排布不唯一，但**视线动线唯一**：主视觉 → 主标题 → 字级层次里的次级信息（时间／地点）→ 二维码 → 落款单位。\n  - 第一眼是**主视觉**，因为人眼先接图像再接文字；最后一格看的是**落款单位与二维码**（观众决定「要不要去」时才回去找主办方和入口）。\n  - **判断依据**：主视觉负责「让人停下」，主标题负责「让他知道这是什么」，字级层次负责「让他找到关键条件」，二维码负责「让他能立刻行动」。网格、留白、色彩是**看不见的骨架**，它们不进动线，但它们错了动线就断（留白不足会让人不想读，字级层次不清会让人找不到时间地点）。\n  - **失败判据**：如果主视觉太抢、把主标题压成配角，观众会停在「好看」而不进入「我要不要去」；如果二维码放在最角落又没有提示语，动线在最后一步断掉。","hint_raw":"①先决定「第一眼看到什么」，其他格围着它排　②有一格是观众「决定行动」时才去找的，它不该在第一眼争抢　③见答案，然后自查：你的海报上，时间地点能在三秒内被找到吗","record":"我看一张海报时，眼睛最先落在哪里；那是不是设计者想让我看的","migrate":"把你这周要交的任何一份材料（课件、简历、活动通知）当成一张海报，回答：别人第一眼看到的是什么，我希望他看到的是什么，差在哪里。","out_char":"","college":"艺术教育学院","profession":"艺术设计","hints":["先决定「第一眼看到什么」，其他格围着它排","有一格是观众「决定行动」时才去找的，它不该在第一眼争抢","见答案，然后自查：你的海报上，时间地点能在三秒内被找到吗"],"code":"澄"},{"date":"2027-04-28","month":4,"day":28,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天看了「什么叫可以交付」，今天连「四种活该用什么标准验收」。","question":"左边四种产出，右边四种验收标准，请连线：① 一份海报 ② 一场活动 ③ 一份表格 ④ 一段视频 —— A 对方一次看懂、不需要解释 B 现场没有停下来等人 C 别人能接着改，不问你 D 前五秒有人愿意继续看。","answer":"参考 ①—A、②—B、③—C、④—D。①—A 是最常见的误区：海报不是给自己看的，评价标准是「陌生人能不能一次看懂」。③—C 是工作场合最看重的一条：文件能被别人接手，等于你会协作。","hint_raw":"① 有一项的标准是「前五秒」。② 表格的标准跟「别人接手」有关。③ 见答案，用这四条去检查自己最近的四件东西。","record":"我最近做的四样东西，各能达到自己的标准吗。","migrate":"","out_char":"","hints":["有一项的标准是「前五秒」","表格的标准跟「别人接手」有关","见答案，用这四条去检查自己最近的四件东西"],"code":"澄"},{"date":"2027-04-29","month":4,"day":29,"weekday":"四","level":"L3","type":"专业日","tag":"国际舞蹈日｜L3 专业日：舞蹈表演","review":false,"carry":"昨天你排的是眼睛的路线，今天排身体的路线。**舞台上先保证不撞人，再谈好看**。","question":"8 人群舞，从左侧幕入场到台前谢幕，必须依次经过四个点位：暗场定位 → 中区造型 → 台前定格 → 侧幕退场。每一处岔口只有一条路能通向出口且**不与同伴路线交叉**。请走出这条路径，并回答：如果有一处必须让路，让的应该是谁。\n\n  - 岔口一：暗场时站在原地等灯亮／摸黑走到自己的标记点\n  - 岔口二：直线穿过中区／从后区绕行到中区\n  - 岔口三：所有人同时向台前收拢／分左右两批先后向台前收拢\n  - 岔口四：从最近侧幕退场／统一从入场侧侧幕退场","answer":"正确路径 **摸黑走到标记点 → 从后区绕行 → 分左右两批先后收拢 → 统一从入场侧侧幕退场**。\n  - 暗场先定位：灯亮那一刻人已经在位，观众看到的是「出现」而不是「走过去」。站着等灯亮，开场就已经输了一拍。\n  - 穿中区是全场最容易撞的地方：中区是造型区，也是所有路线的交汇口，必须从后区绕行，把中区留给「造型」而不是「通过」。\n  - 台前收拢若同时进行，8 个人在窄区互相抢位；分批收拢等于给彼此留出间距。\n  - 退场统一走入场侧：侧幕两侧都要留给下一组上场的人，退场与上场**共用通道**是最典型的舞台事故来源。\n  - **要让路的是「好看」**：交叉点上，让路的一方永远选「绕后区、多走两步」的那条——安全感距优先于构图完整。","hint_raw":"①有一件事必须在灯亮之前完成　②想清楚哪块区域是「大家都要经过的」　③见答案，并回答：为什么退场通道不能两边都用","record":"我在一群人里做事时，是先抢位置，还是先看别人在哪","migrate":"把一次多人协作（小组展示、合唱、运动会入场、实训操作）画成一张走位图，标出最容易「撞在一起」的那个点。","out_char":"","college":"艺术教育学院","profession":"舞蹈表演","hints":["有一件事必须在灯亮之前完成","想清楚哪块区域是「大家都要经过的」","见答案，并回答：为什么退场通道不能两边都用"],"code":"澄"},{"date":"2027-04-30","month":4,"day":30,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"四月最后一天，把「澄」收一件事：排一次「清空」。","question":"月底整理，五个动作请排序：A 把这月所有待办列出来 B 标出已经不做也不会怎样的 C 把剩下的按「这周必须」和「以后再说」分开 D 删掉一个明确放弃的 E 给「以后再说」的那批定一个复查日期。","answer":"参考 A→B→C→D→E。B 是四月最该练的动作：认出「不做也没事」的事；D 必须真的删掉一个（不是归档，是从清单移除）；E 是防止「以后再说」变成永远不做也不删的灰色地带。","hint_raw":"① 有一格是「识别可以不做的事」。② 删掉要真的删。③ 见答案，注意 E 为什么要定日期。","record":"四月我放弃的那件事，是哪一个。\n\n---\n\n## 五月｜清楚自己要什么（月字：清）\n\n五月 31 天：L1 25 道；L3 一天（5/20 食品营养与健康）；L2 完整题两天（5/15、5/18）；L2 一问三天（5/8、5/12、5/25）。","migrate":"","out_char":"","hints":["有一格是「识别可以不做的事」","删掉要真的删","见答案，注意 E 为什么要定日期"],"code":"澄"},{"date":"2027-05-01","month":5,"day":1,"weekday":"六","level":"L1","type":"密文破译","tag":"劳动节｜密文破译","review":false,"carry":"五月主题是「清楚自己要什么」。先从「劳动」这个词破起。","question":"请破译下面三句话里说的是什么「劳动」，并指出哪一句最接近你将来的工作状态：\n  A「我今天干了八小时，累。」\n  B「我今天做的事，明天还要再做一遍，一模一样。」\n  C「我今天做的事，别人用上了。」","answer":"A 说的是体力支出，B 说的是重复性劳动，C 说的是有效劳动。最接近将来工作状态的是 B 与 C 的组合：多数工作都含大量重复，区别在于这些重复有没有被人用上。判断一份工作值不值得长做，看 C 的部分占比。","hint_raw":"① 有一句话里有「别人用上了」。② 累不累不是判断标准。③ 见答案，想想你做的事里有多少被谁用上了。","record":"我这周做的事，有哪一件被别人用上了。","migrate":"","out_char":"","hints":["有一句话里有「别人用上了」","累不累不是判断标准","见答案，想想你做的事里有多少被谁用上了"],"code":"清"},{"date":"2027-05-02","month":5,"day":2,"weekday":"日","level":"L1","type":"隐藏词","tag":"劳动节假期｜隐藏词","review":false,"carry":"昨天看「有没有被用上」，今天在一段假期感受里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个最值得注意：\n  「放假三天，第一天补觉，第二天刷手机到凌晨，第三天开始慌，觉得什么都没做，晚上又熬夜把作业补了，假期就过完了。」","answer":"三个词：补觉、刷到凌晨、开始慌。最值得注意是「开始慌」出现的时间点——它在第三天，说明前两天是「无结构」的，身体休息了但脑子没有。解法不是少休息，是给假期一个结构：一天里留一件有产出的事。","hint_raw":"① 注意「慌」出现在第几天。② 问题不在休息，在无结构。③ 见答案，试给下个假期定一件有产出的事。","record":"我上一个假期，有产出的事是什么。","migrate":"","out_char":"","hints":["注意「慌」出现在第几天","问题不在休息，在无结构","见答案，试给下个假期定一件有产出的事"],"code":"清"},{"date":"2027-05-03","month":5,"day":3,"weekday":"一","level":"L1","type":"配对连线","tag":"劳动节假期｜配对连线","review":false,"carry":"假期最后一天，连「四种休息对应什么状态」。","question":"左边四种累，右边四种对症的休息，请连线：① 一直坐着做事，脑子木 ② 一直和人说话，烦 ③ 一直被打断，焦 ④ 一直没做事，空 —— A 一个人待着，不接任何消息 B 出门走一段，让身体动起来 C 做一件完整的小事（从开始到结束） D 定一个只有自己能完成的短任务。","answer":"参考 ①—B、②—A、③—C、④—D。③—C 最反直觉：总被打断的人需要的不是继续躺着，而是做一件从头到尾不被打断的小事，把「完成感」找回来。④—D 同理——空不是因为闲，是因为没有一件事标记了「今天」。","hint_raw":"① 有两种累是「缺完成感」。② 话太多的人需要安静。③ 见答案，对号入座自己现在是哪一种。","record":"我现在是哪一种累，对症的休息是哪一种。","migrate":"","out_char":"","hints":["有两种累是「缺完成感」","话太多的人需要安静","见答案，对号入座自己现在是哪一种"],"code":"清"},{"date":"2027-05-04","month":5,"day":4,"weekday":"二","level":"L1","type":"密文破译","tag":"五四青年节｜密文破译","review":false,"carry":"休息完了，今天破三句「我还年轻」。","question":"请破译下面三句话，并指出哪一句最容易变成拖延的借口：\n  A「我还年轻，可以慢慢来。」\n  B「我还年轻，可以试错几次。」\n  C「我还年轻，所以现在要挑最重要的做。」","answer":"A 最容易变成借口——它把「时间多」当成了「不用选」；B 有边界（试错几次，次数有限），是可用的；C 把年轻当成「优先排序」的理由，最成熟。三句话的差别不在态度，在有没有「数量」或「排序」。","hint_raw":"① 有一句话里隐含了一个次数。② 时间多不等于可以不做决定。③ 见答案，把 A 改写成 C 的样子。","record":"我这学期「慢慢来」的事，是哪一件。","migrate":"","out_char":"","hints":["有一句话里隐含了一个次数","时间多不等于可以不做决定","见答案，把 A 改写成 C 的样子"],"code":"清"},{"date":"2027-05-05","month":5,"day":5,"weekday":"三","level":"L1","type":"排序题","tag":"劳动节假期｜排序题","review":false,"carry":"昨天把「慢慢来」挑了一件出来，今天排一次「从明天开始」。","question":"你想开始做一件拖了很久的事，五个动作请排序：A 把它拆成能一次做完的最小块 B 在日历上定第一个时间 C 告诉一个人你要做这件事 D 做完第一块就记录 E 一个月后回看记录。","answer":"参考 B（或 A）→A→C→D→E。可接受的两种起手：先定时间再拆，或先拆再定时间；但 B 与 A 必须排在最前两位，且必须在同一天完成——只拆不定时间，会变成计划；只定时间不拆，会临场放弃。C 的作用是外部约束，D 的作用是给自己证据，E 是复盘。","hint_raw":"① 前两个动作必须都在第一天做。② 告诉别人不是形式，是约束。③ 见答案，注意 D 为什么「做完就记」而不是月底记。","record":"我明天要做的「第一块」是什么。","migrate":"","out_char":"","hints":["前两个动作必须都在第一天做","告诉别人不是形式，是约束","见答案，注意 D 为什么「做完就记」而不是月底记"],"code":"清"},{"date":"2027-05-06","month":5,"day":6,"weekday":"四","level":"L1","type":"配对连线","tag":"立夏｜配对连线","review":false,"carry":"开始动了，今天连「四种卡住对应什么破法」。","question":"左边四种卡住，右边四种破法，请连线：① 不知道从哪开始 ② 开始了但做不下去 ③ 做完了但不敢给人看 ④ 给人看了被否 —— A 先做最丑的一版，只求走通 B 找一个人问「第一步你会怎么做」 C 问对方「如果只改一处，改哪里」 D 先给一个最不会评价你的人看。","answer":"参考 ①—B、②—A、③—D、④—C。②—A 的要点是「最丑的一版」：做不下去常因为标准太高，先让自己走通一遍。④—C 把「被否」转化成「一次只改一处」，避免全盘推倒。","hint_raw":"① 有一种破法是「故意做丑」。② 被否之后要问的是一个「最」字。③ 见答案，对号入座自己现在卡在哪一格。","record":"我现在卡在第几格，破法是什么。","migrate":"","out_char":"","hints":["有一种破法是「故意做丑」","被否之后要问的是一个「最」字","见答案，对号入座自己现在卡在哪一格"],"code":"清"},{"date":"2027-05-07","month":5,"day":7,"weekday":"五","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天找到了破法，今天填「怎么开口问」。","question":"横填四格，每格两字：① 问人前先___（自己试／等别人／发群里）一次 ② 问题要具体到___（一步／大概／全部） ③ 开口先说___（我试过／我不会／你帮我） ④ 得到答案后___（复述／道谢／走开）一遍。","answer":"参考：自己试／一步／我试过／复述。「我试过 X，卡在 Y」是最高效的问法，它让对方知道你不是伸手党。第 4 格复述一遍，是为了确认自己真的听懂了，也让对方知道你重视他的时间。","hint_raw":"① 第 3 格要包含你做过的尝试。② 第 2 格越具体，回答越快。③ 见答案，把「我不会」改成「我试过 A，卡在 B」。","record":"我上次问人，有没有说清自己试过什么。","migrate":"","out_char":"","hints":["第 3 格要包含你做过的尝试","第 2 格越具体，回答越快","见答案，把「我不会」改成「我试过 A，卡在 B」"],"code":"清"},{"date":"2027-05-08","month":5,"day":8,"weekday":"六","level":"L2","type":"一问","tag":"世界红十字日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：公益组织的钱从哪来、人从哪来。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"清"},{"date":"2027-05-09","month":5,"day":9,"weekday":"日","level":"L1","type":"密文破译","tag":"母亲节｜密文破译","review":false,"carry":"昨天看了「不赚钱的事」，今天破三句家里的话。","question":"请破译下面三句话背后真正在说的事，并指出哪一句最需要被认真回应：\n  A「你最近是不是瘦了？」\n  B「你那个专业以后能干什么？」\n  C「钱够不够用？」","answer":"A 是「我在担心你身体」，B 是「我怕你将来吃亏」，C 是「我想帮你但不知道怎么帮」。最需要认真回应的是 B——它通常带着真实的焦虑，一句「我知道你担心，我现在在准备 X」比「你别管」有效得多。","hint_raw":"① 三句话都不是字面意思。② 有一句里有对未来的担心。③ 见答案，挑一句，给一个具体的回答。","record":"家里最近问我的那句话，我可以怎么答。","migrate":"","out_char":"","hints":["三句话都不是字面意思","有一句里有对未来的担心","见答案，挑一句，给一个具体的回答"],"code":"清"},{"date":"2027-05-10","month":5,"day":10,"weekday":"一","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天想好了回答，今天排一次「和家里人谈我的打算」。","question":"你要跟家里人说一个他们可能不同意的决定，五个动作请排序：A 先说他们最在意的那一点（安全／稳定／钱） B 说你的打算和理由 C 给出一个可验证的时间点（三个月后看结果） D 主动说清最坏情况和你怎么办 E 不在饭桌上、不当着第三个人说。","answer":"参考 E→A→B→C→D。E 是环境：人多或有饭桌压力时，双方都容易说硬话。A 排第二是关键——先说他们在意的，而不是先讲你的理想，对方才会觉得你听进去了。D 主动说最坏情况，是这一场谈话能真正结束的原因。","hint_raw":"① 有一个动作是关于「什么时候说」。② 先说对方在意的，再说你的。③ 见答案，注意 D 为什么必须在 C 之后。","record":"我要说的那个决定，最坏情况是什么。","migrate":"","out_char":"","hints":["有一个动作是关于「什么时候说」","先说对方在意的，再说你的","见答案，注意 D 为什么必须在 C 之后"],"code":"清"},{"date":"2027-05-11","month":5,"day":11,"weekday":"二","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"谈话准备了，今天看「我将来要过什么样的日子」——用具体画面而不是愿望。","question":"中心格写「五年后普通的一个工作日」。八格填：几点起、在哪、和谁一起工作、一天里说得最多的话是什么、做的最多的一件事、下班后做什么、一个月大概挣多少、那天最想避免什么。","answer":"无标准答案。判定要点：最后一格「最想避免什么」比第一格更能定位你要什么——多数人的职业选择其实是在逃避某种状态（被催、被使唤、看不见尽头、一个人干）。把「想避免」和「想要」各写三条，才叫清楚。","hint_raw":"① 写普通的一天，不写高光时刻。② 「最想避免什么」是最真实的一格。③ 见答案，把「想避免」也当成一种要求。","record":"我最想避免的那种工作状态，具体是什么样子。","migrate":"","out_char":"","hints":["写普通的一天，不写高光时刻","「最想避免什么」是最真实的一格","见答案，把「想避免」也当成一种要求"],"code":"清"},{"date":"2027-05-12","month":5,"day":12,"weekday":"三","level":"L2","type":"一问","tag":"国际护士节｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：幼儿园的保健员和医院护士，工作差别在哪。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"清"},{"date":"2027-05-13","month":5,"day":13,"weekday":"四","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天想了「面对具体的人」，今天看两种「帮忙」。","question":"两个人在同一家幼儿园实习一周后的总结，找三处不同，并指出哪一份更像在观察职业：\n  A「小朋友很可爱，老师很辛苦，我学到了很多，也更喜欢这个专业了。」\n  B「我发现主班一天要处理七次冲突，其中五次是抢玩具；副班主要在换衣、喂饭、看睡；园长只出现两次。」\n  A/B 请找出差异并判断。","answer":"三处不同：① A 记录感受，B 记录事实与次数；② A 的对象是「小朋友」，B 的对象是「岗位分工」；③ A 得到的是态度，B 得到的是一个可以判断的信息（这份工作一天在做什么）。更像在观察职业的是 B。","hint_raw":"① 哪一份里有数字。② 观察职业，看的是「谁在做什么」。③ 见答案，下次实习试着记次数。","record":"我上次进园/进校，记住了几个具体的数字。","migrate":"","out_char":"","hints":["哪一份里有数字","观察职业，看的是「谁在做什么」","见答案，下次实习试着记次数"],"code":"清"},{"date":"2027-05-14","month":5,"day":14,"weekday":"五","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"昨天学了记数字，今天在一段实习感受里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个是好消息：\n  「实习第一周，我一直在旁边看，插不上手。第二周老师让我管一组，我慌得不行。第三周我发现我知道下一步该干什么了。」","answer":"三个词：插不上手、慌、知道下一步。好消息是「知道下一步」——它标志着你从「看」进入「做」，而这个转变通常发生在第三周，很多人撑不到第三周就判断自己「不适合」。","hint_raw":"① 有一句话表示的是一种能力的出现。② 「慌」不是坏消息，是进入新阶段的信号。③ 见答案，记住「第三周」这个时间点。","record":"我有没有一件事，是在快要放弃的时候才突然会的。","migrate":"","out_char":"","hints":["有一句话表示的是一种能力的出现","「慌」不是坏消息，是进入新阶段的信号","见答案，记住「第三周」这个时间点"],"code":"清"},{"date":"2027-05-15","month":5,"day":15,"weekday":"六","level":"L2","type":"完整题","tag":"国际家庭日｜L2 完整题：排序题","review":false,"carry":"5 月你在学「说清楚」。今天练一件家教指导最难的事：**把一句抱怨，变成一件可以改的小事**。","question":"一位家长坐下就说：「我孩子就是不听话，说什么都要顶。」你有五个动作，请排序，并回答：为什么不能先给建议？\n\n  - A 追问具体场景：「最近一次是哪个时刻？当时你在做什么、他在做什么？」\n  - B 把「不听话」翻译成可观察的行为：「也就是你喊三遍他才动，一周大概几次？」\n  - C 和孩子核对：「妈妈说那个时候你不想动，你当时是怎么想的？」\n  - D 给出一个解释框架：「他这个年龄在试边界，顶嘴常常是在争一点自主。」\n  - E 只定一个改动：「这周只改一件事——你只喊一遍，喊完走过去，看会发生什么。下周同一时间我们再聊。」","answer":"正确顺序 **A → B → C → D → E**。\n  - A 先把「总是不听话」这种**全局判断**压到一个具体时刻上——全局判断无法改，具体时刻可以改。\n  - B 把形容词换成**可观察、可计数**的行为，这是全流程的转折点：从「他态度不好」到「喊三遍才动，一周四五次」。\n  - C 是很多指导者会跳过的半步：只听家长一面，方案一定落空。\n  - D 的解释必须**放在事实之后**——先给框架，家长会把框架当借口或当判决。\n  - E 一次只改一件事，是因为家庭系统的改动量极小：改三件等于一件都改不成。\n  - **不能先给建议**：一上来给方法，家长会把它当成「你不懂我家孩子」的通用答案；而且没有具体场景，建议只能笼统，笼统的建议一定失败。","hint_raw":"① 有一个动作把「总是」变成了「上一次」　② 有个动作是把形容词换成数字　③ 见答案，再想：为什么一次只改一件事反而更容易成","record":"我评价别人时，用的是形容词，还是具体发生过的事","migrate":"把你自己的一句抱怨（「我组员不配合」「我学不进去」）按 A→B 走一遍，写成一件可以改的小事。","out_char":"","position":"家庭教育指导师","hints":["有一个动作把「总是」变成了「上一次」","有个动作是把形容词换成数字","见答案，再想：为什么一次只改一件事反而更容易成"],"code":"清"},{"date":"2027-05-16","month":5,"day":16,"weekday":"日","level":"L1","type":"填字格","tag":"全国助残日｜填字格","review":false,"carry":"昨天看了「不听话」的处理，今天填「怎么和一个需要帮助的人相处」。","question":"横填四格，每格两字：① 先问___（需要／能不能／为什么）什么帮助 ② 不替他___（决定／说话／考虑） ③ 该说的规则照常说，不___（降低／回避／放宽） ④ 帮忙之后不___（提起／离开／追问）。","answer":"参考：需要／决定／降低／提起。第 2 格是核心：代替决定看起来是照顾，实际是剥夺。第 3 格反常识但重要——为了让对方舒服而降低要求，等于认定他做不到。","hint_raw":"① 第 1 格是问，不是判断。② 第 3 格要求「照常说」。③ 见答案，注意第 4 格为什么是「不提起」。","record":"我有没有替别人做过他其实能自己做的决定。","migrate":"","out_char":"","hints":["第 1 格是问，不是判断","第 3 格要求「照常说」","见答案，注意第 4 格为什么是「不提起」"],"code":"清"},{"date":"2027-05-17","month":5,"day":17,"weekday":"一","level":"L1","type":"九宫格","tag":"世界电信和信息社会日｜九宫格","review":false,"carry":"昨天学了不代替决定，今天看「我每天接收多少信息」。","question":"中心格写「我的一天信息来源」。八格填：早上第一眼看什么、通勤/走路时听什么、课间刷什么、晚上看什么、哪一类信息最多、哪一类最少、哪一条这周真的改变了我的想法、哪一条我其实不需要。","answer":"无标准答案。核心看第 7 格：一周里能改变想法的信息通常不超过三条，其余都是情绪消费。若第 7 格填不出，说明信息摄入量很大但加工量为零。","hint_raw":"① 第 7 格是唯一有产出的格子。② 第 8 格往往占比最大。③ 见答案，试着停掉一条「不需要」的信息源一周。","record":"这周改变我想法的信息，具体是哪一条。","migrate":"","out_char":"","hints":["第 7 格是唯一有产出的格子","第 8 格往往占比最大","见答案，试着停掉一条「不需要」的信息源一周"],"code":"清"},{"date":"2027-05-18","month":5,"day":18,"weekday":"二","level":"L2","type":"完整题","tag":"国际博物馆日｜L2 完整题：配对连线","review":false,"carry":"昨天你在把抱怨变成小事，今天学另一门手艺：**同一件东西，换一种讲法，人才会真的看见**。","question":"五类展品与五种讲解方式，各配一种。请连线，并回答：哪一类展品**最不能只用「讲」**？\n\n  - 展品：① 一件有铭文和使用痕迹的青铜器　② 一幅三米长卷绘画　③ 一组民俗生活用具（石磨、纺车、老式煤炉）　④ 一处遗址现场（地面上的柱础与排水沟）　⑤ 一件残缺的陶俑\n  - 方式：A 提问式观察（先让学生自己看，问「你觉得它是干什么用的」）　B 分段引导（按画面顺序边走边讲，一次只讲一段）　C 动手体验＋与自己家的东西对比　D 现场空间叙述（站在原位讲「当时这里是什么、人往哪走」）　E 证据推理（「缺的那只手臂，是怎么推出来的」）","answer":"①—A（铭文与使用痕迹是最好的提问材料，先问再答）；②—B（长卷有时间顺序，必须分段走）；③—C（老物件与「你家的锅」一对比，理解立刻发生）；④—D（遗址的价值在空间关系，离开原位就讲不清）；⑤—E（残缺件最迷人的是「怎么还原」，这正是考古推理）。\n  **最不能只用「讲」的是 ④ 遗址现场**：它的信息全在**空间关系**里——柱础的位置、排水沟的坡度、人走动的路径。站在教室里讲一百句，不如让学生在原位上走一遍那三条路。其次是 ③：不动手的民俗展，等于把生活用具变成了标本。\n  反面教材：① 一上来就报「西周中期，通高 32 厘米」——年代与数据是最容易讲、也最容易被忘的部分；先让学生猜用途，猜错了他才记得住答案。","hint_raw":"① 有一样东西的价值在「站在哪里看」　② 有一样东西必须用手　③ 见答案，再想：为什么「先报年代」是最省事也最无效的讲法","record":"我讲一件事时，是不是一上来就给结论和数据","migrate":"把你专业里一个必须「到现场／上手／看实物」才讲得清的知识点找出来，写出它为什么搬不进 PPT。","out_char":"","position":"文博讲解员／展陈设计","hints":["有一样东西的价值在「站在哪里看」","有一样东西必须用手","见答案，再想：为什么「先报年代」是最省事也最无效的讲法"],"code":"清"},{"date":"2027-05-19","month":5,"day":19,"weekday":"三","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天看了讲解，今天看两种「带人参观」。","question":"两个人带同一批新生参观校园，两段记录找三处不同，指出哪一段让人记住了东西：\n  A「我们从大门走到图书馆，一共经过七个楼，我把每个楼的名字和用途都说了。」\n  B「我只讲了三处：哪里能借到最全的资料、哪里能打印、哪里能一个人待着。每讲一处我都让他们自己走一遍。」","answer":"三处不同：① A 讲七个点，B 讲三个点；② A 是名称与用途，B 是「能用来做什么」；③ A 只听，B 让人自己走一遍。更让人记住的是 B——信息少而可操作，且有身体动作参与。","hint_raw":"① 有一份讲了「一个人待着」这种具体需求。② 讲得少为什么反而记得多。③ 见答案，注意「自己走一遍」的作用。","record":"我给别人的信息，是名称还是「能用来做什么」。","migrate":"","out_char":"","hints":["有一份讲了「一个人待着」这种具体需求","讲得少为什么反而记得多","见答案，注意「自己走一遍」的作用"],"code":"清"},{"date":"2027-05-20","month":5,"day":20,"weekday":"四","level":"L3","type":"专业日","tag":"L3 专业日：食品营养与健康","review":false,"carry":"5 月的关键词是「清楚」，今天要清楚一件每天都发生的事：**一份食谱好不好，先看类别齐不齐，再看克数准不准**。","question":"下面是一份 4 岁幼儿的一日食谱，八个空格要填**食物类别**（不是菜名），并标出这份食谱最容易漏掉的一类。\n\n  - 早餐：小米粥、鸡蛋、牛奶 →（　①　）（　②　）（　③　）\n  - 午餐：米饭、清蒸鲈鱼、炒青菜 →（　④　）（　⑤　）（　⑥　）\n  - 午点：苹果、酸奶 →（　⑦　）（　③ 已出现）\n  - 晚餐：番茄豆腐汤、面条 →（　⑧　）（　④ 已出现）\n\n  备选类别：谷薯类／蔬菜类／水果类／畜禽肉／水产类／蛋类／奶类／豆类","answer":"① 谷薯类 ② 蛋类 ③ 奶类 ④ 谷薯类（已出现）⑤ 水产类 ⑥ 蔬菜类 ⑦ 水果类 ⑧ 豆类。\n  - **最容易漏掉的是水产类与豆类**：一日三餐里，谷薯、蔬菜、蛋奶几乎自动出现，而水产和豆类需要**特意安排**——很多幼儿园一周吃不到两次鱼，豆制品也常被当成「配菜的点缀」。\n  - **判断顺序**：先数类别（八类里今天出现了几类），再看每一类的量，最后才看烹调方式（蒸煮优于油炸）。克数精确但类别缺失，等于算得准、吃得偏。","hint_raw":"①先别看克数，只数「今天吃到了几类」　②有两类食物不会自己出现，必须有人特意安排　③见答案，然后查一查你昨天的三餐漏了哪一类","record":"我昨天吃的三餐里，有几类是「碰巧吃到」的，有几类是「特意安排」的","migrate":"给你的专业也做一次「类别齐全度」盘点：一次完整的服务/作品/流程里，有哪几项是天然会自动出现的，哪几项必须有人特意安排才不会被漏掉。","out_char":"","college":"学前教育学院","profession":"食品营养与健康","hints":["先别看克数，只数「今天吃到了几类」","有两类食物不会自己出现，必须有人特意安排","见答案，然后查一查你昨天的三餐漏了哪一类"],"code":"清"},{"date":"2027-05-21","month":5,"day":21,"weekday":"五","level":"L1","type":"隐藏词","tag":"小满｜隐藏词","review":false,"carry":"专业日之后回到自己，今天在一段「进步」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个最容易让人停下：\n  「我最近进步挺慢的，好像每天都很努力，但看不出变化。看别人一学就会，我就觉得自己可能不适合。」","answer":"三个词：进步挺慢、看不出变化、可能不适合。最容易让人停下的是「看不出变化」——它把「没有感觉」误当成「没有发生」。能力提升在前三周几乎不可感，改变出现在「回头看」的时候。解法：留痕，用三个月前的自己做对照。","hint_raw":"① 有一句话是判断，不是事实。② 感觉不到不等于没发生。③ 见答案，找一个三个月前的作品来对比。","record":"我和三个月前的自己，具体差在哪里。","migrate":"","out_char":"","hints":["有一句话是判断，不是事实","感觉不到不等于没发生","见答案，找一个三个月前的作品来对比"],"code":"清"},{"date":"2027-05-22","month":5,"day":22,"weekday":"六","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了对照，今天破三句「我要不要坚持」。","question":"请破译下面三句话，并指出哪一句应该停下来：\n  A「做了半年，还是不舒服，但我说不清哪里不对。」\n  B「做了半年，难，但我能说出我在变强的哪一部分。」\n  C「做了半年，全靠意志，一点都不喜欢。」","answer":"应停下来的是 C——它同时具备两个信号：全靠意志（无内驱）＋ 一点都不喜欢（无兴趣）。A 需要的是「说清楚」，不是停止：说不清通常是缺少观察，不是不合适。B 是可持续状态：难但有可见的成长。","hint_raw":"① 有一句话里出现了两个负面词。② 「说不清」需要的是信息，不是决定。③ 见答案，用三个问题测自己：难不难、在不在变强、要不要靠意志。","record":"我现在坚持的那件事，属于 A、B 还是 C。","migrate":"","out_char":"","hints":["有一句话里出现了两个负面词","「说不清」需要的是信息，不是决定","见答案，用三个问题测自己：难不难、在不在变强、要不要靠意志"],"code":"清"},{"date":"2027-05-23","month":5,"day":23,"weekday":"日","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天分了 A/B/C，今天看两种「努力的理由」。","question":"两个人在社团待了一年，两段自述找三处不同，并指出哪一个人更可能留下来：\n  A「我留下来是因为大家都很好，我不想让他们失望。」\n  B「我留下来是因为去年我带的那场活动，有个新生后来专门来谢我。」","answer":"三处不同：① A 的理由是关系压力，B 的理由是一次具体的效果；② A 指向「别人怎么看我」，B 指向「我做的事产生了什么」；③ A 一旦关系变化就会退出，B 有一个可复现的经验。更可能长期留下的是 B。","hint_raw":"① 有一句话里有「专门来谢我」。② 靠关系留人，关系一变人就散。③ 见答案，想想自己留下的真实理由。","record":"我做这件事的真实理由，说得出一个具体的事吗。","migrate":"","out_char":"","hints":["有一句话里有「专门来谢我」","靠关系留人，关系一变人就散","见答案，想想自己留下的真实理由"],"code":"清"},{"date":"2027-05-24","month":5,"day":24,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天找到了理由，今天走一条「我要不要留下」的路。","question":"你在一件事上待了一年，想决定明年还做不做，四个岔口，每岔只有一条能让决定站得住：岔口一 看心情／看它给了我什么；岔口二 只看喜欢／喜欢和代价都算；岔口三 一个人判断／问两个已经离开的人；岔口四 立刻退出／定一个试用期。","answer":"参考路径：看它给了我什么→喜欢和代价都算→问两个已经离开的人→定一个试用期。第三格最关键：离开的人能告诉你真实的代价，留下的人往往只会说好。第四格把「退出」变成可逆的决定，压力立刻下降。","hint_raw":"① 有一格的信息只能从离开的人那里得到。② 代价不算清楚，喜欢会变成亏欠。③ 见答案，注意第四格为什么是「试用期」。","record":"我问过一个「已经离开的人」吗，他怎么说。","migrate":"","out_char":"","hints":["有一格的信息只能从离开的人那里得到","代价不算清楚，喜欢会变成亏欠","见答案，注意第四格为什么是「试用期」"],"code":"清"},{"date":"2027-05-25","month":5,"day":25,"weekday":"二","level":"L2","type":"一问","tag":"5·25 全国大中学生心理健康日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：心理老师和班主任，谁更容易被学生求助。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"清"},{"date":"2027-05-26","month":5,"day":26,"weekday":"三","level":"L1","type":"配对连线","tag":"配对连线","review":false,"carry":"昨天想了「什么时候会求助」，今天连「四种困扰该找谁」。","question":"左边四种情况，右边四种最合适的人，请连线：① 学不进去、想放弃 ② 和室友长期不合 ③ 身体总是不舒服 ④ 不知道毕业去哪 —— A 专业课老师或已工作的学长 B 学校心理中心 C 校医院／正规医院 D 辅导员或宿管老师。","answer":"参考 ①—B、②—D（或 B）、③—C、④—A。①—B 的理由：学不进去往往不是方法问题，先处理状态。④—A 的关键是「已工作的学长」：他能给出具体的岗位信息，而不是泛泛的建议。","hint_raw":"① 身体的问题只找一类人。② 「不知道去哪」需要的是具体信息。③ 见答案，把自己的困扰对号入座。","record":"我现在最需要找人聊聊的是哪一件，该找谁。","migrate":"","out_char":"","hints":["身体的问题只找一类人","「不知道去哪」需要的是具体信息","见答案，把自己的困扰对号入座"],"code":"清"},{"date":"2027-05-27","month":5,"day":27,"weekday":"四","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天找到了人，今天破三句「我不敢说」。","question":"请破译下面三句话，并指出哪一句的人最容易撑出问题：\n  A「这点小事，不值得麻烦别人。」\n  B「说了也没用，他们不会懂。」\n  C「我先自己弄，弄不好再说。」","answer":"最容易出问题的是 B——它同时关闭了求助和解释两个通道，人会被困在「没人懂」的判断里。A 是分寸感（有时确实不必麻烦人），C 是合理的顺序（先自己试）。区别在于：A、C 留了口子，B 关上了门。","hint_raw":"① 有一句话是对所有人的判断。② 「先自己弄」是可以的，但要加一个期限。③ 见答案，把 B 改成「我说一次，看看对方怎么回」。","record":"我心里那句「说了也没用」，是关于谁的。","migrate":"","out_char":"","hints":["有一句话是对所有人的判断","「先自己弄」是可以的，但要加一个期限","见答案，把 B 改成「我说一次，看看对方怎么回」"],"code":"清"},{"date":"2027-05-28","month":5,"day":28,"weekday":"五","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天打开了门，今天排一次「怎么开口求助」。","question":"你要找一个不太熟的老师帮忙，五个动作请排序：A 想清楚你具体要他帮什么（一句话） B 提前把要给他看的东西整理好 C 先说结论再说背景 D 给出你希望的时间 E 事后告诉他结果。","answer":"参考 A→B→C→D→E。A 必须最前：说不清「要什么」的求助，对方只能客气地回你；B 是尊重对方时间（他不需要再问你要材料）；E 最容易被漏掉，它决定这个人下次还愿不愿意帮你。","hint_raw":"① 有一格是一句话能说清的。② 先给结论，再给背景。③ 见答案，注意 E 为什么比道谢更重要。","record":"我上次求助，事后告诉对方结果了吗。","migrate":"","out_char":"","hints":["有一格是一句话能说清的","先给结论，再给背景","见答案，注意 E 为什么比道谢更重要"],"code":"清"},{"date":"2027-05-29","month":5,"day":29,"weekday":"六","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"求助的事排完了，今天看两种「反馈」。","question":"同一个人收到的两条评价，找三处不同，并指出哪一条更有用：\n  A「你这次做得不错，继续加油。」\n  B「你这次开场用了提问，比上次直接讲好；但第二段例子太长，下次压到三十秒。」","answer":"三处不同：① A 只有结论，B 有对比（比上次）；② A 没有可改的点，B 指明了一个具体动作（压到三十秒）；③ A 无法复用，B 可以照做。更有用的是 B——好反馈一定包含「哪里好、为什么好、下次改哪一处」。","hint_raw":"① 有一句里有「但」。② 有用的评价能指出下一次怎么做。③ 见答案，下次请人评价，主动问「如果只改一处，改哪里」。","record":"我收到过最有用的评价是什么，它指明了哪一处。","migrate":"","out_char":"","hints":["有一句里有「但」","有用的评价能指出下一次怎么做","见答案，下次请人评价，主动问「如果只改一处，改哪里」"],"code":"清"},{"date":"2027-05-30","month":5,"day":30,"weekday":"日","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"五月最后两天。今天看「我这个月想要的和实际做的」。","question":"中心格写「这个月」。八格填：最想做成的一件事、实际花最多时间的事、最开心的一次、最烦的一次、认识的一个新的人、放弃的一件事、学到的一个人话、下个月第一件事。","answer":"无标准答案。核心对照第 1 格与第 2 格：两者不一致是常态，但差距过大说明这个月是「被推着过」的。第 7 格「学到的一个人话」是本册的设计点——很多能力来自别人的一句话，记下来才知道自己从哪长。","hint_raw":"① 第 1 格与第 2 格要诚实地填。② 「学到的一个人话」写原话。③ 见答案，若两格差得远，就把下月第一件事定成第 1 格。","record":"这个月我从谁那里学到一句话，原话是什么。","migrate":"","out_char":"","hints":["第 1 格与第 2 格要诚实地填","「学到的一个人话」写原话","见答案，若两格差得远，就把下月第一件事定成第 1 格"],"code":"清"},{"date":"2027-05-31","month":5,"day":31,"weekday":"一","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"明天是 Q2 复盘，今天走一条「半年节点」的路。","question":"学期过半，四个岔口，每岔只有一条能让你六月不后悔：岔口一 把没做完的补完／重新定一个更小的目标；岔口二 先做最急的／先做最有用的；岔口三 一个人扛／找人分担一半；岔口四 悄悄做／说出来让人知道。","answer":"参考路径：重新定一个更小的目标→先做最有用的→找人分担一半→说出来让人知道。第一格是全册反复出现的方法：剩下六周，把目标缩小到能完成，比补不完更有价值。第四格：说出来会带来监督，也会带来帮助。","hint_raw":"① 有一格是把目标变小。② 「最有用」和「最急」常常不是同一件。③ 见答案，注意第三格为什么是「分担一半」而不是「找人帮忙」。","record":"六月我要缩小的那个目标，具体是什么。\n\n---\n\n## 六月｜价值与选择（月字：价）\n\n六月 30 天：L1 23 道；L3 四天（6/1 美术教育、6/11 学前教育、6/12 工艺美术品设计、6/21 音乐教育）；L2 一问两天（6/5、6/26）；季度复盘一天（6/30）。","migrate":"","out_char":"","hints":["有一格是把目标变小","「最有用」和「最急」常常不是同一件","见答案，注意第三格为什么是「分担一半」而不是「找人帮忙」"],"code":"清"},{"date":"2027-06-01","month":6,"day":1,"weekday":"二","level":"L3","type":"专业日","tag":"国际儿童节｜L3 专业日：美术教育","review":false,"carry":"6 月要谈的是「价值」。今天先谈一件常被搞混的事：**孩子画的不是错，是另一种看**。","question":"一名 5 岁孩子画了《一家人》：人都画在纸的最下方，头很大身子很小，太阳是蓝色的，房子的窗户画在屋顶上（他说「这样从里面能看见外面」）。下面是两版导览词，请找出 **3 处不同**，并说明哪一版会让家长当场说「你怎么画错了」。\n\n  - 甲（结论版）：「这幅画用了冷暖对比，属于儿童画的典型表现期作品，色彩大胆，构图饱满。」\n  - 乙（入口版）：「你把一家人都画在这一排——他们是在一起做什么呢？这个蓝色的太阳，是夏天的太阳吗？窗户在屋顶上，从里面看出去能看到什么？」","answer":"三处不同——① **给结论 vs 给入口**：甲直接贴标签（表现期、冷暖对比），乙只描述并提问；② **说作品 vs 问作者**：甲的对象是画，乙的对象是孩子；③ **合上对话 vs 打开对话**：甲说完就结束了，乙每一句都留了一个他必须回答的问题。\n  会让家长说「画错了」的是**甲**：标签式语言让家长以为这幅画有「标准答案」，于是拿标准去对——发现不像，就判错。而乙的每一个问题都在告诉家长：**这里有一个孩子自己的解释**（窗户画在屋顶，是因为他要「从里面看见外面」——这是空间认知的正常阶段，不是错误）。","hint_raw":"①看两段话在跟谁说话　②有一版全是术语，没有一句在问孩子　③见答案，然后回头看你小时候的画，被说过「画得不像」吗","record":"我评判别人的作品时，是在找标准答案，还是在找他的解释","migrate":"把一句你评价别人作品的常用话说出来，改成「描述＋提问」的版本，看看对方会不会多说一句。","out_char":"","college":"艺术教育学院","profession":"美术教育","hints":["看两段话在跟谁说话","有一版全是术语，没有一句在问孩子","见答案，然后回头看你小时候的画，被说过「画得不像」吗"],"code":"价"},{"date":"2027-06-02","month":6,"day":2,"weekday":"三","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"六月主题是「价」——我能提供什么、它值多少。今天在一段「谈报酬」的话里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个会让你吃亏：\n  「第一次做兼职，人家问我要多少钱，我说随便，看你们给多少就行。后来做完了，他们给的比我想的少一半，我也不好意思说。」","answer":"三个词：随便、看你们给、不好意思说。最吃亏的是「不好意思说」——它是把定价权交出去之后，连异议也交出去。真正的问题出在第一句：「随便」在谈判里等于「我不确定自己的价值」。","hint_raw":"① 有一句话里你放弃了定价。② 「不好意思」的代价是钱和尊重。③ 见答案，试着准备一个数字再谈。","record":"如果现在有人问我「你要多少钱」，我报得出数字吗。","migrate":"","out_char":"","hints":["有一句话里你放弃了定价","「不好意思」的代价是钱和尊重","见答案，试着准备一个数字再谈"],"code":"价"},{"date":"2027-06-03","month":6,"day":3,"weekday":"四","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天发现报不出价，今天排一次「怎么给自己定价」。","question":"第一次接一份活，五个动作请排序：A 先查同类活的行情价 B 算清自己投入的时间和成本 C 报一个区间而不是一个数 D 说清自己能做到什么程度 E 谈不拢时不立刻降价，先问对方预算。","answer":"参考 A→B→D→C→E。A、B 是定价的地基：没有行情和成本的报价，全靠感觉。D 排在报价前：先说明交付边界，价格才有依据。E 是六月最难的一课——对方压价时，先问预算，而不是立刻让步。","hint_raw":"① 有一格是先说清「我能做到什么」。② 报区间比报单点安全。③ 见答案，注意 E 为什么不是「降价」。","record":"我这份活，行情价大概是多少。","migrate":"","out_char":"","hints":["有一格是先说清「我能做到什么」","报区间比报单点安全","见答案，注意 E 为什么不是「降价」"],"code":"价"},{"date":"2027-06-04","month":6,"day":4,"weekday":"五","level":"L1","type":"找不同","tag":"找不同","review":false,"carry":"昨天学了定价，今天看两种「被压价」的应对。","question":"同一个人接活的两次经历，找三处不同，并指出哪一次更专业：\n  A「他说太贵了，我马上说可以便宜点，最后降了四成，做完他还加了两项要求。」\n  B「他说太贵了，我问预算多少。他说只有六成，我说那这项内容我拿掉，价格就到位了，后面加项另外算。」","answer":"三处不同：① A 先降价，B 先问预算；② A 减价不减内容，B 减内容保价格；③ A 没有约定加项，B 事先说明「加项另算」。更专业的是 B——降价必须减内容，否则你用的是自己的时间来补差。","hint_raw":"① 有一句话里出现了「拿掉」。② 价格和内容必须同时变。③ 见答案，记住「减内容」这三个字。","record":"我有没有过「降了价还多做了活」的经历。","migrate":"","out_char":"","hints":["有一句话里出现了「拿掉」","价格和内容必须同时变","见答案，记住「减内容」这三个字"],"code":"价"},{"date":"2027-06-05","month":6,"day":5,"weekday":"六","level":"L2","type":"一问","tag":"世界环境日｜L2 一问","review":false,"carry":"","question":"- 今日一问（不设标准答案，写下你的第一反应）：自然教育指导师带一场活动，要准备几件事。指向岗位：自然教育指导师。","answer":"","hint_raw":"","record":"","migrate":"","out_char":"","hints":[],"code":"价"},{"date":"2027-06-06","month":6,"day":6,"weekday":"日","level":"L1","type":"密文破译","tag":"芒种｜密文破译","review":false,"carry":"芒种，收与种同时。今天破三句「我在攒什么」。","question":"请破译下面三句话里各自在积攒什么，并指出哪一种最不容易被替代：\n  A「我攒了很多课上的笔记。」\n  B「我攒了很多次上台的机会。」\n  C「我攒了十个能随时问问题的人。」","answer":"A 攒信息（可复制，别人也有）；B 攒经验（有壁垒，需要时间）；C 攒关系（最难复制，因为它靠的是对方对你的信任）。最不容易被替代的是 C，其次是 B。信息最容易获得，也最容易过期。","hint_raw":"① 有一种攒法是「人」。② 笔记谁都能记。③ 见答案，数一数自己 C 有几条。","record":"我手机里能随时问问题的人，有几个。","migrate":"","out_char":"","hints":["有一种攒法是「人」","笔记谁都能记","见答案，数一数自己 C 有几条"],"code":"价"},{"date":"2027-06-07","month":6,"day":7,"weekday":"一","level":"L1","type":"九宫格","tag":"高考首日｜九宫格","review":false,"carry":"高考日。今天回看「三年前的那场考试」。","question":"中心格写「三年前的我以为」。八格填：以为大学是什么样、以为专业会学什么、以为朋友会怎么交、以为老师会怎么教、以为努力就会有、以为最难的是、以为毕业还很久、现在发现最不一样的一件事。","answer":"无标准答案。这道题的价值在第 8 格：多数人的落差集中在「以为努力就会有结果」——真实的回报是延迟的、非线性的，而且常常来自你没在意的方向。","hint_raw":"① 第 8 格是唯一有现在的格子。② 落差本身是信息，不是失败。③ 见答案，把落差写成一句可用的判断。","record":"三年前我最大的误判是什么。","migrate":"","out_char":"","hints":["第 8 格是唯一有现在的格子","落差本身是信息，不是失败","见答案，把落差写成一句可用的判断"],"code":"价"},{"date":"2027-06-08","month":6,"day":8,"weekday":"二","level":"L1","type":"排序题","tag":"排序题","review":false,"carry":"昨天看了误判，今天排一次「怎么判断一个说法靠不靠得住」。","question":"有人告诉你「这个专业不好找工作」，五个动作请排序：A 先问他是听谁说的 B 查学校近三年的就业去向 C 找两个真正在这个行业的人问 D 分清他说的是「这个专业」还是「他认识的那几个人」 E 记下结论和依据，半年后回看。","answer":"参考 D→A→C→B→E。D 必须最前：多数「不好找工作」的判断，其实是从两三个样本推出来的。B 排在 C 之后：官方数据看总量，真人看结构（去哪、做什么、起薪、留多久），两者互补。","hint_raw":"① 有一格是分清「样本」和「整体」。② 官方数据和真人经验要看的东西不同。③ 见答案，注意 E 为什么要有回看日期。","record":"我信过的一个「听说」，依据是什么。","migrate":"","out_char":"","hints":["有一格是分清「样本」和「整体」","官方数据和真人经验要看的东西不同","见答案，注意 E 为什么要有回看日期"],"code":"价"},{"date":"2027-06-09","month":6,"day":9,"weekday":"三","level":"L1","type":"隐藏词","tag":"端午节｜隐藏词","review":false,"carry":"昨天学了核实，今天在一段「比较」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个让比较变得没意义：\n  「室友拿了奖学金，另一个已经实习了，我什么都没有。我每天都在忙，但好像什么都没留下，可能我就是比别人差。」","answer":"三个词：什么都没有、每天都在忙、比别人差。让比较失去意义的是「什么都没有」——它是绝对化的全否，掩盖了事实（你在忙，说明你在做，只是没有成果化）。可操作的动作只有一个：把「忙的事」写下来，挑一件做成可见的东西。","hint_raw":"① 有一句话是全面的否定。② 忙不是问题，缺成果才是。③ 见答案，把「什么都没有」改成「还没有什么」。","record":"我忙的那些事里，哪一件可以做成可见的东西。","migrate":"","out_char":"","hints":["有一句话是全面的否定","忙不是问题，缺成果才是","见答案，把「什么都没有」改成「还没有什么」"],"code":"价"},{"date":"2027-06-10","month":6,"day":10,"weekday":"四","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天决定要把一件事做成可见的，今天走这条路。","question":"你要在六周内做出一件能拿给人看的东西，四个岔口，每岔只有一条能真的做出来：岔口一 选题越大越好／小到能一次做完；岔口二 边做边改／先定死，做完再改；岔口三 只给自己看／一开始就说给一个人听；岔口四 做到完美／做到能交付。","answer":"参考路径：小到能一次做完→先定死，做完再改→一开始就说给一个人听→做到能交付。第二格反直觉但有效：边做边改会让小项目无限膨胀。第三格是外部约束：说出去就有了截止日。","hint_raw":"① 有一格是把范围缩小。② 「能交付」低于「完美」。③ 见答案，注意第二格为什么先定死。","record":"我要做的那件东西，一句话说清是什么。","migrate":"","out_char":"","hints":["有一格是把范围缩小","「能交付」低于「完美」","见答案，注意第二格为什么先定死"],"code":"价"},{"date":"2027-06-11","month":6,"day":11,"weekday":"五","level":"L3","type":"专业日","tag":"国际游戏日｜L3 专业日：学前教育","review":false,"carry":"昨天你在学「别用标准答案看孩子」，今天练更难的：**分清「我在帮他」和「我在替他做决定」**。","question":"中心格是「自主游戏」。周围八格是老师在游戏现场的真实行为，请逐个判断属于「支持」还是「干扰」，并写出一句判断依据。\n\n  ① 孩子反复把积木塔推倒重搭，老师站在两步外看着，不说话\n  ② 孩子说「我要当医生」，老师说「今天我们大家都做厨师哦」\n  ③ 孩子在沙池挖沟，老师递过去一把合适的小铲子\n  ④ 两个孩子抢一辆小车，老师直接说「这次给他玩，你等下次」\n  ⑤ 孩子把颜料弄到手上，老师递来湿巾说「擦一下还能接着画」\n  ⑥ 老师看着孩子搭的桥说「这个应该搭成城堡才好看」\n  ⑦ 孩子搭的桥塌了，老师问「你觉得是哪里不稳」\n  ⑧ 老师把孩子搭的东西拍下来，贴在墙上并写上孩子自己的话","answer":"**支持 ①③⑤⑦⑧；干扰 ②④⑥**。\n  - 判断依据只有一条：**这个动作有没有替孩子做决定**。① 不介入＝把决定权留给孩子（重复本来就是游戏的学习方式）；③ 递工具＝给条件不给答案；⑤ 递湿巾＝解决障碍，接不接着画仍归孩子；⑦ 提问＝把思考退回给孩子；⑧ 记录并署名＝承认这是他的作品。\n  - ② 换主题、④ 直接裁决、⑥ 规定成品样貌，三者都含「成人替孩子做了决定」——哪怕语气温柔，结果都是孩子的游戏变成了老师的作业。","hint_raw":"① 只看一件事：这个动作之后，决定权还在孩子手上吗　② 递东西和定标准是两回事　③ 见答案，再想：为什么「温和地替他决定」也算干扰","record":"我上一次「帮忙」，是不是其实替别人做了决定","migrate":"在小组作业或社团活动里，找一次你「顺手替别人做了」的事，判断它属于给条件还是拿走决定权。","out_char":"","college":"学前教育学院","profession":"学前教育","hints":["只看一件事：这个动作之后，决定权还在孩子手上吗","递东西和定标准是两回事","见答案，再想：为什么「温和地替他决定」也算干扰"],"code":"价"},{"date":"2027-06-12","month":6,"day":12,"weekday":"六","level":"L3","type":"专业日","tag":"文化和自然遗产日｜L3 专业日：工艺美术品设计","review":false,"carry":"昨天你在判断「谁做决定」，今天进工坊：**这里决定权不在你手上，在材料和工序手上**。","question":"一件漆器小盒的八道工序被打乱了：A 髹漆　B 选料　C 落款　D 制胎　E 刮灰　F 设计（画样与尺寸）　G 裱布　H 打磨。请排序，并回答：哪一步如果为了赶时间被跳过，会导致整件返工？","answer":"正确顺序 **B 选料 → F 设计 → D 制胎 → G 裱布 → E 刮灰 → H 打磨 → A 髹漆 → C 落款**。\n  - 逻辑链：**选料决定上限**（木胎含水率不达标，后面全白做）→ **设计定尺寸**（尺寸定了胎才能做）→ **制胎** → **裱布加固**（防开裂）→ **刮灰找平** → **打磨**（灰层不平，漆面必然高低不一）→ **髹漆** → **落款**。\n  - 被跳过会全盘返工的是**干燥**（藏在 E 与 H 之间、A 与 A 之间的那道「等」）：每层灰、每道漆都必须干透才能做下一层，**跳过干燥时间不会省一天，只会让整件开裂或起皱**，而且这种失败往往在最后一道漆之后才显现——那时已经无法返修。\n  - 常见误区：把打磨放在髹漆之后才做（面漆会被磨穿）；把落款放在髹漆之前（被漆盖住）。","hint_raw":"①先想清楚「哪一步错了，后面全部作废」　② 有一道工序不写在清单上，但每两步之间都必须有它　③ 见答案，特别注意「打磨」为什么在髹漆之前","record":"我做过哪件事，是因为想快，跳过了不能跳的一步","migrate":"把你专业里的一次作业/项目拆成工序，标出哪两步之间必须有「等」（等审核、等测试、等反馈、等干燥），跳过它会怎样。","out_char":"","college":"艺术教育学院","profession":"工艺美术品设计","hints":["先想清楚「哪一步错了，后面全部作废」","有一道工序不写在清单上，但每两步之间都必须有它","见答案，特别注意「打磨」为什么在髹漆之前"],"code":"价"},{"date":"2027-06-13","month":6,"day":13,"weekday":"日","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"两个专业日之后回到自己，今天在「我做的事值多少钱」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个最需要修正：\n  「我做的手工包，材料花了三十，我卖五十，同学说贵，我就送人了。后来发现别人同款卖一百二，还很多人买。」","answer":"三个词：材料花了三十、卖五十、送人了。最需修正的是「送人了」——它把「不被认可」变成了「没有价值」，而事实只是「定价过低且没有说明」。修正动作：定价按时间算，并把「为什么值这个价」讲出来（手工时长、独一份、可改色）。","hint_raw":"① 有一句话等于否定了自己的劳动。② 定价里没有算时间。③ 见答案，把你的价格拆成材料＋时间＋独特性。","record":"我做的东西，如果按小时算，值多少。","migrate":"","out_char":"","hints":["有一句话等于否定了自己的劳动","定价里没有算时间","见答案，把你的价格拆成材料＋时间＋独特性"],"code":"价"},{"date":"2027-06-14","month":6,"day":14,"weekday":"一","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"昨天算了时间，今天看「我会的东西能卖给谁」。","question":"中心格写「我会做的一件事」。八格填：谁会需要它、他们什么时候需要、他们现在怎么解决、我比他们的办法好在哪、要收多少钱、在哪里能找到他们、我能拿出什么证明、第一句话怎么说。","answer":"无标准答案。判定要点：第 4 格「好在哪」必须是一句对方能听懂的比较（更快／更省／更好看／更省心），说不出比较，就还只是爱好。第 8 格第一句话，是大多数人的真正卡点。","hint_raw":"① 第 4 格要有一个「更」字。② 第 6 格决定这件事能不能开始。③ 见答案，把第 8 格写成一句能直接发出去的话。","record":"我那件事的「更」，具体是更什么。","migrate":"","out_char":"","hints":["第 4 格要有一个「更」字","第 6 格决定这件事能不能开始","见答案，把第 8 格写成一句能直接发出去的话"],"code":"价"},{"date":"2027-06-15","month":6,"day":15,"weekday":"二","level":"L1","type":"迷宫","tag":"迷宫","review":false,"carry":"昨天找到了「更」，今天走一条「第一次接活」的路。","question":"第一次有人找你做付费的活，四个岔口：岔口一 不好意思谈钱／先把价格和内容写清；岔口二 什么都答应／只做自己会的那部分；岔口三 口头约定／留一条文字记录；岔口四 做完就结束／做完要一句评价。","answer":"参考路径：先把价格和内容写清→只做自己会的那部分→留一条文字记录→做完要一句评价。第四格是长期主义的做法：一句评价是你下一次定价的依据，也是你简历上唯一有说服力的东西。","hint_raw":"① 有一格能防止事后扯皮。② 第一次接活，边界比能力更重要。③ 见答案，注意第四格为什么是「评价」。","record":"我做完一件事，有没有留下别人的一句评价。","migrate":"","out_char":"","hints":["有一格能防止事后扯皮","第一次接活，边界比能力更重要","见答案，注意第四格为什么是「评价」"],"code":"价"},{"date":"2027-06-16","month":6,"day":16,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天要了一句评价，今天填「怎么要」。","question":"横填四格，每格两字：① 问的时候说___（具体／随便／大概）一点 ② 只问一个___（人／群／老师） ③ 问「哪一处可以___（更好／不行／算了）」 ④ 收到后___（记下／道谢／转发）。","answer":"参考：具体／人／更好／记下。第 3 格是技巧核心：问「哪一处可以更好」，对方就会给你一句可执行的话；问「做得怎么样」，只能得到「挺好的」。","hint_raw":"① 问法决定答案的质量。② 一次只问一个人，回复率最高。③ 见答案，注意第 3 格为什么用「更好」而不是「不行」。","record":"我上次问「做得怎么样」，得到了什么答案。","migrate":"","out_char":"","hints":["问法决定答案的质量","一次只问一个人，回复率最高","见答案，注意第 3 格为什么用「更好」而不是「不行」"],"code":"价"},{"date":"2027-06-17","month":6,"day":17,"weekday":"四","level":"L1","type":"隐藏词","tag":"隐藏词","review":false,"carry":"评价的事解决了，今天在「我是不是太在意别人看法」里找词。","question":"下面这段话藏着三个词，找出来，并指出哪一个其实是好事：\n  「我做事之前会想别人怎么看，发个朋友圈要改三遍，选课要看别人选什么，我妈说我太没主见。但我也确实很少跟人起冲突。」","answer":"三个词：想别人怎么看、改三遍、很少起冲突。其实是好事的是「很少起冲突」——在意他人感受是一种真实的能力（在服务、教育、协作类工作里很值钱）。要改的不是「在意」，而是「让在意决定选择」：先定自己的判断，再用它调整表达方式。","hint_raw":"① 有一段是能力的证据。② 「在意」和「被在意决定」是两件事。③ 见答案，试着先写自己的选择，再想别人怎么看。","record":"我最近一次因为别人而改掉的选择是什么。","migrate":"","out_char":"","hints":["有一段是能力的证据","「在意」和「被在意决定」是两件事","见答案，试着先写自己的选择，再想别人怎么看"],"code":"价"},{"date":"2027-06-18","month":6,"day":18,"weekday":"五","level":"L1","type":"密文破译","tag":"密文破译","review":false,"carry":"昨天分清了「在意」与「被决定」，今天破三句「我这人就这样」。","question":"请破译下面三句话，并指出哪一句把性格当成了结论：\n  A「我性格内向，不适合上台。」\n  B「我上台会紧张，多练几次会好一点。」\n  C「我不喜欢当众讲话，但我可以准备得很熟。」","answer":"把性格当结论的是 A——它从「内向」直接推出「不适合」，中间跳过了所有可能的调整。B 承认紧张，同时给出可变的因素（多练）；C 承认不喜欢，同时给出可行方案（准备得熟）。后两句都留了余地。","hint_raw":"① 有一句话里性格直接变成了判决。② 注意「但」字后面的部分。③ 见答案，把 A 改写成 C 的样子。","record":"我给自己下的一个结论，能不能改成「可以准备」的形式。","migrate":"","out_char":"","hints":["有一句话里性格直接变成了判决","注意「但」字后面的部分","见答案，把 A 改写成 C 的样子"],"code":"价"},{"date":"2027-06-19","month":6,"day":19,"weekday":"六","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天拆了结论，今天填「上台前四件事」。","question":"横填四格，每格两字：① 先写___（逐字稿／要点／标题） ② 只背前___（三十秒／全部／一半） ③ 提前___（走场／准备／想想）一遍 ④ 上台先看___（一个人／全场／地板）。","answer":"参考：逐字稿／三十秒／走场／一个人。第 2 格是降低紧张最有效的做法：开头三十秒背熟，人一旦顺过开头，后面的紧张会自己降下来。第 4 格：找一个友善的脸讲，比扫视全场更容易稳住。","hint_raw":"① 第 2 格是一个时间单位。② 第 4 格只找一个人。③ 见答案，下次上台前按这四格做一遍。","record":"我上台最紧张的是哪一刻。","migrate":"","out_char":"","hints":["第 2 格是一个时间单位","第 4 格只找一个人","见答案，下次上台前按这四格做一遍"],"code":"价"},{"date":"2027-06-20","month":6,"day":20,"weekday":"日","level":"L1","type":"配对连线","tag":"父亲节｜配对连线","review":false,"carry":"昨天练了上台，今天连「四种表达方式配什么场合」。","question":"左边四种表达，右边四种最合适的场合，请连线：① 直接说结论 ② 先讲故事 ③ 先问问题 ④ 只给选项 —— A 对方在犹豫，需要自己下决定 B 对方很忙，只有一分钟 C 对方有情绪，听不进道理 D 场子冷，需要把人拉进来。","answer":"参考 ①—B、②—D、③—C、④—A。③—C 是关键：人有情绪时问「你怎么想」，比讲道理有效。④—A 把选择权交回去，避免了「替他决定」的冒犯。","hint_raw":"① 只有一分钟的场合用最短的形式。② 有情绪的人需要被问，不需要被讲。③ 见答案，回想最近一次跟家里人说话，用的是哪一种。","record":"我和家里人说话，最常用的是哪一种，最缺的是哪一种。","migrate":"","out_char":"","hints":["只有一分钟的场合用最短的形式","有情绪的人需要被问，不需要被讲","见答案，回想最近一次跟家里人说话，用的是哪一种"],"code":"价"},{"date":"2027-06-21","month":6,"day":21,"weekday":"一","level":"L3","type":"专业日","tag":"夏至｜L3 专业日：音乐教育","review":false,"carry":"前面你在看工序与判断，今天用耳朵做一次专业判断：**同一种声音，放在不同时间，作用相反**。","question":"三条节奏型被写成了生活里的声音。请破译每条像什么，并判断**哪一条适合放在午睡前**、哪一条放进去会适得其反。\n\n  - 甲：♩ ♩ ♩ ♩（每拍均匀、速度稳定）\n  - 乙：♪♪ ♩ ♪♪ ♩（前短后长，一顿一顿）\n  - 丙：♩ ♪♪ ♩（中间抢一下，落点被提前）\n\n  （对应生活场景备选：走路／心跳／敲门）","answer":"甲＝**走路**（均匀等拍，身体最容易跟上）；乙＝**敲门**（短促后停顿，带「等待回应」的意味）；丙＝**心跳加速**（切分与抢拍制造紧张感）。\n  - **适合午睡前的是甲**：稳定等拍让呼吸与心率趋于平稳，这也是摇篮曲几乎都用均匀律动的原因。\n  - **适得其反的是丙**：切分与附点会制造「兴奋—期待」，睡前使用等于反向操作；乙次之，因为它的停顿会让幼儿不断抬头看「还有没有下一次」。\n  - 专业要点：**节奏的情绪作用不是靠快慢，是靠「稳不稳」**。同样的速度，均匀与切分给人的生理反应完全不同。","hint_raw":"① 先用手拍一遍，看身体想做什么　② 有一条节奏里「有一部分被提前了」　③ 见答案，再想：为什么摇篮曲从不使用切分","record":"我最近一次睡不着或静不下来，周围是什么节奏","migrate":"找出你专业里「同一个东西，换个时间/场合作用就相反」的例子（一句话在动员时是鼓舞、在批评时是压力），写一组对照。","out_char":"","college":"艺术教育学院","profession":"音乐教育","hints":["先用手拍一遍，看身体想做什么","有一条节奏里「有一部分被提前了」","见答案，再想：为什么摇篮曲从不使用切分"],"code":"价"},{"date":"2027-06-22","month":6,"day":22,"weekday":"二","level":"L1","type":"九宫格","tag":"九宫格","review":false,"carry":"专业日之后，今天做 Q2 复盘前的第一次盘点。","question":"中心格写「四月到六月」。八格填：做成了的一件事、放弃的一件事、一个新习惯、一个还欠着的承诺、认识的一个新人、最不想再经历的一天、最想再来一次的一天、这三个月变了一点点的地方。","answer":"无标准答案。第 4 格「还欠着的承诺」是本册唯一需要行动的一格：六月三十日前，把它还掉，或者明确告诉对方做不到。第 8 格允许极小——「变了一点点」就是真实的进步。","hint_raw":"① 第 4 格要真的去处理。② 第 8 格写得越小越可信。③ 见答案，今天就处理第 4 格。","record":"我欠着的那个承诺，怎么处理。","migrate":"","out_char":"","hints":["第 4 格要真的去处理","第 8 格写得越小越可信","见答案，今天就处理第 4 格"],"code":"价"},{"date":"2027-06-23","month":6,"day":23,"weekday":"三","level":"L1","type":"填字格","tag":"填字格","review":false,"carry":"昨天盘点了承诺，今天填「怎么把话说清」。","question":"横填四格，每格两字：① 答应的时侯给___（时间／大概／尽量） ② 做不到时___（早说／拖到／装作） ③ 说   const ansBtn = (d.answer && d.answer.trim())
    ? `<button onclick="toggle('${id}-ans','${id}-ab')" id="${id}-ab">看答案</button>` : "";
  const revBadge = d.review ? `<span class="badge" style="border-color:var(--gold);color:#7a5f10">复盘</span>` : "";
  const prof = d.profession ? `<span class="badge">${esc(d.college||"")}·${esc(d.profession)}</span>` : "";
  const pos = d.position ? `<span class="badge">指向岗位：${esc(d.position)}</span>` : "";
  const lvName = lv==="L2" ? ("L2 " + (d.type==="完整题"?"完整题":"一问")) : (LEVEL_NAME[lv]||lv);
  return `<article class="card lv-${lv}${d.review?" review-dot":""}" id="${id}"
      data-key="${esc([d.date,d.weekday,d.type,d.tag,d.profession,d.position,d.carry,d.question,d.answer,(d.hints||[]).join(" ")].join(" ")).replace(/"/g,"")}">
    <div class="card-head">
      <span class="date">${d.month} 月 ${d.day} 日</span>
      <span class="wd">${esc(WEEK[d.weekday]||("周"+d.weekday))}</span>
      <span class="badge lv ${lv}">${esc(lvName)}</span>
      ${d.type && lv!=="L2" ? `<span class="badge type">${esc(d.type)}</span>`:""}
      ${d.code ? `<span class="badge code">密码字 ${esc(d.code)}</span>`:""}
      ${revBadge}${prof}${pos}
    </div>
    ${d.tag ? `<div class="fest">${esc(d.tag)}</div>`:""}
    ${d.carry ? `<div class="carry">${md(d.carry)}</div>`:""}
    <div class="qtext">${md(d.question||"")}</div>
    ${d.record ? `<div class="record">${md(d.record)}</div>`:""}
    <div class="btns">
      ${tipBtn}${ansBtn}
      ${(d.migrate)?`<button class="ghost" onclick="toggle('${id}-mig','')">通用迁移</button>`:""}
    </div>
    <div class="panel" id="${id}-hint">${hints}</div>
    ${d.answer?`<div class="panel" id="${id}-ans"><h4>答案</h4><div class="answer">${md(d.answer)}</div></div>`:""}
    ${d.migrate?`<div class="panel" id="${id}-mig"><h4>通用迁移</h4><div class="answer" style="background:#F3F4EE;border-color:var(--line)">${md(d.migrate)}</div></div>`:""}
  </article>`;
}

window.toggle = function(pid, bid){
  const p = document.getElementById(pid); if(!p) return;
  p.classList.toggle("on");
  if(bid){ const b=document.getElementById(bid); if(b) b.textContent = p.classList.contains("on")?"收起答案":"看答案"; }
};
window.stepHint = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  const next = wrap.querySelector(".hint:not(.on)");
  if(next){ next.classList.add("on"); wrap.classList.add("on"); }
  const shown = wrap.querySelectorAll(".hint.on").length;
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = shown;
};
window.allHints = function(id){
  const wrap = document.getElementById(id+"-hint");
  if(!wrap) return;
  wrap.querySelectorAll(".hint").forEach(h=>h.classList.add("on"));
  wrap.classList.add("on");
  const c = document.getElementById(id+"-hi"); if(c) c.textContent = wrap.querySelectorAll(".hint.on").length;
};

(function render(){
  const main = document.getElementById("main");
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  main.innerHTML = months.map(m=>{
    const list = byMonth[m];
    const rev = list.find(d=>d.review);
    const ch = monthTheme[m] || "";
    const mdname = ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"][m];
    return `<section class="month" id="m${m}">
      <div class="month-head">
        <span class="num">MONTH ${String(m).padStart(2,"0")}</span>
        <h2>${[mdname,ch,rev?("复盘 "+rev.code):""].filter(Boolean).join(" · ")}</h2>
        <span class="ch">${esc(ch)}</span>
      </div>
      <div class="cards">${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
})();

/* 搜索 */
document.getElementById("q").addEventListener("input", function(){
  const kw = this.value.trim().toLowerCase();
  document.querySelectorAll("section.month").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit = !kw || (c.dataset.key||"").toLowerCase().includes(kw);
      c.style.display = hit ? "" : "none";
      if(hit) n++;
    });
    sec.style.display = n ? "" : "none";
  });
});
</script>
